<script>window.DECK = {"deck":"takeaways-v3","title":"Takeaways v3: the fleet outgrows one team, then the agents arrive","draft":"main","drafts":{"main":["title","day-one","cloud-dev","second-exchange","cloud-migration","multi-region","second-cloud","one-runbook","tools-too","overrun","kubeadm-past","twenty-tools","waves","gates","change-windows","karmada-constraints","karmada","no-cluster-names","ai-arrives","elastic-agents","sandbox","mcp-tools","credentials","policy-layer","one-view","the-lake","ai-resize","same-person","the-ask"]},"size":[1920,1080],"slides":{"ai-arrives":{"title":"AI lands on the map","notes":"\u003cp>That's the first half: the fleet, the tools, the placement. Let's go back to the map, because something new is arriving on it.\u003c/p>\n\u003cp>AI. And it arrived the sensible way: somewhere it couldn't hurt anything. Click. First on the on-prem dev cluster, close to the data and the people experimenting with it. Teal is AI, from here on.\u003c/p>\n\u003cp>Click. Then in AWS: the dev cluster first, then three clusters built for it in region two, where the GPUs and the elastic capacity are.\u003c/p>\n\u003cp>Thirty-two clusters now. Same one team. And three more kinds of thing for them to upgrade, which is where the dashed bar on the overrun chart came from.\u003c/p>\n\u003cp>And with AI come users that aren't people.\u003c/p>","plan":{"Act":"VI","Job":"turn to the second half: AI lands on the map, starting where it's safest","Headline":"AI arrived on the on-prem dev clusters first, then in AWS.","Visual":"the map, back to its quiet state. Click: the on-prem dev cluster turns","Energy":"3","Into next":"and with AI come users that aren't people."}},"ai-phases":{"title":"The AI ladder","notes":"\u003cp>With all of that in place, here's how far we let agents climb, and when.\u003c/p>\n\u003cp>Six camps. Camp zero is where we are: people using AI on their own machines, and a person applying every change.\u003c/p>\n\u003cp>Camp one, by the second quarter of 2027: alert triage. For every alert, an agent explains it: is it real, how serious, what changed, where to look. It explains; it never acts. It needs the one view and the lake we just saw, and nothing else, because it has no write path. That's why it's first, and why the date is safe. Verkada runs this at thirty-three cents an alert.\u003c/p>\n\u003cp>Camp two, by the end of 2027: agents propose pull requests. A fix, a resize, a config change, always as a PR, through review, policy in CI and the same pipeline as everyone else. The resize we just saw starts here.\u003c/p>\n\u003cp>Camps three to five are the north star, and they're undated on purpose. Always-on analysis, where the agent owns alert severity. Agents that fix things themselves, inside a blast radius we drew, with the sandbox, the gates, rollback and the change windows all in place. And teams writing their own agents, a DBA agent and an SRE agent working the same incident.\u003c/p>\n\u003cp>Each camp has a gate, written underneath it, and we don't move up until the gate is real. Salesforce's first attempt at this landed at twenty-five percent accuracy; what fixed it was the boring work, not a better model.\u003c/p>\n\u003cp>So here's the same person, with the same map.\u003c/p>","plan":{}},"ai-resize":{"title":"Lakeside savings in practice","notes":"\u003cp>One of the first things worth deciding from the lake is how big every pod should be. This is lakeside savings, in practice.\u003c/p>\n\u003cp>One workload, one trading week. The white line is what it actually uses: busy in market hours, a spike at the open and the close, quiet overnight, nearly idle at the weekend.\u003c/p>\n\u003cp>The dashed blue line is what VPA asks for. VPA's recommender looks at history and settles on one size with headroom over the peaks, and that's a good, safe floor. But it's one number for the whole week.\u003c/p>\n\u003cp>The teal line is what an AI can ask for when it reads the lake: the market calendar, the deploy history, the Kafka lag, last week's same day. Tight overnight and at the weekend, raised before the open, back up for the close. The shaded gap between the two lines is reserved capacity we stop paying for. On this made-up workload it's a large share of the core-hours.\u003c/p>\n\u003cp>How it works without anything restarting: VPA still sets the floor; in-place resize changes the size of a running pod; KEDA reacts to fast signals like queue depth; and Karpenter consolidates the nodes that frees up. That last step is where the bill actually goes down.\u003c/p>\n\u003cp>And the guardrail, because this is an agent changing production. It starts by proposing the new sizes as a pull request. Only later does it act on its own, inside minimum and maximum bounds that policy enforces, with automatic rollback. Hertz showed this pattern at the show: AI agents right-sizing every workload and rearranging nodes across their EKS fleet, about eighty clusters, rolled out through Terraform. They didn't post slides, so the sixty-one percent here is our illustration of the pattern, not their number. And the \"Agentic Karpenter\" demo had Claude propose fixes for a human to approve.\u003c/p>\n\u003cp>And that's the pattern for every agent on this map: read from the lake, propose first, act only inside bounds that policy enforces. So here's the same team, on the same map.\u003c/p>","plan":{"Act":"VII","Job":"AI reads the lake's signals and resizes pods more aggressively than VPA alone, for cost","Headline":"Lakeside savings in practice.","Lede (the assertion, under the title)":"with the lake's signals, AI resizes pods more aggressively than VPA alone, and cuts the bill.","Label":"illustrative: the pattern Hertz showed (AI agents right-sizing across 80 EKS","Visual":"one workload across a trading week (illustrative): actual usage, the flat","Energy":"3","Into next":"that's the pattern for every agent on the map: read the lake, propose","Source":"GOALS §10.3; *The New Scaling Matrix* (Solo.io); *In-Place Pod Resizing"}},"change-windows":{"title":"Windows are policy","notes":"\u003cp>One more thing the pipeline needs: to know when not to run at all.\u003c/p>\n\u003cp>This is a week. The pale bands are when changes are allowed: daytime, Monday to Thursday. The hatched part is frozen: every night, and from Thursday evening through the weekend.\u003c/p>\n\u003cp>Wave one runs on Tuesday. Wave two on Wednesday. The prod wave starts Thursday, and when the window closes it stops. Not because someone remembered to stop it: because the window says so. It sits there through the weekend and picks up on its own when the window opens on Monday morning.\u003c/p>\n\u003cp>Two locks on the same window. Argo CD already has sync windows, a cron with allow and deny, so the pipeline stops itself. And Kyverno reads the same window and stops everything else: someone with kubectl, an operator, an agent. The approved windows are a resource in the cluster, not a call out to the ticket system, so admission never breaks because Jira is slow.\u003c/p>\n\u003cp>This is also what gets teams to let go of manual sync. The control they actually wanted was \"nothing goes out during the freeze\". Now that's enforced, not negotiated.\u003c/p>\n\u003cp>NVIDIA showed the same idea at fleet scale: their maintenance scheduler factors in business-critical windows. Agility Robotics put an admission gate on top of sync windows for the cases a schedule can't see.\u003c/p>\n\u003cp>And that's the platform team's third time sink, the syncs between everyone. The window is the sync: admins, the platform team and developers stay in step without a meeting, because the cluster enforces what they agreed.\u003c/p>\n\u003cp>That's the platform team. Now the developers.\u003c/p>","plan":{"Act":"IV","Job":"time gating by policy: the platform team's time syncs, replaced by a window everyone shares","Headline":"Nothing rolls during a freeze, because the window is a policy, not a promise.","Visual":"as v2: an eight-day strip; the prod wave pauses at Thursday's close and","Energy":"2","Into next":"that's the platform team. Now the developers.","Source":"GOALS §2.3; NVIDIA; Agility Robotics"}},"cloud-dev":{"title":"EKS for dev, qa, ftb","notes":"\u003cp>Then AWS. The environments that don't need to be next to an exchange moved to EKS: dev, qa and ftb.\u003c/p>\n\u003cp>EKS is a different animal. AWS runs the control plane, but the node groups, the add-ons and the order you do them in are on us, and none of it looks like the kubeadm runbook. So now there are two runbooks, for two kinds of cluster.\u003c/p>\n\u003cp>Seven clusters. Still one team.\u003c/p>\n\u003cp>Then the business added an exchange.\u003c/p>","plan":{"Act":"I","Job":"the second kind of cluster","Headline":"EKS arrived for dev, qa and ftb, so now there are two ways to upgrade.","Visual":"the AWS zone opens with three clusters: dev, qa, ftb. Header \"EKS, one","Energy":"2","Into next":"then the business added an exchange."}},"cloud-migration":{"title":"The migration lands in chunks","notes":"\u003cp>The migration. Workloads leave our hardware where they can, and AWS clusters arrive in chunks: six at a time, as each batch of services moves.\u003c/p>\n\u003cp>Every one of those is reasonable. Every one of them is another cluster to upgrade, three times a year, and the apps that moved with it: fifty apps now, over two thousand pods.\u003c/p>\n\u003cp>Seventeen clusters. Still one team.\u003c/p>\n\u003cp>And anything that matters in one region needs a second.\u003c/p>","plan":{"Act":"I","Job":"AWS grows in chunks","Headline":"Then the cloud migration started, and AWS clusters arrived in chunks.","Visual":"six AWS clusters land at once in region 1. Seventeen clusters","Energy":"3","Into next":"and anything that matters in one region needs a second."}},"credentials":{"title":"No passwords in the agent","notes":"\u003cp>The gateway is also where the passwords live, and that's deliberate. The agent never holds one.\u003c/p>\n\u003cp>Follow it left to right. The agent carries a pass: a workload identity, issued to that pod, valid for fifteen minutes, saying what it is and that it's read-only. No key file, no token pasted into an environment variable.\u003c/p>\n\u003cp>At the gateway, that pass is exchanged for a token scoped to exactly one call: this tool, this action. The real secret, the database password or the cloud key, lives in the store behind the gateway. It never crosses the dashed line into the agent: not into its context window, not into its prompt, not into its image. So if an agent is tricked into printing everything it knows, there's nothing worth printing.\u003c/p>\n\u003cp>Four patterns underneath. Workload identity, from EKS Pod Identity or SPIFFE. Token exchange at the gateway. Short-lived, dynamic credentials, so anything that leaks expires on its own. And secrets synced from the store by External Secrets, never written into YAML. We still have to pick the store; that's GOALS section nine. These patterns make the choice matter less.\u003c/p>\n\u003cp>Identity says who the agent is. Policy says what anyone may do.\u003c/p>","plan":{"Act":"VI","Job":"credential patterns that keep passwords out of the agent","Headline":"Agents get a short-lived identity; the passwords never enter the agent.","Visual":"the agent holds a boarding pass (a workload identity, valid minutes); at","Energy":"3","Into next":"identity says who the agent is. Policy says what anyone may do.","Source":"GOALS §3.6, §9; \"DO NOT Give AI Agents Credentials!\" (Solo.io, no deck);"}},"day-one":{"title":"Four clusters, one team","notes":"\u003cp>Let's start where we started.\u003c/p>\n\u003cp>Four clusters on our own hardware, next to the exchange. Dev and staging to build and test on. ny4 for production, and ch4 as its disaster-recovery twin, kept in lockstep with it. We built them with kubeadm, by hand, and that was the right call at the time.\u003c/p>\n\u003cp>And there's one team, the three in orange, roped together, who own the upgrades: the clusters and the apps on them. Kubernetes ships a new minor version three times a year, and they walk all four clusters through it, then the apps.\u003c/p>\n\u003cp>Each little square is an app: twenty of them. The tally in the corner counts clusters, apps and pods, and all three are about to climb. Six hundred and forty pods today.\u003c/p>\n\u003cp>Keep an eye on the team. They're in every picture from here on.\u003c/p>\n\u003cp>Then the cloud showed up, for the environments that didn't need to sit next to an exchange.\u003c/p>","plan":{"Act":"I","Job":"cold open: our own estate, small, and the one-person thread","Headline":"Four clusters, ny4 with ch4 as its DR, and one team upgrading clusters and apps.","Visual":"the on-prem zone only: dev, staging, ny4, ch4, with ny4–ch4 tied in","Energy":"3","Into next":"then the cloud showed up, for the environments that didn't need to sit"}},"elastic-agents":{"title":"Agents on elastic nodes","notes":"\u003cp>Here's the new kind of user.\u003c/p>\n\u003cp>This is one day, hour by hour. The pale band is our elastic node count: Karpenter or Auto Mode adding nodes when there's work and taking them away when there isn't. Each teal diamond is one agent, spawned for one job, gone when it's done.\u003c/p>\n\u003cp>At one in the morning a schedule fires: the nightly agents that check drift and costs. At three, an alert: a handful of triage agents spin up, look, report and vanish. And through the working day, a steady stream: agents reviewing pull requests, drafting changes, answering questions about the platform.\u003c/p>\n\u003cp>Look at the corner. A couple of hundred agents in a day, and not one of them was approved by a person, one by one. That's the point of them. Nobody wants to approve two hundred agents. But it means each one is a user of our platform that nobody looked at before it started.\u003c/p>\n\u003cp>The numbers are illustrative; the shape is what our Jenkins-triggered agent pods will look like.\u003c/p>\n\u003cp>And every one of them runs code it may have just written.\u003c/p>","plan":{"Act":"VI","Job":"autonomous agents as a new kind of user: spawned on demand, on elastic compute","Headline":"Autonomous agents spawn on elastic nodes on demand, and nobody approves each one.","Visual":"a day on a time axis. The node count rises and falls as Karpenter/Auto Mode","Energy":"3","Into next":"and every one of them runs code it may have just written.","Source":"GOALS §0 claim 2; `CLAUDE-AGENT-PLATFORM.md` (Jenkins-triggered agent pods)"}},"gates":{"title":"Gates roll back","notes":"\u003cp>This is the slide the whole second half has been building to.\u003c/p>\n\u003cp>Read it from the middle out. The middle is the test cluster. Then one canary cluster. Then the prod fleet in waves: wave one, wave two, and the rest of prod. A new version of a platform tool starts in the middle and moves outward one ring at a time, and between every ring there's a gate.\u003c/p>\n\u003cp>Click. A new Prometheus goes onto the test cluster. Its gate passes: targets are up, rules are evaluating, nothing's dropped. So it moves out.\u003c/p>\n\u003cp>Click. It reaches the canary cluster, which is a real cluster with real workloads. And this time the gate fails: targets dropped after the upgrade.\u003c/p>\n\u003cp>Click. And here's the point. Nobody decides anything. The pipeline rolls the canary back to the old version on its own. Wave one never started. The prod rings never saw it. Nobody got paged, and the team from the start of this talk found out from a message in the morning, not a phone call at night.\u003c/p>\n\u003cp>On the right: each tool brings its own gate. Argo CD checks every app is still synced and healthy. Prometheus checks its own targets and rules. The OTel collector checks that exports are succeeding. Karpenter checks that pending pods still get nodes. Different checks, same machinery.\u003c/p>\n\u003cp>This isn't our invention. LinkedIn showed it for their cluster services: the gate is just an Argo CD PostSync job. Exit zero, the wave advances. Exit one, the sync fails and it rolls back. They took a release from about a week of manual testing to about an hour.\u003c/p>\n\u003cp>And the pipeline also needs to know when not to run at all.\u003c/p>","plan":{"Act":"IV","Job":"automated gates and rollback","Headline":"Every wave passes its tool's gate, and a failed gate rolls itself back.","Visual":"as v2: a new Prometheus passes test, fails the canary gate, rolls back.","Energy":"4","Into next":"and the pipeline knows when not to run at all.","Source":"LinkedIn canary pipeline; GOALS §1.7"}},"karmada":{"title":"Karmada moves the work","notes":"\u003cp>Remember \"fingers crossed\"? Here's the day it matters.\u003c/p>\n\u003cp>Same constraints on the left, same map on the right. Six replicas, three in each AWS region, exactly where Karmada put them.\u003c/p>\n\u003cp>Click. Region one goes down. Karmada sees those clusters go unhealthy, and the constraint still says \"two regions if you can, the cloud, PCI, US\". So the three replicas from region one land in region two. The app keeps running.\u003c/p>\n\u003cp>Click. Now it's AWS itself having the bad day. Both regions dark. The constraints say \"fall back to the second cloud\", so all six replicas go there.\u003c/p>\n\u003cp>That's the developers' DR pattern, done by policy instead of a runbook.\u003c/p>\n\u003cp>Click. And nobody edited a file. The developer didn't change a thing, nobody rewrote a list of clusters at two in the morning, and the team in orange found out from a message. Fingers uncrossed.\u003c/p>\n\u003cp>To be honest about where this sits: it's the north star, not what we run. It needs every cluster labelled properly, it needs the data behind the app to be reachable from wherever it lands, and Karmada is one more control plane to run and upgrade. It goes through the same pipeline as everything else. Bloomberg runs their streaming platform on it, for exactly this.\u003c/p>\n\u003cp>So what does a developer actually have to know now?\u003c/p>","plan":{"Act":"V","Job":"the peak, for developers: DR patterns done by policy, routing between clusters, regions and clouds","Headline":"Lose a region or a cloud, and Karmada moves the work wherever the constraints still hold.","Visual":"the same map and constraints. Click: replicas spread across both AWS","Energy":"5","Into next":"so what does a developer actually have to know now?","Source":"GOALS §5.1 (cluster taints on NotReady drive rescheduling; application"}},"karmada-constraints":{"title":"Karmada: constraints, not clusters","notes":"\u003cp>Now the developers. Their hidden hours went on three things: knowing what runs where and why, picking clusters and regions, and keeping DR patterns alive. Today, somebody decides which cluster each app goes to, and writes that cluster's name down. Here's the north-star alternative.\u003c/p>\n\u003cp>On the left is everything a developer writes. Constraints: it runs in the cloud, it's PCI, it stays in the US. And asks: six replicas, spread across two regions, and fall back to the second cloud if it has to. There isn't a cluster name anywhere.\u003c/p>\n\u003cp>On the right, Karmada does the placing. It reads the labels every cluster carries, its provider, its region, its compliance scope, and how much room it has, and it spreads the six replicas over the clusters that fit. Three in region one, three in region two. The second cloud is held as the fallback.\u003c/p>\n\u003cp>To be fair about it: for apps whose placement never changes, Argo CD's ApplicationSets can already select clusters by label. Karmada is the option that goes further, because it places by capacity and it keeps placing when things change. And that's the part that matters on a bad day.\u003c/p>\n\u003cp>Because the constraints keep holding when the clusters underneath them don't.\u003c/p>","plan":{"Act":"V","Job":"for developers: where and why, and scheduling, become constraints Karmada acts on","Headline":"With Karmada, developers state constraints, and it picks the clusters and regions.","Visual":"left, what a developer writes: constraints (regions, compliance, capability,","Energy":"3","Into next":"and the constraints keep holding when the clusters underneath them don't.","Source":"path1 `no-cluster-names` and path3 `thirty-first` (the constraint"}},"kubeadm-past":{"title":"Clusters as a fleet","notes":"\u003cp>Start with the cluster admins. What do the people with three hundred clusters do? Not that.\u003c/p>\n\u003cp>On the left is the row from two slides ago: fifty-four steps for one cluster, by hand. Nobody presenting at this scale does that any more. What they do instead is on the right: the upgrade is a change to one field, a version number, in a pull request. It gets reviewed, it gets merged, and a controller does the fifty-four steps, the same way every time.\u003c/p>\n\u003cp>Two routes for us. On-prem, that's Cluster API. And to be straight about it: Cluster API still uses kubeadm underneath. kubeadm isn't going anywhere. What goes is someone running it node by node. The clusters become a fleet, managed from code. Cluster API replaces machines one at a time instead of patching them in place. The tool stays; the hands go.\u003c/p>\n\u003cp>In AWS, it's EKS Auto Mode. AWS upgrades the control plane, then replaces the nodes for us, and it runs Karpenter itself, which takes one tool off our list.\u003c/p>\n\u003cp>The evidence. LinkedIn runs three hundred clusters. With skip-level upgrades they took three minor versions from six fleet-wide waves down to one. NVIDIA converged about fifty-six hundred nodes in thirty minutes. Meta runs about a hundred clusters with fifteen engineers.\u003c/p>\n\u003cp>And the admins' other line, the Karmada upkeep: Karmada's own control plane is built and upgraded exactly the same way, from code, through the same pipeline. It's one more cluster in the fleet, not a pet.\u003c/p>\n\u003cp>That's the cluster admins. Next, the platform team, who carry the most.\u003c/p>","plan":{"Act":"III","Job":"clusters managed as a fleet: kubeadm stays, driven from code instead of by hand","Headline":"Clusters as a fleet, managing kubeadm from code.","Visual":"as v2: 54 steps collapse into a one-line version change; Cluster API on-prem, EKS Auto Mode in AWS; plus one line: Karmada's own control plane is built and upgraded the same way","Energy":"3","Into next":"that's the cluster admins, Karmada's own control plane included. Next, the platform team, who carry the most.","Source":"LinkedIn KEP-4330; NVIDIA; Cluster API primer; Nutanix CAREN"}},"mcp-tools":{"title":"One gateway for tools","notes":"\u003cp>Caged, an agent still has to do things, and it does them through tools. MCP is how: the agent asks a tool server to open a pull request, request a bucket, read the cluster or file a change record.\u003c/p>\n\u003cp>Notice what the agents build infrastructure with. Not a kubeconfig with admin rights. A pull request, and a Crossplane claim inside that pull request. So everything an agent builds still goes through review, the pipeline, the gates and the windows we just saw.\u003c/p>\n\u003cp>The important box is the one in the middle: one gateway every tool call goes through. It's where we check who may call what, with permissions that come from the corporate directory rather than whatever token someone started a server with, and where every call gets logged.\u003c/p>\n\u003cp>Three ways to get it. Obot is open-core and does directory-managed permissions. ToolHive, from Stacklok, is open source and pairs with the Cedar policy work AWS and Stacklok presented. Or we build our own thin proxy, and then every feature after the first is ours to build and keep.\u003c/p>\n\u003cp>The order matters: choose on enforcement first, then pick the tools. A bake-off, not a default.\u003c/p>\n\u003cp>And the gateway is also where the passwords live, so the agent never holds one.\u003c/p>","plan":{"Act":"VI","Job":"agents build infra through MCP tools; one gateway is the enforcement point","Headline":"Agents build infrastructure through MCP tools, so pick the gateway before the tools.","Visual":"agents on the left, tools on the right (Git, Jira, read-only kubectl,","Energy":"3","Into next":"and the gateway is also where the passwords live, so the agent never","Source":"GOALS §3.4, §3.5; `GOALS-GAPS.md` §3.5; *Cedar Analysis for MCP Servers*"}},"multi-region":{"title":"A second AWS region","notes":"\u003cp>Then resilience. One AWS region is a single point of failure, so production gets a second region, mirroring the first. The dashed line splits the AWS side into region one and region two.\u003c/p>\n\u003cp>Six more clusters. Twenty-three in all. Two regions that have to stay in step with each other, the same way ny4 and ch4 do.\u003c/p>\n\u003cp>Still one team.\u003c/p>\n\u003cp>And two regions of one provider is still one provider.\u003c/p>","plan":{"Act":"I","Job":"resilience multiplies the AWS side","Headline":"Resilience meant a second AWS region, mirroring the first.","Visual":"the AWS zone splits with a dashed divider; six clusters appear in region 2,","Energy":"3","Into next":"and two regions of one provider is still one provider."}},"no-cluster-names":{"title":"A PR and a change record","notes":"\u003cp>So what does a developer actually have to know now? Almost nothing about the platform.\u003c/p>\n\u003cp>Follow the route. The developer does the first two things: opens a pull request with their constraints and asks, and gets it reviewed and merged. That's their whole job.\u003c/p>\n\u003cp>Everything after that is the platform. The change record gets approved; that's the one human sign-off the business needs, and it's projected into the cluster where policy can read it. The window opens. Karmada places the work by its constraints. It rolls out in waves through the gates we saw. And it runs.\u003c/p>\n\u003cp>Underneath: the pack from the path decks, now empty. A developer never learns a cluster name, never clicks sync, never reads the policy list, and never rolls back by hand. The platform does all four.\u003c/p>\n\u003cp>That's the first half solved, on paper at least. Now look at the map again, because something new is arriving on it.\u003c/p>","plan":{"Act":"V","Job":"close the first half: the developer's whole job is a PR and a change record","Headline":"A developer now knows no cluster: a merged PR and a change record do the rest.","Visual":"a short path, left to right: PR with constraints and asks → merged → change","Energy":"3","Into next":"that's the first half solved. Now look at the map again, because","Source":"path1 `stage-e` (the empty pack) and `freeze-windows` (change record →"}},"one-runbook":{"title":"One kubeadm upgrade","notes":"\u003cp>Here's what one upgrade actually is, on a kubeadm cluster.\u003c/p>\n\u003cp>In the box: the runbook for a single node. Drain it. Upgrade kubeadm. Run the upgrade. Upgrade kubelet and kubectl. Restart kubelet. Uncordon it. Then the next node. The control plane nodes go first, one at a time, then the workers, one at a time.\u003c/p>\n\u003cp>Below: that's one row. Nine nodes, six steps each, fifty-four steps for one cluster, and a person waiting on every one of them. Call it a day.\u003c/p>\n\u003cp>And kubeadm won't skip a minor version. Kubernetes ships three a year, roughly April, August and December, so that row happens three times a year. Per cluster. On-prem we have eight of them by now.\u003c/p>\n\u003cp>That's the clusters. And they're the small part.\u003c/p>","plan":{"Act":"II","Job":"the cost of one kubeadm upgrade, and why it repeats","Headline":"kubeadm upgrades one node and one minor at a time, three times a year.","Visual":"as v2: the per-node runbook as literal commands, then three rows of 54","Energy":"3","Into next":"and the clusters are the small part."}},"one-view":{"title":"One view for debugging","notes":"\u003cp>Policy stops what shouldn't happen. Telemetry shows what did. And the point of this slide is that it's one view, not four tools.\u003c/p>\n\u003cp>On the left, four sources. OpenTelemetry traces, from classic services and from the AI workloads: the model servers and the agents themselves, with their tool calls and token counts. Logs. Prometheus metrics, which stay exactly where they are; this isn't OTel replacing Prometheus. And state dumps: regular snapshots of what every cluster actually contains.\u003c/p>\n\u003cp>The collector layer on every cluster, the Splunk OTel collector we already roll out, stamps the same cluster, namespace, team and trace ID on all of it. That's what turns four piles into one view: you can go from an alert, to the trace, to the log line, to what the cluster looked like at that moment, without changing tools. It's the plane along the bottom: one altitude, running through all three peaks, measuring each the same way.\u003c/p>\n\u003cp>And on the right, two kinds of reader. A person debugging at two in the morning. And an agent debugging the same thing, reading the same view. Same evidence, so when the agent says what it thinks happened, the person can check it in the same place.\u003c/p>\n\u003cp>And the agents read it from a lake, not from production.\u003c/p>","plan":{"Act":"VII","Job":"OTel, logs, Prometheus and state dumps become one view for whoever is debugging","Headline":"OTel, logs, Prometheus and state dumps give one view to anyone debugging, person or agent.","Visual":"four sources on the left (OTel traces, logs, Prometheus metrics, cluster","Energy":"3","Into next":"and the agents read it from a lake, not from production.","Source":"GOALS §4.2, §7; *The Race to Standardize AI Observability* (Google,"}},"overrun":{"title":"Every group drowns in upkeep","notes":"\u003cp>Now add it up, and split it by who actually carries it. Three groups.\u003c/p>\n\u003cp>On the left, the cluster admins. Their time goes on kubeadm and cluster upgrades, and on the multi-cluster upkeep: the labels, the registrations, the failover setup that something like Karmada would otherwise own. One admin, about half their year for this, 850 hours. They run out at the second cloud.\u003c/p>\n\u003cp>In the middle, the platform team, and they carry the most. The platform apps, the four tools so far. Progressive rollouts of every app upgrade, cluster by cluster. And the time syncs: change windows, approvals, keeping admins and developers and everyone else in step. Two engineers, 1,700 hours. They run out first, at the second region.\u003c/p>\n\u003cp>On the right, developers, the cost nobody budgets. Knowing what runs where and why. Deciding which clusters and regions each app goes to. Keeping DR patterns and drills alive. By the second cloud that's about thirteen hundred hours a year, three-quarters of a developer, spread thinly across every team, so nobody sees it.\u003c/p>\n\u003cp>Click. And that's before AI, the dashed bars, which adds to all three.\u003c/p>\n\u003cp>It's a model, not a measurement; the inputs are in assets/toil-model.json. But each group's line gets crossed for a different reason, so each group gets its own fix. The next few slides take them in turn: admins first, then the platform team, then developers.\u003c/p>","plan":{"Act":"II","Job":"the turn of the first half: the upkeep outgrows every group, each for its own reason","Headline":"Keep doing it this way, and admins, platform and developers all drown in upkeep.","Visual":"three panels, each with its own scale and stacked bars for the six stages:","Energy":"4","Into next":"each group crosses its line for a different reason, so each gets its own","Data":"illustrative model, see Editorial notes (groups)"}},"policy-layer":{"title":"One policy layer","notes":"\u003cp>Identity says who the agent is. Policy says what anyone may do. And \"anyone\" is the point.\u003c/p>\n\u003cp>Three kinds of actor change our clusters now. A person with kubectl. The pipeline, which is how most change should arrive. And agents. All three go through the same gate: Kyverno, with the same rules, checked twice. Once in CI, where a failing rule is a fast test failure the author can fix, person or agent. And again at admission, so nothing gets in around the pipeline.\u003c/p>\n\u003cp>The rules are written against the action, not the actor. No privileged pods, whoever wrote the manifest. Egress only to approved models and approved MCP tools. Nothing outside the change window, the same window the change record opened. Write them that way and agent governance mostly comes for free.\u003c/p>\n\u003cp>That's the fence along the bottom of the range: one gate on every trail, whoever's walking it. It's the second thing that crosses all three paths. The first is next.\u003c/p>\n\u003cp>Policy stops what shouldn't happen. Telemetry shows what did.\u003c/p>","plan":{"Act":"VI","Job":"Kyverno as a cross-cutting layer for user and AI actions","Headline":"One policy layer checks every change, whether a person or an agent made it.","Visual":"the fence line along the foot of all three peaks. In front: three kinds of","Energy":"3","Into next":"policy stops what shouldn't happen. Telemetry shows what did.","Source":"GOALS §2.1–§2.4 (\"write policies against the action, not the actor\");"}},"same-person":{"title":"Same team, same map","notes":"\u003cp>Here's where we started: four clusters and one team with a runbook.\u003c/p>\n\u003cp>And here's the same map now. Thirty-two clusters: two exchanges, two AWS regions, a second cloud, AI in teal, and agents working beside it. The same one team.\u003c/p>\n\u003cp>What changed is what they do. They don't walk each cluster and each app through a runbook. They approve a wave, and the pipeline runs it: test, canary, waves, prod, with a gate between each, inside the window, rolling itself back if a gate fails. Karmada keeps the work where the constraints say. The fence along the bottom checks every change, theirs, the pipeline's and the agents'. And the OTel plane runs through all three peaks and sees all of it.\u003c/p>\n\u003cp>Every cluster is lit because every one is on the version the pipeline delivered, not the version someone got round to.\u003c/p>\n\u003cp>Eight times the clusters with the same team. That's the ratio the fleets at KubeCon run at.\u003c/p>\n\u003cp>Five things get us there.\u003c/p>","plan":{"Act":"Close","Job":"echo the opening, changed","Headline":"Same team, eight times the clusters: it approves the waves, and the pipeline runs them.","Visual":"the full map with AI and agents, every cluster lit; the one team at its","Energy":"4","Into next":"five things get us there."}},"sandbox":{"title":"Not a cage","notes":"\u003cp>Every one of those agents runs code, and often it's code the agent just wrote. So the question is what's around it.\u003c/p>\n\u003cp>A container shares the host's kernel with every other pod on the node. It's a namespace, not a wall. That's fine for code a person reviewed. It isn't a cage for code an agent wrote thirty seconds ago. That was a keynote at the show: sandbox your agents.\u003c/p>\n\u003cp>The next shell is gVisor: a kernel written in user space that answers the agent's system calls itself, so most kernel exploits stop there. It starts fast, with some overhead on system calls. That's our default for agents.\u003c/p>\n\u003cp>The outer shell is Kata: every pod gets its own small virtual machine with its own kernel. If something escapes, it lands in a VM, not on the node. It starts slower, and Microsoft showed how pod snapshots take most of that cost away. That's for untrusted code and for tools that run anything they're handed.\u003c/p>\n\u003cp>And picking one is one line in the pod spec: a runtime class.\u003c/p>\n\u003cp>Caged, it still has to do things, and it does them through tools.\u003c/p>","plan":{"Act":"VI","Job":"containment: a container shares a kernel","Headline":"A container is not a cage, so agents run in gVisor or Kata.","Visual":"an agent diamond inside nested shells, from container (shared kernel)","Energy":"4","Into next":"caged, it still has to do things, and it does them through tools.","Source":"GOALS §3.1; \"Sandbox Your Agents\" keynote (Red Hat); *Groundhog Pod*"}},"second-cloud":{"title":"Fingers crossed for AWS","notes":"\u003cp>For a while the plan was fingers crossed: hope AWS doesn't have a bad day. That isn't a plan. So a second cloud joins, for the day AWS does.\u003c/p>\n\u003cp>That's normal at this scale. Nearly every large fleet at the show was hybrid or multi-cloud.\u003c/p>\n\u003cp>Now pull back and look at the whole thing. Twenty-nine clusters. On our hardware at two exchanges, in two AWS regions, and in a second cloud. Three kinds of place, three upgrade procedures.\u003c/p>\n\u003cp>Six reasonable steps. Every one of them made sense on the day. Sixty-five apps, four thousand pods. And there's still one team in orange.\u003c/p>\n\u003cp>Hold on to \"fingers crossed\". We'll come back to it.\u003c/p>\n\u003cp>Now look at what one upgrade costs them.\u003c/p>","plan":{"Act":"I","Job":"the last growth step, and the setup the peak pays off","Headline":"Hoping AWS never goes down isn't a plan, so a second cloud joined.","Visual":"the second cloud's zone opens with six clusters. Pull back: 29 clusters,","Energy":"4","Into next":"six reasonable steps. Now look at what one upgrade costs him.","Source":"GOALS §0.1 (multi-provider is the norm at scale)"}},"second-exchange":{"title":"A second exchange","notes":"\u003cp>A second exchange. And a second exchange means everything we built for the first one, again: its own clusters, its own DR pair in lockstep.\u003c/p>\n\u003cp>On-prem doubles, from four to eight. Eleven clusters in all. All eight on our hardware are still kubeadm, still by hand.\u003c/p>\n\u003cp>Still one team.\u003c/p>\n\u003cp>And then the cloud migration started.\u003c/p>","plan":{"Act":"I","Job":"on-prem doubles","Headline":"A second exchange doubled what we run on our own hardware.","Visual":"four new on-prem clusters appear in the second row, the second exchange's","Energy":"3","Into next":"and then the migration started."}},"the-ask":{"title":"The ask","notes":"\u003cp>Five things, and the first two are the ones I'm asking for today.\u003c/p>\n\u003cp>One: no new hand-built clusters. New clusters in AWS are EKS Auto Mode; new clusters on-prem come from Cluster API. kubeadm is still there underneath, but the runbook retires.\u003c/p>\n\u003cp>Two: one tool through the pipeline this quarter, and I'd start with the Splunk OTel collector. It's on every cluster, we can see from Splunk whether its data is arriving, so its gate is easy to write. Waves, gates, automatic rollback. Then the other nineteen follow the same path.\u003c/p>\n\u003cp>Three: a Karmada spike. One app, placed only by its constraints, across both AWS regions and the second cloud. That tells us whether the north star is as close as it looks.\u003c/p>\n\u003cp>Four: before any agent triages its first alert, it gets a cage, a gateway, a pass and a fence. gVisor or Kata, one MCP gateway, short-lived identity, and Kyverno.\u003c/p>\n\u003cp>Five: alert triage, explain-only, by the second quarter of 2027, reading the OTel plane and the lake.\u003c/p>\n\u003cp>The fleet is going to keep growing whatever we decide, and the agents are already on their way. The only question is whether the team in orange grows with them, or gets out of their way. Thanks.\u003c/p>","plan":{"Act":"Close","Job":"the ask","Headline":"Stop building clusters by hand, pipeline one tool this quarter, and gate agents before they scale.","Visual":"five numbered lines in path colours: no new hand-built clusters; splunk-otel","Energy":"3","Into next":"end"}},"the-lake":{"title":"The read-only lake","notes":"\u003cp>Everything the plane measures, and everything the mountains do, has to land somewhere the agents can read. Where it lands matters more than which tool it is.\u003c/p>\n\u003cp>So here's the range again, with OTel drawn as what it is: one plane at one altitude, running through all three peaks. Fleet, delivery and agents all pierce it, and it measures them the same way, stamped with the same cluster, namespace, team and trace id.\u003c/p>\n\u003cp>Down in the valley between delivery and agents sits the lake. Every mountain runs its own stream into it. From the fleet: cluster state, snapshotted. From delivery: every sync, every rollout, every gate result. From the agents: their tool calls, as the gateway logged them. And one more stream comes through the plane: OTel gathers traces, metrics and logs from all three and pours them in.\u003c/p>\n\u003cp>The agents sit on the shore and read. That's how they decide things: is this alert real, did this canary actually get worse, which hour is quiet enough to upgrade this cluster.\u003c/p>\n\u003cp>And here's the rule. There's no path from the shore back up the mountain. Read-only extraction is what lets us say yes to agents analysing prod without saying yes to agents holding prod credentials. That's a security control, not just plumbing.\u003c/p>\n\u003cp>Let me be honest about the limit. Mastercard argued the other side at the show: a lake is a snapshot, and a stale index can mislead a model. They let theirs call live APIs through a narrow, audited tool instead. They're right for live decisions. So: the lake for triage and trends; a gate in the middle of a rollout reads live metrics through one narrow tool. NVIDIA and Workday added the other lesson: raw telemetry confuses models, so put a typed query layer over the lake.\u003c/p>\n\u003cp>And one of the first things worth deciding from it is how big every pod should be.\u003c/p>","plan":{"Act":"VII","Job":"AI decides from data: one read-only lake, fed by every mountain and by OTel","Headline":"Agents decide from a read-only lake, not from credentials to production.","Visual":"the range drawn large: fleet, delivery and agents pierce one OTel plane at","Energy":"4","Into next":"and one of the first things worth deciding from it is how big every pod"}},"title":{"title":"KubeCon 2027 north star","notes":"\u003cp>This is where we think the fleet should be heading: a north star for 2027, built from what we saw at KubeCon in Salt Lake City.\u003c/p>\n\u003cp>Three peaks behind it, the same three as the rest of the readout. On the left, the fleet: the clusters themselves. In the middle, delivery: how every change reaches them. On the right, agents: the new kind of user arriving on all of it.\u003c/p>\n\u003cp>And up in the corner, the north star. You'll see it on every slide. It burns brighter on the slides that matter most.\u003c/p>\n\u003cp>It starts small.\u003c/p>","plan":{"Act":"Open","Job":"the title card: name the north star before the story starts","Headline":"KubeCon 2027 north star: managing our fleet at scale.","Visual":"the full range risen (fleet, delivery, agents), with the north star bright in","Energy":"4","Into next":"and it starts small."}},"tools-too":{"title":"Four tools, four trains","notes":"\u003cp>Every one of those clusters also runs the platform: Argo CD to deploy, Prometheus to measure, the Splunk OTel collector to ship telemetry, and Karpenter to scale nodes on the cloud clusters.\u003c/p>\n\u003cp>Each of those has its own release train. Prometheus ships a minor about every six weeks. Argo CD about every three months. The OTel collector every few weeks. Karpenter every month or two. Those are rough, and they don't line up with each other or with Kubernetes.\u003c/p>\n\u003cp>So here's the fleet, twenty-nine clusters across the top, the four tools down the side. Four tools for now, to keep the picture readable; the real list comes back later. Each square is how far that cluster's copy is behind the latest release. Dark is current. Pale is one behind. Hollow is two or more. Dashed means nobody's quite sure without logging in. The blanks are Karpenter on our own hardware, where it doesn't run.\u003c/p>\n\u003cp>This is what hand rollouts leave behind. Not because anyone's careless: because each release is another twenty-odd rollouts by hand, and the next release lands before the last one's finished. The grid is illustrative, but anyone who's run a fleet will recognise it.\u003c/p>\n\u003cp>Now add the clusters, the tools and the apps together, and put them against the team's year.\u003c/p>","plan":{"Act":"II","Job":"the multiplication nobody budgets","Headline":"Each cluster also carries four platform tools, each on its own release train.","Visual":"as v2, re-cut for this fleet: 29 clusters across the top in three zones,","Energy":"3","Into next":"add the clusters, the tools and the apps together, against the team's year."}},"twenty-tools":{"title":"Twenty tools, not four","notes":"\u003cp>Now the platform team, who carry the most. First, a confession: the four tools so far were a demo, to keep the pictures readable. Here's what the platform actually runs.\u003c/p>\n\u003cp>The four in blue are the ones you've seen: Argo CD, Prometheus, the Splunk OTel collector, Karpenter. Click. And the rest: Ceph and Rook for storage on our own hardware, the Vault operator and External Secrets, Grafana and Thanos, Istio or the ALB controller depending on the cloud, the Kafka UI, the file viewer, cert-manager, external-dns, Kyverno, Velero, KEDA, Reloader, Argo Rollouts. Twenty. The tag beside each says where it runs: on every cluster, only on-prem, only in the cloud, or on just a few.\u003c/p>\n\u003cp>Now the numbers, side by side. Four tools across twenty-nine clusters by hand is 116 installs, 464 rollouts a year, about 700 hours. Twenty tools is 418 installs, 1,672 rollouts, two and a half thousand hours. Three people doing nothing else.\u003c/p>\n\u003cp>Click. Through the pipeline, it's eighty approvals a year. Twenty tools, four releases each. That's the job that's left for a person.\u003c/p>\n\u003cp>Same caveat as before: it's a model, not a measurement. But the shape holds.\u003c/p>\n\u003cp>Twenty platform apps, and every one has to roll out across the fleet. The answer is the one we already use for apps.\u003c/p>","plan":{"Act":"IV","Job":"four tools was the demo; at the real twenty, hand rollouts are three people's work","Headline":"Four tools was the demo: the platform really runs twenty, and the numbers follow.","Visual":"the four tool rows from `tools-too` grow to twenty: argo-cd, prometheus,","Energy":"4","Into next":"twenty platform apps, and every one has to roll out across the fleet, the way any app does.","Data":"twenty-tools model, see Editorial notes"}},"waves":{"title":"Tools ship in waves","notes":"\u003cp>Twenty platform apps, rolled out the way we roll out any app: progressively.\u003c/p>\n\u003cp>Read the picture from the left. The middle of the ripple is the test cluster. The next ring is one canary cluster: real workloads, real traffic, but just one. Then the prod fleet in waves: wave one, wave two, and the rest of prod. A new version of a platform tool, say a new Argo CD, starts in the middle and moves outward one ring at a time.\u003c/p>\n\u003cp>How. One definition per tool, an ApplicationSet, and progressive sync takes it one wave at a time. Which wave a cluster is in is a label on the cluster, not a list in a pipeline, so when cluster twenty-nine shows up it just gets a label and it's in.\u003c/p>\n\u003cp>And one train we can get off entirely. On EKS Auto Mode clusters, the outlined ones, AWS runs Karpenter itself. The cheapest rollout is the one somebody else does.\u003c/p>\n\u003cp>LinkedIn does this for their cluster services and took a release from about a week of manual testing to about an hour.\u003c/p>\n\u003cp>But a ring only moves outward when the tool proves itself.\u003c/p>","plan":{"Act":"IV","Job":"platform tools ship like apps","Headline":"Platform tools ship like apps: test first, then a canary cluster, then prod in waves.","Visual":"as v2: half-rings rippling from the test cluster; Auto Mode clusters","Energy":"3","Into next":"and a ring only moves outward when the tool proves itself.","Source":"GOALS §1.4; LinkedIn canary pipeline"}}},"narrativeOrder":["title","day-one","cloud-dev","second-exchange","cloud-migration","multi-region","second-cloud","one-runbook","tools-too","overrun","kubeadm-past","twenty-tools","waves","gates","change-windows","karmada-constraints","karmada","no-cluster-names","ai-arrives","elastic-agents","sandbox","mcp-tools","credentials","policy-layer","one-view","the-lake","ai-resize","same-person","the-ask"],"kit":"1.0.0"};</script>
