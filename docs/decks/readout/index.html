<script>window.DECK = {"deck":"readout","title":"One range, three climbs: KubeCon NA 2026 readout","draft":"ten","drafts":{"main":["cold-open","the-answer","two-forces","fleets","agents-arrive","the-line","base-camp","three-climbs","the-rope","path-1","path-2","path-3","dates","echo","the-ask"],"ten":["cold-open","the-answer","fleets","agents-arrive","one-line","the-belay","path-1-ten","path-2-ten","path-3-ten","the-ask-dated"]},"size":[1920,1080],"slides":{"agents-arrive":{"title":"17 of 501","notes":"\u003cp>Five hundred and one sessions had speakers this year. Each dot is one of them. Seventeen, the orange ones, treated the human developer's experience as the open problem. That's three percent. And four of those seventeen were themselves about serving agents.\u003c/p>\n\u003cp>The reading isn't that developer experience stopped mattering. It's that the industry stopped treating it as the open problem. The portal, the catalog, the golden path: considered solved enough that nobody spent a slot arguing about them. The consumer being designed for now is a machine: an agent calling an API, a controller reading a label, a policy engine checking a manifest.\u003c/p>\n\u003cp>If you want the exception that proves it: NVIDIA and Salesforce's \"N Clusters, One kubectl\" stood out precisely because it was about human workflow breaking.\u003c/p>\n\u003cp>These counts are a regex over titles and abstracts, so treat them as a signal, not a measurement. The three percent holds up when you change the pattern.\u003c/p>\n\u003cp>The whole show said it in one line.\u003c/p>","plan":{"Act":"I","Job":"the second force as evidence: the week was built for agents and controllers, not the person at the terminal","Headline":"Only 17 of 501 sessions treated the human developer as the open problem.","Visual":"501 dots, 17 lit. The rest are the machine audience: agents, controllers, policy engines","Energy":"3","Into next":"the whole show said it in one line.","Source":"GOALS §0.2, regex over titles and abstracts. Relative signal, labelled as such. The 26% agents/MCP figure isn't robust and stays off the slide","Status":"kept as is"}},"base-camp":{"title":"Base camp","notes":"\u003cp>So where are we standing? Base camp. Let's say it plainly, without being defensive, because everyone in the room knows it.\u003c/p>\n\u003cp>Under the fleet: our clusters have names people know by heart, and we upgrade them one at a time, by hand.\u003c/p>\n\u003cp>Under delivery: Argo CD is in every cluster, on manual sync. It's a dashboard somebody clicks.\u003c/p>\n\u003cp>Under agents: Claude runs on laptops. Personal logins or keys, and skills and MCP configs passed from person to person in Slack.\u003c/p>\n\u003cp>None of that is a failure. It's an honest starting point. From here there are three climbs, each with its own stages.\u003c/p>","plan":{}},"cold-open":{"title":"100 clusters, 15 engineers","notes":"\u003cp>A hundred clusters, and fifteen people running them. That's Meta, from their keynote this week, for the clusters behind their AI research and inference.\u003c/p>\n\u003cp>Every little peak on the screen is a cluster. The fifteen figures underneath are the whole team.\u003c/p>\n\u003cp>Pause. That ratio only works if nobody is clicking anything. No hand-run upgrades, no manual syncs, no runbook in a wiki. Here's what we think it means for us.\u003c/p>","plan":{"Act":"I","Job":"earn the first ten seconds with the ratio a room of engineers can't ignore","Headline":"Meta runs about a hundred clusters with fifteen engineers.","Visual":"a hundred small peak glyphs in a field, fifteen climber marks beneath them. No chart; the count is the picture","Energy":"3","Into next":"that ratio only works if nobody is clicking anything. Here's what we think it means for us.","Source":"\"We Have GitOps at Home\" keynote abstract (Meta)","Status":"kept as is"}},"dates":{"title":"Two dates","notes":"\u003cp>Time, drawn to scale, from this month to the end of 2028.\u003c/p>\n\u003cp>Path 1 at the top. Stage A by January, stage B in the first quarter, then promotion and fleet waves through 2027. The summit, stage E, has no date yet.\u003c/p>\n\u003cp>Path 2 in the middle, and here are the two dates we're asking you to commit to. Stage 1, alert triage, by Q2 2027. That date is safe, because triage never writes anything. Stage 2, agents opening pull requests, by the end of 2027. That one's a bet: it's dated after Path 1's stage B on purpose, because of the rope. Phase 3 gets decided in 2028 with real data.\u003c/p>\n\u003cp>Path 3 at the bottom. Stage 1, the label schema, starts now. The rest isn't dated yet, and we'd rather say so than invent dates.\u003c/p>\n\u003cp>Everything above those two flags is gated, not scheduled. If the lower stages land early, the rest starts early. If they slip, the rest slips with them, and nobody has to re-argue the order.\u003c/p>\n\u003cp>Which brings us back to Meta.\u003c/p>","plan":{}},"echo":{"title":"A finished path","notes":"\u003cp>Back to Meta. A hundred clusters, fifteen engineers.\u003c/p>\n\u003cp>Click. That ratio isn't heroics and it isn't headcount. It's one path that every change takes, through every cluster, without anyone clicking anything along the way. The line you're watching is that path.\u003c/p>\n\u003cp>That's what all three climbs add up to. Here's what it takes to start.\u003c/p>","plan":{}},"fleets":{"title":"Fleet sizes","notes":"\u003cp>\"Fleet toil is unsustainable\" is an opinion until you put numbers next to it, so here are the numbers. These are fleet sizes companies disclosed from the stage this year, every one from their own title, abstract or deck, with one exception I'll come to.\u003c/p>\n\u003cp>Salesforce runs a thousand clusters under agentic AIOps. LinkedIn, three hundred, on bare metal. Meta, about a hundred, with about fifteen engineers. Hertz, eighty. Coinbase, seventy-nine in production. Mastercard, thirty EKS clusters driven by an LLM. Verkada, nine.\u003c/p>\n\u003cp>The heights are a log scale, so the small fleets aren't flattened to nothing. The point isn't the biggest number. It's that none of these companies is single-cluster, and none of them upgrades by hand.\u003c/p>\n\u003cp>The bracket is us. Regulated, EKS plus on-prem, right in the middle of this range alongside Hertz, Coinbase and Mastercard. That's the useful part: the patterns these teams use are available to us, not aspirational.\u003c/p>\n\u003cp>Expect the Hertz question, because Coinbase's seventy-nine sits right next to it. Kyle heard the eighty in the room; the published abstract only says \"fleet scale\". Everything else here is public.\u003c/p>\n\u003cp>The second force arrived as a user, not just a workload.\u003c/p>","plan":{"Act":"I","Job":"the first force as evidence: fleet toil is real at our scale, and we sit inside the range","Headline":"Nobody presenting at our scale was single-cluster or upgrading by hand.","Visual":"disclosed fleet sizes drawn as a ridge profile on a log scale: Salesforce 1,000 · LinkedIn 300 · Meta ~100 · Hertz 80 ⚠️ · Coinbase 79 · Mastercard 30 · Verkada 9. Our shape marked as a band mid-ridge","Energy":"3","Into next":"the second force arrived as a user, not just a workload.","Source":"GOALS §0.1. Hertz's 80 is from the room, not the abstract; the ⚠️ stays on the slide","Status":"kept as is"}},"one-line":{"title":"One line","notes":"\u003cp>We heard it five different ways, in five different tracks, from people who had already shipped it. Let agents propose. Let progressive delivery and policy decide.\u003c/p>\n\u003cp>Pause.\u003c/p>\n\u003cp>Here's why that line answers both forces. On the left, the fleet: more clusters than there are hands to upgrade them. On the right, agents: a new kind of workload that needs sandboxing and identity, and a new kind of user that wants to change our infrastructure.\u003c/p>\n\u003cp>Follow both routes up and they arrive at the same col. A change has to reach a cluster safely without a person reading every line, whether there are too many clusters for people to keep up, or the author isn't a person at all. The fix for both is the same: GitOps, policy and progressive delivery. Nobody this week argued for a human reading every diff. And nobody argued for an agent with production credentials and no gate.\u003c/p>\n\u003cp>So where are we standing when we start, and what ties the climbs together?\u003c/p>","plan":{"Act":"I","Job":"show both forces arriving at the same fix, and give the room the sentence to carry out","Headline":"Let agents propose. Let progressive delivery and policy decide.","Visual":"the line set large in the night sky. Below it a ridge: a haze route climbs from the left foot (\"more clusters than hands\"), a teal route from the right (\"agents that change infrastructure\"); both draw themselves up to one col that glows alpenglow, labelled GitOps, policy, progressive delivery","Energy":"2","Into next":"so where are we standing when we start, and what ties the climbs together?","Merged from":"`two-forces` (the convergence picture) and `the-line` (the sentence)"}},"path-1":{"title":"Path 1","notes":"\u003cp>Path 1 is the one the others are belayed to, so it goes first.\u003c/p>\n\u003cp>Teams don't hold on to the sync button because they like clicking. They hold on to it because it's the only change control they have. So the offer is a trade. Stop clicking sync, and in exchange nothing ships during a freeze, a policy violation fails in CI instead of at two in the morning, and a bad version rolls itself back. The letters show which stage delivers each one.\u003c/p>\n\u003cp>Five stages up the face. A, by January: Argo becomes a control loop in non-prod, with its guardrails in the same change. B, in the first quarter: one policy set, run in CI and at admission. Then promotion as a pull request, the fleet rolling in waves, and in 2028 the summit: a team onboards an app with no platform ticket.\u003c/p>\n\u003cp>The full argument is its own deck. Path 2 is the one everyone is looking at.\u003c/p>","plan":{}},"path-1-ten":{"title":"Path 1","notes":"\u003cp>Path 1 is the one the others are belayed to, so it goes first.\u003c/p>\n\u003cp>Teams don't hold on to the sync button because they like clicking. They hold on to it because it's the only change control they have. So the offer is a trade. Give up the button, and in exchange nothing ships during a freeze, a policy violation fails in CI instead of at two in the morning, and a bad version rolls itself back. The letters show which stage delivers each one, and two of the three come from stage B.\u003c/p>\n\u003cp>Five stages up the face. A, by January: Argo becomes a control loop in non-prod, with its guardrails in the same change. B, in the first quarter: one policy set, run in CI and at admission. That's the one in orange, the one we're asking you to protect. Then promotion as a pull request, the fleet rolling in waves in the second half of 2027, and in 2028 the summit: a team onboards an app with no platform ticket.\u003c/p>\n\u003cp>The full argument is its own deck, Path 1: Deployments as a service. Path 2 is the one everyone is looking at.\u003c/p>","plan":{"Act":"II","Job":"say what Path 1 changes for a developer and what teams get back","Headline":"Path 1: teams trade the sync button for better change control.","Visual":"the mint summit on its own, stages A–E as camps up its face with dates; stage B lit in alpenglow, the one we protect. On the left, the trade: three things teams get back, each tagged with the stage that delivers it (two of the three are stage B)","Energy":"3","Into next":"Path 2 is the one everyone is looking at.","Source":"`path1-deployments`","Status":"forked from `path-1`: headline tightened into the trade itself, fewer words, stage B warm, deck pointer moved to the notes"}},"path-2":{"title":"Path 2","notes":"\u003cp>Path 2 is the one everyone is looking at, and the main thing to say about it is what it isn't. It isn't an agent platform we build from scratch.\u003c/p>\n\u003cp>Claude comes off the laptop and runs headless in a throwaway pod, started by Jenkins, which we already run. The pod gets a short-lived identity and no static key. Its only ways out are a gateway, which every model call and tool call goes through, and telemetry, so every call is a span with a team and a cost on it. After the run, the pod is gone.\u003c/p>\n\u003cp>Four phases. Phase 0 is laptops, now: telemetry on, and one shared marketplace for skills and MCP configs. Phase 1, by Q2 2027: read-only agents, starting with alert triage. Phase 2, by the end of 2027: agents open pull requests, and review is unchanged. Phase 3 is 2028, and it's a decision we make with real data.\u003c/p>\n\u003cp>And Path 3 is the ground the other two stand on.\u003c/p>","plan":{}},"path-2-ten":{"title":"Path 2","notes":"\u003cp>Path 2 is the one everyone is looking at, and the main thing to say about it is what it isn't. It isn't an agent platform we build from scratch.\u003c/p>\n\u003cp>Claude comes off the laptop and runs headless in a throwaway pod, started by Jenkins, which we already run. The pod gets a short-lived identity and no static key, in one namespace. Its only ways out are a gateway, which every model call and tool call goes through, and telemetry, so every call is a span with a team and a cost on it. After the run, the pod is gone.\u003c/p>\n\u003cp>Four phases. Phase 0 is laptops, now: telemetry on, and one shared marketplace for skills and MCP configs. The two in orange are the dates we're asking for. Phase 1, by Q2 2027: read-only agents, starting with alert triage. That one is safe, because triage never writes anything. Phase 2, by the end of 2027: agents open pull requests, and review is unchanged. That one is the bet, and it's dated after Path 1's stage B on purpose, because of the rope. Phase 3 is 2028, and it's a decision we make with real data.\u003c/p>\n\u003cp>The detail is its own deck, Path 2: Claude off the laptop, into the pod. And Path 3 is the ground the other two stand on.\u003c/p>","plan":{"Act":"II","Job":"say what Path 2 is, and what it deliberately isn't","Headline":"Path 2: Claude leaves the laptop for a throwaway pod with an identity, a gateway and a log.","Visual":"the teal summit, phases 0–3; phases 1 and 2 lit in alpenglow, the two dates. On the left, the pod as a dashed enclosure whose only exits are a gateway and telemetry","Energy":"3","Into next":"and Path 3 is the ground the other two stand on.","Source":"`CLAUDE-AGENT-PLATFORM.md`, `path2-agents`","Status":"forked from `path-2`: fewer words, the dated phases warm"}},"path-3":{"title":"Path 3","notes":"\u003cp>Path 3 is the ground the other two stand on: the fleet itself.\u003c/p>\n\u003cp>Two ideas. Clusters become cattle: built from code, numbered, replaceable, nobody's pet. And developers never write a cluster name; an app declares constraints, like PCI and GPU, and the platform resolves them to clusters.\u003c/p>\n\u003cp>Four stages. Stage 1 starts now and costs almost nothing: cluster labels become an API, which needs a schema and an owner. Path 1's fleet waves depend on it, which is the second rope. Then fleet delivery in waves, then lifecycle, which is EKS as our one orchestrator with Auto Mode and an upgrade window that's a policy rather than a project, and then Crossplane for the infrastructure app teams own, starting with S3.\u003c/p>\n\u003cp>Two of these camps across the three paths get dates. The rest don't, on purpose.\u003c/p>","plan":{}},"path-3-ten":{"title":"Path 3","notes":"\u003cp>Path 3 is the ground the other two stand on: the fleet itself.\u003c/p>\n\u003cp>Two ideas. Clusters become cattle: built from code, numbered, replaceable, nobody's pet. And developers never write a cluster name. An app declares constraints, like PCI and GPU, and the platform resolves them to clusters.\u003c/p>\n\u003cp>Four stages. Stage 1, in orange, starts now and costs almost nothing: cluster labels become an API, which needs a schema and an owner. Path 1's fleet waves select on those labels, which is the second rope. Then fleet delivery in waves, then lifecycle, which is EKS as our one orchestrator, with Auto Mode and an upgrade window that's a policy rather than a project. Then Crossplane for the infrastructure app teams own, starting with S3.\u003c/p>\n\u003cp>The detail is its own deck, Path 3: The fleet is going to get big. So here's what we need from this room.\u003c/p>","plan":{"Act":"II","Job":"say what Path 3 is, and why its first stage is nearly free","Headline":"Path 3: clusters become cattle, and developers never write a cluster name.","Visual":"the haze summit, stages 1–4; stage 1 lit in alpenglow because it starts now. On the left, twelve identical numbered clusters and the one line of placement an app writes instead of a cluster name","Energy":"3","Into next":"so here's what we need from this room.","Source":"`EKS-VS-ECS.md`, GOALS §5 and §10, `path3-fleet`","Status":"forked from `path-3`: fewer words, stage 1 warm, new transition into the ask"}},"the-answer":{"title":"One path, three climbs","notes":"\u003cp>This is the answer, so we're putting it first. One path to production for every change, whoever or whatever wrote it. We build it as three climbs, and all three start this quarter.\u003c/p>\n\u003cp>The picture is the show's own artwork: the Wasatch range you could see from the convention centre. Three summits from one base camp. The centre one is the tallest because it's the one the others depend on: Path 1, making deployment a service. On the right, the sharpest and newest: Path 2, getting Claude off laptops and into pods we control. On the left, the broadest: Path 3, the EKS fleet and Crossplane, the ground the other two stand on.\u003c/p>\n\u003cp>Peak height is ambition, not priority. Path 3 is widest because everything else stands on its cluster-label vocabulary.\u003c/p>\n\u003cp>Why one path? Because two things got loud this week, and they turn out to be the same problem.\u003c/p>","plan":{"Act":"I","Job":"put the recommendation up front so everything after it is support","Headline":"One path to production for every change, built as three climbs that start this quarter.","Visual":"the range. Three silhouetted summits on the gradient disc, each named: Path 1 Deployments as a service (mint, centre, tallest), Path 2 Claude agent platform (teal, sharpest), Path 3 EKS fleet + Crossplane (haze, broadest). This is the title slide","Energy":"4","Into next":"why one path? Because two things got loud this week, and they turn out to be the same problem.","Status":"kept as is"}},"the-ask":{"title":"The ask","notes":"\u003cp>Here's what we need from this room, and it's small enough to say yes to today.\u003c/p>\n\u003cp>Three owners, one per path. A name each, not a team.\u003c/p>\n\u003cp>For Path 1, protect stage B. It's one policy set, run in CI and at admission. Nobody demos it, so it's the easiest thing to deprioritise, and it gates both Path 1's next stage and Path 2's agent pull requests. If one thing gets protected headcount, it's this.\u003c/p>\n\u003cp>For Path 2, commit to the two dates: alert triage by Q2 2027, agents opening pull requests by the end of 2027.\u003c/p>\n\u003cp>For Path 3, start stage 1 now: someone owns the cluster-label schema, and we agree EKS is our one orchestrator.\u003c/p>\n\u003cp>Two things are on no path but do have a clock: Gateway API, because Ingress NGINX is retired, and an inventory of our long-lived secrets.\u003c/p>\n\u003cp>We'll leave this up for the discussion. Each path has its own deck with the detail.\u003c/p>","plan":{}},"the-ask-dated":{"title":"The ask","notes":"\u003cp>Back to Meta for a second. A hundred clusters and fifteen engineers isn't heroics and it isn't headcount. It's what a finished path looks like: every change takes the same path, through every cluster, and nobody clicks anything along the way. Here's what it takes to start, and it's small enough to say yes to today.\u003c/p>\n\u003cp>This is the plan, drawn to scale, from this month to the end of 2028, and the ask is written on it.\u003c/p>\n\u003cp>First, three owners, one per path. A name each, not a team. Those are the empty lines on the left.\u003c/p>\n\u003cp>Second, protect stage B. It's one policy set, run in CI and at admission. Nobody demos it, so it's the easiest thing to deprioritise, and it gates both Path 1's next stage and Path 2's agent pull requests. If one thing gets protected headcount, it's this.\u003c/p>\n\u003cp>Third, commit to two dates on Path 2. Alert triage by Q2 2027, which is safe because triage never writes anything. And agents opening pull requests by the end of 2027, which is a bet, and it's dated after stage B on purpose.\u003c/p>\n\u003cp>Path 3's first stage, the label schema, starts now. Everything dashed is gated, not scheduled. If the lower stages land early, the rest starts early. If they slip, the rest slips with them, and nobody has to re-argue the order.\u003c/p>\n\u003cp>We'll leave this up for the discussion. Each path has its own deck with the detail.\u003c/p>","plan":{"Act":"III","Job":"make the ask small enough to say yes to in the room, and show it is the plan, not a wish list","Headline":"Name three owners today, protect stage B, and commit to two dates.","Visual":"the three paths as lanes on a timeline to scale, Nov 2026 to the end of 2028. Each lane starts with its name and an empty owner line, and ends at its own small summit. Stage B is filled and ringed in alpenglow; Path 2 carries the two date flags (alert triage by Q2 2027, agent PRs by the end of 2027); Path 3 stage 1 \"starts now\". Everything later is dashed: gated, not scheduled","Energy":"4","Into next":"end. Leave this up for the discussion.","Merged from":"`dates` (the timeline), `the-ask` (owners, stage B, the dates) and `echo` (now the opening line of the notes)"}},"the-belay":{"title":"The belay","notes":"\u003cp>So where are we standing? Base camp, along the bottom. Let's say it plainly, because everyone here knows it. Our clusters have names people know by heart and get upgraded one at a time. Argo CD is in every cluster, on manual sync: a dashboard somebody clicks. And Claude runs on laptops, with skills passed round in Slack. None of that is a failure. It's an honest starting point.\u003c/p>\n\u003cp>From there, three climbs. Path 1 up the middle: delivery, stages A to E. Path 2 on the right: agents, phases 0 to 3. Path 3 on the left: the fleet, stages 1 to 4. Mostly they're independent, which is why we can staff them in parallel. But two ropes tie them together, and one of them decides what we protect.\u003c/p>\n\u003cp>Click. The rope runs from Path 1, stages B and C, across to Path 2, phase 2. Stage B is one policy set, run in CI and at admission. Stage C makes promotion a pull request. Phase 2 is the first time an agent opens a PR. An agent's PR is only safe because the same policy and the same promotion path check it that check a human's. So no agent opens a PR until policy runs in CI. That's the belay.\u003c/p>\n\u003cp>Pause on that. The least visible work on Path 1, a policy layer nobody demos, gates the most visible work on Path 2. If one piece of work gets protected headcount, it's stage B.\u003c/p>\n\u003cp>Click. The second rope is thinner. Path 3's first stage is a cluster-label vocabulary, and Path 1's stage D rolls changes across the fleet by selecting on those labels. That one's nearly free to start, which is why Path 3 starts now.\u003c/p>\n\u003cp>Each climb in one slide, starting with the one the others are belayed to.\u003c/p>","plan":{"Act":"II","Job":"the turn: from today's base camp, three climbs, and the one ordering that decides what we protect","Headline":"No agent opens a PR until policy runs in CI.","Visual":"the route map on the full range with the disc behind Path 1. A base-camp band along the foot says where each path starts today. Camps are lettered; only the camps the ropes touch are named. Click: the alpenglow rope draws from Path 1 B–C to Path 2 phase 2 (\"the belay\") and the other camps step back. Click: a thinner haze rope from Path 3 stage 1 to Path 1 D","Energy":"5","Into next":"each climb in one slide, starting with the one the others are belayed to.","Merged from":"`base-camp` (today, now the band), `three-climbs` (the route map) and `the-rope` (the ropes)"}},"the-line":{"title":"The line","notes":"\u003cp>If you remember one line from this readout, make it this one. Let agents propose. Let progressive delivery and policy decide.\u003c/p>\n\u003cp>Pause.\u003c/p>\n\u003cp>We heard it five different ways, in five different tracks, from people who had already shipped it. Nobody argued for a human reading every diff. And nobody argued for an agent with production credentials and no gate.\u003c/p>\n\u003cp>So where are we standing when we start?\u003c/p>","plan":{}},"the-rope":{"title":"The rope","notes":"\u003cp>Three climbs, and on the last slide they looked independent. Mostly they are, which is why we can staff them in parallel. But two ropes tie them together, and one of them decides what we protect.\u003c/p>\n\u003cp>Click. The first rope runs from Path 1, stages B and C, across to Path 2, phase 2. Stage B is policy running in CI and at admission. Stage C is promotion as a pull request. Phase 2 is the first time an agent opens a PR. An agent's PR is only safe because the same policy and the same promotion path check it that check a human's. So no agent opens a PR until policy runs in CI. That's the belay.\u003c/p>\n\u003cp>Pause on that. It means the least visible work on Path 1, a policy layer nobody demos, is the thing that gates the most visible work on Path 2. If one piece of work gets protected headcount, it's stage B.\u003c/p>\n\u003cp>Click. The second rope is thinner. Path 3's first stage is a cluster-label vocabulary. Path 1's stage D rolls changes across the fleet by selecting on those labels. That one's nearly free to start, which is why Path 3 starts now.\u003c/p>\n\u003cp>Everything else on the three faces is independent. Each climb in one slide, starting with the one the others are belayed to.\u003c/p>","plan":{}},"three-climbs":{"title":"Three climbs","notes":"\u003cp>From base camp, three climbs. Each has its own stages, numbered the way its own plan numbers them.\u003c/p>\n\u003cp>Path 1, up the middle: delivery. Stage A turns Argo into a control loop. B is policy, one set in CI and at admission. C makes promotion a pull request. D rolls changes across the fleet in waves. E is the summit: deploying becomes a service.\u003c/p>\n\u003cp>Path 2, on the right: agents. Phase 0 is laptops: telemetry and one shared marketplace. Phase 1 is read-only agents in CI, starting with alert triage. Phase 2, agents open pull requests. Phase 3, teams add their own agent jobs without a ticket to us.\u003c/p>\n\u003cp>Path 3, on the left: the fleet. Stage 1 makes cluster labels an API. Then fleet delivery, then cluster lifecycle, then Crossplane for the infrastructure app teams own.\u003c/p>\n\u003cp>They look independent. Two ropes say they aren't.\u003c/p>","plan":{}},"two-forces":{"title":"Two forces, one fix","notes":"\u003cp>Two things got loud this week, from two different directions.\u003c/p>\n\u003cp>On the left, fleets. Companies running hundreds of clusters and still upgrading them by hand. Ninety percent of AI runs on Kubernetes, so the fleet is growing, not shrinking.\u003c/p>\n\u003cp>On the right, agents. They're a new kind of workload that needs sandboxing, identity and egress control. And they're a new kind of user: they want to change our infrastructure, which means they need a path to production that doesn't depend on a human reading every diff.\u003c/p>\n\u003cp>Click. Follow both routes up and they arrive at the same place. A change has to reach a cluster safely without a person reviewing every line, whether there are too many clusters for people to keep up, or the author isn't a person at all. The answer to both is one control plane: GitOps, policy, and progressive delivery. That's what makes a change safe regardless of who or what wrote it.\u003c/p>\n\u003cp>First force first: the fleets.\u003c/p>","plan":{}}},"narrativeOrder":["cold-open","the-answer","fleets","agents-arrive","one-line","the-belay","path-1-ten","path-2-ten","path-3-ten","the-ask-dated"],"kit":"1.0.0"};</script>
