<script>window.DECK = {"deck":"ten-takeaways","title":"Ten takeaways, ten looks","draft":"main","drafts":{"main":["cold-open","upgrade-like-an-app","mark-the-seam","restore-or-rumor","signal","rule-not-driver","boarding-pass","not-a-cage","base-camp-first","reading-room","itemize","three-on-monday"]},"size":[1920,1080],"slides":{"base-camp-first":{"title":"Base camp first","notes":"\u003cp>This is the one rule the rest of the agent half hangs on: base camp first.\u003c/p>\n\u003cp>It's our AI rollout drawn as an expedition profile, the side-on mountain you get in a climbing guide. We're at camp zero: engineers use Claude Code and a human applies every change.\u003c/p>\n\u003cp>Click. Two camps get dates. Camp one, alert triage, by Q2 2027. It explains and never acts, so it needs no write path. Verkada does this for thirty-three cents an alert. Camp two, agents opening pull requests, by the end of 2027. Review still decides. Podium says thirty percent of their merged PRs come from agents.\u003c/p>\n\u003cp>Click. Above that the route is pale and dashed, and it has no dates on purpose. Owning alerting, agents that fix things inside a blast radius, teams writing their own agents. You only date the camps you can see, and we can't see those yet: they need delivery and policy, sections one and two, finished first.\u003c/p>\n\u003cp>Camp one needs two things before we go: something to read, and a way to count.\u003c/p>","plan":{"Act":"III","Job":"the peak: the AI rollout ladder (GOALS §6)","Headline":"Base camp first.","Visual":"an expedition elevation profile. Camps 0–2 on a surveyed, dated slope (today; Q2 2027; end 2027); camps 3–5 pale, dashed and undated","Energy":"5","Into next":"camp 1 needs two things: something to read and a way to count.","Source":"GOALS §6; Verkada, Podium, Salesforce, Mastercard, IBM, Google"}},"boarding-pass":{"title":"Boarding passes","notes":"\u003cp>Rule six: boarding passes, not house keys.\u003c/p>\n\u003cp>A house key works forever, for whoever holds it. That's what a long-lived secret is, and a secret an agent can read is a secret that can leave the building.\u003c/p>\n\u003cp>A boarding pass names who you are, is good for one trip, and is worthless an hour later. That's workload identity. This pass is illustrative: a triage agent in the SRE namespace, a read-only seat, going to the metrics API, with a SPIFFE identity, valid for fifteen minutes, checked by Cedar or OpenFGA, carrying a short-lived certificate, and no static secret on file.\u003c/p>\n\u003cp>On the stub, the other passengers on this flight at the show: Coinbase moving from bearer tokens to mesh mTLS, Google and Microsoft on pod certificates, RBC on why Kubernetes Secrets were a bad idea, and two more.\u003c/p>\n\u003cp>An identity says who the agent is. It doesn't say where it's allowed to run.\u003c/p>","plan":{"Act":"III","Job":"the identity and secrets takeaway (GOALS §9, §3.6)","Headline":"Boarding passes, not house keys.","Visual":"an airline boarding pass for a triage agent: SPIFFE ID, valid for 15 minutes, read-only seat, checked by Cedar or OpenFGA, no static secret on file. The stub lists the other passengers (Coinbase, Google and Microsoft, RBC, Veritas Automata, Infisical)","Energy":"3","Into next":"an identity says who the agent is. It doesn't say where it can run.","Source":"the pass is illustrative; sessions on the stub"}},"cold-open":{"title":"Ten rules","notes":"\u003cp>Ten things we brought home from Salt Lake City, about a minute each. Here's the promise: every one of them is a rule we can adopt, not a tool we have to buy.\u003c/p>\n\u003cp>They come in the order you'd build them. The first three are the ground the fleet stands on. The next two are the path every change takes across it. The last five are what agents need before we let them in. The colours are the same three paths we use everywhere else.\u003c/p>\n\u003cp>The first rule is about the thing that's going to get big whatever we do.\u003c/p>","plan":{"Act":"I","Job":"set the promise: ten rules, no shopping list","Headline":"We came home with ten rules, and none of them is a product.","Visual":"the Three Peaks ridge, with ten small summit flags along it, unlabelled","Energy":"3","Into next":"the first rule is about the thing that's going to get big whatever we do."}},"itemize":{"title":"Itemize it","notes":"\u003cp>Last rule: itemize it, or it didn't happen.\u003c/p>\n\u003cp>On the receipt, what we saw other teams itemise. Verkada knows its alert triage costs thirty-three cents an alert, which is about fifteen hundred dollars a month; that total is our arithmetic on their title. Nubank traces sixteen billion spans an hour. Yahoo tamed Istio's metric cardinality at ten thousand pods. Adobe attributes network cost back to teams with eBPF.\u003c/p>\n\u003cp>Then our tab. Can we list what we use AI for? Not yet. Spend by team? Not yet. Every MCP call as a span? Not yet. Total known: nothing.\u003c/p>\n\u003cp>The fix is boring and it's first: turn on telemetry, put every call on the OpenTelemetry pipeline we already run, with a team and a use case on it. The inventory falls out of the instrumentation.\u003c/p>\n\u003cp>Ten rules. Three of them we can start on Monday.\u003c/p>","plan":{"Act":"III","Job":"the observability takeaway (GOALS §4)","Headline":"Itemize it, or it didn't happen.","Visual":"a thermal till receipt. What we saw itemised (Verkada, Nubank, Yahoo, Adobe), then our tab, three lines reading NOT YET, and TOTAL KNOWN $ —","Energy":"3","Into next":"ten rules. Three of them we can start on Monday.","Source":"Verkada title (the $1,551 is our arithmetic), Nubank, Yahoo, Adobe"}},"mark-the-seam":{"title":"Mark the seam","notes":"\u003cp>Rule two: mark the seam before we pour.\u003c/p>\n\u003cp>This is our AWS stack drawn as a building in section. The foundation is the landing zone: accounts, guardrails, org-wide scaffolding. Then CDK: VPCs, the EKS clusters, shared services. Then the seam, the amber line. Above it, Crossplane, starting with S3 and moving to typed APIs that apps, and agents, can call. Then the apps themselves.\u003c/p>\n\u003cp>Below the seam, things change rarely. Above it, they change constantly. Two tools fighting over one AWS resource always starts with a line nobody drew. And like concrete, once it's poured, moving it is expensive.\u003c/p>\n\u003cp>The line is decision three, and it needs a diagram, not a debate.\u003c/p>\n\u003cp>And under the foundation is the one thing we can't get back.\u003c/p>","plan":{"Act":"I","Job":"the AWS takeaway (GOALS §10)","Headline":"Mark the seam before we pour.","Visual":"cyanotype blueprint. A building in section: LZA and CDK below, the seam as a dashed amber line, Crossplane and the apps above, and a title block holding status and references","Energy":"3","Into next":"and under the foundation, the one thing we can't get back.","Source":"GOALS §10.1–§10.3; the seam is our proposal (decision 3)"}},"not-a-cage":{"title":"Not a cage","notes":"\u003cp>Rule seven: a container is not a cage.\u003c/p>\n\u003cp>Agents run code they wrote a minute ago, and every container on a node shares one kernel. So the rule is that each agent gets a microVM-grade boundary, and its own identity, before it ever gets a credential.\u003c/p>\n\u003cp>It's drawn like a lab's containment levels. Level one, a plain container: fine for our own services, not for agent-written code. Level two, gVisor, a user-space kernel in between. Level three, Kata microVMs: the agent gets its own kernel, and pod snapshots make the start-up cost bearable; that's the one we'd lead with. Level four, an agent substrate that bundles identity, sandbox, session and egress into one layer; that one's still a decision, or at least a vocabulary to pick.\u003c/p>\n\u003cp>Red Hat, Microsoft, Google, Solo.io with Anthropic, NTT and vCluster all presented on it.\u003c/p>\n\u003cp>So how far up the mountain do we let agents go, and when?\u003c/p>","plan":{"Act":"III","Job":"the sandboxing takeaway (GOALS §3)","Headline":"A container is not a cage.","Visual":"biocontainment notice. Safety yellow, hazard stripes, and a four-level containment ladder (container, gVisor, Kata microVM, agent substrate) with a verdict per level","Energy":"4","Into next":"so how far up do we let agents go, and when?","Source":"Red Hat, Microsoft, Google, Solo.io, NTT, vCluster sessions"}},"reading-room":{"title":"Reading room only","notes":"\u003cp>Rule nine, and the first thing camp one needs: something to read. Reading room only.\u003c/p>\n\u003cp>A reference library is the best-known place where you may read everything and take nothing. That's the access rule for agents. They study a read-only copy of production: cluster state dumped to a database on a schedule, metrics queried from Prometheus, and where freshness matters, a small set of narrow, audited live tools. They get a desk in the reading room, never the keys to the stacks.\u003c/p>\n\u003cp>NVIDIA and Upbound showed a queryable audit layer like this, and Mastercard argued for a narrow tool surface over a stale index.\u003c/p>\n\u003cp>Read-only extraction is how we say yes to agent analysis without saying yes to agent credentials in production. It feeds camp one directly.\u003c/p>\n\u003cp>And every page they read goes on the receipt.\u003c/p>","plan":{"Act":"III","Job":"the data-access takeaway (GOALS §7)","Headline":"Reading room only.","Visual":"a library catalogue card on a green baize desk, with a red READ ONLY stamp. Holdings: cluster state in a database, Prometheus, narrow audited tools","Energy":"2","Into next":"and every page they read goes on the receipt.","Source":"NVIDIA + Upbound; Mastercard"}},"restore-or-rumor":{"title":"Restore, or it's a rumor","notes":"\u003cp>Rule three: backups are a rumor until you restore.\u003c/p>\n\u003cp>This is the one item on our whole list where being wrong is unrecoverable, so it gets a safety sign. Three steps, posted like an emergency procedure. Retain: audit every storage class, because Delete is the default reclaim policy and it's the wrong one for data we care about. Back up: Velero on a schedule, and nothing bespoke, because there's now a working group standardising the primitives. Drill: restore into a scratch cluster on a calendar, and time it.\u003c/p>\n\u003cp>The drill is the point. A cluster we can rebuild is a cluster we're willing to upgrade aggressively, which takes us back to rule one.\u003c/p>\n\u003cp>That's the ground. Now the path every change takes across it.\u003c/p>","plan":{"Act":"I","Job":"the data-protection takeaway (GOALS §8)","Headline":"Backups are a rumor until you restore.","Visual":"an ISO 7010 safe-condition placard. Safety green, a database-with-restore pictogram, three numbered panels: retain, back up, drill","Energy":"2","Into next":"that's the ground. Now the path change takes across it.","Source":"Velero project update (Red Hat); Data Protection WG (Broadcom)"}},"rule-not-driver":{"title":"The rule doesn't ask","notes":"\u003cp>Rule five: the rule doesn't ask who's driving.\u003c/p>\n\u003cp>This is set as a statute on purpose. The clause never names a person or an agent: \"No workload shall run privileged, mount the host, or reach an unapproved model or tool, whoever authored the change.\" That's the whole idea. Write policy against the action, not the actor, and the rule that stops an engineer shipping a privileged pod also bounds an agent.\u003c/p>\n\u003cp>The sub-clauses are the mechanics. Enforced at admission in CEL, with no webhook in the request path. Run first in CI, so a violation is a failing test an agent can fix. And clause (c) is our own proposal: no sync during a change window without an approved change record.\u003c/p>\n\u003cp>In the margin, the cases we heard: AT&T, Google, JPMorganChase, Grainger, and Nirmata with Nutanix on policy at the AI gateway.\u003c/p>\n\u003cp>Which matters most for the drivers that aren't people.\u003c/p>","plan":{"Act":"II","Job":"the policy takeaway (GOALS §2)","Headline":"The rule doesn't ask who's driving.","Visual":"a page from an annotated statute book. One operative clause (\"No workload shall run privileged… whoever authored the change\"), lettered sub-clauses, and an annotations column of cases heard","Energy":"3","Into next":"which matters most for the drivers that aren't people.","Source":"AT&T + Nirmata, Google, JPMorganChase + Nirmata, W.W. Grainger, Nirmata + Nutanix"}},"signal":{"title":"A signal to leave","notes":"\u003cp>Rule four: nothing leaves the station without a signal.\u003c/p>\n\u003cp>Promotion is literally a train leaving one station for the next: dev, stage, prod. And a departure board is a public, timestamped record of what left and when, which is exactly what we want from GitOps.\u003c/p>\n\u003cp>Read the board. LinkedIn: canary namespaces with an Argo CD gate, a week per release down to an hour. Meta: Terraform on a cron job replaced by Argo CD and Kargo, a day down to minutes. Transfix: agents earn the right to merge, from shadow mode to a granted permission. Ford: CI as the safety net under AI-written GitOps, across hundreds of clusters.\u003c/p>\n\u003cp>And our row, in amber: Kargo or GitOps Promoter, held for a two-week spike.\u003c/p>\n\u003cp>The signal is the pipeline, not a person reading every diff. And the signal is decided by a rule that doesn't care who wrote the change.\u003c/p>","plan":{"Act":"II","Job":"the delivery takeaway (GOALS §1)","Headline":"Nothing leaves the station without a signal.","Visual":"split-flap departure board. Rows are operators, what they ran and the result; our row comes last, in amber: Kargo or GitOps Promoter, held for a two-week spike","Energy":"4","Into next":"and the signal is decided by a rule that doesn't care who wrote the change.","Source":"LinkedIn, Meta, Transfix, Ford sessions; GOALS decision 1"}},"three-on-monday":{"title":"Three on Monday","notes":"\u003cp>Ten rules. Here's the range again, and now every peak has its name.\u003c/p>\n\u003cp>Upgrade like an app. Mark the seam. Restore, or it's a rumor. A signal to leave. The rule doesn't ask who's driving. Boarding passes. Not a cage. Base camp first. Reading room. Itemize it.\u003c/p>\n\u003cp>None of them is a product. And three of them cost a meeting, not a purchase, so we can start them on Monday. Mark the seam: one diagram with the line drawn between CDK and Crossplane. Retain, back up, drill: audit our reclaim policies and time one restore. Itemize it: turn telemetry on and write down what we actually use AI for.\u003c/p>\n\u003cp>Each of those needs one owner. That's the ask.\u003c/p>","plan":{"Act":"III","Job":"close: echo the promise and make the ask","Headline":"Ten rules; three of them cost a meeting, not a purchase.","Visual":"back on the ridge. The ten flags now carry their rules; three are lit (mark the seam, restore, itemize), each with an owner line","Energy":"4","Into next":"end"}},"upgrade-like-an-app":{"title":"Upgrade like an app","notes":"\u003cp>Rule one, and it's about the thing that's going to get big whatever we do: upgrade the fleet like you ship an app.\u003c/p>\n\u003cp>Every fleet talk at the show was really an upgrade story. LinkedIn took production across three Kubernetes minor versions in seven business days, in one skip-level rollout; it used to take forty. NVIDIA converged about fifty-six hundred nodes in thirty minutes for two kernel CVEs, because the change shipped with its own check. Meta runs about a hundred clusters with fifteen engineers. Salesforce runs a thousand.\u003c/p>\n\u003cp>The common thread: ship each change with the check that fails without it, roll it out in waves, and nobody upgrades a cluster by hand.\u003c/p>\n\u003cp>A fleet that big is built from code. So where does one tool's code stop and the next one's start?\u003c/p>","plan":{"Act":"I","Job":"the fleet takeaway (GOALS §5)","Headline":"Upgrade the fleet like you ship an app.","Visual":"Swiss poster: off-white, one heavy grotesk, one signal red, four numbers that carry the slide: 7 business days (was 40), 30 minutes for about 5,600 nodes, 15 engineers, 1,000 clusters","Energy":"4","Into next":"a fleet that big is built from code, so where does one tool's code stop?","Source":"LinkedIn deck p.2, NVIDIA deck, Meta and Salesforce abstracts"}}},"narrativeOrder":["cold-open","upgrade-like-an-app","mark-the-seam","restore-or-rumor","signal","rule-not-driver","boarding-pass","not-a-cage","base-camp-first","reading-room","itemize","three-on-monday"],"kit":"1.0.0"};</script>
