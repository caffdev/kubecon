<script>window.DECK = {"deck":"ten-takeaways","title":"Ten takeaways, ten looks","draft":"ten","drafts":{"main":["cold-open","upgrade-like-an-app","mark-the-seam","restore-or-rumor","signal","rule-not-driver","boarding-pass","not-a-cage","base-camp-first","reading-room","itemize","three-on-monday"],"ten":["cold-open-ten","upgrade-like-an-app-ten","mark-the-seam-ten","restore-or-rumor-ten","signal-any-driver","cage-and-pass","base-camp-first-ten","reading-room-ten","itemize-ten","three-on-monday-ten"]},"size":[1920,1080],"slides":{"base-camp-first":{"title":"Base camp first","notes":"\u003cp>This is the one rule the rest of the agent half hangs on: base camp first.\u003c/p>\n\u003cp>It's our AI rollout drawn as an expedition profile, the side-on mountain you get in a climbing guide. We're at camp zero: engineers use Claude Code and a human applies every change.\u003c/p>\n\u003cp>Click. Two camps get dates. Camp one, alert triage, by Q2 2027. It explains and never acts, so it needs no write path. Verkada does this for thirty-three cents an alert. Camp two, agents opening pull requests, by the end of 2027. Review still decides. Podium says thirty percent of their merged PRs come from agents.\u003c/p>\n\u003cp>Click. Above that the route is pale and dashed, and it has no dates on purpose. Owning alerting, agents that fix things inside a blast radius, teams writing their own agents. You only date the camps you can see, and we can't see those yet: they need delivery and policy, sections one and two, finished first.\u003c/p>\n\u003cp>Camp one needs two things before we go: something to read, and a way to count.\u003c/p>","plan":{}},"base-camp-first-ten":{"title":"Base camp first","notes":"\u003cp>This is the rule the whole agent half hangs on: base camp first.\u003c/p>\n\u003cp>It's our AI rollout drawn as an expedition profile, the side-on mountain from a climbing guide. We're at camp zero: engineers use Claude Code locally, and a human applies every change.\u003c/p>\n\u003cp>Click. The route draws, and two camps get flags. Camp one, alert triage, by Q2 2027. It explains and never acts, so it needs no write path at all. Verkada runs exactly this, at thirty-three cents an alert. Camp two, agents opening pull requests, by the end of 2027. Review still decides. Podium says thirty percent of their merged PRs now come from agents. Those are the two dates we're proposing; decision six in GOALS is whether we commit to them.\u003c/p>\n\u003cp>Click. Above that, the route goes pale and dashed, and it has no dates on purpose. An agent that owns alerting. Agents that fix things inside a blast radius, which Salesforce and Mastercard showed. Teams running their own DBA, SRE and dev agents, which IBM and Google compared. You only date the camps you can see, and we can't see those yet. Each one waits on the spine from two slides ago: delivery and policy.\u003c/p>\n\u003cp>Pause. So the agent half is not a leap. It's two dated camps and a route we survey as we go.\u003c/p>\n\u003cp>Camp one needs two things before we leave: something to read, and a way to count.\u003c/p>","plan":{"Act":"III","Job":"the peak: the AI rollout ladder (GOALS §6), two dated camps and an undated route above","Headline":"Base camp first.","Visual":"an expedition elevation profile across the full sheet, faint contours behind. Camps 0–2 on a dark, surveyed slope; flags planted at camp 1 (Q2 2027, Verkada $0.33 an alert) and camp 2 (end 2027, Podium 30% of merged PRs). Camps 3–5 pale, dashed and undated","Energy":"5","Into next":"camp 1 needs two things: something to read and a way to count.","Source":"GOALS §6 and decision 6; Verkada, Podium; Salesforce, Mastercard, IBM, Google in the notes"}},"boarding-pass":{"title":"Boarding passes","notes":"\u003cp>Rule six: boarding passes, not house keys.\u003c/p>\n\u003cp>A house key works forever, for whoever holds it. That's what a long-lived secret is, and a secret an agent can read is a secret that can leave the building.\u003c/p>\n\u003cp>A boarding pass names who you are, is good for one trip, and is worthless an hour later. That's workload identity. This pass is illustrative: a triage agent in the SRE namespace, a read-only seat, going to the metrics API, with a SPIFFE identity, valid for fifteen minutes, checked by Cedar or OpenFGA, carrying a short-lived certificate, and no static secret on file.\u003c/p>\n\u003cp>On the stub, the other passengers on this flight at the show: Coinbase moving from bearer tokens to mesh mTLS, Google and Microsoft on pod certificates, RBC on why Kubernetes Secrets were a bad idea, and two more.\u003c/p>\n\u003cp>An identity says who the agent is. It doesn't say where it's allowed to run.\u003c/p>","plan":{}},"cage-and-pass":{"title":"A cage and a pass","notes":"\u003cp>Rules six and seven also share a slide, because they're the two walls around one agent: where it runs, and who it is. Every agent gets its own kernel and a pass that expires.\u003c/p>\n\u003cp>Where it runs first. Agents run code they wrote a minute ago, and every container on a node shares one kernel. So a container is not a cage. It's drawn as a lab's containment levels. Level one, a plain container: fine for our services, not for agent-written code. Level two, gVisor, a user-space kernel in between. Level three, Kata microVMs: the agent gets its own kernel, and Microsoft's pod snapshots make the start-up cost bearable. That's the row in black, the one we'd trial first. Level four, an agent substrate that bundles identity, sandbox, session and egress into one layer, which Solo.io keynoted with Anthropic and Google; for us it's still a decision, or at least a vocabulary to pick.\u003c/p>\n\u003cp>Now who it is: the pass clipped to the door. A house key works forever, for whoever holds it. That's a long-lived secret, and a secret an agent can read is a secret that can leave the building. A pass names who you are, is good for one trip, and is worthless an hour later. This one is illustrative: a SPIFFE identity for a triage agent, valid for fifteen minutes, checked by Cedar or OpenFGA, and no static secret on file. Coinbase, Google and Microsoft, RBC and Veritas Automata all argued some version of it.\u003c/p>\n\u003cp>So: a cage, and a pass. Never the house keys.\u003c/p>\n\u003cp>How far up the mountain do we let agents go, and when?\u003c/p>","plan":{"Act":"III","Job":"the sandboxing and identity rules together (GOALS §3, §9, §3.6): an agent's boundary is where it runs and who it is. Merged from `not-a-cage` and `boarding-pass`","Headline":"Every agent gets its own kernel and a pass that expires.","Visual":"a containment-lab door sign in safety yellow. On the right, the level ladder (container: not a cage; gVisor: trial; Kata microVM, its own kernel: trial, printed in reverse; agent substrate: decide). On the left, under the headline and clipped to the sign as the entry requirement, an illustrative pass: SPIFFE ID, valid 15 minutes, no static secret on file (Cedar or OpenFGA as the checker, in the notes)","Energy":"3","Into next":"so how far up the mountain do we let agents go, and when?","Source":"Red Hat, Microsoft, Google, Solo.io, NTT, vCluster sessions; Coinbase, Google + Microsoft, RBC, Veritas Automata, Infisical (notes). The pass is illustrative"}},"cold-open":{"title":"Ten rules","notes":"\u003cp>Ten things we brought home from Salt Lake City, about a minute each. Here's the promise: every one of them is a rule we can adopt, not a tool we have to buy.\u003c/p>\n\u003cp>They come in the order you'd build them. The first three are the ground the fleet stands on. The next two are the path every change takes across it. The last five are what agents need before we let them in. The colours are the same three paths we use everywhere else.\u003c/p>\n\u003cp>The first rule is about the thing that's going to get big whatever we do.\u003c/p>","plan":{}},"cold-open-ten":{"title":"Ten rules","notes":"\u003cp>We spent four days in Salt Lake City and came home with ten things. Here's the promise: every one of them is a rule we can adopt, not a tool we have to buy.\u003c/p>\n\u003cp>They come in the order you'd build them. Pause on the range. The first three are the ground the fleet stands on. The next two are the path every change takes across it. The last five are what agents need before we let them in.\u003c/p>\n\u003cp>Ten rules in ten slides means two slides carry a pair. I'll say when.\u003c/p>\n\u003cp>The first rule is about the thing that gets big whatever we do.\u003c/p>","plan":{"Act":"I","Job":"set the promise: ten rules, no shopping list, in three groups","Headline":"We came home with ten rules, and none of them is a product.","Visual":"the Three Peaks range at night: ten peaks capped by path, three thin brackets above them naming the groups (the ground, the spine, the agents)","Energy":"3","Into next":"the first rule is about the thing that gets big whatever we do."}},"itemize":{"title":"Itemize it","notes":"\u003cp>Last rule: itemize it, or it didn't happen.\u003c/p>\n\u003cp>On the receipt, what we saw other teams itemise. Verkada knows its alert triage costs thirty-three cents an alert, which is about fifteen hundred dollars a month; that total is our arithmetic on their title. Nubank traces sixteen billion spans an hour. Yahoo tamed Istio's metric cardinality at ten thousand pods. Adobe attributes network cost back to teams with eBPF.\u003c/p>\n\u003cp>Then our tab. Can we list what we use AI for? Not yet. Spend by team? Not yet. Every MCP call as a span? Not yet. Total known: nothing.\u003c/p>\n\u003cp>The fix is boring and it's first: turn on telemetry, put every call on the OpenTelemetry pipeline we already run, with a team and a use case on it. The inventory falls out of the instrumentation.\u003c/p>\n\u003cp>Ten rules. Three of them we can start on Monday.\u003c/p>","plan":{}},"itemize-ten":{"title":"Itemize it","notes":"\u003cp>Rule ten: itemize it, or it didn't happen.\u003c/p>\n\u003cp>Wait for the receipt to print. On it, what we saw other teams itemise. Verkada knows its alert triage costs thirty-three cents an alert, on about forty-seven hundred alerts a month; the fifteen hundred dollars is our arithmetic on their numbers. Nubank traces sixteen billion spans an hour. Yahoo tamed Istio's metric cardinality at ten thousand pods. Adobe, not on the receipt, attributes network cost back to teams with eBPF.\u003c/p>\n\u003cp>Then our tab. Can we list what we use AI for? Not yet. Spend by team? Not yet. Every MCP call as a span? Not yet. Total known: nothing.\u003c/p>\n\u003cp>We can't pick the right model per use case, or defend the spend, until every call is a line item. The fix is boring and it comes first: turn on telemetry, and put every call on the OpenTelemetry pipeline we already run, with a team and a use case on it. The inventory falls out of the instrumentation.\u003c/p>\n\u003cp>Ten rules. Three of them we can start on Monday.\u003c/p>","plan":{"Act":"III","Job":"the observability rule (GOALS §4): we can't manage AI spend we haven't itemised","Headline":"Itemize it, or it didn't happen.","Visual":"a thermal till receipt printing down from the top edge. What we saw itemised (Verkada, Nubank, Yahoo), then our tab: three lines reading NOT YET, and TOTAL KNOWN $ —","Energy":"3","Into next":"ten rules. Three of them we can start on Monday.","Source":"Verkada title (the $1,551 is our arithmetic), Nubank, Yahoo. Adobe's eBPF line moved to the notes"}},"mark-the-seam":{"title":"Mark the seam","notes":"\u003cp>Rule two: mark the seam before we pour.\u003c/p>\n\u003cp>This is our AWS stack drawn as a building in section. The foundation is the landing zone: accounts, guardrails, org-wide scaffolding. Then CDK: VPCs, the EKS clusters, shared services. Then the seam, the amber line. Above it, Crossplane, starting with S3 and moving to typed APIs that apps, and agents, can call. Then the apps themselves.\u003c/p>\n\u003cp>Below the seam, things change rarely. Above it, they change constantly. Two tools fighting over one AWS resource always starts with a line nobody drew. And like concrete, once it's poured, moving it is expensive.\u003c/p>\n\u003cp>The line is decision three, and it needs a diagram, not a debate.\u003c/p>\n\u003cp>And under the foundation is the one thing we can't get back.\u003c/p>","plan":{}},"mark-the-seam-ten":{"title":"Mark the seam","notes":"\u003cp>Rule two: mark the seam before we pour.\u003c/p>\n\u003cp>This is our AWS stack drawn as a building in section. The foundation is the Landing Zone Accelerator: accounts and guardrails. Then CDK: VPCs, the EKS clusters, shared services. Then the seam, the amber line. Above it, Crossplane, starting with S3 and moving to typed APIs that apps, and agents, can call. Then the apps themselves.\u003c/p>\n\u003cp>Read the arrows on the left. Below the seam, things change rarely. Above it, they change constantly. Two tools fighting over one AWS resource always starts with a line nobody drew. And like concrete, once it's poured, moving it is expensive.\u003c/p>\n\u003cp>The title block says what it costs: decision three, and what it needs is a diagram with the seam marked. A meeting, not a purchase. American Family Insurance with Upbound showed Crossplane once adoption is real, and Meta showed the move from Terraform on a cron job to GitOps.\u003c/p>\n\u003cp>And under the foundation is the one thing we can't get back.\u003c/p>","plan":{"Act":"I","Job":"the AWS rule (GOALS §10): draw the CDK-to-Crossplane handoff before building on it","Headline":"Mark the seam before we pour.","Visual":"cyanotype section. LZA and CDK below, Crossplane and the apps above, the seam as an amber datum line run across the whole sheet. Dimension arrows on the left read \"changes rarely\" and \"changes constantly\". A title block, bottom right, carries status (DECIDE, decision 3) and what the decision needs: a diagram with the seam marked","Energy":"3","Into next":"and under the foundation, the one thing we can't get back.","Source":"GOALS §10.1–§10.3; decisions table row 3; the seam is our proposal"}},"not-a-cage":{"title":"Not a cage","notes":"\u003cp>Rule seven: a container is not a cage.\u003c/p>\n\u003cp>Agents run code they wrote a minute ago, and every container on a node shares one kernel. So the rule is that each agent gets a microVM-grade boundary, and its own identity, before it ever gets a credential.\u003c/p>\n\u003cp>It's drawn like a lab's containment levels. Level one, a plain container: fine for our own services, not for agent-written code. Level two, gVisor, a user-space kernel in between. Level three, Kata microVMs: the agent gets its own kernel, and pod snapshots make the start-up cost bearable; that's the one we'd lead with. Level four, an agent substrate that bundles identity, sandbox, session and egress into one layer; that one's still a decision, or at least a vocabulary to pick.\u003c/p>\n\u003cp>Red Hat, Microsoft, Google, Solo.io with Anthropic, NTT and vCluster all presented on it.\u003c/p>\n\u003cp>So how far up the mountain do we let agents go, and when?\u003c/p>","plan":{}},"reading-room":{"title":"Reading room only","notes":"\u003cp>Rule nine, and the first thing camp one needs: something to read. Reading room only.\u003c/p>\n\u003cp>A reference library is the best-known place where you may read everything and take nothing. That's the access rule for agents. They study a read-only copy of production: cluster state dumped to a database on a schedule, metrics queried from Prometheus, and where freshness matters, a small set of narrow, audited live tools. They get a desk in the reading room, never the keys to the stacks.\u003c/p>\n\u003cp>NVIDIA and Upbound showed a queryable audit layer like this, and Mastercard argued for a narrow tool surface over a stale index.\u003c/p>\n\u003cp>Read-only extraction is how we say yes to agent analysis without saying yes to agent credentials in production. It feeds camp one directly.\u003c/p>\n\u003cp>And every page they read goes on the receipt.\u003c/p>","plan":{}},"reading-room-ten":{"title":"Reading room only","notes":"\u003cp>Rule nine, and the first thing camp one needs: something to read. Reading room only.\u003c/p>\n\u003cp>A reference library is the best-known place where you may read everything and take nothing out. That's the access rule for agents. They study a read-only copy of production: cluster state dumped to a database on a schedule, metrics queried from Prometheus, and where freshness matters, a small set of narrow, audited live tools. They get a desk in the reading room, never the keys to the stacks.\u003c/p>\n\u003cp>NVIDIA and Upbound showed a queryable audit layer like this. Mastercard argued the other side well, against a stale index, for a narrow tool surface, and they run an LLM across thirty EKS clusters that way.\u003c/p>\n\u003cp>Read-only extraction is how we say yes to agent analysis without saying yes to agent credentials in production. And it feeds camp one directly.\u003c/p>\n\u003cp>And every page they read goes on the receipt.\u003c/p>","plan":{"Act":"III","Job":"the data-access rule (GOALS §7): agents read a copy of production, never hold its credentials","Headline":"Reading room only.","Visual":"a library catalogue card on green baize, larger than in `main`, with a red READ ONLY stamp. Holdings: cluster state in a database, Prometheus, narrow audited tool calls. See also: NVIDIA + Upbound, Mastercard","Energy":"2","Into next":"and every page they read goes on the receipt.","Source":"NVIDIA + Upbound; Mastercard"}},"restore-or-rumor":{"title":"Restore, or it's a rumor","notes":"\u003cp>Rule three: backups are a rumor until you restore.\u003c/p>\n\u003cp>This is the one item on our whole list where being wrong is unrecoverable, so it gets a safety sign. Three steps, posted like an emergency procedure. Retain: audit every storage class, because Delete is the default reclaim policy and it's the wrong one for data we care about. Back up: Velero on a schedule, and nothing bespoke, because there's now a working group standardising the primitives. Drill: restore into a scratch cluster on a calendar, and time it.\u003c/p>\n\u003cp>The drill is the point. A cluster we can rebuild is a cluster we're willing to upgrade aggressively, which takes us back to rule one.\u003c/p>\n\u003cp>That's the ground. Now the path every change takes across it.\u003c/p>","plan":{}},"restore-or-rumor-ten":{"title":"Restore, or it's a rumor","notes":"\u003cp>Rule three: backups are a rumor until you restore.\u003c/p>\n\u003cp>This is the one item on our whole list where being wrong is unrecoverable, so it gets a safety sign.\u003c/p>\n\u003cp>Here's why it's a rumor. Nutanix gave the scariest talk of the week: one commit cascaded into deleting thirty-nine production clusters. When they reached for the backups, the latest Velero snapshot was twelve hours old, partial, and the recovery pipeline had never been tested end to end. Their own line was that a backup strategy is a hypothesis until you've restored from it.\u003c/p>\n\u003cp>So three steps, posted like an emergency procedure. Retain: audit every storage class, because Delete is the default reclaim policy and it's the wrong one for data we care about. Back up: Velero on a schedule, and nothing bespoke, because Broadcom's new data protection working group is still standardising the primitives. Drill: restore into a scratch cluster on a calendar, and time it.\u003c/p>\n\u003cp>The drill is the point. A cluster we can rebuild is a cluster we're willing to upgrade aggressively, which takes us back to rule one.\u003c/p>\n\u003cp>That's the ground. Now the path every change takes across it.\u003c/p>","plan":{"Act":"I","Job":"the data-protection rule (GOALS §8): the restore drill is the point","Headline":"Backups are a rumor until you restore.","Visual":"ISO 7010 safe-condition placard. Database-and-restore pictogram, then three panels in sequence (retain, back up, drill), the DRILL panel inverted with a stopwatch. One evidence line: Nutanix's latest Velero snapshot, when they needed it, was 12 hours old, partial and untested","Energy":"2","Into next":"that's the ground. Now the path every change takes across it.","Source":"GOALS §8; Nutanix, \"GitOps Meltdown\" (`deck-assets/01-gitops-meltdown/p19`); Velero project update (Red Hat); Data Protection WG (Broadcom)"}},"rule-not-driver":{"title":"The rule doesn't ask","notes":"\u003cp>Rule five: the rule doesn't ask who's driving.\u003c/p>\n\u003cp>This is set as a statute on purpose. The clause never names a person or an agent: \"No workload shall run privileged, mount the host, or reach an unapproved model or tool, whoever authored the change.\" That's the whole idea. Write policy against the action, not the actor, and the rule that stops an engineer shipping a privileged pod also bounds an agent.\u003c/p>\n\u003cp>The sub-clauses are the mechanics. Enforced at admission in CEL, with no webhook in the request path. Run first in CI, so a violation is a failing test an agent can fix. And clause (c) is our own proposal: no sync during a change window without an approved change record.\u003c/p>\n\u003cp>In the margin, the cases we heard: AT&T, Google, JPMorganChase, Grainger, and Nirmata with Nutanix on policy at the AI gateway.\u003c/p>\n\u003cp>Which matters most for the drivers that aren't people.\u003c/p>","plan":{}},"signal":{"title":"A signal to leave","notes":"\u003cp>Rule four: nothing leaves the station without a signal.\u003c/p>\n\u003cp>Promotion is literally a train leaving one station for the next: dev, stage, prod. And a departure board is a public, timestamped record of what left and when, which is exactly what we want from GitOps.\u003c/p>\n\u003cp>Read the board. LinkedIn: canary namespaces with an Argo CD gate, a week per release down to an hour. Meta: Terraform on a cron job replaced by Argo CD and Kargo, a day down to minutes. Transfix: agents earn the right to merge, from shadow mode to a granted permission. Ford: CI as the safety net under AI-written GitOps, across hundreds of clusters.\u003c/p>\n\u003cp>And our row, in amber: Kargo or GitOps Promoter, held for a two-week spike.\u003c/p>\n\u003cp>The signal is the pipeline, not a person reading every diff. And the signal is decided by a rule that doesn't care who wrote the change.\u003c/p>","plan":{}},"signal-any-driver":{"title":"A signal, whoever's driving","notes":"\u003cp>Rules four and five share a slide, because they're one idea: nothing leaves the station without a signal, whoever's driving.\u003c/p>\n\u003cp>Promotion really is a train leaving one station for the next: dev, stage, prod. And a departure board is a public, timestamped record of what left and when, which is what we want GitOps to be.\u003c/p>\n\u003cp>Read the board. LinkedIn: canary namespaces with an Argo CD PostSync gate took a release from a week to an hour. Transfix: agents earn the right to merge, from shadow mode to a granted permission. Ford: CI as the safety net under GitOps that AI wrote, across hundreds of clusters. And our row, in amber: Kargo or GitOps Promoter. That's decision one, and it's held for a two-week spike on one app, not more blog posts.\u003c/p>\n\u003cp>Now the bottom of the board, the standing notice. It's the policy rule, and it never names a person or an agent. No privileged pods, no host mounts, no unapproved model or tool, whoever wrote the change. It runs in CI first, so a violation is a failing test an agent can fix, and then at admission in CEL, with no webhook in the path. AT&T, Google, JPMorganChase, Grainger and Nirmata all showed versions of it. Write the rule against the action, not the actor, and agent governance mostly comes free.\u003c/p>\n\u003cp>The signal is the pipeline, not a person reading every diff.\u003c/p>\n\u003cp>But the drivers that aren't people need more than a rule. They need a boundary.\u003c/p>","plan":{"Act":"II","Job":"the delivery and policy rules together (GOALS §1, §2): one gate, and it checks the change, not the author. Merged from `signal` and `rule-not-driver`","Headline":"Nothing leaves the station without a signal, whoever's driving.","Visual":"a full-bleed split-flap departure board. Rows: LinkedIn (canary namespaces, PostSync gate: 1 week → 1 hour), Transfix (agents earn the right to merge: shadow → grant), Ford (CI as the net under AI-written GitOps), and our row in amber (Kargo or GitOps Promoter: held for a 2-week spike). Along the foot, the statute's clause as the station's standing notice to all drivers, human or agent","Energy":"4","Into next":"the drivers that aren't people need more than a rule. They need a boundary.","Source":"LinkedIn, Transfix, Ford sessions; GOALS §2.1–§2.2; decision 1. Cut from `main`: the Meta row (Meta is on slide 2) and the five annotated cases (AT&T, Google, JPMorganChase, Grainger, Nirmata + Nutanix), now in the notes"}},"three-on-monday":{"title":"Three on Monday","notes":"\u003cp>Ten rules. Here's the range again, and now every peak has its name.\u003c/p>\n\u003cp>Upgrade like an app. Mark the seam. Restore, or it's a rumor. A signal to leave. The rule doesn't ask who's driving. Boarding passes. Not a cage. Base camp first. Reading room. Itemize it.\u003c/p>\n\u003cp>None of them is a product. And three of them cost a meeting, not a purchase, so we can start them on Monday. Mark the seam: one diagram with the line drawn between CDK and Crossplane. Retain, back up, drill: audit our reclaim policies and time one restore. Itemize it: turn telemetry on and write down what we actually use AI for.\u003c/p>\n\u003cp>Each of those needs one owner. That's the ask.\u003c/p>","plan":{}},"three-on-monday-ten":{"title":"Three on Monday","notes":"\u003cp>Ten rules. Here's the range again, and now every peak has its name.\u003c/p>\n\u003cp>Upgrade like an app. Mark the seam. Restore, or it's a rumor. A signal to leave, whoever's driving. Not a cage, and a pass, not a key. Base camp first. Reading room only. Itemize it.\u003c/p>\n\u003cp>None of them is a product. Most need work, and some need decisions. But three of them cost a meeting, not a purchase, so we can start them on Monday. They're the three catching the light.\u003c/p>\n\u003cp>Mark the seam: one diagram, with the line drawn between CDK and Crossplane. Retain, back up, drill: audit our reclaim policies and time one restore. Itemize it: turn telemetry on and write down what we actually use AI for.\u003c/p>\n\u003cp>Pause. Each of those needs one owner. That's the ask.\u003c/p>","plan":{"Act":"III","Job":"close: echo the promise, name all ten, make the ask","Headline":"Ten rules; three of them cost a meeting, not a purchase.","Visual":"the cold open's range at dawn: a low alpenglow haze behind it, every peak numbered and named, three capped in alpenglow (2 mark the seam, 3 restore, 10 itemize). Above, the three asks, numbered to match, each with an owner line","Energy":"4","Into next":"end"}},"upgrade-like-an-app":{"title":"Upgrade like an app","notes":"\u003cp>Rule one, and it's about the thing that's going to get big whatever we do: upgrade the fleet like you ship an app.\u003c/p>\n\u003cp>Every fleet talk at the show was really an upgrade story. LinkedIn took production across three Kubernetes minor versions in seven business days, in one skip-level rollout; it used to take forty. NVIDIA converged about fifty-six hundred nodes in thirty minutes for two kernel CVEs, because the change shipped with its own check. Meta runs about a hundred clusters with fifteen engineers. Salesforce runs a thousand.\u003c/p>\n\u003cp>The common thread: ship each change with the check that fails without it, roll it out in waves, and nobody upgrades a cluster by hand.\u003c/p>\n\u003cp>A fleet that big is built from code. So where does one tool's code stop and the next one's start?\u003c/p>","plan":{}},"upgrade-like-an-app-ten":{"title":"Upgrade like an app","notes":"\u003cp>Rule one, and it's about the thing that gets big whatever we do: upgrade the fleet like you ship an app.\u003c/p>\n\u003cp>Every fleet talk at the show was really an upgrade story. Here's the cleanest one. LinkedIn took production from Kubernetes 1.31 to 1.34. One minor version at a time, that's six fleet waves and forty business days: every bar on this strip. With skip-level upgrades, one rollout and a promotion, it took seven. The red ones.\u003c/p>\n\u003cp>The others along the bottom are the same pattern. NVIDIA converged about fifty-six hundred nodes in thirty minutes for two kernel CVEs, because the change shipped with its own check. Meta runs about a hundred clusters with about fifteen engineers. Salesforce runs a thousand.\u003c/p>\n\u003cp>The common thread: ship each change with the check that fails without it, roll it out in waves, and nobody upgrades a cluster by hand.\u003c/p>\n\u003cp>A fleet that big is built from code. So where does one tool's code stop and the next one's start?\u003c/p>","plan":{"Act":"I","Job":"the fleet rule (GOALS §5): upgrades are a rollout with a check, not a project","Headline":"Upgrade the fleet like you ship an app.","Visual":"Swiss poster. A strip of forty business-day bars, the first seven in signal red: LinkedIn's v1.31 → v1.34, one minor at a time (40) against one skip-level rollout (7). Three smaller figures below: NVIDIA 30 minutes for ~5,600 nodes, Meta ~15 engineers for ~100 clusters, Salesforce 1,000 clusters","Energy":"4","Into next":"a fleet that big is built from code, so where does one tool's code stop?","Source":"LinkedIn deck p.2 (`deck-assets/13-skip-level-upgrades/p02`), NVIDIA deck, Meta and Salesforce abstracts"}}},"narrativeOrder":["cold-open-ten","upgrade-like-an-app-ten","mark-the-seam-ten","restore-or-rumor-ten","signal-any-driver","cage-and-pass","base-camp-first-ten","reading-room-ten","itemize-ten","three-on-monday-ten"],"kit":"1.0.0"};</script>
