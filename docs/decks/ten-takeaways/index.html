<script>window.DECK = {"deck":"ten-takeaways","title":"Ten takeaways, ten looks","draft":"main","drafts":{"main":["cold-open","upgrade-like-an-app","mark-the-seam","restore-or-rumor","signal","rule-not-driver","boarding-pass","not-a-cage","base-camp-first","reading-room","itemize","three-on-monday"]},"size":[1920,1080],"slides":{"base-camp-first":{"title":"Base camp first","notes":"\u003cp>This is the one rule the rest of the agent half hangs on: base camp first.\u003c/p>\n\u003cp>It's our AI rollout drawn as an expedition profile, the side-on mountain you get in a climbing guide. We're at camp zero: engineers use Claude Code and a human applies every change.\u003c/p>\n\u003cp>Click. Two camps get dates. Camp one, alert triage, by Q2 2027. It explains and never acts, so it needs no write path. Verkada does this for thirty-three cents an alert. Camp two, agents opening pull requests, by the end of 2027. Review still decides. Podium says thirty percent of their merged PRs come from agents.\u003c/p>\n\u003cp>Click. Above that the route is pale and dashed, and it has no dates on purpose. Owning alerting, agents that fix things inside a blast radius, teams writing their own agents. You only date the camps you can see, and we can't see those yet: they need delivery and policy, sections one and two, finished first.\u003c/p>\n\u003cp>Camp one needs two things before we go: something to read, and a way to count.\u003c/p>","plan":{"Act":"III","Job":"the peak: the AI rollout ladder (GOALS §6)","Headline":"Base camp first.","Visual":"an expedition elevation profile. Camps 0–2 on a surveyed, dated slope (today; Q2 2027; end 2027); camps 3–5 pale, dashed and undated","Energy":"5","Into next":"camp 1 needs two things: something to read and a way to count.","Source":"GOALS §6; Verkada, Podium, Salesforce, Mastercard, IBM, Google"}},"boarding-pass":{"title":"Boarding passes, not house keys.","notes":"\u003cp>Say it out loud: what you will actually say over this slide, written for the ear.\u003c/p>","plan":{"Act":"III","Job":"the identity and secrets takeaway (GOALS §9, §3.6)","Headline":"Boarding passes, not house keys.","Visual":"an airline boarding pass for a triage agent: SPIFFE ID, valid for 15 minutes, read-only seat, checked by Cedar or OpenFGA, no static secret on file. The stub lists the other passengers (Coinbase, Google and Microsoft, RBC, Veritas Automata, Infisical)","Energy":"3","Into next":"an identity says who the agent is. It doesn't say where it can run.","Source":"the pass is illustrative; sessions on the stub"}},"cold-open":{"title":"Ten rules","notes":"\u003cp>Ten things we brought home from Salt Lake City, about a minute each. Here's the promise: every one of them is a rule we can adopt, not a tool we have to buy.\u003c/p>\n\u003cp>They come in the order you'd build them. The first three are the ground the fleet stands on. The next two are the path every change takes across it. The last five are what agents need before we let them in. The colours are the same three paths we use everywhere else.\u003c/p>\n\u003cp>The first rule is about the thing that's going to get big whatever we do.\u003c/p>","plan":{"Act":"I","Job":"set the promise: ten rules, no shopping list","Headline":"We came home with ten rules, and none of them is a product.","Visual":"the Three Peaks ridge, with ten small summit flags along it, unlabelled","Energy":"3","Into next":"the first rule is about the thing that's going to get big whatever we do."}},"itemize":{"title":"Itemize it","notes":"\u003cp>Last rule: itemize it, or it didn't happen.\u003c/p>\n\u003cp>On the receipt, what we saw other teams itemise. Verkada knows its alert triage costs thirty-three cents an alert, which is about fifteen hundred dollars a month; that total is our arithmetic on their title. Nubank traces sixteen billion spans an hour. Yahoo tamed Istio's metric cardinality at ten thousand pods. Adobe attributes network cost back to teams with eBPF.\u003c/p>\n\u003cp>Then our tab. Can we list what we use AI for? Not yet. Spend by team? Not yet. Every MCP call as a span? Not yet. Total known: nothing.\u003c/p>\n\u003cp>The fix is boring and it's first: turn on telemetry, put every call on the OpenTelemetry pipeline we already run, with a team and a use case on it. The inventory falls out of the instrumentation.\u003c/p>\n\u003cp>Ten rules. Three of them we can start on Monday.\u003c/p>","plan":{"Act":"III","Job":"the observability takeaway (GOALS §4)","Headline":"Itemize it, or it didn't happen.","Visual":"a thermal till receipt. What we saw itemised (Verkada, Nubank, Yahoo, Adobe), then our tab, three lines reading NOT YET, and TOTAL KNOWN $ —","Energy":"3","Into next":"ten rules. Three of them we can start on Monday.","Source":"Verkada title (the $1,551 is our arithmetic), Nubank, Yahoo, Adobe"}},"mark-the-seam":{"title":"Mark the seam before we pour.","notes":"\u003cp>Say it out loud: what you will actually say over this slide, written for the ear.\u003c/p>","plan":{"Act":"I","Job":"the AWS takeaway (GOALS §10)","Headline":"Mark the seam before we pour.","Visual":"cyanotype blueprint. A building in section: LZA and CDK below, the seam as a dashed amber line, Crossplane and the apps above, and a title block holding status and references","Energy":"3","Into next":"and under the foundation, the one thing we can't get back.","Source":"GOALS §10.1–§10.3; the seam is our proposal (decision 3)"}},"not-a-cage":{"title":"A container is not a cage.","notes":"\u003cp>Say it out loud: what you will actually say over this slide, written for the ear.\u003c/p>","plan":{"Act":"III","Job":"the sandboxing takeaway (GOALS §3)","Headline":"A container is not a cage.","Visual":"biocontainment notice. Safety yellow, hazard stripes, and a four-level containment ladder (container, gVisor, Kata microVM, agent substrate) with a verdict per level","Energy":"4","Into next":"so how far up do we let agents go, and when?","Source":"Red Hat, Microsoft, Google, Solo.io, NTT, vCluster sessions"}},"reading-room":{"title":"Reading room only.","notes":"\u003cp>Say it out loud: what you will actually say over this slide, written for the ear.\u003c/p>","plan":{"Act":"III","Job":"the data-access takeaway (GOALS §7)","Headline":"Reading room only.","Visual":"a library catalogue card on a green baize desk, with a red READ ONLY stamp. Holdings: cluster state in a database, Prometheus, narrow audited tools","Energy":"2","Into next":"and every page they read goes on the receipt.","Source":"NVIDIA + Upbound; Mastercard"}},"restore-or-rumor":{"title":"Backups are a rumor until you restore.","notes":"\u003cp>Say it out loud: what you will actually say over this slide, written for the ear.\u003c/p>","plan":{"Act":"I","Job":"the data-protection takeaway (GOALS §8)","Headline":"Backups are a rumor until you restore.","Visual":"an ISO 7010 safe-condition placard. Safety green, a database-with-restore pictogram, three numbered panels: retain, back up, drill","Energy":"2","Into next":"that's the ground. Now the path change takes across it.","Source":"Velero project update (Red Hat); Data Protection WG (Broadcom)"}},"rule-not-driver":{"title":"The rule doesn't ask who's driving.","notes":"\u003cp>Say it out loud: what you will actually say over this slide, written for the ear.\u003c/p>","plan":{"Act":"II","Job":"the policy takeaway (GOALS §2)","Headline":"The rule doesn't ask who's driving.","Visual":"a page from an annotated statute book. One operative clause (\"No workload shall run privileged… whoever authored the change\"), lettered sub-clauses, and an annotations column of cases heard","Energy":"3","Into next":"which matters most for the drivers that aren't people.","Source":"AT&T + Nirmata, Google, JPMorganChase + Nirmata, W.W. Grainger, Nirmata + Nutanix"}},"signal":{"title":"Nothing leaves the station without a signal.","notes":"\u003cp>Say it out loud: what you will actually say over this slide, written for the ear.\u003c/p>","plan":{"Act":"II","Job":"the delivery takeaway (GOALS §1)","Headline":"Nothing leaves the station without a signal.","Visual":"split-flap departure board. Rows are operators, what they ran and the result; our row comes last, in amber: Kargo or GitOps Promoter, held for a two-week spike","Energy":"4","Into next":"and the signal is decided by a rule that doesn't care who wrote the change.","Source":"LinkedIn, Meta, Transfix, Ford sessions; GOALS decision 1"}},"three-on-monday":{"title":"Ten rules; three of them cost a meeting, not a purchase.","notes":"\u003cp>Say it out loud: what you will actually say over this slide, written for the ear.\u003c/p>","plan":{"Act":"III","Job":"close: echo the promise and make the ask","Headline":"Ten rules; three of them cost a meeting, not a purchase.","Visual":"back on the ridge. The ten flags now carry their rules; three are lit (mark the seam, restore, itemize), each with an owner line","Energy":"4","Into next":"end"}},"upgrade-like-an-app":{"title":"Upgrade the fleet like you ship an app.","notes":"\u003cp>Say it out loud: what you will actually say over this slide, written for the ear.\u003c/p>","plan":{"Act":"I","Job":"the fleet takeaway (GOALS §5)","Headline":"Upgrade the fleet like you ship an app.","Visual":"Swiss poster: off-white, one heavy grotesk, one signal red, four numbers that carry the slide: 7 business days (was 40), 30 minutes for about 5,600 nodes, 15 engineers, 1,000 clusters","Energy":"4","Into next":"a fleet that big is built from code, so where does one tool's code stop?","Source":"LinkedIn deck p.2, NVIDIA deck, Meta and Salesforce abstracts"}}},"narrativeOrder":["cold-open","upgrade-like-an-app","mark-the-seam","restore-or-rumor","signal","rule-not-driver","boarding-pass","not-a-cage","base-camp-first","reading-room","itemize","three-on-monday"],"kit":"1.0.0"};</script>
