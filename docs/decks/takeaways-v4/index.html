<script>window.DECK = {"deck":"takeaways-v4","title":"Takeaways v4: the fleet outgrows one team, then the agents arrive (with the receipts)","draft":"main","drafts":{"main":["cold-open","journey","show-fleet","estate-grows","one-runbook","overrun","capi-diff","skip-level","region-claim","show-delivery","twenty-tools","waves","gates","change-windows","placement","failover","show-agents","three-ways","agent-pod","sandbox","mcp-gateway","credentials","policy-layer","one-view","the-lake","triage","new-holes","ship-the-check","patch-loop","the-ask"]},"size":[1920,1080],"slides":{"agent-pod":{"title":"An agent is a Job","notes":"\u003cp>Workloads first. Here's one agent as Kubernetes sees it: a Job. Jenkins, an alert or a schedule creates it, it does one task, and it's gone.\u003c/p>\n\u003cp>Five fields matter. runtimeClassName gvisor: the code it runs talks to gVisor's kernel, not the node's. More on that next.\u003c/p>\n\u003cp>serviceAccountName: in AWS, wired to Pod Identity, so it gets a short-lived role. No keys in the image.\u003c/p>\n\u003cp>automountServiceAccountToken false: no Kubernetes API token just because it's a pod.\u003c/p>\n\u003cp>activeDeadlineSeconds: killed at fifteen minutes, whatever it's doing; ttlSecondsAfterFinished cleans it up, and its logs are already in the lake.\u003c/p>\n\u003cp>nodeSelector and tolerations: agents run on their own tainted pool, which Karpenter grows for a burst and empties after. Nobody approves each agent; the spec is the approval.\u003c/p>\n\u003cp>Podium runs this shape: every coding agent an isolated pod.\u003c/p>\n\u003cp>One catch we found writing this: Auto Mode can't run gVisor or Kata, so the agents pool is self-managed Karpenter on our own AMI. Verify before we build it.\u003c/p>\n\u003cp>runtimeClassName is the line that matters, because a container is not a cage.\u003c/p>","plan":{"Act":"V · tag: agents as workloads","Job":"an agent as a workload is an ordinary Job with five fields that matter","Headline":"An agent is a Job: sandboxed, on its own nodes, with a deadline, and gone when it's done.","Visual":"the Job spec, annotated: `runtimeClassName: gvisor`, `serviceAccountName`","Energy":"3","Into next":"`runtimeClassName` is the line that matters, because a container is not a cage.","Source":"`CLAUDE-AGENT-PLATFORM.md` (Jenkins-triggered agent pods); Podium (abstract);"}},"capi-diff":{"title":"The upgrade is one field","notes":"\u003cp>So here's the admins' fix, on-prem. kubeadm stays. The hands go.\u003c/p>\n\u003cp>On the left is the whole upgrade, as a pull request. It's a Cluster API Cluster object for ny4, built from a ClusterClass we'd call onprem-kubeadm. Three control-plane machines, six workers. The upgrade is one line: version, v1.36 to v1.37. That's the diff someone reviews. The versions are illustrative.\u003c/p>\n\u003cp>On the right, top: what that used to be. Fifty-four hand steps for this one cluster.\u003c/p>\n\u003cp>Click. Bottom: what Cluster API does with the one line. The control plane first, one machine at a time: a new machine at the new version joins, the old one is drained and deleted. Then the workers, the same way, one extra machine at a time. It's still kubeadm underneath. Nobody types it.\u003c/p>\n\u003cp>The catch, and it's the first thing an admin will ask: replacing a machine on bare metal means re-provisioning a physical server. That's what Metal3 does. If ny4 runs on VMs, it's the vSphere or Nutanix provider instead. Picking that provider is the first decision, before any of this works.\u003c/p>\n\u003cp>One field per cluster. LinkedIn went a step further, and changed the upgrade itself.\u003c/p>","plan":{"Act":"II · tag: cluster admins","Job":"on-prem, the upgrade becomes one field in an object; Cluster API does the 54 steps","Headline":"On-prem, an upgrade becomes one field, and Cluster API does the 54 steps.","Visual":"left, the diff in `clusters/ny4.yaml`: a CAPI `Cluster` with","Energy":"3","Into next":"one field per cluster. LinkedIn went further and made it one rollout per","Source":"Cluster API book (ClusterClass, topology); *Nutanix CAREN*; GOALS §5.2"}},"change-windows":{"title":"Freeze windows","notes":"\u003cp>The pipeline also needs to know when not to run.\u003c/p>\n\u003cp>The strip is one week. Syncs are allowed Monday to Thursday, nine to five; everything else is frozen. Wave one Tuesday, wave two Wednesday. The prod wave starts Thursday, hits five o'clock and stops, then picks up Monday morning. Nobody had to remember, and nobody met about it. That's the platform team's time syncs, gone.\u003c/p>\n\u003cp>On the left, how: Argo CD's own sync windows on the AppProject. Kind allow, a cron schedule, eight hours, New York time. Built in. It stops the pipeline.\u003c/p>\n\u003cp>Click. But kubectl, operators and soon agents change clusters too. So the approved window from the change record is projected into the cluster as a small object of ours, and a Kyverno rule denies production writes when none is open. Admission never waits on the ticket system.\u003c/p>\n\u003cp>NVIDIA schedules fleet maintenance around business windows; Agility Robotics gates updates on robots mid-task.\u003c/p>\n\u003cp>That's the platform team. Now developers: where their app runs.\u003c/p>","plan":{"Act":"III · tag: platform team","Job":"the freeze is config the cluster keeps; the platform team's time syncs go away","Headline":"A freeze is config: Argo CD holds the waves, and Kyverno holds everyone else.","Visual":"v3's eight-day strip across the top, on the dark ground now (snowfield is","Energy":"2","Into next":"that's the platform team. Now the developers: where their app runs.","Source":"GOALS §2.3; Argo CD sync windows; *Look Before You Leap* (Agility Robotics, 📎)"}},"cold-open":{"title":"Meta's ratio and ours","notes":"\u003cp>One number from the keynote stage to start. Meta runs about a hundred Kubernetes clusters, for AI research and inference, with about fifteen engineers. That's from their own keynote abstract.\u003c/p>\n\u003cp>We run twenty-nine. On our own hardware at two exchanges, in two AWS regions, and in a second cloud. And the clusters and the apps on them are upgraded by one team of three, mostly by hand.\u003c/p>\n\u003cp>Click. Do the division. Meta is about seven clusters per engineer. We're about ten. We already run more clusters per head than Meta does.\u003c/p>\n\u003cp>Click. So the difference isn’t headcount. It's what does the upgrades. At Meta it's code: GitOps, the title of the talk. Here, it's the three of us.\u003c/p>\n\u003cp>That's the talk. For the next half hour, every claim comes with a receipt: someone at the show who already does it, and the config it takes. Here's what we brought back.\u003c/p>","plan":{"Act":"Open","Job":"earn attention with the contrast an engineer can't ignore: a peer runs more","Headline":"Meta runs ~100 clusters with ~15 engineers. We run 29 with three, by hand.","Visual":"two fields at the same scale, one square per cluster and one figure per","Energy":"4","Into next":"none of them got there by hiring. Here's what we brought back.","Source":"GOALS §0.1 (Meta keynote abstract, *We Have GitOps at Home*). Team of three"}},"credentials":{"title":"No passwords in the agent","notes":"\u003cp>The scoped token is the whole credentials story. The agent never holds a password.\u003c/p>\n\u003cp>Left to right. The agent carries a pass: a workload identity issued to that pod, read-only, short-lived and rotated. No key file, no token in an environment variable.\u003c/p>\n\u003cp>At the gateway the pass becomes a token for one call. The real secret sits in the store behind the gateway and never crosses the dashed line, not into the agent's context, prompt or image. If an agent is tricked into printing everything it knows, there's nothing worth printing.\u003c/p>\n\u003cp>Click. In AWS, this is the whole wiring: one Pod Identity association between the triage-agent service account and a read-only role. That's the serviceAccountName line from the Job.\u003c/p>\n\u003cp>On-prem, the same idea is a SPIFFE ID from SPIRE. Secrets apps do need are synced by External Secrets, never written in YAML. The store itself is still GOALS section nine.\u003c/p>\n\u003cp>Identity says who the agent is. Policy says what anyone may do.\u003c/p>","plan":{"Act":"V · tag: agents as users","Job":"passwords never enter the agent; identity is a short-lived pass","Headline":"Agents get a short-lived identity; the passwords never enter the agent.","Visual":"as v3 (the pass exchanged at the gateway; the secret stays behind it), with","Energy":"3","Into next":"identity says who the agent is. Policy says what anyone may do.","Source":"GOALS §3.6, §9; 📎 *Every Kubernetes Object Deserves an Identity* (Defakto);"}},"estate-grows":{"title":"Four clusters became 29","notes":"\u003cp>Now ours. Four clusters, on our own hardware next to the exchange. Dev and staging, ny4 for production, and ch4 as its disaster-recovery twin, in lockstep. Built with kubeadm, by hand, which was right at the time. One team of three, in orange, owns the upgrades: the clusters and the twenty apps on them.\u003c/p>\n\u003cp>Click. Then EKS, for the environments that don't need to sit by an exchange: dev, qa and ftb. A different animal, so now there are two upgrade procedures.\u003c/p>\n\u003cp>Click. A second exchange. Everything we built for the first, again: its own clusters, its own DR pair. Eleven.\u003c/p>\n\u003cp>Click. The cloud migration. AWS clusters arrive in chunks of six as services move. Seventeen.\u003c/p>\n\u003cp>Click. Resilience. Production gets a second AWS region, mirroring the first. Twenty-three.\u003c/p>\n\u003cp>Click. And two regions of one provider is still one provider. So, fingers crossed for AWS, a second cloud. Twenty-nine clusters, sixty-five apps, four thousand pods. Every step was reasonable on the day. And it's still the same three people.\u003c/p>\n\u003cp>Two procedures, three kinds of place. Here's what one upgrade actually is.\u003c/p>","plan":{"Act":"I","Job":"our own estate grows from four clusters to 29, in five reasonable steps, on one","Headline":"Four clusters became 29 in five reasonable steps, and one team still upgrades them all.","Visual":"the estate map at stage 1 (dev, staging, ny4, ch4; ny4–ch4 tied as DR). Five","Energy":"3","Into next":"two ways to upgrade, three kinds of place. Here's one upgrade."}},"failover":{"title":"Failover by layer","notes":"\u003cp>Remember \"fingers crossed for AWS\". This is what replaces it, and it's where the engineering is.\u003c/p>\n\u003cp>Four layers, two AWS regions, the second cloud on the right. Start with delivery: because placement is labels, the app already runs in both regions, three replicas each. Nothing gets deployed during an outage.\u003c/p>\n\u003cp>Click. Region one fails. Detection starts the clock: health checks have to fail enough times to be believed.\u003c/p>\n\u003cp>Click. Traffic moves: Global Accelerator at the edge, Route 53 behind it, Istio locality failover east-west. All of it lands on region two. Nobody redeployed anything.\u003c/p>\n\u003cp>Click. Capacity. Region two was sized for half the traffic and just got all of it. The autoscaler doubles the pods and Auto Mode adds nodes: launch, image pull, warm-up. Minutes, and part of our recovery time whether we budget for it or not.\u003c/p>\n\u003cp>Click. State. Region two's database replica is promoted to writer. The slowest layer, and not a Kubernetes problem at all.\u003c/p>\n\u003cp>So recovery time is a sum, and the data sets it. No seconds on the slide on purpose: we measure each one at a game day.\u003c/p>\n\u003cp>And if all of AWS goes? The second cloud holds a warm standby. Karmada's cluster affinities are for the few apps that can't run in two places at once; Bloomberg runs streaming that way. And the data row says it plainly: how data crosses clouds is undecided.\u003c/p>\n\u003cp>That's the first half. Now the show's biggest topic.\u003c/p>","plan":{"Act":"IV · tag: developers","Job":"the peak: lose a region and nothing moves but traffic; the RTO is a sum and the","Headline":"Lose a region and the app doesn't move: traffic, capacity and data do.","Visual":"see Visual direction (failover by layer). Four layers across both regions:","Energy":"5","Into next":"that's the first half: clusters from objects, tools in waves, apps by"}},"gates":{"title":"A gate is a Job","notes":"\u003cp>A ring only moves outward when its step is healthy. Healthy means a gate, and a gate is a Job.\u003c/p>\n\u003cp>On the left, the whole thing: a Kubernetes Job with one annotation that matters, the Argo CD PostSync hook. After Argo syncs the new Prometheus, it runs this check: are ninety-nine percent of targets up, and has that held for fifteen minutes. Every tool brings its own check.\u003c/p>\n\u003cp>Exit zero: the app goes healthy and the next wave starts.\u003c/p>\n\u003cp>Click. Exit one: the sync fails, and the next wave never starts. Prod never sees it.\u003c/p>\n\u003cp>On the right, LinkedIn's slide from their canary pipeline for critical cluster services. Same shape: Argo syncs the canary, a PostSync hook decides.\u003c/p>\n\u003cp>Click. Their result: a release went from about a week to about an hour, validated automatically, with more than ten incidents caught before production.\u003c/p>\n\u003cp>One correction to our earlier drafts: Argo CD doesn't roll back by itself. A failed gate stops the wave; the revert is a commit, which a bot can open.\u003c/p>\n\u003cp>And the pipeline also needs to know when not to run at all.\u003c/p>","plan":{"Act":"III · tag: platform team","Job":"a gate is a Job; a failed gate stops the wave before prod; LinkedIn's result","Headline":"A gate is a Job: exit 0 and the wave moves on, exit 1 and it stops before prod.","Visual":"left, the PostSync hook: a `batch/v1` Job annotated","Energy":"4","Into next":"and the pipeline knows when not to run at all.","Source":"*Ship Faster, Ship Safer* (LinkedIn), 📎 p22, p25; GOALS §1.7(b)"}},"journey":{"title":"North star: three takeaways","notes":"\u003cp>That's the north star. Three takeaways from four days and five hundred talks, and each one comes with a receipt.\u003c/p>\n\u003cp>Click. One: there's always another cluster. Another environment, another exchange, another region. So clusters are objects, built and upgraded from code. The receipt: LinkedIn moved more than two hundred and fifty clusters three Kubernetes minors forward in one rollout, in seven business days.\u003c/p>\n\u003cp>Click. Two: no manual way keeps up. Every change rides one pipeline, in waves, behind gates. The receipt: LinkedIn again, whose canary pipeline turned a week of testing per release into an hour.\u003c/p>\n\u003cp>Click. Three: AI brings problems as it solves them. Verkada's agent explains a production alert for thirty-three cents. And on the other side, one maintainer's own AI pipeline found two hundred and twenty issues in one open-source project, Metal3, in a year. Attackers run the same models. Both are true at once.\u003c/p>\n\u003cp>The fleet first, and first, how many fleets were on stage.\u003c/p>","plan":{"Act":"Open","Job":"the title, and the three takeaways, each already carrying its proof","Headline":"Three takeaways from four days in Salt Lake City.","Visual":"the kicker \"KubeCon 2027 north star\" over the headline (the deck's title).","Energy":"3","Into next":"the fleet first, and first, how many fleets were on stage."}},"mcp-gateway":{"title":"MCP auth is three questions","notes":"\u003cp>As users, agents work through tools, and these days that mostly means MCP.\u003c/p>\n\u003cp>Stacklok and AWS framed MCP auth as three questions. Who is calling, and how do they prove it? For us, the agent's own workload identity, not a person's borrowed token. Who decides what it may call? A policy at the gateway, groups from the directory. What identity reaches the tool? A token minted for that one call, never the agent's.\u003c/p>\n\u003cp>On the right, question two as a Cedar policy: triage agents may call read-only tools on the Kubernetes server. Cedar can be analysed, so you can prove what a policy set allows before any agent tries it.\u003c/p>\n\u003cp>Click. The choice is the gateway, Obot, ToolHive or our own thin proxy, decided in a short bake-off on where enforcement sits.\u003c/p>\n\u003cp>And the dissent: Mastercard dropped MCP for narrow built-in tools, and drives thirty EKS clusters that way.\u003c/p>\n\u003cp>The scoped token in question three is the whole credentials story.\u003c/p>","plan":{"Act":"V · tag: agents as users","Job":"MCP auth is three questions, and one gateway answers all three; one honest dissent","Headline":"MCP auth is three questions, and the gateway is where we answer all three.","Visual":"the three questions (who is calling and how do they prove it; who decides;","Energy":"3","Into next":"and the scoped token is the whole credentials story.","Source":"GOALS §3.4, §3.5; `GOALS-GAPS.md` §3.5; 📎 *What Can Your AI Agents Actually"}},"new-holes":{"title":"New holes daily","notes":"\u003cp>Now the third way agents arrive: in attackers' hands.\u003c/p>\n\u003cp>This is every CVE published, year by year, as one talk showed it. For a decade, a steady climb: ten thousand, twenty, thirty, forty-five thousand last year. This year, about seventy-nine thousand, and the year isn't over. Over two hundred a day.\u003c/p>\n\u003cp>What changed is AI. Metal3's security lead at Ericsson told it on stage: this year, his own AI pipeline found two hundred and twenty issues in one small project. Seventy-nine were invalid or duplicates. Twenty-two were real security bugs. And he's a defender. Mythos vs Maintainers was the other side: attackers pointing the same models at the same code, and maintainers drowning in reports.\u003c/p>\n\u003cp>Click. His first takeaway, word for word: \"AI finds bugs fast, and not only for us. Shorten your upgrade cycle.\"\u003c/p>\n\u003cp>A note on what that means for us. Most of these holes are in images and libraries, and those patches don't wait for our three Kubernetes upgrades a year; they ship through the waves like any change. So the question isn't the upgrade calendar. It's how fast a fix goes from \"a hole exists\" to \"every cluster is patched\", and who drives it.\u003c/p>\n\u003cp>The answer isn't more people. NVIDIA showed what it is.\u003c/p>","plan":{"Act":"VII · tag: agents as attackers","Job":"the threat, made concrete, without v3's flawed 61 days","Headline":"AI finds holes faster than ever: CVEs nearly doubled in 2026, and one maintainer's AI found 220 in a year.","Visual":"as v3 (CVEs a year, 2016–2026, the 2026 bar in alpenglow at ~79k, \"over 200 a","Energy":"3","Into next":"the answer isn't more people. NVIDIA showed what it is.","Source":"*Mythos vs Maintainers* p6 (⚠️ OpenCVE check); 📎 *AI Found a 0-Day in Metal3* (Ericsson)"}},"one-runbook":{"title":"One kubeadm upgrade","notes":"\u003cp>Here's what one upgrade actually is, on a kubeadm cluster.\u003c/p>\n\u003cp>In the box: the runbook for a single node. Drain it. Upgrade kubeadm. On the first control-plane node that's kubeadm upgrade apply; on every other node, kubeadm upgrade node. Upgrade kubelet and kubectl. Restart kubelet. Uncordon it. Then the next node. The control plane nodes go first, one at a time, then the workers, one at a time.\u003c/p>\n\u003cp>Below: that's one row. Nine nodes, six steps each, fifty-four steps for one cluster, and a person waiting on every one of them. Call it a day.\u003c/p>\n\u003cp>And kubeadm won't skip a minor version. Kubernetes ships three a year, roughly April, August and December, so that row happens three times a year. Per cluster. On-prem we have eight of them by now.\u003c/p>\n\u003cp>And in AWS it's a different procedure again: update the control plane version, then every node group, then the add-ons. Two runbooks.\u003c/p>\n\u003cp>That's the clusters. And they're the small part.\u003c/p>","plan":{"Act":"I","Job":"the cost of one kubeadm upgrade, in its literal commands","Headline":"kubeadm upgrades one node and one minor at a time, three times a year.","Visual":"as v3 (the runbook as commands, then three rows of 54 step blocks), corrected:","Energy":"3","Into next":"and the clusters are the small part: add the tools and the apps."}},"one-view":{"title":"One collector config","notes":"\u003cp>Policy stops what shouldn't happen. Telemetry shows what did, to whoever is debugging, person or agent.\u003c/p>\n\u003cp>The trick is one collector config on every cluster. The k8sattributes processor stamps every signal with its namespace, pod and deployment; the highlighted part copies the team label from the namespace. The resource processor stamps the cluster. Prometheus stays; this sits in front of it.\u003c/p>\n\u003cp>Click. One incident, four signals: the alert, the failing span, the error log, the Kubernetes event. Same cluster, same team, and the span and log share a trace id. A person can pivot between them. An agent can't do it any other way.\u003c/p>\n\u003cp>The receipt is cost. Yahoo cut Istio metrics from two million series to two hundred and eighty thousand with two-stage aggregation: about a hundred and forty thousand dollars a year on one cluster. Two regions double our surface.\u003c/p>\n\u003cp>And their warning: switch to delta temporality and every rate query breaks, silently.\u003c/p>\n\u003cp>Agents read all of it from a lake, not from production.\u003c/p>","plan":{"Act":"VI","Job":"one correlated view for anyone debugging, person or agent, because the collector","Headline":"One collector config stamps every signal with the same cluster, team and trace.","Visual":"left, the collector config: `k8sattributes` (namespace, pod, deployment; the","Energy":"3","Into next":"and agents read it from a lake, not from production.","Source":"GOALS §4.2; 📎 *Two-Stage OTel Aggregation* (Yahoo) p02, p42"}},"overrun":{"title":"Every group drowns in upkeep","notes":"\u003cp>Now add it up, split by who carries it.\u003c/p>\n\u003cp>Cluster admins, on the left: kubeadm and cluster upgrades, plus the multi-cluster upkeep, labels, registrations, failover setup. One admin, half a year of hours, 850. Out at the second cloud.\u003c/p>\n\u003cp>The platform team, in the middle, carries the most: the platform apps, just the core four tools for now; progressive rollouts of every app upgrade; and the time syncs, the windows and approvals that keep everyone in step. Two engineers, 1,700 hours. Out first, at the second region.\u003c/p>\n\u003cp>Developers, on the right: knowing what runs where and why, scheduling, keeping DR patterns alive. Thirteen hundred hours by the second cloud, spread thin across every team, so nobody sees it.\u003c/p>\n\u003cp>All three on one scale, so you can see who carries the most. Click. And the dashed bars are AI, which adds to all three.\u003c/p>\n\u003cp>A model, not a measurement. But each group crosses its line for a different reason, so each gets its own fix, and for each, someone at the show already runs it. Admins first.\u003c/p>","plan":{"Act":"I","Job":"the turn of the first half: the upkeep outgrows every group, each for its own reason","Headline":"Keep doing it this way, and admins, platform and developers all drown in upkeep.","Visual":"as v3 (three panels, stacked bars by stage, each group's line), now on one","Energy":"4","Into next":"each group gets its own fix, and for each one, someone at the show already","Data":"v3 toil model"}},"patch-loop":{"title":"Close the circle","notes":"\u003cp>Put that next to everything we built, and the circle closes.\u003c/p>\n\u003cp>From the top. A new CVE lands, found by their agent or anyone's. The lake finds it: that query from earlier, which clusters run the image. Our agent drafts the fix.\u003c/p>\n\u003cp>Click. The fix is a pull request with a one-line diff: payments moves to a new image digest, rebuilt with the patched OpenSSL.\u003c/p>\n\u003cp>Then CI runs the same rules as anyone's change, and the team approves; the agent can't approve its own PR. Then the waves roll it out, each step gated on status, as NVIDIA showed.\u003c/p>\n\u003cp>Click. Transfix put the principle in six words: models produce evidence, code decides authority. Four roles, and the agent that proposes is never the one that approves or merges. Authority grows from a track record read by rules, not from trust. KubeEdge's maintainers already run the attacker-side version: agents reading disclosures and proposing patches.\u003c/p>\n\u003cp>In the middle: days, from a CVE to every cluster. Same team, same pipeline; the agents make it go round faster.\u003c/p>\n\u003cp>Five first pull requests get us there.\u003c/p>","plan":{"Act":"VII · tag: agents as attackers","Job":"close the circle: our agents patch what theirs find, through the first half's","Headline":"Close the circle: our agents patch what theirs find, and the waves roll it out.","Visual":"v3's ring of five stations, now each with its object: a new CVE (their agent);","Energy":"4","Into next":"five first pull requests get us there.","Source":"📎 *Progressive Delivery for Trust* (Transfix) p09, p17; NVIDIA (above);"}},"placement":{"title":"Labels, not cluster names","notes":"\u003cp>Now developers, and the question each one asks: where does my app run?\u003c/p>\n\u003cp>Before, on the left: the payments repo has a file per cluster, an Argo CD Application for ny4, for ch4, a dozen for AWS, and values for each. The highlighted line: destination name ny4. Developers have to know our cluster names, and every new cluster means a PR in every app repo.\u003c/p>\n\u003cp>After, on the right: one block in the app's repo. Tier prod, regions aws-1 and aws-2, a warm standby in the second cloud, six replicas. No cluster names. That's our small API; the platform turns it into an ApplicationSet cluster generator selecting on labels the clusters already carry.\u003c/p>\n\u003cp>Click. The thirtieth cluster arrives from the Region claim already labelled. Payments lands on it, and nobody opens a PR in the payments repo.\u003c/p>\n\u003cp>NVIDIA and Salesforce made the same point from the other side: choose where the complexity lives, and put it in the platform.\u003c/p>\n\u003cp>And because it's labels, the app already runs in both regions. So what happens when one goes?\u003c/p>","plan":{"Act":"IV · tag: developers","Job":"a developer writes labels, never a cluster name; the platform finds the clusters","Headline":"Developers write labels, not cluster names, and the 30th cluster costs them nothing.","Visual":"a before/after of a real app repo. Before: an Argo CD Application per cluster","Energy":"3","Into next":"and because it's labels, the app already runs in both regions. So what","Source":"GOALS §5.5, §5.1 A; `EKS-VS-ECS.md` rule 5; 📎 *N Clusters, One kubectl* p10"}},"policy-layer":{"title":"One rule set, whoever made the change","notes":"\u003cp>Identity says who the agent is. Policy says what anyone may do, and the trick is to write the rule against the action, not the actor.\u003c/p>\n\u003cp>On the right, one CEL rule as a native ValidatingAdmissionPolicy, GA since Kubernetes 1.30, no webhook to keep alive. Every container image comes from our registry, pinned by digest. It never mentions people or agents.\u003c/p>\n\u003cp>On the left, three actors send the same bad change: a person with kubectl, the pipeline from a merged PR, an agent through a tool call.\u003c/p>\n\u003cp>The pipeline and the agent meet the rule in CI first, through kyverno test, so the PR fails before anyone reviews it. For an agent, a failed test is something it can read and fix.\u003c/p>\n\u003cp>The person with kubectl skips CI; that's what admission is for. Click. All three meet the same rule there, with the same message.\u003c/p>\n\u003cp>One rule set for people and agents. That's why agent governance mostly comes for free, if the rules are already there.\u003c/p>\n\u003cp>Policy stops what shouldn't happen. Telemetry shows what did.\u003c/p>","plan":{"Act":"V · tag: agents as users","Job":"one CEL rule set, written against the action, stops a person, the pipeline and","Headline":"One rule set checks every change, in CI and at admission, whoever made it.","Visual":"a ValidatingAdmissionPolicy with one CEL rule that never names an actor","Energy":"3","Into next":"policy stops what shouldn't happen. Telemetry shows what did.","Source":"GOALS §2.1–§2.2 (\"write policies against the action, not the actor\");"}},"region-claim":{"title":"A region is one claim","notes":"\u003cp>That's on-prem. In AWS the cluster itself can come from code.\u003c/p>\n\u003cp>On the left is all an admin writes for a new region: a Region claim. Mirror aws-1, six clusters, label them aws-2. That's our own API, a Crossplane composite we'd write, and the slide says so. Accounts and landing zone stay in CDK below it.\u003c/p>\n\u003cp>The composition builds the rest: VPC and subnets, IAM with Pod Identity, six EKS clusters, DNS and load balancers, and, most important, each cluster registered with Argo CD already labelled. So the waves and placement find them. Nobody edits a list.\u003c/p>\n\u003cp>Click. What it sets on each EKS cluster, in the real API fields. The version is ours. computeConfig enabled is Auto Mode: AWS runs the nodes and Karpenter. Load balancing and block storage on, so AWS runs those add-ons too.\u003c/p>\n\u003cp>Two catches. Auto Mode takes no custom AMIs, which matters for agent sandboxes later. And the twenty-one-day node lifetime in our notes still needs checking.\u003c/p>\n\u003cp>That's the admins. The platform team carries the most, and the show had plenty to say about them.\u003c/p>","plan":{"Act":"II · tag: cluster admins","Job":"AWS automation: a region from one claim; AWS runs the nodes","Headline":"In AWS, a new region is one claim: Crossplane builds it, and EKS Auto Mode runs it.","Visual":"as v3 (claim → Crossplane → what it builds → who runs what), with the claim","Energy":"3","Into next":"that's the admins. The platform team carries the most, and the show","Source":"`EKS-VS-ECS.md` §4; GOALS §10.1–10.2; EKS CreateCluster API; *Crossplane:"}},"sandbox":{"title":"Three runtimes, three syscall paths","notes":"\u003cp>A container is not a cage. Here's why, as three syscall paths. These are alternatives, not layers: one runtime class per pod.\u003c/p>\n\u003cp>On the left, a plain container. The agent's system calls go straight to the host kernel every pod on that node shares. A namespace, not a wall. Fine for code a person reviewed; not for code an agent wrote a minute ago.\u003c/p>\n\u003cp>Click. gVisor. The calls go to the Sentry, a kernel in user space, and only a narrow set ever reaches the host. Most kernel exploits stop there. Fast to start; syscall-heavy work pays. Runs on any EC2 instance, but on our own AMI, so not Auto Mode. Our default for agents.\u003c/p>\n\u003cp>Click. Kata. Each pod gets a microVM with its own guest kernel, and an escape lands in a VM. Slower to start, a VM's memory per pod; Microsoft showed snapshots fixing most of the start-up. On AWS it needs metal or nested virtualisation. For untrusted code and tools that run whatever they're handed.\u003c/p>\n\u003cp>AWS's own talk said it simply: a runtime class on a normal pod spec.\u003c/p>\n\u003cp>That's agents as workloads. As users, they work through tools.\u003c/p>","plan":{"Act":"V · tag: agents as workloads","Job":"containment, accurately: three runtimes are alternatives, each with a syscall","Headline":"A container shares the kernel; gVisor intercepts it, and Kata gives the agent its own.","Visual":"three columns side by side, each the path a syscall takes from the agent to","Energy":"4","Into next":"that's agents as workloads. As users, they do things through tools.","Source":"GOALS §3.1; \"Sandbox Your Agents\" keynote (Red Hat); *Groundhog Pod*"}},"ship-the-check":{"title":"NVIDIA: an agent drove the rollout","notes":"\u003cp>The answer isn't more people. NVIDIA showed it, and it was the cleanest agent-safe automation at the show.\u003c/p>\n\u003cp>Their slide. Two kernel CVEs, days apart. Sixteen clusters, about fifty-six hundred nodes, converged in thirty minutes, and an agent drove it.\u003c/p>\n\u003cp>Look how little the agent was trusted with. It applies the change to a cluster and polls one status field. Complete: next cluster. Erroring or blocked: stop and escalate to a person. It caught tainted control-plane nodes, escalated instead of forcing it, and a human added the tolerations.\u003c/p>\n\u003cp>Underneath: ship the change with the check that fails without it, so done is a value in a field, not an opinion.\u003c/p>\n\u003cp>Click. All the agent reads: kubectl get, gate on status, an enum. An interface a machine can drive safely.\u003c/p>\n\u003cp>Click. Their line: the next CVE is a YAML change. The controller never changed between the two CVEs.\u003c/p>\n\u003cp>Put that next to everything we built, and the circle closes.\u003c/p>","plan":{"Act":"VII · tag: agents as attackers","Job":"the receipt for patching at speed: ship the change with the check, and let an","Headline":"NVIDIA patched ~5,600 nodes in 30 minutes: an agent drove it by reading one status field.","Visual":"snowfield. NVIDIA's \"the status enum let an agent drive the rollout\"","Energy":"4","Into next":"put that next to everything we built, and the circle closes.","Source":"📎 *5,000 Nodes in Minutes, Twice in a Week* (NVIDIA) p04, p06, p07"}},"show-agents":{"title":"At the show: AI","notes":"\u003cp>That's the first half. Now the takeaway every stage at the show was talking about.\u003c/p>\n\u003cp>Same four days. Lit: AI, inference and agents. Two hundred and twenty-eight talks, nearly half the show.\u003c/p>\n\u003cp>The names. Uber on Monday. Tuesday's keynotes: Anthropic and Google with Agent Substrate, Red Hat's \"Sandbox Your Agents\", NVIDIA. Verkada triaging alerts at thirty-three cents each. Grainger, LinkedIn, Ericsson's AI-found zero-day. AWS, OpenAI, Microsoft, Huawei on Wednesday. Salesforce and AWS again on Thursday.\u003c/p>\n\u003cp>And look at how they split. Solving: Mastercard let an LLM drive thirty EKS clusters, read-only by default, with every write reviewed. Creating: Google's keynote said an agent isn't just another workload; it breaks the identity assumptions Kubernetes was built on. And Mythos vs Maintainers: open source maintainers drowning in AI-found vulnerability reports.\u003c/p>\n\u003cp>The same technology, on both sides, sometimes in the same hour. That's the third takeaway: AI brings problems as it solves them. Here's how it arrived on our map.\u003c/p>","plan":{"Act":"V","Job":"the third takeaway's credibility: AI everywhere, on both sides of the problem","Headline":"AI was everywhere, solving problems on one stage and creating them on the next.","Visual":"from v3 as settled there: the four days, AI talks lit (228 of 501, nearly","Energy":"4","Into next":"and it arrives on our map three ways at once.","Source":"GOALS §5.1 B (four layers, the budget to write down, Karmada's trigger:"}},"show-delivery":{"title":"At the show: pipelines","notes":"\u003cp>Next, the platform team, who carry the most. First, the second takeaway, as the show told it.\u003c/p>\n\u003cp>Same four days. Lit now: GitOps, pipelines, progressive delivery, policy, platform engineering. About a hundred and twenty talks.\u003c/p>\n\u003cp>And the names. Apple on policy, Monday. AT&T and JPMorganChase on policy as code. NVIDIA with Upbound, Adobe, Meta's keynote, Salesforce and Heroku, Google, the Crossplane maintainers, the Argo CD maintainers with Intuit, Spotify.\u003c/p>\n\u003cp>Three to remember. Meta, in a keynote: a one-line Helm change used to take a working day in their Terraform pipeline, so they moved deploys to GitOps. That's the fifteen engineers running a hundred clusters. LinkedIn: their most critical cluster services ship several times a week, through a canary pipeline built for software that has no user traffic to shift. And Ford: hundreds of clusters, and CI that checks every pull request end to end before it reaches one.\u003c/p>\n\u003cp>None of them keep up by hand. Every change rides a pipeline. Here's what that means for our platform team.\u003c/p>","plan":{"Act":"III","Job":"the second takeaway's credibility: nobody at fleet scale keeps up by hand","Headline":"At fleet scale, nobody keeps up by hand: every change rides a pipeline.","Visual":"from v3 as settled there: the four days, delivery talks lit (122 of 501);","Energy":"3","Into next":"and that includes the twenty tools the platform team runs, not the four we counted.","Source":"v3 narrative, \"The show-* slides\""}},"show-fleet":{"title":"At the show: fleets","notes":"\u003cp>Before our own story, here's the first takeaway as the show told it.\u003c/p>\n\u003cp>These are the four days, every talk as a box, Monday's co-located day through Thursday. Lit are the talks about running fleets: multi-cluster, upgrades, cluster lifecycle. Almost a hundred of them.\u003c/p>\n\u003cp>And look at who gave them. Bloomberg on multi-cluster. AWS's keynote. NVIDIA and Salesforce on one kubectl across many clusters. Apple and Uber keynotes. NVIDIA again, five thousand nodes in minutes. Mastercard, thirty EKS clusters. Coinbase, Nutanix, LinkedIn.\u003c/p>\n\u003cp>Three to remember. LinkedIn: more than two hundred and fifty clusters, about half a million nodes, upgraded with skip-level upgrades. Salesforce: a thousand clusters, run with agents. And GEICO, a regulated insurer like the companies we compare ourselves to: no single cloud had enough GPUs, so they run Kubernetes across providers.\u003c/p>\n\u003cp>None of them planned to have that many. Every one of those fleets grew one reasonable cluster at a time. There's always another cluster coming, so it has to be the rule, not the exception.\u003c/p>\n\u003cp>Now ours. It started at four.\u003c/p>","plan":{"Act":"I","Job":"the first takeaway's credibility: the show was full of fleets, run by big names","Headline":"The big names all run fleets: another cluster is the rule, not the exception.","Visual":"from v3 as settled there (commit 26debcc): the four days as boxes, fleet talks","Energy":"3","Into next":"now ours. It started at four.","Source":"v3 narrative, \"The show-* slides\" (every highlight checked against its abstract)"}},"skip-level":{"title":"LinkedIn: three minors, one rollout","notes":"\u003cp>That's on-prem from code. LinkedIn went further, at about ten times our size: more than two hundred and fifty clusters, around half a million nodes, on their own hardware. This is their result slide.\u003c/p>\n\u003cp>They took production from Kubernetes 1.31 to 1.34. Three minors. The old way, one minor at a time, was six fleet waves and forty business days. They did it in one rollout and a promotion, in seven.\u003c/p>\n\u003cp>The trick is in the title of their talk: binary version is not behaviour. It's KEP-4330, compatibility versions. You deploy the 1.34 binaries, but pinned with the emulated-version flag, so they behave like 1.31. You soak that. If anything's wrong, rollback is just a binary downgrade, because behaviour never changed. Then you release, by raising the emulated version. One promotion instead of three upgrades.\u003c/p>\n\u003cp>Two honest notes. LinkedIn did this with their own control-plane tooling, so before we promise it we check what kubeadm and Cluster API support. And this removes minor-version toil, not patching: security patches still ship every month, through the waves we're about to build.\u003c/p>\n\u003cp>That's on-prem. In AWS, the cluster itself comes from code.\u003c/p>","plan":{"Act":"II · tag: cluster admins","Job":"the receipt: a peer at ten times our size changed the upgrade itself, not just","Headline":"LinkedIn took 250+ clusters from v1.31 to v1.34 in one rollout: 7 business days, not 40.","Visual":"snowfield. LinkedIn's result slide (`13-skip-level-upgrades/p02`) as the hero,","Energy":"3","Into next":"that's on-prem. In AWS the cluster itself comes from code.","Source":"*Binary Version Is Not Behavior* (LinkedIn), 📎 deck p02, p05, p08. ⚠️ Their"}},"the-ask":{"title":"Five first pull requests","notes":"\u003cp>So, back to where we started. Meta runs about a hundred clusters with fifteen engineers. We run twenty-nine with three. The difference was never headcount. It's what does the work.\u003c/p>\n\u003cp>Same three people on the left, same twenty-nine clusters. What changes is the job: not sixteen hundred hand rollouts a year, but about eighty wave approvals, and the pipeline does the rest.\u003c/p>\n\u003cp>Five first pull requests, each one an object you've already seen.\u003c/p>\n\u003cp>One. No hand-built cluster, ever again. The next one is a file: a Cluster API Cluster on-prem, a Region claim in AWS.\u003c/p>\n\u003cp>Two. One platform tool through the waves this quarter: the Splunk OTel collector. That means a wave label on twenty-nine cluster secrets, a RollingSync ApplicationSet, and one gate Job.\u003c/p>\n\u003cp>Three. AWS region two from one claim, on Auto Mode, with one app live in both regions, placed by labels.\u003c/p>\n\u003cp>Four. Before any agent touches anything: the runtime class and its node pool, the gateway, Pod Identity, and the CEL rules.\u003c/p>\n\u003cp>Five. Explain-only alert triage by the second quarter of 2027, logging every accept, modify and reject from the first day, because that log is how agents earn the next job.\u003c/p>\n\u003cp>Every claim in this talk had a receipt. These are ours to write. Thank you.\u003c/p>","plan":{"Act":"Close","Job":"echo the opening with the ratio changed by the pipeline, then the ask as five","Headline":"Same team, same 29 clusters: five first pull requests start it this quarter.","Visual":"left, the opening's echo: 29 squares, the same three people, \"1,672 hand","Energy":"3","Into next":"end"}},"the-lake":{"title":"The read-only lake","notes":"\u003cp>And agents read it from a lake, not from production.\u003c/p>\n\u003cp>The range again, OTel as one plane through all three peaks, and the lake in the valley. This time every stream is a table. From the fleet, pods and nodes, snapshotted every fifteen minutes. From delivery, every Argo CD sync and gate result. From the agents, every MCP call the gateway logged. And through the plane, traces, metrics and logs.\u003c/p>\n\u003cp>Agents read from the shore, with a read-only role or a SQL tool through the gateway. No path back up the mountain. That's what lets us say yes to agents analysing prod without giving them prod credentials.\u003c/p>\n\u003cp>Click. One query an agent runs: a new CVE lands; which clusters run an affected image? Join the pod snapshot to the vulnerability feed by digest. No kubectl, no credentials. Hold on to it; it comes back.\u003c/p>\n\u003cp>Receipts: NVIDIA and Upbound showed a queryable audit layer, one query across five clouds. Mastercard answers \"how many EC2 instances\" from an eight-hundred-byte projection instead of forty megabytes of JSON.\u003c/p>\n\u003cp>The limit: a lake is a snapshot. Fine for triage and trends; a gate mid-rollout reads live metrics. The store is still a decision.\u003c/p>\n\u003cp>So give an agent its first job: the next alert.\u003c/p>","plan":{"Act":"VI","Job":"agents decide from a read-only lake; name what's in it and how they read it","Headline":"Agents decide from a read-only lake, not from credentials to production.","Visual":"v3's range-and-lake composition, with the lake named: tables","Energy":"4","Into next":"so give an agent its first job from the lake: the next alert.","Source":"GOALS §7; 📎 *One Recipe, Five Clouds, One Query* (NVIDIA, Upbound) p18;"}},"three-ways":{"title":"Three ways agents arrive","notes":"\u003cp>So AI was everywhere at the show. On our map it doesn't arrive as one thing. Agents arrive three ways at once, and each needs a different answer.\u003c/p>\n\u003cp>Click. First, as workloads. An agent is a pod, on our nodes, beside our apps, often running code it wrote a minute ago. Podium runs every coding agent as an isolated pod, and those agents open thirty percent of their merged pull requests. The answer is an ordinary Job spec, with the right runtime class.\u003c/p>\n\u003cp>Click. Second, as users. The same agent calls our tools: it opens pull requests, requests infrastructure, reads the cluster. Mastercard lets an LLM drive thirty EKS clusters, with every write reviewed. The answer is a gateway, a short-lived identity, and the same CEL rules people get.\u003c/p>\n\u003cp>Click. Third, the one nobody puts on a roadmap: attackers have agents too. They point them at the open source we run. One Metal3 maintainer's own AI found two hundred and twenty issues in a year; attackers have the same models. We can't fence that out. We have to out-pace it, with the lake, our own agents, and the waves from the first half.\u003c/p>\n\u003cp>Those three tags sit in the corner from here on. Workloads first: here's one agent, as a pod.\u003c/p>","plan":{"Act":"V","Job":"the turn into the agent half: agents arrive three ways at once, each with a","Headline":"Agents arrive three ways: as workloads, as users, and as attackers finding new holes daily.","Visual":"v3's three columns, with one named example under each, in place of the","Energy":"4","Into next":"workloads first. Here's one agent, as a pod.","Source":"Podium (abstract); 📎 *No RAG, No Regrets* (Mastercard); 📎 *AI Found a 0-Day"}},"triage":{"title":"One alert, triaged","notes":"\u003cp>The first job isn't fixing anything. It's explaining an alert.\u003c/p>\n\u003cp>On the left, a real-shaped alert: payments crash-looping on aws-1 prod for six minutes.\u003c/p>\n\u003cp>Click. The agent reads the lake and posts this. A verdict: real, not noise, no open incident. A severity with its basis, so you can disagree: three of six replicas down in aws-1, and aws-2 carrying it; that's the failover slide working. What changed: Argo CD synced payments twelve minutes ago. Where to look. And a suggestion: roll back, one revert PR.\u003c/p>\n\u003cp>It doesn't act. No write path anywhere, which is why it's first: no sandbox or policy gate needed to make it safe.\u003c/p>\n\u003cp>Click. The responder accepts, modifies or rejects, and every choice is logged. That log is the track record an agent needs before it's allowed to open that PR itself.\u003c/p>\n\u003cp>Receipts. Verkada runs this on nine production clusters: forty-seven hundred alerts a month, thirty-three cents each, a summary in a hundred and thirty-nine seconds. And Salesforce's first attempt was right a quarter of the time. A curated knowledge base and an eval harness got them to sixty to eighty percent. Budget for both, or expect the twenty-five.\u003c/p>\n\u003cp>Demo option: HolmesGPT on a CrashLoopBackOff in dev, two minutes.\u003c/p>\n\u003cp>That's our agents. Theirs are already at work.\u003c/p>","plan":{"Act":"VI","Job":"the second half's high: an agent doing its first job, explain-only, with real","Headline":"The first agent job is explaining alerts: $0.33 each at Verkada, 25% right on Salesforce's first try.","Visual":"see Visual direction (one alert, triaged). Alert: `KubePodCrashLooping`,","Energy":"4","Into next":"that's our agents. Theirs are already at work on what we run.","Source":"GOALS §6 stage 1; Verkada (title and abstract); 📎 *1000 Clusters, 1 Smarter","Demo option":"HolmesGPT or k8sgpt explaining a CrashLoopBackOff on dev, read-only,"}},"twenty-tools":{"title":"Twenty tools, not four","notes":"\u003cp>Those platform hours assumed the core four tools. Here's what the platform actually runs.\u003c/p>\n\u003cp>The four in blue are the core four from the chart. Click. And the rest: Ceph and Rook on our hardware, the Vault operator and External Secrets, Grafana and Thanos, Istio or the ALB controller, the Kafka UI, the file viewer, cert-manager, external-dns, Kyverno, Velero, KEDA, Reloader, Argo Rollouts. Twenty, each tagged with where it runs.\u003c/p>\n\u003cp>The numbers, side by side. Four tools across twenty-nine clusters by hand: 116 installs, 464 rollouts a year, about 700 hours. Twenty: 418 installs, 1,672 rollouts, two and a half thousand hours. Three people doing nothing else.\u003c/p>\n\u003cp>Click. Through the pipeline, it's eighty approvals a year. That's the job left for a person.\u003c/p>\n\u003cp>A model, not a measurement, but the shape holds. So here's what the pipeline is made of, starting with the order things roll out in.\u003c/p>","plan":{"Act":"III · tag: platform team","Job":"the multiplication nobody budgets: the overrun counted four tools; the platform runs twenty","Headline":"The overrun counted four tools. The platform really runs twenty: 1,672 rollouts a year.","Visual":"v3's twenty rows with where each runs (everywhere, on-prem only, cloud only,","Energy":"4","Into next":"twenty tools across the fleet. Here's what the pipeline is made of, starting with the order things roll out in.","Data":"v3 twenty-tools model"}},"waves":{"title":"A wave is a label","notes":"\u003cp>Twenty tools across the fleet. The pipeline that rolls them out is less than you'd think.\u003c/p>\n\u003cp>On the right, the order: test cluster, one canary, then prod a quarter at a time. Each ring is a label on the cluster: wave equals test, canary or prod.\u003c/p>\n\u003cp>On the left, the whole rollout order for Prometheus: an ApplicationSet over every registered cluster. The line that matters is RollingSync. Three steps: test; when healthy, canary; when healthy, prod, no more than twenty-five percent at a time. The template copies each cluster's label onto its app, so the steps can find it.\u003c/p>\n\u003cp>Same file shape for all twenty tools. A thirtieth cluster arrives labelled, from the Region claim, and joins its ring.\u003c/p>\n\u003cp>The catch: progressive sync sits behind a controller flag. We check its maturity in our Argo CD before we lean on it.\u003c/p>\n\u003cp>A ring only moves outward when its step is healthy. Healthy means a gate.\u003c/p>","plan":{"Act":"III · tag: platform team","Job":"a wave is a label on a cluster, and the rollout order is a dozen lines of ApplicationSet","Headline":"A wave is a label on the cluster, and the order is a dozen lines of ApplicationSet.","Visual":"left, `platform/prometheus/appset.yaml`: `strategy.type: RollingSync`, steps","Energy":"3","Into next":"a ring only moves outward when the step is healthy. Healthy means a gate.","Source":"GOALS §1.4; Argo CD docs (Progressive Syncs)"}}},"narrativeOrder":["cold-open","journey","show-fleet","estate-grows","one-runbook","overrun","capi-diff","skip-level","region-claim","show-delivery","twenty-tools","waves","gates","change-windows","placement","failover","show-agents","three-ways","agent-pod","sandbox","mcp-gateway","credentials","policy-layer","one-view","the-lake","triage","new-holes","ship-the-check","patch-loop","the-ask"],"kit":"1.0.0"};</script>
