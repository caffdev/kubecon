<script>window.DECK = {"deck":"takeaways-v2","title":"Takeaways v2: the fleet outgrows one person","draft":"ten","drafts":{"main":["two-clusters","dr","eks","more-of-everything","ai-users","second-cloud","one-runbook","tools-too","overrun","kubeadm-past","waves","gates","change-windows","otel-common-layer","the-lake","same-person","the-ask"],"ten":["fleet-outgrows","estate-grows","every-cluster-multiplies","overrun-ten","kubeadm-past-ten","gates-ten","change-windows-ten","one-layer-one-lake","same-person-ten","the-ask-ten"]},"size":[1920,1080],"slides":{"ai-users":{"title":"AI as workloads and users","notes":"\u003cp>Then AI, two ways at once.\u003c/p>\n\u003cp>First as workloads: GPU clusters for inference and training. Those are the teal peaks.\u003c/p>\n\u003cp>Second, and this is the one people miss, as users. Look at the row of people. The teal diamonds are agents. They call our API server, open pull requests against our repos and read our metrics. There are already a couple of dozen, they don't sleep, and they don't wait for business hours.\u003c/p>\n\u003cp>This was everywhere at the show. Mastercard has an LLM driving thirty EKS clusters. Salesforce runs agentic operations across a thousand.\u003c/p>\n\u003cp>Twenty clusters now. And the more we depend on one provider, the more its bad day becomes ours.\u003c/p>","plan":{}},"change-windows":{"title":"Windows are policy","notes":"\u003cp>One more thing the pipeline needs: to know when not to run at all.\u003c/p>\n\u003cp>This is a week. The pale bands are when changes are allowed: daytime, Monday to Thursday. The hatched part is frozen: every night, and from Thursday evening through the weekend.\u003c/p>\n\u003cp>Wave one runs on Tuesday. Wave two on Wednesday. The prod wave starts Thursday, and when the window closes it stops. Not because someone remembered to stop it: because the window says so. It sits there through the weekend and picks up on its own when the window opens on Monday morning.\u003c/p>\n\u003cp>Two locks on the same window. Argo CD already has sync windows, a cron with allow and deny, so the pipeline stops itself. And Kyverno reads the same window and stops everything else: someone with kubectl, an operator, an agent. The approved windows are a resource in the cluster, not a call out to the ticket system, so admission never breaks because Jira is slow.\u003c/p>\n\u003cp>This is also what gets teams to let go of manual sync. The control they actually wanted was \"nothing goes out during the freeze\". Now that's enforced, not negotiated.\u003c/p>\n\u003cp>NVIDIA showed the same idea at fleet scale: their maintenance scheduler factors in business-critical windows. Agility Robotics put an admission gate on top of sync windows for the cases a schedule can't see.\u003c/p>\n\u003cp>One more layer runs on every cluster we just rolled to, and it's the one that sees both kinds of workload.\u003c/p>","plan":{}},"change-windows-ten":{"title":"Windows are policy","notes":"\u003cp>This is a week. The pale bands are when changes are allowed: daytime, Monday to Thursday. The hatched part is frozen.\u003c/p>\n\u003cp>Wave one runs Tuesday, wave two Wednesday. The prod wave starts Thursday, and when the window closes it stops. Not because someone remembered: because the window says so. It waits through the weekend and picks up on its own on Monday.\u003c/p>\n\u003cp>Two locks on the same window. Argo CD already has sync windows, a cron with allow and deny, so the pipeline stops itself. Kyverno reads the same window and stops everything else: someone with kubectl, an operator, an agent. The window lives in the cluster, so admission never waits on the ticket system.\u003c/p>\n\u003cp>This is also what gets teams to let go of manual sync. What they wanted was \"nothing goes out during the freeze\". Now that's enforced, not negotiated. NVIDIA's fleet scheduler plans around business-critical windows the same way.\u003c/p>\n\u003cp>One more layer runs on every cluster we just rolled to.\u003c/p>","plan":{"Act":"III","Job":"time gating: freezes enforced by policy, not by a person; the breather after the peak","Headline":"Nothing rolls during a freeze, because the window is a policy, not a promise.","Visual":"a week as a strip of hours, frozen hours hatched; wave 1 Tuesday, wave 2","Energy":"2","Into next":"one more layer runs on every cluster we just rolled to.","Source":"GOALS §2.3; `GOALS-GAPS.md` §1.1 + §2.3; NVIDIA maintenance scheduler; Agility"}},"dr":{"title":"DR makes three","notes":"\u003cp>Then prod got important. Important enough that losing it wasn't an option, so it got a twin: a DR cluster.\u003c/p>\n\u003cp>Now there are three. And DR only works if it matches prod: same Kubernetes version, same tools, same config. That dashed line is lockstep. Every upgrade now happens twice, back to back, and the second one isn't allowed to drift from the first.\u003c/p>\n\u003cp>Still one person.\u003c/p>\n\u003cp>Then we moved into AWS.\u003c/p>","plan":{}},"eks":{"title":"EKS arrives","notes":"\u003cp>Then AWS. We stood up EKS: a dev cluster, and two prod clusters in two regions, east and west, so our public apps could run live-live.\u003c/p>\n\u003cp>EKS is a different animal. AWS runs the control plane, but the node groups, the add-ons and the order you do them in are on us, and none of it looks like the kubeadm runbook. So now there are two runbooks, for two kinds of cluster.\u003c/p>\n\u003cp>Six clusters. Still one person.\u003c/p>\n\u003cp>And once EKS made clusters easy to get, everyone wanted one.\u003c/p>","plan":{}},"estate-grows":{"title":"Six steps, one person","notes":"\u003cp>We started small. A handful of people, two clusters on our own hardware, built with kubeadm by hand. One to test on, one to run on. And one person who upgrades them.\u003c/p>\n\u003cp>Click. Prod got important enough to need a twin, so DR joined. And DR only works if it matches prod version for version, so every upgrade now happens twice, in lockstep.\u003c/p>\n\u003cp>Click. Then AWS. A dev cluster and two prod clusters in two regions. EKS is a different animal: AWS runs the control plane, the rest is on us, and none of it looks like the kubeadm runbook. Two kinds of cluster, two runbooks.\u003c/p>\n\u003cp>Click. Then every new team brought apps, people and, usually, a reason for a cluster of its own. Fourteen clusters. Nobody decided that; it just happened, one reasonable request at a time.\u003c/p>\n\u003cp>Click. Then AI, two ways at once. GPU clusters for the workloads, in teal. And agents as users: the teal diamonds call our API, open pull requests and read our metrics. Mastercard has an LLM driving thirty EKS clusters; Salesforce runs agentic operations across a thousand.\u003c/p>\n\u003cp>Click. And because one provider's bad day can't be ours, a second cloud, with apps moving into it. Nearly every large fleet at the show was hybrid or multi-cloud.\u003c/p>\n\u003cp>Twenty-eight clusters. Three kinds of place. Every step made sense on the day. And there's still one person in orange.\u003c/p>\n\u003cp>So what does one upgrade actually cost him?\u003c/p>","plan":{"Act":"I","Job":"six reasonable growth steps, each obvious on its own, adding up to 28 clusters and one person","Headline":"Six reasonable steps turned two clusters into twenty-eight. One person still upgrades them.","Visual":"the estate map from `main`, one slide, five clicks: day one → + DR → + EKS →","Energy":"4","Into next":"so what does one upgrade actually cost him?","Source":"GOALS §0 claim 2 (Mastercard: an LLM drives 30 EKS clusters; Salesforce: 1,000"}},"every-cluster-multiplies":{"title":"Five trains per cluster","notes":"\u003cp>Here's what one cluster costs him in a year.\u003c/p>\n\u003cp>The top lane is Kubernetes itself. Three minor versions a year, roughly April, August and December. On a kubeadm cluster each upgrade is that block: nine nodes, six steps a node. Drain it, upgrade kubeadm, run the upgrade, upgrade kubelet and kubectl, restart kubelet, uncordon. Then the next node. Fifty-four steps, every one waiting on the last. Call it a day. And kubeadm can't skip a minor, so all three happen, every year.\u003c/p>\n\u003cp>Below it, the platform on that cluster. Argo CD to deploy, Prometheus to measure, the Splunk OTel collector to ship telemetry, Karpenter to scale nodes on the cloud clusters. Each has its own release train, and they don't line up with each other or with Kubernetes. The timing here is illustrative, but the shape isn't: lots of small rollouts, all year, scattered.\u003c/p>\n\u003cp>That's one cluster. Now multiply by twenty-eight. Every new cluster brings all five trains with it, and on a hand-run fleet each stop is somebody's afternoon. What hand rollouts leave behind is version skew: if you asked which version of Prometheus each cluster runs, someone would have to go and look.\u003c/p>\n\u003cp>So add it all up, and put it against one person's year.\u003c/p>","plan":{"Act":"II","Job":"make the per-cluster work concrete, and show that every new cluster brings all of it again","Headline":"Every cluster carries five release trains, and each stop is done by hand.","Visual":"one cluster's year on a Jan–Dec axis. Kubernetes: three 54-step blocks (April,","Energy":"3","Into next":"so add it all up, and put it against one person's year.","Source":"kubeadm upgrade docs (skipping minors is unsupported); Kubernetes ships three"}},"fleet-outgrows":{"title":"The fleet outgrows one person","notes":"\u003cp>This talk is about one person. In our story he's the one who upgrades the clusters, and he's in orange on every slide from here on.\u003c/p>\n\u003cp>Today he looks after two of them, test and prod, and it's fine. It takes him a couple of days, three times a year, and nobody else notices.\u003c/p>\n\u003cp>The dashed outlines are the clusters that are coming. Twenty-six more, in the story I'm about to tell, and every one of them arrives for a good reason.\u003c/p>\n\u003cp>So the claim is simple: the fleet will outgrow one person with a runbook. Then I'll show you what the fleets at KubeCon do instead, and what I think we should start this quarter.\u003c/p>\n\u003cp>Here's how it grows.\u003c/p>","plan":{"Act":"I","Job":"title and cold open: state the claim, plant the one person and the row that will fill","Headline":"The fleet will outgrow one person with a runbook.","Visual":"the claim at hero size. Below it, one row: the climber in alpenglow, two lit","Energy":"3","Into next":"here's how it grows."}},"gates":{"title":"Gates roll back","notes":"\u003cp>This is the slide the whole second half has been building to.\u003c/p>\n\u003cp>Read it from the middle out. The middle is the test cluster. Then one canary cluster. Then the prod fleet in waves: wave one, wave two, and the rest of prod. A new version of a platform tool starts in the middle and moves outward one ring at a time, and between every ring there's a gate.\u003c/p>\n\u003cp>Click. A new Prometheus goes onto the test cluster. Its gate passes: targets are up, rules are evaluating, nothing's dropped. So it moves out.\u003c/p>\n\u003cp>Click. It reaches the canary cluster, which is a real cluster with real workloads. And this time the gate fails: targets dropped after the upgrade.\u003c/p>\n\u003cp>Click. And here's the point. Nobody decides anything. The pipeline rolls the canary back to the old version on its own. Wave one never started. The prod rings never saw it. Nobody got paged, and the person from the start of this talk found out from a message in the morning, not a phone call at night.\u003c/p>\n\u003cp>On the right: each tool brings its own gate. Argo CD checks every app is still synced and healthy. Prometheus checks its own targets and rules. The OTel collector checks that exports are succeeding. Karpenter checks that pending pods still get nodes. Different checks, same machinery.\u003c/p>\n\u003cp>This isn't our invention. LinkedIn showed it for their cluster services: the gate is just an Argo CD PostSync job. Exit zero, the wave advances. Exit one, the sync fails and it rolls back. They took a release from about a week of manual testing to about an hour.\u003c/p>\n\u003cp>And the pipeline also needs to know when not to run at all.\u003c/p>","plan":{}},"gates-ten":{"title":"Waves, gates, rollback","notes":"\u003cp>The tools get the treatment we already give apps.\u003c/p>\n\u003cp>Read it from the left. The test cluster, then one canary with real workloads, then the prod fleet in waves: wave one, wave two, the rest of prod. A new version of a tool moves outward one ring at a time. One ApplicationSet per tool, with progressive sync taking it a wave at a time; a cluster joins a wave with a label, so cluster twenty-nine just gets a label and it's in.\u003c/p>\n\u003cp>Between every ring there's a gate.\u003c/p>\n\u003cp>Click. A new Prometheus goes onto the test cluster. Its gate passes: targets up, rules evaluating. So it moves out.\u003c/p>\n\u003cp>Click. It reaches the canary, and this time the gate fails. Targets dropped after the upgrade.\u003c/p>\n\u003cp>Click. And here's the point. Nobody decides anything. The pipeline rolls the canary back on its own. Wave one never started. Prod never saw it. The person in orange finds out from a message in the morning, not a phone call at night.\u003c/p>\n\u003cp>On the right, each tool brings its own gate. Different checks, same machinery.\u003c/p>\n\u003cp>This isn't our invention. LinkedIn showed it for their cluster services: the gate is an Argo CD PostSync job. Exit zero, the wave advances; exit one, the sync fails and it rolls back. A release went from about a week of manual testing to about an hour. The failure on screen is our example, not their incident.\u003c/p>\n\u003cp>And the pipeline also needs to know when not to run at all.\u003c/p>","plan":{"Act":"III","Job":"the peak: tools roll out in waves, and automated gates and rollback make the waves safe to leave alone","Headline":"Platform tools roll out in waves, and a failed gate rolls itself back.","Visual":"half-rings rippling right from the test cluster (canary, wave 1, wave 2, prod)","Energy":"5","Into next":"and the pipeline also needs to know when not to run at all.","Source":"GOALS §1.4 (ApplicationSets, progressive sync), §1.7; LinkedIn canary pipeline"}},"kubeadm-past":{"title":"kubeadm by hand is the past","notes":"\u003cp>So what do the people with three hundred clusters do? Not that.\u003c/p>\n\u003cp>On the left is the row from two slides ago: fifty-four steps for one cluster, by hand. Nobody presenting at this scale does that any more. What they do instead is on the right: the upgrade is a change to one field, a version number, in a pull request. It gets reviewed, it gets merged, and a controller does the fifty-four steps, the same way every time.\u003c/p>\n\u003cp>Two routes for us. On-prem, that's Cluster API. And to be straight about it: Cluster API still uses kubeadm underneath. kubeadm isn't going anywhere. What goes is a person running it node by node. Cluster API replaces machines one at a time instead of patching them in place. The tool stays; the hands go.\u003c/p>\n\u003cp>In AWS, it's EKS Auto Mode. AWS upgrades the control plane, then replaces the nodes for us, and it runs Karpenter itself, which takes one tool off our list.\u003c/p>\n\u003cp>The evidence. LinkedIn runs three hundred clusters. With skip-level upgrades they took three minor versions from six fleet-wide waves down to one. NVIDIA converged about fifty-six hundred nodes in thirty minutes. Meta runs about a hundred clusters with fifteen engineers.\u003c/p>\n\u003cp>That's the clusters. The tools on them need the same treatment.\u003c/p>","plan":{}},"kubeadm-past-ten":{"title":"kubeadm by hand is the past","notes":"\u003cp>Not that.\u003c/p>\n\u003cp>On the left, the block from two slides ago: fifty-four steps for one cluster, by hand. Nobody presenting at this scale does that any more. On the right is what they do instead: the upgrade is a change to one field in a pull request. It gets reviewed, merged, and a controller does the fifty-four steps the same way every time.\u003c/p>\n\u003cp>Two routes for us. On-prem, Cluster API. To be straight about it, Cluster API still runs kubeadm underneath. What goes is a person running it node by node; Cluster API replaces machines one at a time instead. The tool stays; the hands go.\u003c/p>\n\u003cp>In AWS, EKS Auto Mode. AWS upgrades the control plane, replaces the nodes, and runs Karpenter itself, which takes one train off our list. The cheapest rollout is the one somebody else does.\u003c/p>\n\u003cp>The evidence. LinkedIn runs three hundred clusters; skip-level upgrades took three minor versions from six fleet-wide waves to one. NVIDIA converged about fifty-six hundred nodes in thirty minutes.\u003c/p>\n\u003cp>That's the clusters. The tools on them need the same treatment.\u003c/p>","plan":{"Act":"III","Job":"retire hand-run kubeadm, honestly: the tool stays, the hands go","Headline":"kubeadm by hand is the past: the fleets on stage rebuild clusters from code.","Visual":"the 54-step block from slide 3 collapses into a two-line version diff in a","Energy":"3","Into next":"that's the clusters. The tools on them need the same treatment.","Source":"LinkedIn KEP-4330 talk; NVIDIA fleet node changes; `EKS-VS-ECS.md` §4 rules 1–2"}},"more-of-everything":{"title":"More of everything","notes":"\u003cp>This is the step nobody decides.\u003c/p>\n\u003cp>Each new team arrives with apps, with people who deploy them, and usually with a reason to want a cluster of its own: isolation, a compliance boundary, a region. Every one of those requests is reasonable on the day.\u003c/p>\n\u003cp>Fourteen clusters. About sixty apps. Thirty-odd people deploying. Notice the cluster names have gone from the map. There are too many to name now, and nobody misses them.\u003c/p>\n\u003cp>And he's still one person.\u003c/p>\n\u003cp>Then some of the users stopped being people.\u003c/p>","plan":{}},"one-layer-one-lake":{"title":"One layer, one lake","notes":"\u003cp>It's the layer that sees both kinds of workload.\u003c/p>\n\u003cp>This usually gets framed as OTel beating Prometheus. It isn't. Prometheus stays, top right, as a place metrics land. OTel is the layer in the middle.\u003c/p>\n\u003cp>On the left, classic workloads: services and batch jobs, with metrics, logs and traces. Below them, AI workloads: model servers and agents, with things classic tools have no words for: tokens, tool calls, which model answered, what it cost. IBM and JPMorgan showed inference servers that emit OTel traces and get scraped by Prometheus, both at once.\u003c/p>\n\u003cp>Both go through the same collector on every cluster. That's the Splunk OTel collector we already run, so it isn't a new tool, and it stamps the same cluster, namespace and team on everything.\u003c/p>\n\u003cp>And it all lands in one lake. The agents sit on the shore and read: is this alert real, did this canary get worse, which hour is quiet enough to upgrade. There's no path from the shore back to production. Read-only is what lets us say yes to agents analysing prod without handing them prod credentials.\u003c/p>\n\u003cp>The honest limit, bottom left. Mastercard argued the other side: a lake is a snapshot, and a stale index can mislead a model. They're right for live decisions, so a gate in the middle of a rollout reads live metrics through one narrow tool. The lake is for triage and trends.\u003c/p>\n\u003cp>So here's the same person, with the same fleet.\u003c/p>","plan":{"Act":"III","Job":"reframe OTel as the layer classic and AI workloads share, and land its data where agents can only read","Headline":"Classic and AI workloads share one OTel layer, and agents only read its lake.","Visual":"classic (haze) and AI (teal) workloads flow into one collector on every","Energy":"3","Into next":"so here's the same person, with the same fleet.","Source":"GOALS §4.2, §7; *Seeing Inside LLM Inference* (IBM, JPMorgan Chase); *No RAG,"}},"one-runbook":{"title":"One kubeadm upgrade","notes":"\u003cp>Here's what one upgrade actually is, on a kubeadm cluster.\u003c/p>\n\u003cp>In the box: the runbook for a single node. Drain it. Upgrade kubeadm. Run the upgrade. Upgrade kubelet and kubectl. Restart kubelet. Uncordon it. Then the next node. The control plane nodes go first, one at a time, then the workers, one at a time.\u003c/p>\n\u003cp>Below: that's one row. Nine nodes, six steps each, fifty-four steps for one cluster, and a person waiting on every one of them. Call it a day.\u003c/p>\n\u003cp>And kubeadm won't skip a minor version. Kubernetes ships three a year, roughly April, August and December, so that row happens three times a year. Per cluster. On-prem we'd have six of them by the end of the story.\u003c/p>\n\u003cp>That's the clusters. And they're the small part.\u003c/p>","plan":{}},"otel-common-layer":{"title":"OTel, the shared layer","notes":"\u003cp>One more layer runs on every cluster we just rolled to, and it's the one that sees both kinds of workload.\u003c/p>\n\u003cp>The headline is the point, so let me be careful with it. This isn't OTel winning and Prometheus losing. Prometheus stays. It's on the right, as a place metrics land, and plenty of what we run will keep exposing Prometheus metrics for years.\u003c/p>\n\u003cp>What OTel is, is the layer in the middle. On the left, our classic workloads: services and batch jobs, emitting metrics, logs and traces. Below them, the AI workloads: model servers and agents, emitting things classic tools have no words for: token counts, tool calls, which model answered. OpenTelemetry has semantic conventions for exactly that now, and Google and Microsoft spent a whole session on keeping them consistent.\u003c/p>\n\u003cp>Both go through the same collector on every cluster. That's the splunk-otel-collector we're already rolling out, so this isn't a new tool. And it stamps the same cluster, namespace and team on everything, classic and AI alike. That's what lets us ask one question across both: what did this team's agent cost, and what did it touch?\u003c/p>\n\u003cp>IBM and JPMorgan showed it in practice: their inference servers emit OTel traces and get scraped by Prometheus, both at once.\u003c/p>\n\u003cp>And everything that layer collects has to land somewhere the agents can read.\u003c/p>","plan":{}},"overrun":{"title":"One person's year runs out","notes":"\u003cp>Now add it up.\u003c/p>\n\u003cp>Each bar is one stage of the story: day one, then DR, EKS, more teams, AI, the second cloud. The height is the hours a year of upgrade work, done the way we do it today. The lower part is cluster upgrades; the upper part is rolling out the tools on them.\u003c/p>\n\u003cp>The orange line is one person's year. Not his whole year: about half of it, 850 hours, because he also has tickets, on-call and projects.\u003c/p>\n\u003cp>For the first three stages it's fine. At more teams it's most of his time. At the AI stage, the bar goes through the line: 1,188 hours. That's one point four people doing nothing but upgrades.\u003c/p>\n\u003cp>These are not our measurements. It's a model: twelve hours per kubeadm upgrade, six per managed cluster, three minors a year, plus the tools. Change the inputs and the crossing moves left or right a stage. It doesn't go away, because every new cluster multiplies both parts.\u003c/p>\n\u003cp>Click. The obvious answer is to hire. A second person moves the line up to 1,700. The second cloud uses 95 percent of both their years. Hiring buys one stage.\u003c/p>\n\u003cp>And look at what's inside the bars. From the AI stage on, the tools cost more than the clusters. So fixing kubeadm alone isn't enough.\u003c/p>\n\u003cp>So what do the people with three hundred clusters do?\u003c/p>","plan":{}},"overrun-ten":{"title":"One person's year runs out","notes":"\u003cp>Here's that sum.\u003c/p>\n\u003cp>Each bar is one of the six steps from the map: day one, then DR, EKS, more teams, AI, the second cloud. The height is the hours a year of upgrade work, done the way we do it today. The lower part is cluster upgrades; the upper part is rolling out the tools on them.\u003c/p>\n\u003cp>The orange line is his year. Not all of it: about half, 850 hours, because he also has tickets, on-call and projects.\u003c/p>\n\u003cp>For three steps it's fine. At more teams it's most of his time. At AI the bar goes through his line: 1,188 hours, one point four people doing nothing but upgrades. The hatched part is the work his year can't hold.\u003c/p>\n\u003cp>These are not our measurements. It's a model: twelve hours per kubeadm upgrade, six per managed cluster, an hour and a half per tool per cluster, three minors a year. The inputs are in the deck's assets folder. Change them and the crossing moves a step left or right. It doesn't go away, because every new cluster multiplies both parts.\u003c/p>\n\u003cp>Click. The obvious answer is to hire. A second person moves the line to 1,700 hours, and the second cloud uses ninety-five percent of both their years. Hiring buys one step.\u003c/p>\n\u003cp>And look inside the bars. From AI on, the tools cost more than the clusters. So fixing kubeadm alone isn't enough.\u003c/p>\n\u003cp>So what do the people with three hundred clusters do?\u003c/p>","plan":{"Act":"II","Job":"the turn: the work outgrows the person, and hiring only buys a stage","Headline":"Keep doing it this way, and one person's year runs out at the AI stage.","Visual":"stacked bars per stage (clusters haze, tools mint) against his 850 h line; the","Energy":"4","Into next":"so what do the people with three hundred clusters do?","Data":"illustrative model, see Editorial notes"}},"same-person":{"title":"Same person, same fleet","notes":"\u003cp>Here's where we started: two clusters and one person with a runbook.\u003c/p>\n\u003cp>And here's the same estate from six slides ago. Twenty-eight clusters, three kinds of place, people and agents using all of it. The same one person.\u003c/p>\n\u003cp>What changed is what he does. He doesn't walk each cluster through a runbook any more. He approves a wave, and the pipeline runs it: test, canary, wave one, wave two, prod, with a gate between each, inside the window, rolling itself back if a gate fails. Every cluster on the map is lit because every one of them is on the version the pipeline delivered, not the version someone got round to.\u003c/p>\n\u003cp>That's fourteen times the clusters with the same person, and that's the ratio the fleets at KubeCon run at. Meta runs about a hundred clusters with fifteen engineers.\u003c/p>\n\u003cp>Four things get us there.\u003c/p>","plan":{}},"same-person-ten":{"title":"Same person, same fleet","notes":"\u003cp>Here's the picture we started with: one person, two clusters, and twenty-six dashed outlines still to come.\u003c/p>\n\u003cp>They came. Twenty-eight clusters, the same row. And the same one person.\u003c/p>\n\u003cp>What changed is what he does. He doesn't walk each cluster through a runbook any more. He approves a wave, and the pipeline runs it: test, canary, wave one, wave two, prod, with a gate between each, inside the window, rolling itself back if a gate fails. Every cluster is lit because every one is on the version the pipeline delivered, not the version someone got round to.\u003c/p>\n\u003cp>Fourteen times the clusters with the same person only works because he isn't doing the work by hand. For scale, Meta runs about a hundred clusters with about fifteen engineers.\u003c/p>\n\u003cp>Here's what gets us there.\u003c/p>","plan":{"Act":"III","Job":"close: echo the opening row, changed","Headline":"Same person, fourteen times the clusters: now he approves waves, and the pipeline runs them.","Visual":"the row from slide 1, all 28 lit mint, cut by gates into test, canary, wave","Energy":"4","Into next":"here's what gets us there."}},"second-cloud":{"title":"A second cloud","notes":"\u003cp>The last step. When AWS has a bad day in a region, so do we. So a second provider joins, and apps start moving into it: some off our own hardware, some out of AWS.\u003c/p>\n\u003cp>That's normal at this scale. Nearly every large fleet at the show was hybrid or multi-cloud. GEICO put it plainly: no single cloud had enough of what they needed.\u003c/p>\n\u003cp>Now pull back and look at the whole thing. Twenty-eight clusters. Three kinds of place, three upgrade procedures. About a hundred and forty apps. People and agents using all of it.\u003c/p>\n\u003cp>Six reasonable steps. Every one of them made sense on the day. And there's still one person in orange.\u003c/p>\n\u003cp>Now look at what one upgrade costs him.\u003c/p>","plan":{}},"the-ask":{"title":"The ask","notes":"\u003cp>Four things, and the first two are the ones I'm asking for today.\u003c/p>\n\u003cp>One: no new hand-built clusters. New clusters in AWS are EKS Auto Mode; new clusters on-prem come from Cluster API. kubeadm is still there underneath, but the runbook retires.\u003c/p>\n\u003cp>Two: one tool through the pipeline this quarter, and I'd start with the Splunk OTel collector. It's on every cluster, we can see from Splunk whether its data is arriving, so its gate is easy to write, and it's the layer we just talked about. Waves, gates, automatic rollback. Once it works, Argo CD, Prometheus and Karpenter follow the same path.\u003c/p>\n\u003cp>Three: change windows as a policy. One window, stored in the cluster, that Argo CD and Kyverno both read.\u003c/p>\n\u003cp>Four: the OTel collector on every cluster, AI workloads included, feeding one read-only lake that the agents read instead of holding production credentials.\u003c/p>\n\u003cp>The fleet is going to keep growing whatever we decide. The only question is whether the person in orange grows with it, or gets out of the way of it. Thanks.\u003c/p>","plan":{}},"the-ask-ten":{"title":"The ask","notes":"\u003cp>Four things, and the first two are the ones I'm asking for today.\u003c/p>\n\u003cp>One: no new hand-built clusters. New clusters in AWS are EKS Auto Mode; new clusters on-prem come from Cluster API. kubeadm is still there underneath, but the runbook retires.\u003c/p>\n\u003cp>Two: one tool through the pipeline this quarter, and I'd start with the Splunk OTel collector. It's on every cluster, we can see from Splunk whether its data is arriving, so its gate is easy to write, and it's the layer we just talked about. Waves, gates, automatic rollback. Once it works, Argo CD, Prometheus and Karpenter follow the same path.\u003c/p>\n\u003cp>Then, three: change windows as a policy. One window, stored in the cluster, that Argo CD and Kyverno both read.\u003c/p>\n\u003cp>And four: the OTel collector on every cluster, AI workloads included, feeding one read-only lake that the agents read instead of holding production credentials.\u003c/p>\n\u003cp>One caveat before anyone quotes the hours: the chart was a model, not our measurements. The first job of the pilot is to replace it with real numbers.\u003c/p>\n\u003cp>The fleet is going to keep growing whatever we decide. The only question is whether the person in orange grows with it, or gets out of its way. Thanks.\u003c/p>","plan":{"Act":"III","Job":"the ask, small enough to say yes to in the room","Headline":"Stop building clusters by hand, and put one tool through the pipeline this quarter.","Visual":"a route of four camps. 1 and 2 lit in alpenglow and roped solid, set large:","Energy":"3","Into next":"end"}},"the-lake":{"title":"The read-only lake","notes":"\u003cp>Everything that layer collects has to land somewhere the agents can read, and where it lands matters more than which tool it is.\u003c/p>\n\u003cp>Three streams come down, one from each path. From the fleet: cluster state, snapshotted into a database, plus metrics. From delivery: every sync, every rollout, every gate result. From the agents themselves: their traces and tool calls. They all run into one lake.\u003c/p>\n\u003cp>The agents sit on the shore and read. That's how they decide things: is this alert real, did this canary actually get worse, which hour is quiet enough to upgrade this cluster.\u003c/p>\n\u003cp>And here's the rule. There's no path from the shore back up to production. Read-only extraction is what lets us say yes to agents analysing prod without saying yes to agents holding prod credentials. That's a security control, not just plumbing.\u003c/p>\n\u003cp>Let me be honest about the limit. Mastercard argued the other side at the show: a lake is a snapshot, and a stale index can mislead a model. They let theirs call live APIs through a narrow, audited tool instead. They're right for live decisions. So: the lake for triage and trends; a gate in the middle of a rollout reads live metrics through one narrow tool. NVIDIA and Workday added the other lesson: raw telemetry confuses models, so put a typed query layer over the lake.\u003c/p>\n\u003cp>So here's the same person, with the same fleet.\u003c/p>","plan":{}},"tools-too":{"title":"Four tools, four trains","notes":"\u003cp>Every one of those clusters also runs the platform: Argo CD to deploy, Prometheus to measure, the Splunk OTel collector to ship telemetry, and Karpenter to scale nodes on the cloud clusters.\u003c/p>\n\u003cp>Each of those has its own release train. Prometheus ships a minor about every six weeks. Argo CD about every three months. The OTel collector every few weeks. Karpenter every month or two. Those are rough, and they don't line up with each other or with Kubernetes.\u003c/p>\n\u003cp>So here's the fleet, twenty-eight clusters across the top, the four tools down the side. Each square is how far that cluster's copy is behind the latest release. Dark is current. Pale is one behind. Hollow is two or more. Dashed means nobody's quite sure without logging in. The blanks are Karpenter on our own hardware, where it doesn't run.\u003c/p>\n\u003cp>This is what hand rollouts leave behind. Not because anyone's careless: because each release is another twenty-odd rollouts by hand, and the next release lands before the last one's finished. The grid is illustrative, but anyone who's run a fleet will recognise it.\u003c/p>\n\u003cp>Now add the clusters and the tools together, and put them against one person's year.\u003c/p>","plan":{}},"two-clusters":{"title":"Two clusters, one person","notes":"\u003cp>Let's start small, because we did.\u003c/p>\n\u003cp>A team, a handful of people, and two clusters on our own hardware. One to test on, one to run on. We built them with kubeadm, by hand, and that was the right call at the time.\u003c/p>\n\u003cp>And there's one person (that's him, in orange, with the runbook) who knows how to upgrade them. Three times a year, Kubernetes ships a new minor version, and he walks both clusters through it. It takes him a couple of days. Nobody else notices.\u003c/p>\n\u003cp>Keep an eye on him. He's in every picture from here on.\u003c/p>\n\u003cp>Then prod became important enough to need a twin.\u003c/p>","plan":{}},"waves":{"title":"Tools ship in waves","notes":"\u003cp>That's the clusters. The tools on them need the same treatment, and the fix is the one we already use for apps.\u003c/p>\n\u003cp>Read the picture from the left. The middle of the ripple is the test cluster. The next ring is one canary cluster: real workloads, real traffic, but just one. Then the prod fleet in waves: wave one, wave two, and the rest of prod. A new version of a platform tool, say a new Argo CD, starts in the middle and moves outward one ring at a time.\u003c/p>\n\u003cp>How. One definition per tool, an ApplicationSet, and progressive sync takes it one wave at a time. Which wave a cluster is in is a label on the cluster, not a list in a pipeline, so when cluster twenty-nine shows up it just gets a label and it's in.\u003c/p>\n\u003cp>And one train we can get off entirely. On EKS Auto Mode clusters, the outlined ones, AWS runs Karpenter itself. The cheapest rollout is the one somebody else does.\u003c/p>\n\u003cp>LinkedIn does this for their cluster services and took a release from about a week of manual testing to about an hour.\u003c/p>\n\u003cp>But a ring only moves outward when the tool proves itself.\u003c/p>","plan":{}}},"narrativeOrder":["fleet-outgrows","estate-grows","every-cluster-multiplies","overrun-ten","kubeadm-past-ten","gates-ten","change-windows-ten","one-layer-one-lake","same-person-ten","the-ask-ten"],"kit":"1.0.0"};</script>
