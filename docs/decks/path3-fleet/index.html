<script>window.DECK = {"deck":"path3-fleet","title":"Path 3: The fleet is going to get big","draft":"ten","drafts":{"main":["cold-open","fleets","grows-regardless","third-platform","gap-closed","cattle","upgrade-policy","ship-the-check","two-problems","live-live","thirty-first","four-stages","the-seam","paved-road","restore","the-ask"],"with-index":["cold-open","fleets","grows-regardless","third-platform","gap-closed","cattle","upgrade-policy","ship-the-check","two-problems","live-live","thirty-first","four-stages","the-seam","paved-road","restore","the-ask","tool-index","ti-capi","ti-karmada","ti-traffic","ti-velero","ti-secrets","ti-otel","ti-opencost","ti-nfm","ti-crossplane","ti-kro","ti-scaling","ti-backstage"],"ten":["cold-open","fleet-grows","two-of-everything","cattle-on-a-clock","ship-the-check-ten","region-is-a-sum","thirty-first-ten","the-route","restore-ten","the-ask-ten"]},"size":[1920,1080],"slides":{"cattle":{"title":"Cattle, not pets","notes":"\u003cp>So we stay on EKS, and here's the first design rule for a big fleet: clusters are cattle, not pets.\u003c/p>\n\u003cp>On the left, a pet. It has a name people know by heart. It was built by hand, it's been patched by hand, and nobody is quite sure they could recreate it from scratch. So nobody wants to upgrade it.\u003c/p>\n\u003cp>On the right, cattle. Identical, numbered, created from code, replaceable. If one is sick, you rebuild it.\u003c/p>\n\u003cp>Three rules make that real. Every cluster is created and upgraded from code, using Auto Mode with CDK or Crossplane: no cluster that nobody can recreate. New clusters default to EKS Auto Mode, which pushes node patching and upgrades to AWS; the management fee costs less than the engineer-hours we spend on node groups, and we keep self-managed Karpenter only where Auto Mode doesn't fit, like exotic GPU shapes. And we push platform add-ons off our nodes where we can: trial EKS Capabilities, managed Argo CD, ACK and kro, against self-hosting. Fewer controllers on our nodes means fewer things to upgrade.\u003c/p>\n\u003cp>Cattle still need upgrading, and that has to stop being a project.\u003c/p>","plan":{}},"cattle-on-a-clock":{"title":"Cattle on a clock","notes":"\u003cp>The first design rule for a big fleet: clusters are cattle, not pets.\u003c/p>\n\u003cp>This is a cluster's clock. Every EKS minor version gets fourteen months of standard support. Inside that window the control plane costs about ten cents an hour per cluster, around seventy-three dollars a month.\u003c/p>\n\u003cp>On the cheap side, the herd. Identical, numbered, built from code with CDK or Crossplane, so any one of them can be rebuilt. New clusters default to EKS Auto Mode, which pushes node patching and upgrades to AWS; we keep self-managed Karpenter only where Auto Mode doesn't fit, like exotic GPU shapes. And every cluster is upgraded before month fourteen, by a named owner, because the policy says so, not because someone remembered.\u003c/p>\n\u003cp>Click. On the other side, the pet. It has a name everybody knows. It was built by hand and patched by hand, and nobody is sure they could recreate it, so nobody wants to upgrade it. It drifts past month fourteen into extended support, about sixty cents an hour, around four hundred and forty dollars a month, per cluster: six times as much. Those fees come from third-party write-ups, so we check the pricing page before anyone quotes them. But the shape is the point: a missed upgrade is now a line on the bill, not just a risk.\u003c/p>\n\u003cp>Skip-level upgrades, what LinkedIn did, make the window easier to hit. And we should measure our own toil, hours per EKS minor last year, so this argument carries our number, not just theirs.\u003c/p>\n\u003cp>Cattle get upgraded in bulk, so every change needs its own proof.\u003c/p>","plan":{"Act":"II","Job":"the first design rule, with its cost attached: clusters built from code and upgraded by policy","Headline":"Clusters are cattle: built from code, and upgraded inside their 14 months by policy.","Visual":"a clock of support months, 0 to 22. Standard support to month 14 at $0.10 an hour; past it, extended support at $0.60 ⚠️, a step on the line. The herd of identical glyphs sits on the cheap side; one pet, named and patched by hand, sits on the step","Energy":"3","Into next":"cattle are upgraded in bulk, so every change needs its own proof.","Source":"`EKS-VS-ECS.md` §4 rules 1–4; ⚠️ fee from third-party write-ups","Status":"merged from `cattle` + `upgrade-policy`"}},"cold-open":{"title":"Forty days to seven","notes":"\u003cp>Forty squares. Each one is a business day. That's how long it used to take LinkedIn to move production across three Kubernetes minor versions, 1.31 to 1.34: six fleet waves, one minor at a time.\u003c/p>\n\u003cp>This year it took seven. Same fleet, one rollout. The newer control-plane binaries emulate the older minor's behaviour, which is KEP-4330, so three minors become one wave instead of six.\u003c/p>\n\u003cp>That's what upgrade toil looks like when someone attacks it directly. And they weren't unusual. Look at who else was presenting.\u003c/p>","plan":{"Act":"I","Job":"open on the number that makes upgrade toil felt, and name the talk","Headline":"LinkedIn took production from 1.31 to 1.34 in seven business days. It used to take forty.","Visual":"forty day-squares in two rows, seven of them lit. The deck title and presenters small at the foot","Energy":"4","Into next":"and they're not unusual. Look at who else was presenting, and where we sit.","Source":"LinkedIn, \"Binary Version Is Not Behavior\" (KEP-4330), deck p.2","Status":"kept as is (shared with `main`)"}},"fleet-grows":{"title":"The fleet grows","notes":"\u003cp>They weren't unusual. These are the fleet sizes companies disclosed from the stage this year, each from their own title, abstract or deck, with one exception.\u003c/p>\n\u003cp>Salesforce, a thousand clusters. LinkedIn, three hundred, on bare metal. Meta, about a hundred, run by about fifteen engineers. Hertz, eighty. Coinbase, seventy-nine. Mastercard, thirty EKS clusters. Verkada, nine. It's a log scale so the small ones still show. None of them is single-cluster, and none of them upgrades by hand.\u003c/p>\n\u003cp>The bracket is us: regulated, EKS plus on-prem, in the middle of the table next to Hertz, Coinbase and Mastercard. Our split isn't an awkward halfway state. It's the normal shape of a fleet our size.\u003c/p>\n\u003cp>Click. And we're climbing. Look at what we already brought home as the plan: live-live across two regions, agent pods and their sandboxes from Path 2, GPU pools, on-prem sites joining through Hybrid Nodes, Crossplane writing app infrastructure, plus the Argo and canary work from Path 1. Every one of those lands on Kubernetes. None of it runs on ECS. So the fleet grows whatever we decide.\u003c/p>\n\u003cp>If anyone asks about Hertz: we heard eighty in the room; their abstract only says \"fleet scale\". Everything else is public.\u003c/p>\n\u003cp>Which makes the question we keep getting, \"EKS or ECS?\", the wrong question.\u003c/p>","plan":{"Act":"I","Job":"make \"fleet toil is unsustainable\" evidence, place us in it, and show the growth is already committed","Headline":"Our fleet grows either way, toward the sizes nobody upgrades by hand.","Visual":"the ridge of disclosed fleet sizes on a log scale (Salesforce 1,000 · LinkedIn 300 · Meta ~100 · Hertz 80 ⚠️ · Coinbase 79 · Mastercard 30 · Verkada 9), our shape bracketed under the mid-table three, and a haze arrow from our bracket up the table carrying the roadmap items that put more clusters on Kubernetes. No height or number for us","Energy":"3","Into next":"so \"EKS or ECS?\" is the wrong question.","Source":"GOALS §0.1; `EKS-VS-ECS.md` §1","Status":"merged from `fleets` + `grows-regardless`"}},"fleets":{"title":"Fleet sizes","notes":"\u003cp>They weren't unusual. These are the fleet sizes companies disclosed from the stage this year, every one from their own title, abstract or deck, with one exception.\u003c/p>\n\u003cp>Salesforce, a thousand clusters. LinkedIn, three hundred, on bare metal. Meta, about a hundred, run by about fifteen engineers. Hertz, eighty. Coinbase, seventy-nine in production. Mastercard, thirty EKS clusters. Verkada, nine. Heights are a log scale so the small fleets still show.\u003c/p>\n\u003cp>None of them is single-cluster, and none of them upgrades by hand.\u003c/p>\n\u003cp>The bracket is us: regulated, EKS plus on-prem, alongside Hertz, Coinbase and Mastercard. Our on-prem plus EKS split isn't an awkward transitional state; it's the normal shape of a fleet our size. The patterns these teams use are available to us.\u003c/p>\n\u003cp>Expect the Hertz question: Kyle heard eighty in the room; the abstract only says \"fleet scale\". Everything else is public.\u003c/p>\n\u003cp>And ours is going to grow, whatever we decide.\u003c/p>","plan":{}},"four-stages":{"title":"Four stages","notes":"\u003cp>That's the summit. Here's the route: four stages, and the first one is nearly free.\u003c/p>\n\u003cp>Stage 1, starting now: cluster labels become an API. That's a schema, an owner, and a policy that won't let a cluster join the fleet without its labels. It costs a few days of agreement, not a tool.\u003c/p>\n\u003cp>Stage 2: fleet delivery in waves, ApplicationSets with rolling sync, which we share with Path 1's stage D. Stage 3: lifecycle. Auto Mode as the default for new clusters, the support window as a policy, and Hybrid Nodes piloted at one on-prem site so on-prem and EKS become one control-plane model. Stage 4: Crossplane for the infrastructure app teams own, starting with S3.\u003c/p>\n\u003cp>Why stage 1 first? Three things wait on it. Path 1's fleet waves select on cluster labels. The thirty-first cluster only joins itself if its labels exist. And developers only stop naming clusters when there's a vocabulary to use instead.\u003c/p>\n\u003cp>Stage 4 needs one line drawn before anyone builds on it.\u003c/p>","plan":{}},"gap-closed":{"title":"The gap closed","notes":"\u003cp>The old argument for ECS was that it's simpler. That was true in 2022. It isn't now.\u003c/p>\n\u003cp>EKS Auto Mode went GA in December 2024; ECS Managed Instances in the autumn of 2025. Side by side, they're the same product shape. AWS runs and patches the nodes on both. Both charge EC2 plus a per-instance management fee; we need to check the actual fee levels on the pricing pages before anyone quotes a number. And when AWS cut GPU fees in July this year, they cut them on both, on the same day.\u003c/p>\n\u003cp>So what's left is the API. EKS has managed Argo CD, ACK and kro running in the AWS control plane; ECS has nothing comparable. Nearly everything we'd run alongside our apps ships as a Helm chart first; on ECS each one becomes a task definition we write and maintain. And Kubernetes runs on-prem and in every other cloud; ECS runs on AWS.\u003c/p>\n\u003cp>For us, the Kubernetes API is the asset, not the cost. So we stay on EKS. Here's how to run a big one.\u003c/p>","plan":{}},"grows-regardless":{"title":"It grows either way","notes":"\u003cp>And ours is going to grow, whatever we decide about anything else.\u003c/p>\n\u003cp>Look at what we've already committed to, or brought home as the plan. Live-live across two EKS regions. Agent pods and their sandboxes, from Path 2. The Argo, policy and canary work from Path 1. Crossplane and kro writing app infrastructure. GPU pools for isolation. On-prem sites joining through Hybrid Nodes.\u003c/p>\n\u003cp>Every single one of those lands on Kubernetes. None of them runs on ECS. So the fleet grows on its own: more clusters for isolation, for regions, for GPU pools, for on-prem sites and for agent sandboxes. Solid is what we run today; dashed is where the roadmap puts us.\u003c/p>\n\u003cp>Every hour spent standing up a second orchestrator is an hour not spent on the fleet tooling we need anyway.\u003c/p>\n\u003cp>So the question people keep asking us, \"EKS or ECS?\", is the wrong question.\u003c/p>","plan":{}},"live-live":{"title":"Losing a region","notes":"\u003cp>\"No user-visible downtime\" isn't a number. It's a sum, and the slowest part of it is what the customers see.\u003c/p>\n\u003cp>Four layers. Delivery is solved: ApplicationSets already put the same app in both regions, so a scheduler buys us nothing here.\u003c/p>\n\u003cp>Traffic: something has to notice the region is gone, and the change has to propagate. Then clients keep the old DNS answer cached for as long as they like, which lands inside our recovery time and is out of our control. That's why we recommend AWS Global Accelerator at the edge: it takes the DNS cache off the clock. That's our recommendation, to be clear, not something we saw presented.\u003c/p>\n\u003cp>State: we can't fail traffic over faster than the data. Aurora Global or DynamoDB global tables have to converge in the surviving region, and doing it in the other order is how writes split.\u003c/p>\n\u003cp>Capacity: the survivor inherits a hundred percent of traffic at fifty percent of its size. Either we pay for permanent double headroom, and this lane is zero, or Karpenter's scale-up time is formally part of our RTO.\u003c/p>\n\u003cp>The lengths are illustrative. Measuring them is decision 2b. And the developer-facing half of multi-cluster is the part nobody budgets.\u003c/p>","plan":{}},"paved-road":{"title":"Road before portal","notes":"\u003cp>Above the seam, developers still have no road. We have no internal developer platform today, so every team invents its own way to deploy.\u003c/p>\n\u003cp>Here are the options, laid out by how much of Kubernetes they hide. A portal like Backstage, Port or Cortex: a catalog, golden-path templates and scorecards; Backstage was a full day of the show, and it's a TypeScript application we'd own and staff, not a weekend install. A workload spec like Score or OpenChoreo: one portable file per workload. An orchestrator like Humanitec or Kratix: declare what a workload needs and the platform wires it. And at the far end, a PaaS: push code, get an app; Salesforce runs on Heroku.\u003c/p>\n\u003cp>Our lean is the far left: a paved road with no portal yet. Templates in Git, ApplicationSets, the cluster-label vocabulary, and policy-enforced defaults. As one talk put it, you probably already have one. It's useful on day one, and it keeps every portal option open.\u003c/p>\n\u003cp>Every company that made deploying boring standardised the path first. The portal came afterwards, as a window onto it.\u003c/p>\n\u003cp>Last, the floor under all of it.\u003c/p>","plan":{}},"region-is-a-sum":{"title":"Losing a region","notes":"\u003cp>Multi-cluster has a second problem that looks like fleet toil and isn't: losing a region. Confusing the two is how you end up buying a scheduler for a traffic problem.\u003c/p>\n\u003cp>\"No user-visible downtime\" isn't a number. It's a sum of delays, and customers see the slowest one.\u003c/p>\n\u003cp>Placement is solved. ApplicationSets already run the same app in both regions. Click. And that's the only lane a multi-cluster scheduler like Karmada shortens. Karmada is good, Bloomberg runs it in production, but it stays on our watch list until we can name a workload that needs scheduling rather than placement. That's decision 2: which production workloads can't run active-active? If that list is empty, the decision closes.\u003c/p>\n\u003cp>The long lanes are somewhere else. Traffic: something has to notice the region is gone, and the change has to propagate. Then clients keep the old DNS answer cached as long as they like, which lands inside our recovery time and out of our control. That's why we recommend AWS Global Accelerator at the edge: it takes the DNS cache off the clock. Our recommendation, to be clear, not something we saw presented.\u003c/p>\n\u003cp>State: we can't fail traffic over faster than the data. Aurora Global or DynamoDB global tables have to converge in the survivor, and doing it in the other order is how writes split.\u003c/p>\n\u003cp>Capacity: the survivor inherits a hundred percent of traffic at half its size. Either we pay for permanent double headroom and this lane goes to zero, or Karpenter's scale-up time is formally part of our RTO.\u003c/p>\n\u003cp>The lengths are illustrative; measuring them is decision 2b. And placement being solved is the setup for the best slide in this deck.\u003c/p>","plan":{"Act":"II","Job":"split surviving a region from fleet management, and show \"no visible downtime\" is a sum","Headline":"Losing a region is a sum of delays, and the scheduler's lane is already solved.","Visual":"four lanes as time bars. Placement is a sliver marked solved, and it is the only lane a scheduler like Karmada works on. Traffic (detect, propagate, the client DNS cache struck off by Global Accelerator), state (data converges in the survivor) and capacity (the survivor scales from half to full) run long; the RTO line stands at the slowest lane's end","Energy":"3","Into next":"placement being solved is the setup for the best slide in the deck.","Source":"GOALS §5.1, §5.1B. Lengths illustrative; Global Accelerator is our recommendation","Status":"merged from `two-problems` + `live-live`"}},"restore":{"title":"Restore","notes":"\u003cp>Last, the floor under all of it, and the one area where being wrong is unrecoverable.\u003c/p>\n\u003cp>Backups are a rumor until we restore one.\u003c/p>\n\u003cp>Three steps, in order. Retain: audit every storage class, because Delete is the default reclaim policy and it's the wrong one for data we care about. Back up: Velero on a schedule, with consistent, incremental snapshots, and nothing bespoke, because there's now a Kubernetes data protection working group standardising exactly this. Drill: restore into a scratch cluster on a calendar, and time it.\u003c/p>\n\u003cp>The drill matters more than the backup. A cluster we can rebuild and restore is a cluster we're willing to upgrade aggressively, which is the whole deck.\u003c/p>\n\u003cp>And one cheap alert: etcd database size at fifty and seventy-five percent. AWS showed how pod status churn alone can push a cluster read-only with zero crashed nodes. Catch it in days, not minutes.\u003c/p>\n\u003cp>So, five decisions.\u003c/p>","plan":{}},"restore-ten":{"title":"Restore","notes":"\u003cp>The floor is the one area where being wrong is unrecoverable.\u003c/p>\n\u003cp>Backups are a rumor until we restore one. Pause.\u003c/p>\n\u003cp>Three steps, in order. Retain: audit every storage class, because Delete is the default reclaim policy, and it's the wrong one for data we care about. Back up: Velero on a schedule, with consistent, incremental snapshots, and nothing bespoke, because there's now a Kubernetes data protection working group standardising exactly this.\u003c/p>\n\u003cp>And the one that's lit: drill. Restore into a scratch cluster on a calendar, and time it. The drill matters more than the backup. A cluster we can rebuild and restore is a cluster we're willing to upgrade aggressively, and that's the whole deck.\u003c/p>\n\u003cp>One cheap extra while we're down here: alert on etcd database size at fifty and seventy-five percent. AWS showed how pod status churn alone can push a cluster read-only with zero crashed nodes. That alert catches it in days, not minutes.\u003c/p>\n\u003cp>So, five decisions.\u003c/p>","plan":{"Act":"III","Job":"the one area where being wrong is unrecoverable; a breather before the ask","Headline":"Backups are a rumor until we restore one.","Visual":"the headline set large, and under it a short trail of three camps, retain and back up as outlines, drill lit: restore into a scratch cluster on a calendar, and time it. A low far ridge along the foot: the floor","Energy":"2","Into next":"so, five decisions.","Source":"GOALS §8; Velero project update (Red Hat); Data Protection WG","Status":"forked edit of `restore` (one trail, drill lit; the etcd alert moves to the notes)"}},"ship-the-check":{"title":"Ship the check","notes":"\u003cp>The third design rule has nothing to do with AI, and it's the best template we saw all week for anything we'll later want a machine to drive.\u003c/p>\n\u003cp>Ship every change together with the check that fails without it. NVIDIA had two kernel CVEs to fix, twice in one week, across EKS, GKE, AKS, OKE and on-prem. The fix shipped with its own check, the check fails until the fix has really landed on that node, and every node reports a status.\u003c/p>\n\u003cp>So the picture on the right is the audit. Every square is a node, about fifty-six hundred of them. Most are verified, a few are still pending, and one failed and is being retried. Where the fleet stands is a kubectl get, not a spreadsheet someone fills in. They converged about fifty-six hundred nodes in thirty minutes.\u003c/p>\n\u003cp>The status mix here is illustrative; the pattern is theirs.\u003c/p>\n\u003cp>That's fleet toil. Multi-cluster has a second problem that looks similar and isn't.\u003c/p>","plan":{}},"ship-the-check-ten":{"title":"Ship the check","notes":"\u003cp>The second design rule is how you know a bulk change actually landed. It has nothing to do with AI, and it's the best template we saw all week for anything we'll later want a machine to drive.\u003c/p>\n\u003cp>Ship every change together with the check that fails without it. NVIDIA had two kernel CVEs to fix in one week, across clouds and on-prem. The fix shipped with its own check, the check fails until the fix has really landed on that node, and every node reports a status.\u003c/p>\n\u003cp>So the picture on the left is the audit. Every square is a node, about fifty-six hundred of them, converged in thirty minutes across sixteen clusters. Most are verified, a few are still pending, and one failed and is being retried. The status mix is illustrative; the pattern and the numbers are theirs.\u003c/p>\n\u003cp>And on the right is how they read it: one kubectl get on their rollout object. Status in progress, forty-eight eighty of five thousand nodes complete. Done is an enum value on the resource, and the nodes that need attention are the failed Jobs. Where the fleet stands is a query, not a spreadsheet someone fills in. Their own line for what came next: the next CVE is a YAML change.\u003c/p>\n\u003cp>That's fleet toil. Losing a region looks like the same problem, and it isn't.\u003c/p>","plan":{"Act":"II","Job":"the automation pattern that has nothing to do with AI","Headline":"Ship every change with the check that fails without it, so `kubectl get` is the audit.","Visual":"NVIDIA's field of about 5,600 node squares, nearly all verified, a few pending, one failed and retrying (the mix is illustrative). Beside it, ~5,600 set large (30 minutes, 16 clusters), and their real `kubectl get nodewright` row (`in_progress`, `4880/5000`) from deck p5, columns trimmed: the audit is a query","Energy":"3","Into next":"that's fleet toil. Losing a region looks like the same problem, and isn't.","Source":"\"5,000 Nodes in Minutes, Twice in a Week\" (NVIDIA); `deck-assets/12-fleet-node-changes`","Status":"forked edit of `ship-the-check` (the three text blocks became one number and NVIDIA's own `kubectl get` output)"}},"the-ask":{"title":"The ask","notes":"\u003cp>We opened with forty days becoming seven. The ask is to make that our policy rather than someone else's exception.\u003c/p>\n\u003cp>Five decisions. E1: EKS is our container orchestrator, and new ECS workloads need a written exception. E2: new clusters default to Auto Mode, with self-managed Karpenter only where it doesn't fit. E3: no cluster ever enters extended support, and every cluster has a named owner. Then the cluster-label schema needs an owner today, because it's stage 1 and three things wait on it. And decision 2: the list of production workloads that can't run active-active, named and counted. If that list is empty, Karmada stays on the watch list and the decision closes.\u003c/p>\n\u003cp>And one thing we're starting unless someone objects: a skip-level upgrade pilot in non-prod this quarter, paired with a timed restore drill, so we're willing to upgrade aggressively.\u003c/p>","plan":{}},"the-ask-ten":{"title":"The ask","notes":"\u003cp>We opened with forty days becoming seven. The ask is to make that our policy rather than someone else's exception.\u003c/p>\n\u003cp>Five decisions. E1: EKS is our container orchestrator, and new ECS workloads need a written exception. E2: new clusters default to Auto Mode, with self-managed Karpenter only where it doesn't fit. E3: no cluster ever enters extended support, and every cluster has a named owner. Then the cluster-label schema needs an owner today, because it's stage 1 and three things wait on it. And decision 2: the list of production workloads that can't run active-active, named and counted. If that list is empty, Karmada stays on the watch list and the decision closes.\u003c/p>\n\u003cp>And one thing we're starting unless someone objects: a skip-level upgrade pilot in non-prod this quarter, paired with a timed restore drill, so we're willing to upgrade aggressively.\u003c/p>\n\u003cp>The fleet is going to get big whatever we decide. Let's spend the effort making it cattle, not on a second orchestrator. Thank you.\u003c/p>","plan":{"Act":"III","Job":"the ask, echoing forty days becoming seven","Headline":"Standardise on EKS, default to Auto Mode, and name an owner for the label schema.","Visual":"the forty-square strip from the opening as one row, labelled \"policy, not exception\", above five decisions with our lean: E1 EKS standard, E2 Auto Mode default, E3 never in extended support, 2c the label-schema owner, 2 the can't-be-active/active list. One line under them: what starts unless someone objects","Energy":"4","Into next":"end","Status":"forked edit of `the-ask` (larger type, one-row strip)"}},"the-route":{"title":"Four stages","notes":"\u003cp>Four stages, and the first one is nearly free.\u003c/p>\n\u003cp>Stage 1, starting now: cluster labels become an API. A schema, an owner, and a policy that won't let a cluster join the fleet without its labels. It costs agreement, not a tool. And three things wait on it. Path 1's fleet waves select on cluster labels. Cluster thirty-one only joins itself if its labels exist. And developers only stop naming clusters when there's a vocabulary to use instead.\u003c/p>\n\u003cp>Stage 2: fleet delivery in waves, ApplicationSets with rolling sync, which we share with Path 1. Stage 3: lifecycle. Auto Mode as the default for new clusters, the support window as a policy, and Hybrid Nodes piloted at one on-prem site, so on-prem and EKS become one control-plane model.\u003c/p>\n\u003cp>Then the dashed line. Before anyone builds stage 4, we mark the seam. Below it, the landing zone and CDK: accounts, guardrails, VPCs, the EKS clusters themselves, things that change rarely. Above it, Crossplane and kro, starting with S3 and moving to the infrastructure app teams own, things that change constantly. Two tools fighting over one resource starts with an unmarked line. That's decision 3, and it needs a diagram with the line drawn, not a debate.\u003c/p>\n\u003cp>And above the seam we have no paved road yet. Our lean: build the road first, templates in Git and the label vocabulary, and buy a portal later, as a window onto it.\u003c/p>\n\u003cp>Before we climb, the floor under all of it.\u003c/p>","plan":{"Act":"III","Job":"the route, why stage 1 starts now, and where CDK hands off to Crossplane","Headline":"Four stages, and the first is nearly free: labels, fleet delivery, lifecycle, Crossplane.","Visual":"the haze face with four camps up it: 1 cluster labels as an API (starts now: a schema, an owner, a join policy); 2 fleet delivery in waves; 3 lifecycle (Auto Mode, the window as policy, Hybrid Nodes at one site); a dashed seam across the face (CDK below, Crossplane above, decision 3); 4 Crossplane for app-owned infrastructure, S3 first. Beside it, the three things that wait on stage 1","Energy":"3","Into next":"before we climb, the floor under all of it.","Source":"GOALS §5, §10.2, decision 3","Status":"merged from `four-stages` + `the-seam` (and one line of `paved-road`, in the notes)"}},"the-seam":{"title":"The seam","notes":"\u003cp>Stage 4 needs one line drawn before anyone builds on it. Mark the seam before we pour.\u003c/p>\n\u003cp>Read the building from the ground up. The landing zone: accounts, guardrails, org-wide scaffolding. Then CDK: VPCs, the EKS clusters themselves, shared services. Both of those change rarely.\u003c/p>\n\u003cp>Then the seam, the dashed line, where ownership hands off. Above it, Crossplane and kro, starting with S3 and moving to the infrastructure app teams own. And at the top, apps and agents, which call narrow, typed APIs rather than writing raw cloud YAML. An agent calls a typed API far more reliably than it writes CloudFormation.\u003c/p>\n\u003cp>Below the seam things change rarely; above it they change constantly. Two tools fighting over one resource starts with an unmarked line, and once it's poured, it's expensive to move.\u003c/p>\n\u003cp>This is decision 3, and it needs a diagram with the seam marked, not a debate. Nice moment from the show: two of the Crossplane contribfest slides were our own function-lifecycle work.\u003c/p>\n\u003cp>And above the seam, developers still have no road.\u003c/p>","plan":{}},"third-platform":{"title":"A third platform","notes":"\u003cp>The question isn't \"EKS or ECS\". It's \"EKS, or EKS plus ECS\". We already run Kubernetes on-prem and EKS in two regions, and everything we committed to at KubeCon lands on Kubernetes. ECS wouldn't replace anything. It would be a third container platform.\u003c/p>\n\u003cp>Across the top: deploy, policy, identity, observability, and the new one, agents operating it. On-prem and EKS share one API and one set of tools, which we're building anyway: Helm and Argo CD, CEL and Kyverno at admission and in CI, Pod Identity and IRSA, the OTel collector, and one API that every MCP tool already speaks.\u003c/p>\n\u003cp>Add ECS and every column gets a second answer. Task definitions and their own pipelines. IAM and pipeline checks, with no admission point to enforce policy. Task roles, a second identity model to audit. FireLens and CloudWatch, a second set of dashboards. And a second API surface for every agent and MCP tool, which matters more every month, because the main consumer of the platform is becoming a machine, and machines are good at one well-documented API and worse at two.\u003c/p>\n\u003cp>It's not \"some workloads get simpler\". It's two of everything, and on-call has to know both. And the old argument for ECS, that it's simpler, closed last year.\u003c/p>","plan":{}},"thirty-first":{"title":"The 31st cluster","notes":"\u003cp>This is the payoff for every rule so far.\u003c/p>\n\u003cp>On the left is what a developer writes for their app: constraints. Regions, compliance, capability, residency. Not a cluster name. On the right is the fleet, thirty clusters as identical glyphs. The lit ones are the clusters whose labels match those constraints; an ApplicationSet label selector picks them, and we already run that.\u003c/p>\n\u003cp>Click. We add cluster thirty-one. It comes up from code, policy won't let it join the fleet without its labels, and because it's in us-west-2 with PCI and GPU, the selector picks it up. The app gets deployed there.\u003c/p>\n\u003cp>Now look at the YAML on the left. It didn't move. Nobody opened a pull request against the app. Adding the thirty-first cluster cost the app team nothing.\u003c/p>\n\u003cp>That's the summit. Here's the route.\u003c/p>","plan":{}},"thirty-first-ten":{"title":"The 31st cluster","notes":"\u003cp>Placement is solved, and here's what that buys us. This is the payoff for the whole deck.\u003c/p>\n\u003cp>On the left is what a developer writes for their app: constraints. Regions, compliance, capability, residency. Not a cluster name. On the right is the fleet, thirty clusters as identical glyphs. The lit ones are the clusters whose labels match those constraints; an ApplicationSet label selector picks them, and we already run that.\u003c/p>\n\u003cp>Click. We add cluster thirty-one. It comes up from code, policy won't let it join the fleet without its labels, and because it's in us-west-2 with PCI and GPU, the selector picks it up. The app gets deployed there.\u003c/p>\n\u003cp>Click. Now look at the YAML on the left. Zero lines changed. Nobody opened a pull request against the app. Adding the thirty-first cluster cost the app team nothing.\u003c/p>\n\u003cp>Every rule so far exists to make this true. Cattle built from code, so cluster thirty-one is cheap to make. Changes that carry their own check, so it's safe to roll to. Placement by labels, so nobody has to know its name.\u003c/p>\n\u003cp>That's the summit. Here's the route up to it.\u003c/p>","plan":{"Act":"II","Job":"the peak: the payoff every rule so far exists for","Headline":"Adding the 31st cluster should cost nobody an app change.","Visual":"on the left, an app's placement YAML (regions, compliance, capability, residency). On the right, a herd of 30 numbered clusters, the label-matched ones lit. Click 1: a 31st drops in under a glow, takes its labels and lights. Click 2: the YAML card is stamped \"0 lines changed\"","Energy":"5","Into next":"that's the summit. Here's the route up to it.","Source":"`EKS-VS-ECS.md` §4 rule 5; GOALS §5.5","Status":"forked edit of `thirty-first` (glow, the diff stamp as a second click)"}},"ti-backstage":{"title":"Backstage","notes":"\u003cp>Backstage: The open-source developer portal most of the industry starts from. Where we stand: Decide after the paved road works. The catalog and the placement vocabulary carry the value, and can exist before any portal.\u003c/p>\n\u003cp>The question to ask of any portal: who maintains the plugins, and does it actually deploy anything?\u003c/p>","plan":{}},"ti-capi":{"title":"Cluster API","notes":"\u003cp>Cluster API: Clusters themselves as declarative, reconciled objects. Where we stand: The lifecycle half of fleet management, next to Auto Mode on EKS; automated fleet upgrades hang off it.\u003c/p>\n\u003cp>Delivery with ApplicationSets plus lifecycle with Cluster API is the whole answer to fleet toil.\u003c/p>","plan":{}},"ti-crossplane":{"title":"Crossplane","notes":"\u003cp>Crossplane: Cloud resources and app infrastructure as Kubernetes APIs we define. Where we stand: Trial, starting with S3, aiming at the app layer. We already contribute to function-lifecycle.\u003c/p>\n\u003cp>The real decision is the CDK-to-Crossplane seam: decision 3.\u003c/p>","plan":{}},"ti-karmada":{"title":"Karmada","notes":"\u003cp>Karmada: A genuine multi-cluster scheduler, for workloads that must move. Where we stand: Watch, until decision 2 says we have workloads that can't run active-active. If the list is empty, it stays here.\u003c/p>\n\u003cp>Our notes had Karmada as a likely adopt. The live-live analysis is what moved it to watch.\u003c/p>","plan":{}},"ti-kro":{"title":"kro","notes":"\u003cp>kro: Lightweight resource-graph composition with YAML and CEL. Where we stand: Watch. Relevant if Crossplane's weight becomes the objection, and less either-or than it looked last year. ⚠️ Check its release and stability first.\u003c/p>\n\u003cp>EKS Capabilities ships a managed kro, which is worth trying alongside the Auto Mode work.\u003c/p>","plan":{}},"ti-nfm":{"title":"Network Flow Monitor vs eBPF","notes":"\u003cp>Network Flow Monitor vs eBPF: Two ways to attribute network traffic and cost: run one, not both. Where we stand: Decision 8. ⚠️ Confirm the add-on name and pricing before enabling it fleet-wide.\u003c/p>\n\u003cp>Per-namespace egress and retransmits also make a cheap, app-agnostic canary signal. That's our idea, to test.\u003c/p>","plan":{}},"ti-opencost":{"title":"OpenCost","notes":"\u003cp>OpenCost: Cost allocation per namespace, label and team, CNCF-native. Where we stand: Trial after tag and label discipline; without labels every cost tool draws the same unattributable chart.\u003c/p>\n\u003cp>Cost at the point of deploy changes behaviour; a monthly FinOps deck doesn't.\u003c/p>","plan":{}},"ti-otel":{"title":"OpenTelemetry and Jaeger","notes":"\u003cp>OpenTelemetry and Jaeger: The default telemetry pipeline, and where cardinality cost is won or lost. Where we stand: Adopt the OTel conventions as they are. Watch the trap: switching to delta temporality breaks every rate() query.\u003c/p>\n\u003cp>Yahoo: 86% fewer series and roughly 140 thousand dollars a year saved on one cluster.\u003c/p>","plan":{}},"ti-scaling":{"title":"Karpenter, KEDA and VPA","notes":"\u003cp>Karpenter, KEDA and VPA: Nodes, signals and pod size: three layers, three tools. Where we stand: Trial KEDA on one Kafka consumer: KEDA for the signal, VPA for the size, Karpenter (or Auto Mode) for nodes.\u003c/p>\n\u003cp>Our brainstorm idea, Prometheus and Kafka lag into scaling, is exactly KEDA's job, not a custom controller.\u003c/p>","plan":{}},"ti-secrets":{"title":"External Secrets, Infisical, Vault, OpenBao","notes":"\u003cp>External Secrets, Infisical, Vault, OpenBao: A sync layer first, so the secret store becomes a reversible choice. Where we stand: Adopt ESO now; decide the store after inventorying long-lived secrets. The direction is fewer long-lived secrets at all. On no path, but on a clock.\u003c/p>\n\u003cp>Sequencing turns a strategic decision into a preference.\u003c/p>","plan":{}},"ti-traffic":{"title":"Global Accelerator, Route 53, k8gb","notes":"\u003cp>Global Accelerator, Route 53, k8gb: Three ways to move traffic off a dead region, and only one keeps DNS out of the RTO. Where we stand: Recommend Global Accelerator at the public edge with Route 53 behind it. ⚠️ Get the real failover time and the cost from AWS first.\u003c/p>\n\u003cp>Decision 2a. What settles it is whether on-prem needs the same mechanism.\u003c/p>","plan":{}},"ti-velero":{"title":"Velero","notes":"\u003cp>Velero: Backup and restore for cluster resources and volumes. Where we stand: Adopt, and put restore drills on the calendar: a backup nobody has restored is a hope.\u003c/p>\n\u003cp>Pair with reclaimPolicy Retain on stateful storage classes: the storage layer is the first line, backups the second.\u003c/p>","plan":{}},"tool-index":{"title":"Tool index","notes":"\u003cp>The appendix: every tool this path names gets one catalogue card. What it is, what sets it apart, and where we stand, with the status stamped on it: adopt, trial, decide or watch. This part is for reading afterwards, not for presenting.\u003c/p>","plan":{}},"two-of-everything":{"title":"Two of everything","notes":"\u003cp>The question isn't \"EKS or ECS\". It's \"EKS, or EKS plus ECS\". We already run two container platforms: Kubernetes on-prem, and EKS in two regions. ECS wouldn't replace either of them. It would be the third.\u003c/p>\n\u003cp>Across the top are the five jobs a platform does: deploy, policy, identity, observability, and the new one, agents operating it. Platforms one and two share one answer to each, the band you see, down to one API that every MCP tool already speaks. We're building that anyway.\u003c/p>\n\u003cp>Click. Add ECS, and every column gets a second answer, and every one of those boxes is new work. Task definitions and their own pipelines. No admission point for policy. A second identity model to audit. A second set of dashboards. And a second API for every agent and tool, which matters more each month, because the main consumer of the platform is becoming a machine, and machines are good at one well-documented API and worse at two. Two of everything, and on-call has to know both.\u003c/p>\n\u003cp>Click. The old argument for ECS was that it's simpler. That stopped being true in 2025. EKS Auto Mode went GA in December 2024, ECS Managed Instances in the autumn of 2025, and they're the same product shape: AWS runs and patches the nodes on both. When AWS cut GPU fees this July, it cut them on both, on the same day. What's left of the difference is the Kubernetes API, and for us that's the asset, not the cost.\u003c/p>\n\u003cp>So we stay on EKS. Here's how the big fleets run one.\u003c/p>","plan":{"Act":"I","Job":"the turn: ECS adds a platform rather than replacing one, and \"simpler\" no longer holds","Headline":"ECS wouldn't replace anything; it would be a third container platform.","Visual":"five jobs across the top (deploy, policy, identity, observability, agents operating it). Platforms 1 and 2, on-prem Kubernetes and EKS, share one solid haze band of tools. Platform 3, ECS, is the same five jobs again as dashed, empty alpenglow boxes. One line under it closes the \"simpler\" gap: Auto Mode and ECS Managed Instances both have AWS patch the nodes","Energy":"4","Into next":"so we stay on EKS. Here's how the big fleets run one.","Source":"`EKS-VS-ECS.md` §0, §2, §3","Status":"merged from `third-platform` + `gap-closed`"}},"two-problems":{"title":"Two problems","notes":"\u003cp>That's fleet toil. Multi-cluster has a second problem that looks similar and isn't, and confusing the two is how you end up buying a scheduler for a traffic problem.\u003c/p>\n\u003cp>Left branch: fleet toil. One definition, many clusters. The answers are ApplicationSets with progressive sync, rolling out in waves, Cluster API or Auto Mode for cluster lifecycle, and shipping the check with every change.\u003c/p>\n\u003cp>Right branch: losing a region. Both regions already run the app, so placement isn't the problem. It's traffic, state and capacity: getting users to the surviving region, keeping data consistent, and having enough room there.\u003c/p>\n\u003cp>Karmada is the real multi-cluster scheduler: placement, propagation, rescheduling. It's good, and Bloomberg runs it in production. But it sits on neither branch for us until we can name a workload that needs scheduling rather than placement. That's decision 2: which production workloads can't run active-active? If that list is empty, Karmada stays on the watch list and the decision closes.\u003c/p>\n\u003cp>The region branch first, because customers see it.\u003c/p>","plan":{}},"upgrade-policy":{"title":"Upgrades as a policy","notes":"\u003cp>Cattle still need upgrading, and the second design rule is that upgrade cadence is a policy, not a project.\u003c/p>\n\u003cp>Every EKS minor version gets fourteen months of standard support. Inside that window, the control plane costs about ten cents an hour per cluster, around seventy-three dollars a month. Miss the window and the cluster drops into extended support, at about sixty cents an hour, around four hundred and forty dollars a month, per cluster, six times as much. Those figures come from third-party write-ups, so we check the pricing page before quoting them in a meeting. But the shape is the point: a missed upgrade is now a line on the bill, not just a risk.\u003c/p>\n\u003cp>So the rule is: never enter extended support. Every cluster gets upgraded inside its window and has a named owner. Skip-level upgrades help, three minors in one rollout instead of six waves, which is what LinkedIn did. And we should measure our own toil, hours per EKS minor upgrade last year, so this argument carries our number and not just theirs.\u003c/p>\n\u003cp>And every upgrade change carries its own proof.\u003c/p>","plan":{}}},"narrativeOrder":["cold-open","fleet-grows","two-of-everything","cattle-on-a-clock","ship-the-check-ten","region-is-a-sum","thirty-first-ten","the-route","restore-ten","the-ask-ten"],"kit":"1.0.0"};</script>
