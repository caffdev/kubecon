<script>window.DECK = {"deck":"path1-deployments","title":"Path 1: Deployments as a service","draft":"ten","drafts":{"main":["day-one","abstraction-depth","peers","stage-zero","guardrails-first","canary-gate","ramps","one-label","no-cluster-names","promotion-pr","the-trade","stage-a","reloader","stage-b","freeze-windows","stages-c-d","stage-e","the-ask"],"with-index":["day-one","abstraction-depth","peers","stage-zero","guardrails-first","canary-gate","ramps","one-label","no-cluster-names","promotion-pr","the-trade","stage-a","reloader","stage-b","freeze-windows","stages-c-d","stage-e","the-ask","tool-index","ti-argocd","ti-appsets","ti-hydrator","ti-rollouts","ti-promoter","ti-kargo","ti-reloader","ti-kyverno","ti-cel","ti-falco","ti-gatewayapi","ti-istio"],"ten":["day-one-ten","peers-ten","the-button","rollback-gate","one-policy-set","promotion-pr-ten","the-trade-ten","the-route","day-one-meant","the-ask-ten"]},"size":[1920,1080],"slides":{"abstraction-depth":{"title":"What day one measures","notes":"\u003cp>Our first reaction, when we heard that quote, was this one. We are never going to let someone deploy to prod on day one. Day one, they can't find the bathroom.\u003c/p>\n\u003cp>Get the laugh. Then: that's not what they meant, and it's not what we're asking for.\u003c/p>\n\u003cp>\"Day one\" doesn't measure trust in new hires. It measures how much of our platform a person has to understand before they can ship. CVS didn't make production safer by trusting people more. They made the path so constrained that trust stopped being the variable.\u003c/p>\n\u003cp>So here's what a developer has to carry today. Click. Which cluster their app runs in. Click. When to click sync, and whether to. Click. Whether there's a change freeze on. Click. Which of our rules their manifest breaks. Click. How to roll back.\u003c/p>\n\u003cp>Every one of those has an owner later in this deck: the letter on the right is the stage that takes it off the pack. The first one belongs to Path 3, the fleet.\u003c/p>\n\u003cp>And our peers have already taken those off the pack.\u003c/p>","plan":{"Act":"I","Job":"defuse the \"new hires in prod\" objection and reframe what day one measures","Headline":"Day one measures how much of our platform a developer has to understand before they can ship.","Visual":"the joke as one small line at the top (\"Day one they can't find the bathroom.\"). Below it, the five things a developer has to know today, stacked like a pack, each tagged with the stage that takes it off","Energy":"3","Into next":"our peers have already taken those off the pack."}},"canary-gate":{"title":"Canary with analysis","notes":"\u003cp>If you remember one mechanism from this deck, make it this one.\u003c/p>\n\u003cp>A Rollout is the workload's spec, in Git. It sends a share of traffic to the new version and pauses. An AnalysisRun queries a metric, error rate or latency, and judges it against a threshold we wrote down in advance.\u003c/p>\n\u003cp>Click. When the analysis fails, the version reverts itself. Nobody is paged to make the call, nobody has to notice the graph. That automatic fail-back is the whole ask on this slide. A canary that waits for a human to look at a dashboard is just a slower outage.\u003c/p>\n\u003cp>The honest caveat: traffic-weighted canary needs a traffic router. A mesh, an ingress controller, ALB or VPC Lattice, or the Gateway API plugin, whose maturity we still need to check against the Argo Rollouts docs. Which router we get comes out of the networking work, not this path. Better to say that now than have someone discover it in Q&A.\u003c/p>\n\u003cp>And percentage ramps don't fit everything we run.\u003c/p>","plan":{"Act":"II","Job":"the one mechanism to remember: the gate reverts a version without being asked","Headline":"A canary without automated analysis is just a slower outage.","Visual":"a track: Rollout → setWeight → AnalysisRun → fail → revert. Only the revert is in the accent. A quiet caveat: traffic-weighted canary needs a router, and the networking thread chooses it","Energy":"4","Into next":"and percentage ramps don't fit everything we run."}},"day-one":{"title":"Day one","notes":"\u003cp>This is CVS Health, on the main stage on Wednesday. Read it with me: approachable enough that someone joining the company could ship a new application on their very first day.\u003c/p>\n\u003cp>That's the bar they set for their platform. Not a tooling migration, not a number of clusters. Developer onboarding time. They spent two years on it, and the control plane they built is being open-sourced.\u003c/p>\n\u003cp>Pause. Our first reaction was probably the same as yours.\u003c/p>","plan":{"Act":"I","Job":"open on the bar, in the speaker's own words","Headline":"\"…someone joining the company could ship a new application on their very first day.\"","Visual":"the quote set huge, flush left, with its attribution small beneath. Nothing else on the slide","Energy":"3","Into next":"our first reaction was probably the same as yours.","Source":"CVS Health keynote abstract, Michael Amundson and Jim Beyers, Nov 11"}},"day-one-meant":{"title":"What day one meant","notes":"\u003cp>We opened on CVS Health's sentence and a peak with no route on it. Here's the same peak, with the route drawn all the way up. Stage E is a 2028 decision, not a 2027 commitment: a team onboards an app with no platform ticket.\u003c/p>\n\u003cp>Land this slowly. That's what day one meant. Not trusting new hires with production. A developer who never learned a cluster name, because Path 3's labels place the app. Who never clicked sync, because stages A and B replaced the click with controls. Who never read the policy list, because a violation fails their CI build in ninety seconds. And who never rolled anything back by hand, because the gate did it.\u003c/p>\n\u003cp>Pause. Here's what we need from this room.\u003c/p>","plan":{"Act":"III","Job":"echo the opening: this is what day one meant for us","Headline":"That's day one: a developer who never learned a cluster name, never clicked sync, never read the policy list and never rolled back by hand.","Visual":"the opening's composition returns on dusk: the same peak, now with the route drawn to the summit and every camp lit; our own sentence in the quote's place, and stage E's date beneath it","Energy":"3","Into next":"here's what we need from this room.","Merged from":"`stage-e`"}},"day-one-ten":{"title":"Day one","notes":"\u003cp>This is CVS Health, on the main stage on Wednesday. Read it with me: approachable enough that someone joining the company could ship a new application on their very first day.\u003c/p>\n\u003cp>Our first reaction was probably the same as yours. We are never letting someone deploy to prod on day one. Day one, they can't find the bathroom.\u003c/p>\n\u003cp>Get the laugh. Then: that's not what they meant. Day one doesn't measure how much we trust new hires. It measures how much of our platform a person has to understand before they can ship. CVS didn't make production safer by trusting people more. They made the path so constrained that trust stopped being the variable.\u003c/p>\n\u003cp>That peak on the right is where this deck is going. There's no route on it yet.\u003c/p>\n\u003cp>And our peers have already climbed it.\u003c/p>","plan":{"Act":"I","Job":"open on the bar in CVS Health's own words, and reframe \"day one\" as a measure of how much platform a developer must learn","Headline":"\"…someone joining the company could ship a new application on their very first day.\"","Visual":"the quote set huge, flush left, attribution small beneath; low on the right, one mint-capped peak with no route on it yet","Energy":"3","Into next":"our peers have already done it.","Source":"CVS Health keynote, Michael Amundson and Jim Beyers, Nov 11"}},"freeze-windows":{"title":"Freeze windows","notes":"\u003cp>And the freeze becomes something the cluster enforces. Today \"nothing goes out during the freeze\" means someone refusing to click.\u003c/p>\n\u003cp>The change record gets approved in the ITSM system, exactly as it is today. We project the approved record into the cluster as a custom resource. Policy reads that resource at admission. The decision worth defending is that admission never calls the ITSM API at request time. Admission is a hot path, and a policy that calls an external service fails closed the first time that service is slow.\u003c/p>\n\u003cp>The free half: Argo CD's own sync windows already handle the calendar freeze. Use them for that, and keep policy for \"this specific change needs a record\".\u003c/p>\n\u003cp>Only then does prod auto-sync go on. It's the last item in stage B, on purpose. This and the auto-sync work are one conversation, not two. Present them in sequence and someone funds auto-sync and defers the gating.\u003c/p>\n\u003cp>After B, promotion and the fleet.\u003c/p>","plan":{"Act":"III","Job":"show how change windows get enforced with no human and no hot-path dependency","Headline":"A freeze stops being someone refusing to click.","Visual":"change record approved → projected as a CRD → policy reads the CRD. Argo's own sync windows cover the calendar. Prod auto-sync is the last item in the stage","Energy":"3","Into next":"after B, promotion and the fleet."}},"guardrails-first":{"title":"Guardrails in the same change","notes":"\u003cp>Before we ask anyone to turn off the sync button, one rule, and it's a practice we're adopting, not a scare story.\u003c/p>\n\u003cp>Auto-sync ships with its guardrails in the same pull request. Not a follow-up ticket. One change.\u003c/p>\n\u003cp>The first line is the feature: auto-sync with self-heal, in non-prod only. Click. Prune can never reach stateful or cluster-critical resources. Click. Deletions go last, after everything else is healthy. Click. Prod keeps a sync window, and stays manual until stage B. Click. And we audit storage reclaim policy, because Delete is the default and it's the wrong default for data we care about.\u003c/p>\n\u003cp>The teams at the show who run GitOps at scale talked about these as a named practice with a checklist. It's what makes the guardrails look like part of the feature rather than overhead.\u003c/p>\n\u003cp>Now, what our peers run that we don't.\u003c/p>","plan":{"Act":"I","Job":"set the condition that makes auto-sync safe, as a practice we adopt","Headline":"Auto-sync ships with its guardrails in the same change, never as a follow-up ticket.","Visual":"a single pull request containing four items: prune protection on stateful and cluster-critical resources, PruneLast, a sync window on prod, a reclaimPolicy audit","Energy":"3","Into next":"now, what our peers run that we don't."}},"no-cluster-names":{"title":"No cluster names","notes":"\u003cp>A cluster name in an app repo is a bug. It hard-codes the one thing that live-live regions and rolling upgrades need to keep fluid.\u003c/p>\n\u003cp>So the developer stops writing a cluster name, the crossed-out line, and declares constraints instead: regions, compliance, capability. The platform resolves those to clusters.\u003c/p>\n\u003cp>And we already have the cheap first step. The ApplicationSet cluster generator matches clusters by label selector. It's in Argo CD today and costs nothing. Add rolling sync and that fan-out becomes waves: wave one, check health, wave two. OCM, Karmada and the cluster-inventory ClusterProfile work would all consume the same vocabulary if we ever needed them; we've seen ClusterProfile as a capability, not something we've run.\u003c/p>\n\u003cp>So this is a vocabulary problem more than a tooling problem. The vocabulary is Path 3's first stage, and it's the entry gate for stage D on this path.\u003c/p>\n\u003cp>Last mechanism: how a version moves between environments.\u003c/p>","plan":{"Act":"II","Job":"name the vocabulary the fleet stages depend on","Headline":"A cluster name in an app repo is a bug.","Visual":"the YAML a developer writes (regions, compliance, capability, residency) beside the ApplicationSet cluster generator that resolves it by label selector","Energy":"3","Into next":"last mechanism: how a version moves between environments.","Source":"GOALS §5.5; the label vocabulary is Path 3 stage 1 and stage D's entry gate here"}},"one-label":{"title":"One label is the switch","notes":"\u003cp>This is the only canary pattern that works for things with no user traffic to split: admission webhooks, controllers, credential services. Which is most of what a platform team owns.\u003c/p>\n\u003cp>Five moves. Isolate: run a canary instance beside production with its own deployment, service, config, and its own database schema and user. Route: only one dedicated canary-test namespace can reach it, using a namespace selector. No proxy, no mesh; the API server does the routing. Validate: run twenty-plus real workflows on real nodes against real data. Gate: an Argo CD PostSync hook job; exit zero advances, exit one fails the sync. Promote: cluster by cluster, automatically on pass.\u003c/p>\n\u003cp>On the right is why you build the gate rather than a dashboard. A loud webhook outage got caught in about thirty minutes. A silent webhook change that quietly stripped GPUs from job specs lasted about two days. That's the bars, to scale. No human watching a graph catches the quiet ones.\u003c/p>\n\u003cp>That pattern selects on labels. So should everything else.\u003c/p>","plan":{"Act":"II","Job":"show the canary pattern for platform services, which is most of what we own","Headline":"For services with no traffic to split, one namespace label is the switch.","Visual":"five moves in sequence (isolate, route by namespaceSelector, validate on 20+ real workflows, gate on a PostSync hook, promote cluster by cluster). Beside it: a loud failure caught in about 30 minutes versus a silent one that lasted about two days","Energy":"4","Into next":"that pattern selects on labels. So should everything else.","Source":"LinkedIn deck (`02-canary-namespaces-linkedin`)"}},"one-policy-set":{"title":"One policy set","notes":"\u003cp>The other two controls, policy and the freeze, turn out to be one machine.\u003c/p>\n\u003cp>One policy set, written once in Git with its own tests, so the policies are code we review. It runs in two places. First in CI: kyverno apply against the manifests before anything merges. A violation becomes a ninety-second test failure, for a person or for an agent. Nobody can iterate against a rejected sync at two in the morning.\u003c/p>\n\u003cp>Then at admission. The hot path is CEL admission policy, inside the API server, so there's no webhook that can be down. Be honest about the flag: generating that CEL from our Kyverno set is a documented capability we haven't run, and we verify it before anyone treats that box as a design. Kyverno keeps what CEL can't express.\u003c/p>\n\u003cp>Now the freeze. Today it means someone refusing to click. Instead, the change record is approved in the ITSM system exactly as today, and projected into the cluster as a custom resource that policy reads. Admission never calls the ITSM API at request time, because a policy that calls an outside service fails closed the first time that service is slow. Argo CD's sync windows already cover the calendar freeze.\u003c/p>\n\u003cp>And the line at the bottom is the one Path 2 depends on. Write policy against the action, not the actor, and the rule that stops a person also bounds an agent.\u003c/p>\n\u003cp>Last mechanism: how a version moves between environments.\u003c/p>","plan":{"Act":"II","Job":"show that policy and the freeze are one machine, enforced with no human and no call out of the hot path","Headline":"One policy set stops a bad change in CI and a frozen one at admission.","Visual":"snowfield. A change's path from commit to running crosses two gates; one policy bar above drops into both; under the admission gate an approved change record, projected as a CRD, feeds in. The rule at the foot: write policy against the action, not the actor","Energy":"4","Into next":"last mechanism: how a version moves between environments.","Merged from":"`stage-b`, `freeze-windows`","Source":"⚠️ generating CEL admission policy from the Kyverno set is a capability we haven't run; flagged on the slide"}},"peers":{"title":"Our peers","notes":"\u003cp>Three companies, three measures, and none of them is \"we bought a tool\".\u003c/p>\n\u003cp>CVS Health set the goal as developer onboarding time: a new hire ships a new app on day one. Two years of work, and a control plane they're open-sourcing.\u003c/p>\n\u003cp>LinkedIn's canary pipeline for their cluster-critical services took a release from about a week to about an hour, validated automatically. Look at the bars: the hour is that sliver. And it caught more than ten incidents before they reached production.\u003c/p>\n\u003cp>Meta: about fifteen engineers run about a hundred clusters. That ratio is only possible if nobody is clicking anything.\u003c/p>\n\u003cp>And here is where we are.\u003c/p>","plan":{"Act":"I","Job":"prove it has been done, at our scale and above","Headline":"Our peers already made the deploy path invisible.","Visual":"three measures, each drawn as before → after: CVS day one; LinkedIn about a week → about an hour per release; Meta about 100 clusters run by about 15 engineers","Energy":"3","Into next":"and here is where we are."}},"peers-ten":{"title":"Our peers","notes":"\u003cp>Two companies, two measures, and neither of them is \"we bought a tool\".\u003c/p>\n\u003cp>LinkedIn first. Their own slide title: from a week of hoping to an hour of proof. Every square on the left is one hour. A release of their cluster-critical services used to take about a week, cluster by cluster: that's the whole grid. Now it takes about an hour, validated automatically: that's the one lit square. And the same pipeline caught more than ten incidents before they reached production. Faster and safer, not one at the expense of the other.\u003c/p>\n\u003cp>Meta, on the right: about fifteen engineers run about a hundred clusters, on-prem, with Argo CD and Kargo. Each little peak is a cluster, each dot is a person. That ratio is only possible if nobody is clicking anything.\u003c/p>\n\u003cp>And here is where we are.\u003c/p>","plan":{"Act":"I","Job":"prove the bar is reachable, at our scale and above","Headline":"Our peers already made the deploy path invisible.","Visual":"two pictures in real units. LinkedIn: a week drawn as 168 hour-squares (7 rows of 24), all grey, one lit: about a week per release became about an hour, and 10+ incidents were caught before prod. Meta: 100 cluster glyphs beside 15 engineer dots","Energy":"3","Into next":"and here is where we are.","Source":"LinkedIn, \"Ship Faster, Ship Safer\" (deck p25); Meta, \"We Have GitOps at Home\" keynote abstract"}},"promotion-pr":{"title":"Promotion as a PR","notes":"\u003cp>Last mechanism: how a version moves from dev to stage to prod. Promotion is becoming a pull request.\u003c/p>\n\u003cp>On the left, GitOps Promoter, which is our call. Each environment is a branch. A promotion is a commit and a pull request, with a commit status per environment. There's no state outside Git, so the PR is the audit record: the one artifact a human reviewer, an agent and an auditor all read. It composes with Argo's source hydrator, so Git holds what actually runs, with diffs a person can read.\u003c/p>\n\u003cp>On the right, Kargo: Warehouses, Freight and Stages, with its own control plane and UI. It fits complex pipelines and release managers who live in a UI, and Meta runs about a hundred clusters with it. It would be a second control plane for us.\u003c/p>\n\u003cp>What would flip it, stated so the decision looks as reversible as it is: per-environment commit status needs hand-wiring for auto-rollback; Promoter doesn't order across apps; and it's younger. Nearly every published comparison is written by someone with a stake, Akuity maintains both Argo CD and Kargo, so the answer is a two-week spike on one real app, not more reading. And the Kargo adoption figure in our notes came from a vendor post; we don't quote it.\u003c/p>\n\u003cp>So why haven't teams asked for any of this?\u003c/p>","plan":{"Act":"II","Job":"state the promotion call, and what would flip it","Headline":"Promotion becomes a pull request: GitOps Promoter first, Kargo as the fallback.","Visual":"two models side by side: Kargo's Warehouses → Freight → Stages with its own control plane, against Promoter's branch, commit and PR per environment with no state outside Git. What would flip it, written underneath","Energy":"3","Into next":"so why haven't teams asked for any of this?","Source":"GOALS §1.2; ⚠️ the Kargo adoption figure came from a vendor post"}},"promotion-pr-ten":{"title":"Promotion as a PR","notes":"\u003cp>Last mechanism: how a version moves from dev to stage to prod. Today that's a person editing YAML in another repo. It becomes a pull request.\u003c/p>\n\u003cp>On the left, GitOps Promoter, our lean, and stage C. Each environment is a branch, and a promotion is a commit and a pull request. There's no state outside Git, so the PR is the audit record that a reviewer, an agent and an auditor all read. Notice what that does to change control: the approval stops being a click and becomes a review.\u003c/p>\n\u003cp>On the right, Kargo, with its own control plane and UI. It's a serious option, and Meta runs Argo CD and Kargo across about a hundred clusters. For us it would be a second control plane.\u003c/p>\n\u003cp>What would flip it, said out loud so the decision looks as reversible as it is: Promoter's rollback per environment is hand-wired, it doesn't order across apps, and it's younger. Every published comparison is written by someone with a stake, so the answer is a two-week spike on one real app. We don't quote any Kargo adoption figure; the one in our notes came from a vendor post.\u003c/p>\n\u003cp>So, if all of this exists, why haven't our teams asked for any of it?\u003c/p>","plan":{"Act":"II","Job":"state the promotion call and what would flip it","Headline":"Promotion becomes a pull request: GitOps Promoter first, Kargo as the fallback.","Visual":"two models side by side, weighted by the call: Promoter large on the left, tagged with camp C, its environment branches joined by a PR at each step, no state outside Git; Kargo smaller and muted on the right, Warehouse, Freight and Stages inside its own control plane. One line underneath: what would flip it, and the spike that decides","Energy":"3","Into next":"so why haven't teams asked for any of this?","Source":"GOALS §1.2; Meta's Argo CD + Kargo from its keynote abstract"}},"ramps":{"title":"Where ramps break","notes":"\u003cp>This is LinkedIn's articulation, and it's the best one we heard.\u003c/p>\n\u003cp>Percentage ramps quietly assume three things about requests. That they're interchangeable: but a random ten percent means some users' critical jobs land on a version nobody validated. That they're balanced: but a percentage can't balance job types, and some types miss the ramp window entirely. That the change is divisible: but a schema migration is all or nothing. And that it's one component: but in a multi-component change, one request hits the new version of one service and the old version of the next.\u003c/p>\n\u003cp>This is why our canary answer is per workload class rather than one pattern for everything. If we're running long, this slide is the one to cut.\u003c/p>\n\u003cp>LinkedIn's answer for those cases needs no mesh at all.\u003c/p>","plan":{"Act":"II","Job":"explain why our canary answer is per workload class","Headline":"Percentage ramps assume requests are interchangeable, divisible and single-component.","Visual":"four broken assumptions, each a small picture: critical jobs on an unvalidated version, job types that miss the ramp, a schema migration that can't be split, a request that hits one new and one old component","Energy":"3","Into next":"LinkedIn's answer for those needs no mesh at all.","Source":"LinkedIn, canary namespaces for cluster-critical services"}},"reloader":{"title":"Reloader","notes":"\u003cp>Without this one, a GitOps config change reports success while the running pods keep serving the old value. That falsifies \"Git is the state of the world\" on the very day we say it.\u003c/p>\n\u003cp>Three places a config value can live, and they aren't interchangeable. A ConfigMap or Secret in our Git repo: Reloader rolls the deployments that use it, so it's commit, sync, roll. Good.\u003c/p>\n\u003cp>The middle row is the trap. When the value lives in Config Server's own backing config, Reloader rolls the config server, and its clients keep the cached value.\u003c/p>\n\u003cp>And client-side refresh scope, with an actuator refresh per instance, is out of band: Git no longer describes what's running.\u003c/p>\n\u003cp>Our lean, and this is ours, not from the show, and untested: make the roll the refresh mechanism. It needs one Spring-owning team to confirm which beans tolerate a restart. And it opens a question worth asking in the room: does any app's config genuinely need in-place refresh? If not, the config-server refresh path can retire, which is a simplification we'd get for free.\u003c/p>\n\u003cp>Stage B is the one that buys the trade.\u003c/p>","plan":{"Act":"III","Job":"close the config trap before it embarrasses us","Headline":"Reloader makes \"Git is the state of the world\" true for config too.","Visual":"three places a value can live, and what actually makes a pod see a change in each; the middle row (Config Server's own config) marked as the trap","Energy":"2","Into next":"stage B is the one that buys the trade.","Source":"ours, untested; no conference evidence"}},"rollback-gate":{"title":"Rollback by gate","notes":"\u003cp>If you remember one mechanism from this deck, make it this one, because rollback is the control people trust a machine with least.\u003c/p>\n\u003cp>A Rollout is the workload's spec, in Git. It sends a share of traffic to the new version and pauses. An AnalysisRun queries a metric, error rate or latency, and judges it against a threshold we wrote down in advance.\u003c/p>\n\u003cp>Click. When the analysis fails, the version goes back to the last good one. Nobody is paged to make the call and nobody has to notice a graph. A canary that waits for a human to look at a dashboard is just a slower outage.\u003c/p>\n\u003cp>The bars underneath are why. They're LinkedIn's, drawn to the same scale. A loud webhook outage was caught in about thirty minutes. A silent webhook change that stripped GPUs from jobs ran for about two days, eight hundred and twenty executions. Nobody watching a graph catches the quiet ones. A gate does.\u003c/p>\n\u003cp>Two honest notes, if asked. A weighted canary needs a traffic router, and which one is the networking thread's call; the Rollouts Gateway API plugin is unverified, so we check its docs first. And for platform services with no traffic to split, LinkedIn's answer needs no mesh: a canary in its own namespace, one label as the switch, and an Argo CD PostSync Job as the gate. That's why canary is a proof of concept per workload class, and the gate is the part that isn't optional.\u003c/p>\n\u003cp>That's rollback. The other two controls turn out to be one policy set.\u003c/p>","plan":{"Act":"II","Job":"the one mechanism to remember: a gate, not a person, sends a bad version back","Headline":"A canary without automated analysis is just a slower outage.","Visual":"a track: Rollout → a share of traffic → AnalysisRun, which fails, and a mint arc carries the version back to the start. Beneath, LinkedIn's two failures drawn to scale: loud, about 30 minutes; silent, about 2 days","Energy":"4","Into next":"that's rollback. The other two controls turn out to be one policy set.","Merged from":"`canary-gate` (the track), `one-label` (the evidence; the five moves go to the notes), `ramps` (the notes)","Source":"LinkedIn deck (`02-canary-namespaces-linkedin`, p08 and p15); ⚠️ the Rollouts Gateway API plugin is in the notes only, flagged"}},"stage-a":{"title":"Stage A","notes":"\u003cp>Here's the trade made concrete, starting with stage A, by January: Argo becomes a control loop, in non-prod.\u003c/p>\n\u003cp>Six items. Auto-sync with self-heal and prune, non-prod only; prod stays manual until stage B. The guardrails ship in the same change, which is the rule from earlier. Stakater Reloader, which gets its own slide next because it's the trust prerequisite. A drift policy by resource class: silent self-heal for cluster-critical things, alert first where a human may have hot-fixed something. An Argo CD upgrade. And a reclaim-policy audit on our storage classes.\u003c/p>\n\u003cp>The exit gate is how we know the stage is done rather than declared done: zero manual syncs in non-prod for four weeks, drift alerts going to a named owner, and a config change that demonstrably rolls the pods that use it.\u003c/p>\n\u003cp>And the first two weeks are deliberately small: one app, and the real deliverable is the list of everything that drifted. Nobody argues with a list of things that were already wrong.\u003c/p>\n\u003cp>One of those six items deserves its own slide.\u003c/p>","plan":{"Act":"III","Job":"the first stage, its six items and its exit gate","Headline":"Stage A, by January: Argo becomes a control loop in non-prod.","Visual":"the mint face with camp A lit; six items; the exit gate; the first two weeks (one app, and a written list of everything that drifted)","Energy":"3","Into next":"one of those six items deserves its own slide."}},"stage-b":{"title":"Stage B","notes":"\u003cp>Stage B is the trade from two slides ago, made real, and it's the least visible work on this whole path.\u003c/p>\n\u003cp>One policy set, written once in Git, with its own tests, so the policies themselves are code we review. It runs in two places. First in CI: kyverno apply against the manifests and the cloud plans before anything merges. A violation becomes a ninety-second test failure, for a person or for an agent, and an agent can iterate against a test failure. It can't iterate against a rejected sync at two in the morning.\u003c/p>\n\u003cp>Then at admission. The hot path is CEL ValidatingAdmissionPolicy, which runs in-process in the API server, so there's no webhook that can be down. Be honest about the flag: generating those CEL policies from our Kyverno set is a documented capability we haven't run yet. We verify it before anyone treats this box as a design.\u003c/p>\n\u003cp>Kyverno keeps what CEL can't express: generation, mutation chains, and verifyImages, with our own images signed by cosign in CI. verifyImages starts in audit mode.\u003c/p>\n\u003cp>The rule at the bottom is the one that matters for Path 2. Write policy against the action, not the actor. The policy that stops a person deploying a privileged container is the same one that bounds an agent, so most agent governance comes for free.\u003c/p>\n\u003cp>Stage B gates stage C here, and it gates phase 2 of the agent path. Nobody demos it, which is why it's the stage that gets deprioritised. And the freeze becomes something the cluster enforces.\u003c/p>","plan":{"Act":"III","Job":"the stage that pays for everything else, and the least visible work","Headline":"Stage B is the trade: one policy set, run in CI and at admission.","Visual":"four layers: CI (kyverno apply, 90-second failures), admission hot path (CEL ValidatingAdmissionPolicy), admission remainder (Kyverno), supply chain (cosign, verifyImages in audit). The rule underneath: write policy against the action, not the actor","Energy":"4","Into next":"and the freeze becomes something the cluster enforces.","Source":"⚠️ Kyverno generating VAP is a capability we haven't run"}},"stage-e":{"title":"Stage E","notes":"\u003cp>Stage E is the summit, and it's a 2028 decision, not a 2027 commitment: a team onboards an app with no platform ticket.\u003c/p>\n\u003cp>On the left is the pack from the start of the talk, and every item is crossed off, with the stage that took it. Which cluster: gone, Path 3's labels. When to click sync: gone, stage A. Whether there's a freeze, and which rules apply: gone, stage B. How to roll back: gone, stage D.\u003c/p>\n\u003cp>On the right, what the summit adds. Constraints instead of cluster names. Cost and ownership labels enforced at the same admission gate: unglamorous, and without it every cost tool draws the same pie chart nobody can attribute. Right-sizing as a pull request rather than a project, with KEDA for the signal and in-place resizing for the size, while watching the thrash where HPA, VPA and Karpenter all act on one workload. And one thing to watch rather than build: cost shown in the Argo CD UI at the moment of deploy.\u003c/p>\n\u003cp>Land this slowly. That's what day one meant. A developer who never learned a cluster name, never clicked sync, never read the policy list, and never rolled anything back by hand.\u003c/p>\n\u003cp>Here's what we need from this room.\u003c/p>","plan":{"Act":"III","Job":"echo the opening: this is what \"day one\" meant","Headline":"Stage E: a team onboards an app with no platform ticket.","Visual":"the summit, with the pack from slide 2 now empty: never learned a cluster name, never clicked sync, never read the policy list, never rolled back by hand","Energy":"3","Into next":"here's what we need from this room."}},"stage-zero":{"title":"Stage zero","notes":"\u003cp>Here's where we are, and let's say it without being defensive. Argo CD is installed in every cluster, on manual sync. That's stage zero, and it's honest.\u003c/p>\n\u003cp>But look at what that one button is standing in for. Promotion is a person editing YAML in another repo. Policy is a reviewer's memory; we have no policy engine. Rollback is a person and a Slack thread. Drift is something we discover by accident. And a config change can report success while the pods keep serving the old value.\u003c/p>\n\u003cp>A dashboard somebody clicks isn't a deployment platform. It's a deployment interface. Nothing downstream, promotion, canary, agents, has anything to drive until this changes.\u003c/p>\n\u003cp>Before we ask to turn that button off, one rule.\u003c/p>","plan":{"Act":"I","Job":"name the gap without defensiveness, so the room agrees on the starting point","Headline":"Today Argo CD is a dashboard somebody clicks.","Visual":"one large SYNC button, alone. Around it, five quiet labels for what that button stands in for: promotion, policy, rollback, drift, config reload","Energy":"2","Into next":"before we ask to turn it off, one rule."}},"stages-c-d":{"title":"Stages C and D","notes":"\u003cp>Two stages on one slide, because they're one piece of work from a funding point of view. The distinction to hold onto is commitment versus proof of concept.\u003c/p>\n\u003cp>Stage C is a commitment. A spike on Argo's source hydrator first, then GitOps Promoter on one app: dev to prod with nobody editing YAML. Agent-or-human attribution goes in the same stage, because it's cheap now and expensive to retrofit. And separation of duties in machinery we already run: whoever proposes a change can't approve its own pull request, the forge enforces the rules, and RBAC bounds each role. The honest gap: revoking a permission doesn't undo merges that already happened. Withdrawal isn't rollback.\u003c/p>\n\u003cp>Stage D is one commitment and one proof of concept. The commitment is fleet waves: ApplicationSets with rolling sync and a health gate between waves. The proof of concept is canary: two patterns, one pilot service each, time-boxed, and \"neither is worth it yet\" is an allowed answer. Even the proof of concept has automated analysis.\u003c/p>\n\u003cp>And a kill switch is not a rollback. Progressive delivery reverts a version; it can't turn off one behaviour inside a version. That's a feature flag's job, and CVS Health, the company we opened with, has the answer to that too.\u003c/p>\n\u003cp>The exit gate is deliberately brutal: a health gate nobody has watched fail is a health gate nobody should trust.\u003c/p>\n\u003cp>And then, the summit.\u003c/p>","plan":{"Act":"III","Job":"separate what we commit to from what we only evaluate","Headline":"Stages C and D: promotion is a PR, and the fleet rolls in waves with a gate that has failed at least once.","Visual":"two camps, C (commitment) and D (one commitment, one POC). A kill switch is not a rollback","Energy":"3","Into next":"and then the summit."}},"the-ask":{"title":"The ask","notes":"\u003cp>Five decisions, and four of them already have a lean, so this is about confirming, not deliberating. Take the objections, but let's not reopen promotion: the spike is how we test it.\u003c/p>\n\u003cp>Prod auto-sync comes after change-window gating, because the gating is what buys the permission. Promoter first, Kargo as the fallback, two-week spike. Change records projected as a CRD, because admission can't depend on an outside service. Canary as a proof of concept per workload class, where \"not yet\" is an allowed answer. Drift handled both ways, split by resource class. And one new question: does any app's config genuinely need in-place refresh? We lean no, and if so, the config-server refresh path retires.\u003c/p>\n\u003cp>The card on the right is the thing to repeat at the end. Stage B has no demo and no dashboard. A room that buys the trade and then funds only stage A has made things worse, because auto-sync without the policy layer is exactly the risk the guardrails exist for. It also gates the agent path's pull requests.\u003c/p>\n\u003cp>If we leave with one owner named, make it stage B's.\u003c/p>","plan":{"Act":"III","Job":"confirm the leans and protect the one invisible stage","Headline":"Confirm five leans and protect stage B's headcount.","Visual":"five decisions with our lean beside each, and a separate card: stage B gates stage C *and* Path 2 phase 2, so if one thing gets protected headcount, it's this","Energy":"4","Into next":"end"}},"the-ask-ten":{"title":"The ask","notes":"\u003cp>Five decisions, and every one already has a lean, so this is about confirming, not deliberating. Take the objections, but let's not reopen promotion: the spike is how we test it.\u003c/p>\n\u003cp>Prod auto-sync comes after the change-window gating, because the gating is what buys the permission. Promoter first, Kargo as the fallback, and a two-week spike on one app. Change records projected into the cluster as a CRD, because admission can't depend on an outside service. Canary as a proof of concept per workload class, where \"not yet\" is an allowed answer. And drift handled both ways, split by resource class: silent self-heal for cluster-critical things, alert first where someone may have hot-fixed.\u003c/p>\n\u003cp>One smaller question we'd like an answer to: does any app's config genuinely need in-place refresh? We lean no, and if none does, the config-server refresh path retires.\u003c/p>\n\u003cp>The card on the right is the thing to repeat at the end. Stage B has no demo and no dashboard. A room that buys the trade and then funds only stage A has made things worse, because auto-sync without the policy layer is exactly the risk the guardrails exist for. It also gates the agent path's pull requests.\u003c/p>\n\u003cp>If we leave with one owner named, make it stage B's.\u003c/p>","plan":{"Act":"III","Job":"confirm the leans and protect the one invisible stage","Headline":"Confirm five leans and protect stage B's headcount.","Visual":"five decisions as a short ledger, each with our lean; beside it a large mint card, camp B: it gates stage C and the agent path's pull requests, so if one thing gets protected headcount, it's this","Energy":"4","Into next":"end"}},"the-button":{"title":"The button","notes":"\u003cp>Here's where we are, and let's say it without being defensive. Argo CD is installed in every cluster, on manual sync. That's stage zero, and it's honest.\u003c/p>\n\u003cp>But look at what that one button is standing in for. Drift is something we find by accident, and a config change can report success while the pods keep serving the old value. Policy is a reviewer's memory; we have no engine. The freeze is someone refusing to click. Promotion is a person editing YAML in another repo. And rollback is a person and a Slack thread.\u003c/p>\n\u003cp>So the button isn't really a deploy button. It's the only change control we've got. That's why teams hold on to it, and they're right to.\u003c/p>\n\u003cp>The letter beside each one is the stage that replaces it. Hold on to those letters; they come back.\u003c/p>\n\u003cp>Here's what replaces it, starting with the one that matters most: rollback.\u003c/p>","plan":{"Act":"I","Job":"name the gap without defensiveness: one click is standing in for five controls we don't have","Headline":"Today the SYNC button is the only change control we have.","Visual":"dusk ground. One large SYNC button with a cursor on it; five wires fan out to what it stands in for (promotion, policy, the freeze, rollback, drift and config), each with today's stand-in and the camp letter that replaces it","Energy":"2","Into next":"here's what replaces it, starting with the control that matters most.","Merged from":"`stage-zero` (the button) and `abstraction-depth` (each item tagged with the stage that takes it off)"}},"the-route":{"title":"The route","notes":"\u003cp>Here's the trade as a climb: five stages up one face, and watch where the click comes off.\u003c/p>\n\u003cp>A, by January: auto-sync and self-heal in non-prod only, with the guardrails in the same pull request, never a follow-up ticket. Prune false on stateful and cluster-critical resources, PruneLast, a sync window on prod, and a reclaim-policy audit. Reloader goes in too, so a config change actually rolls its pods. A is done when non-prod has gone four weeks without a manual sync.\u003c/p>\n\u003cp>B, in the first quarter: the one policy set in CI and at admission, and the freeze enforced by the cluster. It's done when a freeze blocks a sync with no human involved. And only then, the struck button: prod auto-sync goes on as the last item in B. Offer it earlier and we trade away the only reason teams agree.\u003c/p>\n\u003cp>Above the button the route is dashed: that's what we trial rather than commit to. C, from the second quarter: promotion as a pull request, one app first. D, in the second half: the fleet rolls in waves with a health gate, once Path 3's cluster labels exist, and canary as a proof of concept. D is done when that gate has failed a bad wave at least once, because a gate nobody has watched fail is a gate nobody should trust.\u003c/p>\n\u003cp>E, 2028, is a decision, not a commitment. Which brings us back to where we started.\u003c/p>","plan":{"Act":"III","Job":"the whole plan as one climb: dated stages, each with an exit gate, and prod's click coming off only after the controls","Headline":"Five stages, and prod stops clicking only after the controls are in.","Visual":"snowfield. One peak, the route climbing its face through camps A–E; each camp labelled at its height with its date, its one line and its exit gate (A and B dated in alpenglow, because those are commitments). The route is solid through A and B and dashed above, because C–E are trials and a decision. A struck SYNC marker sits on the route just past B, where prod auto-sync goes on: the focal point","Energy":"3","Into next":"which brings us back to where we started.","Merged from":"`stage-a`, `guardrails-first`, `reloader`, `stage-b`, `freeze-windows` (B's exit gate), `stages-c-d`, `no-cluster-names` (D's entry gate, in the notes)"}},"the-trade":{"title":"The trade","notes":"\u003cp>This is the slide the deck exists to deliver.\u003c/p>\n\u003cp>Teams don't resist auto-sync because they like clicking. They resist it because manual sync is the only change control they have. Take the button away and you've taken away the one thing standing between a bad commit and production. Of course they say no.\u003c/p>\n\u003cp>So the offer isn't \"turn on auto-sync\". The offer is a trade. You stop clicking sync. Click. In exchange, nothing ships during a freeze, because the cluster enforces the window, not a person refusing to click. Click. Every policy violation fails in CI in ninety seconds, not at two in the morning. Click. And a bad version rolls itself back, because the analysis run fails and the rollout reverts it.\u003c/p>\n\u003cp>The letters are the stages that deliver each one. Two of the three come from stage B, which is why stage B is the one we'll ask you to protect.\u003c/p>\n\u003cp>Pause. Then: here's the trade made concrete, in five stages. And notice the order. The control comes back in a better form before the click goes away. Prod auto-sync is the last item in stage B, not the first thing we ask for.\u003c/p>","plan":{"Act":"III","Job":"the turn: make the offer the deck exists to make","Headline":"Stop clicking sync, and in exchange nothing ships in a freeze, policy fails in CI, and a bad version rolls itself back.","Visual":"the setup line small (\"Teams resist auto-sync because manual sync is the only change control they have\"), then the trade set large across the slide, with its three gains building one per click","Energy":"5","Into next":"here is the trade made concrete, in five stages."}},"the-trade-ten":{"title":"The trade","notes":"\u003cp>Here's the answer. Teams don't resist auto-sync because they like clicking. They resist it because manual sync is the only change control they have. Take the button away and you've taken the one thing standing between a bad commit and production. Of course they say no.\u003c/p>\n\u003cp>So the offer isn't \"turn on auto-sync\". The offer is a trade. Stop clicking sync. Click. In exchange, nothing ships during a freeze, because the cluster enforces it, not a person refusing to click. Click. A policy violation fails in CI in ninety seconds, not at two in the morning. Click. And a bad version rolls itself back, because the analysis fails and the version goes back with nobody paged.\u003c/p>\n\u003cp>You've already seen all three. Watch the button: it fades as each control arrives, and it's only struck out once all three are in. That's the order we're proposing. The letters are the stages that deliver each gain, and two of the three come from stage B, which is why stage B is the one we'll ask you to protect.\u003c/p>\n\u003cp>Pause. Here is the trade as a climb, and watch where the click comes off.\u003c/p>","plan":{"Act":"III","Job":"the turn: make the offer the deck exists to make","Headline":"Stop clicking sync, and in exchange nothing ships in a freeze, policy fails in CI, and a bad version rolls itself back.","Visual":"mint ground, the only one. The setup line small; STOP CLICKING SYNC huge; the three gains build one per click, each tagged with its camp, while the SYNC button on the right dims a step per gain and is struck through on the last","Energy":"5","Into next":"here is the trade as a climb, and watch where the click comes off."}},"ti-appsets":{"title":"ApplicationSets + progressive sync","notes":"\u003cp>ApplicationSets + progressive sync: One definition fanned out to every cluster, in waves rather than all at once. Where we stand: Trial progressive sync on one platform component across non-prod; use label selectors as the cluster interface from day one.\u003c/p>\n\u003cp>Name the limit every time it comes up: placement that reacts to cluster health is Karmada or OCM territory, not this.\u003c/p>","plan":{"Act":"Appendix","Job":"the reference card for ApplicationSets + progressive sync","Headline":"One definition fanned out to every cluster, in waves rather than all at once.","Visual":"a catalogue card: what it is, what sets it apart, where we stand, stamped TRIAL","Energy":"1","Into next":"the next card."}},"ti-argocd":{"title":"Argo CD","notes":"\u003cp>Argo CD: The GitOps controller we already run. The work is making it converge, not choosing it. Where we stand: Already ours. Turn on auto-sync with self-heal, and write the upgrade ticket to the current 3.x line. ⚠️ Confirm the exact version against the release notes.\u003c/p>\n\u003cp>The ArgoCon point we both took away: the controller isn't the gap, the manual sync button is.\u003c/p>","plan":{"Act":"Appendix","Job":"the reference card for Argo CD","Headline":"The GitOps controller we already run. The work is making it converge, not choosing it.","Visual":"a catalogue card: what it is, what sets it apart, where we stand, stamped ADOPT","Energy":"1","Into next":"the next card."}},"ti-cel":{"title":"Validating / MutatingAdmissionPolicy","notes":"\u003cp>Validating / MutatingAdmissionPolicy: Admission policy built into the API server, written in CEL. Where we stand: The default for simple validations and mutations; Kyverno for the rest.\u003c/p>\n\u003cp>The trade-off slide in Greg's deck is worth showing anyone who asks why not Kyverno for everything.\u003c/p>","plan":{"Act":"Appendix","Job":"the reference card for Validating / MutatingAdmissionPolicy","Headline":"Admission policy built into the API server, written in CEL.","Visual":"a catalogue card: what it is, what sets it apart, where we stand, stamped ADOPT","Energy":"1","Into next":"the next card."}},"ti-falco":{"title":"Falco","notes":"\u003cp>Falco: Runtime detection: what happened after admission said yes. Where we stand: Trial on one cluster with one out-of-band-change rule first.\u003c/p>\n\u003cp>The one rule worth writing first: alert on any write to a Secret or ConfigMap that didn't come from Argo CD's service account.\u003c/p>","plan":{"Act":"Appendix","Job":"the reference card for Falco","Headline":"Runtime detection: what happened after admission said yes.","Visual":"a catalogue card: what it is, what sets it apart, where we stand, stamped TRIAL","Energy":"1","Into next":"the next card."}},"ti-gatewayapi":{"title":"Gateway API","notes":"\u003cp>Gateway API: The successor to Ingress, and the router a traffic-weighted canary needs. Where we stand: Adopt, with an owner and a date. It also unlocks the Argo Rollouts Gateway API plugin. On no path, but on a clock.\u003c/p>\n\u003cp>This migration pays twice: the ingress move we have to make anyway, and the router canaries need.\u003c/p>","plan":{"Act":"Appendix","Job":"the reference card for Gateway API","Headline":"The successor to Ingress, and the router a traffic-weighted canary needs.","Visual":"a catalogue card: what it is, what sets it apart, where we stand, stamped ADOPT","Energy":"1","Into next":"the next card."}},"ti-hydrator":{"title":"Argo CD source hydrator","notes":"\u003cp>Argo CD source hydrator: Commit the rendered YAML back to Git, so what's in Git is what runs. Where we stand: Trial it as part of the Promoter spike, not as a separate project.\u003c/p>\n\u003cp>This is the quiet prerequisite for the promotion decision. Spike them together.\u003c/p>","plan":{"Act":"Appendix","Job":"the reference card for Argo CD source hydrator","Headline":"Commit the rendered YAML back to Git, so what's in Git is what runs.","Visual":"a catalogue card: what it is, what sets it apart, where we stand, stamped TRIAL","Energy":"1","Into next":"the next card."}},"ti-istio":{"title":"Istio","notes":"\u003cp>Istio: The mesh direction we're already committed to. Where we stand: Committed. Open item: sidecar versus ambient, in ISTIO-VS-GATEWAY-API.md. Budget mesh telemetry cardinality as a cost line.\u003c/p>\n\u003cp>Locality failover only fires if outlier detection is actually configured.\u003c/p>","plan":{"Act":"Appendix","Job":"the reference card for Istio","Headline":"The mesh direction we're already committed to.","Visual":"a catalogue card: what it is, what sets it apart, where we stand, stamped ADOPT","Energy":"1","Into next":"the next card."}},"ti-kargo":{"title":"Kargo","notes":"\u003cp>Kargo: The serious alternative: a promotion control plane with its own UI. Where we stand: Spike it second. It wins if what we want is a release-management UI across many targets rather than PRs as the record.\u003c/p>\n\u003cp>Akuity maintains both Argo CD and Kargo, so read their comparisons accordingly. That's why we want our own spike.\u003c/p>","plan":{"Act":"Appendix","Job":"the reference card for Kargo","Headline":"The serious alternative: a promotion control plane with its own UI.","Visual":"a catalogue card: what it is, what sets it apart, where we stand, stamped DECIDE","Energy":"1","Into next":"the next card."}},"ti-kyverno":{"title":"Kyverno","notes":"\u003cp>Kyverno: Policy as Kubernetes YAML, for what in-tree CEL can't express. Where we stand: Our policy layer: CI shift-left, change-window gating against a projected CRD, and reports.\u003c/p>\n\u003cp>The change-window CRD keeps the admission path from depending on the ITSM system being up.\u003c/p>","plan":{"Act":"Appendix","Job":"the reference card for Kyverno","Headline":"Policy as Kubernetes YAML, for what in-tree CEL can't express.","Visual":"a catalogue card: what it is, what sets it apart, where we stand, stamped ADOPT","Energy":"1","Into next":"the next card."}},"ti-promoter":{"title":"GitOps Promoter","notes":"\u003cp>GitOps Promoter: Our lean for promotion: every environment change is a pull request. Where we stand: Our preferred option going into the spike. Watch for: per-environment commit statuses wired by hand, and less adoption data than Kargo.\u003c/p>\n\u003cp>ArgoCon showed it as the traceability mechanism in the agent-ready checklist, which is part of why we lean this way: it serves the agent path too.\u003c/p>","plan":{"Act":"Appendix","Job":"the reference card for GitOps Promoter","Headline":"Our lean for promotion: every environment change is a pull request.","Visual":"a catalogue card: what it is, what sets it apart, where we stand, stamped DECIDE","Energy":"1","Into next":"the next card."}},"ti-reloader":{"title":"Stakater Reloader","notes":"\u003cp>Stakater Reloader: Restart what consumes a ConfigMap or Secret when it changes. Where we stand: Adopt first. Without it a GitOps config change appears to succeed while pods keep serving the old value.\u003c/p>\n\u003cp>The cheapest item on the path, and it protects the 'Git is the state of the world' claim.\u003c/p>","plan":{"Act":"Appendix","Job":"the reference card for Stakater Reloader","Headline":"Restart what consumes a ConfigMap or Secret when it changes.","Visual":"a catalogue card: what it is, what sets it apart, where we stand, stamped ADOPT","Energy":"1","Into next":"the next card."}},"ti-rollouts":{"title":"Argo Rollouts","notes":"\u003cp>Argo Rollouts: Traffic-weighted canaries and blue-green, with automated analysis and rollback. Where we stand: Pilot on one user-facing HTTP app. ⚠️ Sources disagree on whether the Gateway API plugin is alpha or stable; check the docs first.\u003c/p>\n\u003cp>For cluster-critical services with no traffic to split, the namespace-scoped canary is the better fit.\u003c/p>","plan":{"Act":"Appendix","Job":"the reference card for Argo Rollouts","Headline":"Traffic-weighted canaries and blue-green, with automated analysis and rollback.","Visual":"a catalogue card: what it is, what sets it apart, where we stand, stamped TRIAL","Energy":"1","Into next":"the next card."}},"tool-index":{"title":"Tool index","notes":"\u003cp>The appendix: every tool this path names gets one catalogue card. What it is, what sets it apart, and where we stand, with the status stamped on it: adopt, trial, decide or watch. This part is for reading afterwards, not for presenting.\u003c/p>","plan":{"Act":"Appendix","Job":"open the reference section and show every tool at a glance","Headline":"Every tool we named, one card each, with where we stand.","Visual":"a catalogue drawer of tabs, each with its status","Energy":"1","Into next":"one card per tool follows."}}},"narrativeOrder":["day-one-ten","peers-ten","the-button","rollback-gate","one-policy-set","promotion-pr-ten","the-trade-ten","the-route","day-one-meant","the-ask-ten","day-one","abstraction-depth","peers","stage-zero","guardrails-first","canary-gate","ramps","one-label","no-cluster-names","promotion-pr","the-trade","stage-a","reloader","stage-b","freeze-windows","stages-c-d","stage-e","the-ask","tool-index","ti-argocd","ti-appsets","ti-hydrator","ti-rollouts","ti-promoter","ti-kargo","ti-reloader","ti-kyverno","ti-cel","ti-falco","ti-gatewayapi","ti-istio"],"kit":"1.0.0"};</script>
