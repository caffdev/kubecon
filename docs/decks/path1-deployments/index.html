<script>window.DECK = {"deck":"path1-deployments","title":"Path 1: Deployments as a service","draft":"main","drafts":{"main":["day-one","abstraction-depth","peers","stage-zero","guardrails-first","canary-gate","ramps","one-label","no-cluster-names","promotion-pr","the-trade","stage-a","reloader","stage-b","freeze-windows","stages-c-d","stage-e","the-ask"]},"size":[1920,1080],"slides":{"abstraction-depth":{"title":"What day one measures","notes":"\u003cp>Our first reaction, when we heard that quote, was this one. We are never going to let someone deploy to prod on day one. Day one, they can't find the bathroom.\u003c/p>\n\u003cp>Get the laugh. Then: that's not what they meant, and it's not what we're asking for.\u003c/p>\n\u003cp>\"Day one\" doesn't measure trust in new hires. It measures how much of our platform a person has to understand before they can ship. CVS didn't make production safer by trusting people more. They made the path so constrained that trust stopped being the variable.\u003c/p>\n\u003cp>So here's what a developer has to carry today. Click. Which cluster their app runs in. Click. When to click sync, and whether to. Click. Whether there's a change freeze on. Click. Which of our rules their manifest breaks. Click. How to roll back.\u003c/p>\n\u003cp>Every one of those has an owner later in this deck: the letter on the right is the stage that takes it off the pack. The first one belongs to Path 3, the fleet.\u003c/p>\n\u003cp>And our peers have already taken those off the pack.\u003c/p>","plan":{"Act":"I","Job":"defuse the \"new hires in prod\" objection and reframe what day one measures","Headline":"Day one measures how much of our platform a developer has to understand before they can ship.","Visual":"the joke as one small line at the top (\"Day one they can't find the bathroom.\"). Below it, the five things a developer has to know today, stacked like a pack, each tagged with the stage that takes it off","Energy":"3","Into next":"our peers have already taken those off the pack."}},"canary-gate":{"title":"Canary with analysis","notes":"\u003cp>If you remember one mechanism from this deck, make it this one.\u003c/p>\n\u003cp>A Rollout is the workload's spec, in Git. It sends a share of traffic to the new version and pauses. An AnalysisRun queries a metric, error rate or latency, and judges it against a threshold we wrote down in advance.\u003c/p>\n\u003cp>Click. When the analysis fails, the version reverts itself. Nobody is paged to make the call, nobody has to notice the graph. That automatic fail-back is the whole ask on this slide. A canary that waits for a human to look at a dashboard is just a slower outage.\u003c/p>\n\u003cp>The honest caveat: traffic-weighted canary needs a traffic router. A mesh, an ingress controller, ALB or VPC Lattice, or the Gateway API plugin, whose maturity we still need to check against the Argo Rollouts docs. Which router we get comes out of the networking work, not this path. Better to say that now than have someone discover it in Q&A.\u003c/p>\n\u003cp>And percentage ramps don't fit everything we run.\u003c/p>","plan":{"Act":"II","Job":"the one mechanism to remember: the gate reverts a version without being asked","Headline":"A canary without automated analysis is just a slower outage.","Visual":"a track: Rollout → setWeight → AnalysisRun → fail → revert. Only the revert is in the accent. A quiet caveat: traffic-weighted canary needs a router, and the networking thread chooses it","Energy":"4","Into next":"and percentage ramps don't fit everything we run."}},"day-one":{"title":"Day one","notes":"\u003cp>This is CVS Health, on the main stage on Wednesday. Read it with me: approachable enough that someone joining the company could ship a new application on their very first day.\u003c/p>\n\u003cp>That's the bar they set for their platform. Not a tooling migration, not a number of clusters. Developer onboarding time. They spent two years on it, and the control plane they built is being open-sourced.\u003c/p>\n\u003cp>Pause. Our first reaction was probably the same as yours.\u003c/p>","plan":{"Act":"I","Job":"open on the bar, in the speaker's own words","Headline":"\"…someone joining the company could ship a new application on their very first day.\"","Visual":"the quote set huge, flush left, with its attribution small beneath. Nothing else on the slide","Energy":"3","Into next":"our first reaction was probably the same as yours.","Source":"CVS Health keynote abstract, Michael Amundson and Jim Beyers, Nov 11"}},"freeze-windows":{"title":"Freeze windows","notes":"\u003cp>And the freeze becomes something the cluster enforces. Today \"nothing goes out during the freeze\" means someone refusing to click.\u003c/p>\n\u003cp>The change record gets approved in the ITSM system, exactly as it is today. We project the approved record into the cluster as a custom resource. Policy reads that resource at admission. The decision worth defending is that admission never calls the ITSM API at request time. Admission is a hot path, and a policy that calls an external service fails closed the first time that service is slow.\u003c/p>\n\u003cp>The free half: Argo CD's own sync windows already handle the calendar freeze. Use them for that, and keep policy for \"this specific change needs a record\".\u003c/p>\n\u003cp>Only then does prod auto-sync go on. It's the last item in stage B, on purpose. This and the auto-sync work are one conversation, not two. Present them in sequence and someone funds auto-sync and defers the gating.\u003c/p>\n\u003cp>After B, promotion and the fleet.\u003c/p>","plan":{"Act":"III","Job":"show how change windows get enforced with no human and no hot-path dependency","Headline":"A freeze stops being someone refusing to click.","Visual":"change record approved → projected as a CRD → policy reads the CRD. Argo's own sync windows cover the calendar. Prod auto-sync is the last item in the stage","Energy":"3","Into next":"after B, promotion and the fleet."}},"guardrails-first":{"title":"Guardrails in the same change","notes":"\u003cp>Before we ask anyone to turn off the sync button, one rule, and it's a practice we're adopting, not a scare story.\u003c/p>\n\u003cp>Auto-sync ships with its guardrails in the same pull request. Not a follow-up ticket. One change.\u003c/p>\n\u003cp>The first line is the feature: auto-sync with self-heal, in non-prod only. Click. Prune can never reach stateful or cluster-critical resources. Click. Deletions go last, after everything else is healthy. Click. Prod keeps a sync window, and stays manual until stage B. Click. And we audit storage reclaim policy, because Delete is the default and it's the wrong default for data we care about.\u003c/p>\n\u003cp>The teams at the show who run GitOps at scale talked about these as a named practice with a checklist. It's what makes the guardrails look like part of the feature rather than overhead.\u003c/p>\n\u003cp>Now, what our peers run that we don't.\u003c/p>","plan":{"Act":"I","Job":"set the condition that makes auto-sync safe, as a practice we adopt","Headline":"Auto-sync ships with its guardrails in the same change, never as a follow-up ticket.","Visual":"a single pull request containing four items: prune protection on stateful and cluster-critical resources, PruneLast, a sync window on prod, a reclaimPolicy audit","Energy":"3","Into next":"now, what our peers run that we don't."}},"no-cluster-names":{"title":"No cluster names","notes":"\u003cp>A cluster name in an app repo is a bug. It hard-codes the one thing that live-live regions and rolling upgrades need to keep fluid.\u003c/p>\n\u003cp>So the developer stops writing a cluster name, the crossed-out line, and declares constraints instead: regions, compliance, capability. The platform resolves those to clusters.\u003c/p>\n\u003cp>And we already have the cheap first step. The ApplicationSet cluster generator matches clusters by label selector. It's in Argo CD today and costs nothing. Add rolling sync and that fan-out becomes waves: wave one, check health, wave two. OCM, Karmada and the cluster-inventory ClusterProfile work would all consume the same vocabulary if we ever needed them; we've seen ClusterProfile as a capability, not something we've run.\u003c/p>\n\u003cp>So this is a vocabulary problem more than a tooling problem. The vocabulary is Path 3's first stage, and it's the entry gate for stage D on this path.\u003c/p>\n\u003cp>Last mechanism: how a version moves between environments.\u003c/p>","plan":{"Act":"II","Job":"name the vocabulary the fleet stages depend on","Headline":"A cluster name in an app repo is a bug.","Visual":"the YAML a developer writes (regions, compliance, capability, residency) beside the ApplicationSet cluster generator that resolves it by label selector","Energy":"3","Into next":"last mechanism: how a version moves between environments.","Source":"GOALS §5.5; the label vocabulary is Path 3 stage 1 and stage D's entry gate here"}},"one-label":{"title":"One label is the switch","notes":"\u003cp>This is the only canary pattern that works for things with no user traffic to split: admission webhooks, controllers, credential services. Which is most of what a platform team owns.\u003c/p>\n\u003cp>Five moves. Isolate: run a canary instance beside production with its own deployment, service, config, and its own database schema and user. Route: only one dedicated canary-test namespace can reach it, using a namespace selector. No proxy, no mesh; the API server does the routing. Validate: run twenty-plus real workflows on real nodes against real data. Gate: an Argo CD PostSync hook job; exit zero advances, exit one fails the sync. Promote: cluster by cluster, automatically on pass.\u003c/p>\n\u003cp>On the right is why you build the gate rather than a dashboard. A loud webhook outage got caught in about thirty minutes. A silent webhook change that quietly stripped GPUs from job specs lasted about two days. That's the bars, to scale. No human watching a graph catches the quiet ones.\u003c/p>\n\u003cp>That pattern selects on labels. So should everything else.\u003c/p>","plan":{"Act":"II","Job":"show the canary pattern for platform services, which is most of what we own","Headline":"For services with no traffic to split, one namespace label is the switch.","Visual":"five moves in sequence (isolate, route by namespaceSelector, validate on 20+ real workflows, gate on a PostSync hook, promote cluster by cluster). Beside it: a loud failure caught in about 30 minutes versus a silent one that lasted about two days","Energy":"4","Into next":"that pattern selects on labels. So should everything else.","Source":"LinkedIn deck (`02-canary-namespaces-linkedin`)"}},"peers":{"title":"Our peers","notes":"\u003cp>Three companies, three measures, and none of them is \"we bought a tool\".\u003c/p>\n\u003cp>CVS Health set the goal as developer onboarding time: a new hire ships a new app on day one. Two years of work, and a control plane they're open-sourcing.\u003c/p>\n\u003cp>LinkedIn's canary pipeline for their cluster-critical services took a release from about a week to about an hour, validated automatically. Look at the bars: the hour is that sliver. And it caught more than ten incidents before they reached production.\u003c/p>\n\u003cp>Meta: about fifteen engineers run about a hundred clusters. That ratio is only possible if nobody is clicking anything.\u003c/p>\n\u003cp>And here is where we are.\u003c/p>","plan":{"Act":"I","Job":"prove it has been done, at our scale and above","Headline":"Our peers already made the deploy path invisible.","Visual":"three measures, each drawn as before → after: CVS day one; LinkedIn about a week → about an hour per release; Meta about 100 clusters run by about 15 engineers","Energy":"3","Into next":"and here is where we are."}},"promotion-pr":{"title":"Promotion as a PR","notes":"\u003cp>Last mechanism: how a version moves from dev to stage to prod. Promotion is becoming a pull request.\u003c/p>\n\u003cp>On the left, GitOps Promoter, which is our call. Each environment is a branch. A promotion is a commit and a pull request, with a commit status per environment. There's no state outside Git, so the PR is the audit record: the one artifact a human reviewer, an agent and an auditor all read. It composes with Argo's source hydrator, so Git holds what actually runs, with diffs a person can read.\u003c/p>\n\u003cp>On the right, Kargo: Warehouses, Freight and Stages, with its own control plane and UI. It fits complex pipelines and release managers who live in a UI, and Meta runs about a hundred clusters with it. It would be a second control plane for us.\u003c/p>\n\u003cp>What would flip it, stated so the decision looks as reversible as it is: per-environment commit status needs hand-wiring for auto-rollback; Promoter doesn't order across apps; and it's younger. Nearly every published comparison is written by someone with a stake, Akuity maintains both Argo CD and Kargo, so the answer is a two-week spike on one real app, not more reading. And the Kargo adoption figure in our notes came from a vendor post; we don't quote it.\u003c/p>\n\u003cp>So why haven't teams asked for any of this?\u003c/p>","plan":{"Act":"II","Job":"state the promotion call, and what would flip it","Headline":"Promotion becomes a pull request: GitOps Promoter first, Kargo as the fallback.","Visual":"two models side by side: Kargo's Warehouses → Freight → Stages with its own control plane, against Promoter's branch, commit and PR per environment with no state outside Git. What would flip it, written underneath","Energy":"3","Into next":"so why haven't teams asked for any of this?","Source":"GOALS §1.2; ⚠️ the Kargo adoption figure came from a vendor post"}},"ramps":{"title":"Where ramps break","notes":"\u003cp>This is LinkedIn's articulation, and it's the best one we heard.\u003c/p>\n\u003cp>Percentage ramps quietly assume three things about requests. That they're interchangeable: but a random ten percent means some users' critical jobs land on a version nobody validated. That they're balanced: but a percentage can't balance job types, and some types miss the ramp window entirely. That the change is divisible: but a schema migration is all or nothing. And that it's one component: but in a multi-component change, one request hits the new version of one service and the old version of the next.\u003c/p>\n\u003cp>This is why our canary answer is per workload class rather than one pattern for everything. If we're running long, this slide is the one to cut.\u003c/p>\n\u003cp>LinkedIn's answer for those cases needs no mesh at all.\u003c/p>","plan":{"Act":"II","Job":"explain why our canary answer is per workload class","Headline":"Percentage ramps assume requests are interchangeable, divisible and single-component.","Visual":"four broken assumptions, each a small picture: critical jobs on an unvalidated version, job types that miss the ramp, a schema migration that can't be split, a request that hits one new and one old component","Energy":"3","Into next":"LinkedIn's answer for those needs no mesh at all.","Source":"LinkedIn, canary namespaces for cluster-critical services"}},"reloader":{"title":"Reloader","notes":"\u003cp>Without this one, a GitOps config change reports success while the running pods keep serving the old value. That falsifies \"Git is the state of the world\" on the very day we say it.\u003c/p>\n\u003cp>Three places a config value can live, and they aren't interchangeable. A ConfigMap or Secret in our Git repo: Reloader rolls the deployments that use it, so it's commit, sync, roll. Good.\u003c/p>\n\u003cp>The middle row is the trap. When the value lives in Config Server's own backing config, Reloader rolls the config server, and its clients keep the cached value.\u003c/p>\n\u003cp>And client-side refresh scope, with an actuator refresh per instance, is out of band: Git no longer describes what's running.\u003c/p>\n\u003cp>Our lean, and this is ours, not from the show, and untested: make the roll the refresh mechanism. It needs one Spring-owning team to confirm which beans tolerate a restart. And it opens a question worth asking in the room: does any app's config genuinely need in-place refresh? If not, the config-server refresh path can retire, which is a simplification we'd get for free.\u003c/p>\n\u003cp>Stage B is the one that buys the trade.\u003c/p>","plan":{"Act":"III","Job":"close the config trap before it embarrasses us","Headline":"Reloader makes \"Git is the state of the world\" true for config too.","Visual":"three places a value can live, and what actually makes a pod see a change in each; the middle row (Config Server's own config) marked as the trap","Energy":"2","Into next":"stage B is the one that buys the trade.","Source":"ours, untested; no conference evidence"}},"stage-a":{"title":"Stage A","notes":"\u003cp>Here's the trade made concrete, starting with stage A, by January: Argo becomes a control loop, in non-prod.\u003c/p>\n\u003cp>Six items. Auto-sync with self-heal and prune, non-prod only; prod stays manual until stage B. The guardrails ship in the same change, which is the rule from earlier. Stakater Reloader, which gets its own slide next because it's the trust prerequisite. A drift policy by resource class: silent self-heal for cluster-critical things, alert first where a human may have hot-fixed something. An Argo CD upgrade. And a reclaim-policy audit on our storage classes.\u003c/p>\n\u003cp>The exit gate is how we know the stage is done rather than declared done: zero manual syncs in non-prod for four weeks, drift alerts going to a named owner, and a config change that demonstrably rolls the pods that use it.\u003c/p>\n\u003cp>And the first two weeks are deliberately small: one app, and the real deliverable is the list of everything that drifted. Nobody argues with a list of things that were already wrong.\u003c/p>\n\u003cp>One of those six items deserves its own slide.\u003c/p>","plan":{"Act":"III","Job":"the first stage, its six items and its exit gate","Headline":"Stage A, by January: Argo becomes a control loop in non-prod.","Visual":"the mint face with camp A lit; six items; the exit gate; the first two weeks (one app, and a written list of everything that drifted)","Energy":"3","Into next":"one of those six items deserves its own slide."}},"stage-b":{"title":"Stage B","notes":"\u003cp>Stage B is the trade from two slides ago, made real, and it's the least visible work on this whole path.\u003c/p>\n\u003cp>One policy set, written once in Git, with its own tests, so the policies themselves are code we review. It runs in two places. First in CI: kyverno apply against the manifests and the cloud plans before anything merges. A violation becomes a ninety-second test failure, for a person or for an agent, and an agent can iterate against a test failure. It can't iterate against a rejected sync at two in the morning.\u003c/p>\n\u003cp>Then at admission. The hot path is CEL ValidatingAdmissionPolicy, which runs in-process in the API server, so there's no webhook that can be down. Be honest about the flag: generating those CEL policies from our Kyverno set is a documented capability we haven't run yet. We verify it before anyone treats this box as a design.\u003c/p>\n\u003cp>Kyverno keeps what CEL can't express: generation, mutation chains, and verifyImages, with our own images signed by cosign in CI. verifyImages starts in audit mode.\u003c/p>\n\u003cp>The rule at the bottom is the one that matters for Path 2. Write policy against the action, not the actor. The policy that stops a person deploying a privileged container is the same one that bounds an agent, so most agent governance comes for free.\u003c/p>\n\u003cp>Stage B gates stage C here, and it gates phase 2 of the agent path. Nobody demos it, which is why it's the stage that gets deprioritised. And the freeze becomes something the cluster enforces.\u003c/p>","plan":{"Act":"III","Job":"the stage that pays for everything else, and the least visible work","Headline":"Stage B is the trade: one policy set, run in CI and at admission.","Visual":"four layers: CI (kyverno apply, 90-second failures), admission hot path (CEL ValidatingAdmissionPolicy), admission remainder (Kyverno), supply chain (cosign, verifyImages in audit). The rule underneath: write policy against the action, not the actor","Energy":"4","Into next":"and the freeze becomes something the cluster enforces.","Source":"⚠️ Kyverno generating VAP is a capability we haven't run"}},"stage-e":{"title":"Stage E","notes":"\u003cp>Stage E is the summit, and it's a 2028 decision, not a 2027 commitment: a team onboards an app with no platform ticket.\u003c/p>\n\u003cp>On the left is the pack from the start of the talk, and every item is crossed off, with the stage that took it. Which cluster: gone, Path 3's labels. When to click sync: gone, stage A. Whether there's a freeze, and which rules apply: gone, stage B. How to roll back: gone, stage D.\u003c/p>\n\u003cp>On the right, what the summit adds. Constraints instead of cluster names. Cost and ownership labels enforced at the same admission gate: unglamorous, and without it every cost tool draws the same pie chart nobody can attribute. Right-sizing as a pull request rather than a project, with KEDA for the signal and in-place resizing for the size, while watching the thrash where HPA, VPA and Karpenter all act on one workload. And one thing to watch rather than build: cost shown in the Argo CD UI at the moment of deploy.\u003c/p>\n\u003cp>Land this slowly. That's what day one meant. A developer who never learned a cluster name, never clicked sync, never read the policy list, and never rolled anything back by hand.\u003c/p>\n\u003cp>Here's what we need from this room.\u003c/p>","plan":{"Act":"III","Job":"echo the opening: this is what \"day one\" meant","Headline":"Stage E: a team onboards an app with no platform ticket.","Visual":"the summit, with the pack from slide 2 now empty: never learned a cluster name, never clicked sync, never read the policy list, never rolled back by hand","Energy":"3","Into next":"here's what we need from this room."}},"stage-zero":{"title":"Stage zero","notes":"\u003cp>Here's where we are, and let's say it without being defensive. Argo CD is installed in every cluster, on manual sync. That's stage zero, and it's honest.\u003c/p>\n\u003cp>But look at what that one button is standing in for. Promotion is a person editing YAML in another repo. Policy is a reviewer's memory; we have no policy engine. Rollback is a person and a Slack thread. Drift is something we discover by accident. And a config change can report success while the pods keep serving the old value.\u003c/p>\n\u003cp>A dashboard somebody clicks isn't a deployment platform. It's a deployment interface. Nothing downstream, promotion, canary, agents, has anything to drive until this changes.\u003c/p>\n\u003cp>Before we ask to turn that button off, one rule.\u003c/p>","plan":{"Act":"I","Job":"name the gap without defensiveness, so the room agrees on the starting point","Headline":"Today Argo CD is a dashboard somebody clicks.","Visual":"one large SYNC button, alone. Around it, five quiet labels for what that button stands in for: promotion, policy, rollback, drift, config reload","Energy":"2","Into next":"before we ask to turn it off, one rule."}},"stages-c-d":{"title":"Stages C and D","notes":"\u003cp>Two stages on one slide, because they're one piece of work from a funding point of view. The distinction to hold onto is commitment versus proof of concept.\u003c/p>\n\u003cp>Stage C is a commitment. A spike on Argo's source hydrator first, then GitOps Promoter on one app: dev to prod with nobody editing YAML. Agent-or-human attribution goes in the same stage, because it's cheap now and expensive to retrofit. And separation of duties in machinery we already run: whoever proposes a change can't approve its own pull request, the forge enforces the rules, and RBAC bounds each role. The honest gap: revoking a permission doesn't undo merges that already happened. Withdrawal isn't rollback.\u003c/p>\n\u003cp>Stage D is one commitment and one proof of concept. The commitment is fleet waves: ApplicationSets with rolling sync and a health gate between waves. The proof of concept is canary: two patterns, one pilot service each, time-boxed, and \"neither is worth it yet\" is an allowed answer. Even the proof of concept has automated analysis.\u003c/p>\n\u003cp>And a kill switch is not a rollback. Progressive delivery reverts a version; it can't turn off one behaviour inside a version. That's a feature flag's job, and CVS Health, the company we opened with, has the answer to that too.\u003c/p>\n\u003cp>The exit gate is deliberately brutal: a health gate nobody has watched fail is a health gate nobody should trust.\u003c/p>\n\u003cp>And then, the summit.\u003c/p>","plan":{"Act":"III","Job":"separate what we commit to from what we only evaluate","Headline":"Stages C and D: promotion is a PR, and the fleet rolls in waves with a gate that has failed at least once.","Visual":"two camps, C (commitment) and D (one commitment, one POC). A kill switch is not a rollback","Energy":"3","Into next":"and then the summit."}},"the-ask":{"title":"The ask","notes":"\u003cp>Five decisions, and four of them already have a lean, so this is about confirming, not deliberating. Take the objections, but let's not reopen promotion: the spike is how we test it.\u003c/p>\n\u003cp>Prod auto-sync comes after change-window gating, because the gating is what buys the permission. Promoter first, Kargo as the fallback, two-week spike. Change records projected as a CRD, because admission can't depend on an outside service. Canary as a proof of concept per workload class, where \"not yet\" is an allowed answer. Drift handled both ways, split by resource class. And one new question: does any app's config genuinely need in-place refresh? We lean no, and if so, the config-server refresh path retires.\u003c/p>\n\u003cp>The card on the right is the thing to repeat at the end. Stage B has no demo and no dashboard. A room that buys the trade and then funds only stage A has made things worse, because auto-sync without the policy layer is exactly the risk the guardrails exist for. It also gates the agent path's pull requests.\u003c/p>\n\u003cp>If we leave with one owner named, make it stage B's.\u003c/p>","plan":{"Act":"III","Job":"confirm the leans and protect the one invisible stage","Headline":"Confirm five leans and protect stage B's headcount.","Visual":"five decisions with our lean beside each, and a separate card: stage B gates stage C *and* Path 2 phase 2, so if one thing gets protected headcount, it's this","Energy":"4","Into next":"end"}},"the-trade":{"title":"The trade","notes":"\u003cp>This is the slide the deck exists to deliver.\u003c/p>\n\u003cp>Teams don't resist auto-sync because they like clicking. They resist it because manual sync is the only change control they have. Take the button away and you've taken away the one thing standing between a bad commit and production. Of course they say no.\u003c/p>\n\u003cp>So the offer isn't \"turn on auto-sync\". The offer is a trade. You stop clicking sync. Click. In exchange, nothing ships during a freeze, because the cluster enforces the window, not a person refusing to click. Click. Every policy violation fails in CI in ninety seconds, not at two in the morning. Click. And a bad version rolls itself back, because the analysis run fails and the rollout reverts it.\u003c/p>\n\u003cp>The letters are the stages that deliver each one. Two of the three come from stage B, which is why stage B is the one we'll ask you to protect.\u003c/p>\n\u003cp>Pause. Then: here's the trade made concrete, in five stages. And notice the order. The control comes back in a better form before the click goes away. Prod auto-sync is the last item in stage B, not the first thing we ask for.\u003c/p>","plan":{"Act":"III","Job":"the turn: make the offer the deck exists to make","Headline":"Stop clicking sync, and in exchange nothing ships in a freeze, policy fails in CI, and a bad version rolls itself back.","Visual":"the setup line small (\"Teams resist auto-sync because manual sync is the only change control they have\"), then the trade set large across the slide, with its three gains building one per click","Energy":"5","Into next":"here is the trade made concrete, in five stages."}}},"narrativeOrder":["day-one","abstraction-depth","peers","stage-zero","guardrails-first","canary-gate","ramps","one-label","no-cluster-names","promotion-pr","the-trade","stage-a","reloader","stage-b","freeze-windows","stages-c-d","stage-e","the-ask"],"kit":"1.0.0"};</script>
