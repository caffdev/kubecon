<script>window.DECK = {"deck":"eks-2030","title":"Built for the curve: KubeCon 2026 takeaways for our move to EKS, and our 2030","draft":"main","drafts":{"main":["cold-open","the-claim","skip-the-gpus","work-outgrows-us","retrofit-tax","twenty-thirty","five-moves","cluster-is-a-commit","upgrades-in-waves","guard-the-deletes","ten-line-contract","ci-is-the-gate","identity-not-secrets","mesh-on-a-budget","one-pipeline","every-dollar-has-an-owner","agent-is-a-workload","sandbox-per-session","the-loop","the-road","not-building","the-ask"]},"size":[1920,1080],"slides":{"agent-is-a-workload":{"title":"An agent is a workload","notes":"\u003cp>Move five: agents. The first thing to get right is what an agent is. It isn't a tool on someone's laptop. It's a workload, and a strange one.\u003c/p>\n\u003cp>GenbaNEXT put it in a table. A normal request takes milliseconds, costs nearly nothing, and gives the same answer twice. An agent task takes minutes, costs tokens, gives a different answer each time, carries state between steps, and when it fails, it fails after you've already paid for half of it.\u003c/p>\n\u003cp>Click. So here's our build, as a section through one agent pod. Inside: the Claude Agent SDK harness, in our own image. It's started by events: an alert, a webhook, a schedule. Its state lives outside the pod, in Postgres, the way Mastercard does it, so a restart resumes instead of starting over. And it writes in exactly one way: a merge request.\u003c/p>\n\u003cp>Click. IBM's line was the one I wrote down: you probably don't need an agent platform, you already run the parts. Uber ran over eight hundred thousand agent runs in one month on the same workflow engine it uses for everything else.\u003c/p>\n\u003cp>A workload that writes and runs its own code needs a stronger box than a normal pod.\u003c/p>","plan":{"Act":"III, move 5","Job":"reframe the agent. It isn't a laptop tool; it's a workload with a pod, an identity, a","Headline":"An agent is a workload: a pod, an identity, a budget","Visual":"GenbaNEXT's comparison as a table (a request vs an agent task) on the left. On the","Energy":"2","Into next":"\"A workload that writes and runs its own code needs a stronger box than a normal"}},"ci-is-the-gate":{"title":"CI is the gate","notes":"\u003cp>We're keeping Argo CD basic: no promotion tools, no progressive sync. So where does safety come from? Two gates, both boring.\u003c/p>\n\u003cp>The first gate is CI, before anything merges. It renders the chart, checks the schema, runs policy, and checks the rules the API server would reject anyway. Click. Ford runs hundreds of clusters this way, with pull requests coming from people, from AI and from bots. Deterministic CI means reviewers read the content, not the syntax.\u003c/p>\n\u003cp>The second gate is after the sync: an Argo CD PostSync hook, which is just a Job with one annotation. It runs a smoke test against the thing that just deployed. If it passes, the next wave goes. If it fails, the wave stops and a person gets paged; that's the red branch. Click. LinkedIn built exactly this and went from a week of hoping to an hour of proof, with more than ten incidents caught before production. EarnIn wires infrastructure tests into GitOps the same way, and caught cert-manager breaking silently and backups that never actually ran.\u003c/p>\n\u003cp>Now the pods are running. Who are they, and what are they allowed to touch?\u003c/p>","plan":{"Act":"III, move 2","Job":"without promoters or progressive sync, safety comes from deterministic CI before","Headline":"With plain Argo CD, CI and one hook are the gate","Visual":"a pipe: PR → CI valve (render, schema, policy, API rules) → merge → Argo CD sync →","Energy":"3","Into next":"\"Now the pods are running. Who are they, and what are they allowed to touch?\""}},"cluster-is-a-commit":{"title":"A cluster is a commit","notes":"\u003cp>Move one. A cluster is something we create from Git, and rebuild from Git, and nobody ever builds one by hand.\u003c/p>\n\u003cp>This is a section through one cluster. The bottom layer is infrastructure code: the VPC, the EKS cluster, the node pools, and one last thing, Argo CD. That's the only \"app\" the infra code ever installs. Everything above that line, the add-ons, Istio, Vault's agent, the apps, is Argo CD's job, from the same repo.\u003c/p>\n\u003cp>The tool for the bottom layer is a decision we still have to make: Terraform, or Cluster API, or ACK with kro. The cloud is there because it's open. The split is not open.\u003c/p>\n\u003cp>Click. Meta told exactly this story. About fifteen engineers, about a hundred clusters. Their line was \"Terraform didn't get fired, just reorged\". A one-line Helm change used to take up to a working day in their Terraform pipeline; now it's minutes.\u003c/p>\n\u003cp>Click. And the proof that rebuilds work: Nutanix lost thirty-nine clusters, which is coming up in two slides, and redeployed all thirty-nine from Git by day two.\u003c/p>\n\u003cp>Creating clusters is the easy half. Keeping fifty of them current is where the hours go.\u003c/p>","plan":{"Act":"III, move 1","Job":"clusters are created and rebuilt from Git. Nobody hand-builds one.","Headline":"A cluster is a commit, not a ticket","Visual":"a section through one cluster with two strata. Infra code (graphite) holds the VPC,","Energy":"3","Into next":"\"Creating clusters is the easy half. Keeping fifty of them current is where the","Notes":"Meta also used Kargo for promotion; we take only the split. 🔵 Decide the cluster","Sources":"Meta (abstract); `2026-11-10_gitops-meltdown…` \"Rebuilding clusters from Git\"."}},"cold-open":{"title":"Fifteen engineers, a hundred clusters","notes":"\u003cp>At KubeCon, Meta said about fifteen engineers run about a hundred Kubernetes clusters for AI research and inference. Here it is drawn to scale: the red bar is the team, the long bar is the clusters. One to six point seven.\u003c/p>\n\u003cp>Click. Nubank: five engineers run tracing for more than six thousand services. Same scale. The drawing breaks: at this scale, that bar is about forty slides wide.\u003c/p>\n\u003cp>Click. LinkedIn: an app team writes about ten lines, and the platform runs five million pods. That one would be thirty-four thousand slides wide.\u003c/p>\n\u003cp>None of them got there by hiring a big platform team. \"Big\" is a ratio, not a headcount. Here's what we think that means for us.\u003c/p>","plan":{"Act":"I","Job":"earn the room's attention with the show's most useful surprise: the biggest operators","Headline":"Fifteen engineers run Meta's hundred clusters","Visual":"the ratios drawn to scale at 13px per unit. Meta's 15 engineers (red hatch) against","Energy":"4","Into next":"\"None of them got there by hiring. Here's what we think that means for us.\"","Sources":"\"We Have GitOps at Home\" (Meta, abstract); `2026-11-10_tracing-at-scale…nubank`"}},"every-dollar-has-an-owner":{"title":"Every dollar has an owner","notes":"\u003cp>If we grow exponentially, so does the bill. So every dollar needs an owner from the first cluster, not after the first finance review.\u003c/p>\n\u003cp>Adobe drew the problem at the show. The AWS bill comes per account. Ownership is per team. Teams spread across clusters and accounts, and by default nothing lines up.\u003c/p>\n\u003cp>Click. Four meters. Pods: a team label on everything, enforced at admission, so it's never optional. Packets: Adobe priced network flows with eBPF, because cross-AZ, peering and internet egress all cost differently. Series: Yahoo's hundred and forty thousand a year was one cluster's metrics. And tokens: Verkada's triage agent costs about twenty-seven cents for a five-call investigation and a dollar twenty-nine past twenty-five calls. Mastercard said the same thing: once agents run off a laptop, they need budgets and attribution.\u003c/p>\n\u003cp>Tokens bring us to move five: the agents.\u003c/p>","plan":{"Act":"III, move 4","Job":"exponential growth means exponential bills. Cost is attributed per team, per agent","Headline":"Every dollar has an owner: pods, packets, series and tokens","Visual":"Adobe's problem drawn: one \"AWS bill, per account\" box fanning out on dashed","Energy":"3","Into next":"\"Tokens bring us to move five: the agents.\""}},"five-moves":{"title":"Five moves","notes":"\u003cp>Five moves. Think of them as the five sheets of a drawing set. Each one uses tools we already lean on, and each one is already running at a company that presented.\u003c/p>\n\u003cp>Click. One: clusters are cattle. EKS, Karpenter, plain Argo CD. Meta and NVIDIA.\u003c/p>\n\u003cp>Click. Two: apps on a contract. One Helm chart, CI, and a PostSync hook. LinkedIn and Ford.\u003c/p>\n\u003cp>Click. Three: identity, not secrets. Vault, Istio, EKS Pod Identity. Coinbase and Yahoo.\u003c/p>\n\u003cp>Click. Four: one telemetry pipeline, feeding the Prometheus, Grafana and Splunk we already have. Nubank and Yahoo.\u003c/p>\n\u003cp>Click. Five: agents are workloads, built on the Claude Agent SDK and run on EKS. Verkada and Mastercard.\u003c/p>\n\u003cp>And what's not in the set: GPUs, the advanced Argo promotion tools, and a second orchestrator.\u003c/p>\n\u003cp>Move one: stop treating clusters as places.\u003c/p>","plan":{"Act":"II","Job":"orient the bridge. Map the five moves to our stack, so the next twelve slides have a","Headline":"Five moves, all on the stack we already chose","Visual":"five drawing sheets with zero radius, a double frame and a title block. Each shows the","Energy":"2","Into next":"\"Move one: stop treating clusters as places.\""}},"guard-the-deletes":{"title":"Guard the deletes","notes":"\u003cp>This was the cautionary tale of the show. Nutanix ran thirty-nine production clusters from one management cluster through GitOps. An admin, changing something else, deleted the top-level object of the tree. Pruning did exactly what it was built to do: it deleted everything under it.\u003c/p>\n\u003cp>The timeline: twelve minutes in, the delete stalled, because the GitOps controller had deleted itself. Eight hours later they restored the controller, it read the same desired state, and finished the job: all thirty-nine clusters gone. Two days to get the clusters back, two more for the apps. And the backups were twelve hours old and had never been restore-tested.\u003c/p>\n\u003cp>They used Flux. The same shape exists in Argo CD's app-of-apps. Four guards, all basic.\u003c/p>\n\u003cp>Click. One: no single root owns the fleet. One Application per cluster, and Argo CD bootstrapped on its own.\u003c/p>\n\u003cp>Click. Two: make bulk delete hard. The Prune=false sync option on clusters and stateful infrastructure, and an in-tree CEL admission policy that refuses deletes on them. We'll check the exact option names against our Argo CD version.\u003c/p>\n\u003cp>Click. Three: data outlives objects. Retain on the storage class, and Git hosted outside the clusters it drives.\u003c/p>\n\u003cp>Click. Four: restore on a schedule. Their new targets are an hour of data loss and thirty minutes to restore, proven on a game day.\u003c/p>\n\u003cp>Move two is about the apps, and keeping Argo CD boring.\u003c/p>","plan":{"Act":"III, move 1","Job":"tell the cautionary tale. One wrong desired state, applied faithfully, deleted 39","Headline":"One commit deleted 39 clusters. Four guards stop it.","Visual":"Nutanix's four days as a timeline with dimensioned gaps (12 min, ~8 h, 1–2 days,","Energy":"4","Into next":"\"Move two is about the apps, and about keeping Argo CD boring.\"","Notes":"Nutanix ran Flux. The failure, a self-managing root that prunes everything under it,"}},"identity-not-secrets":{"title":"Identity, not secrets","notes":"\u003cp>Move three: identity, not secrets.\u003c/p>\n\u003cp>Top left is how most platforms start: a password in an environment variable. Long-lived, copied into places, never rotated. We void that from the first cluster.\u003c/p>\n\u003cp>Instead, every pod gets one identity. Istio already gives each pod a SPIFFE ID, built from its namespace and service account, and a short-lived certificate for mutual TLS. Vault trusts the same identity through its Kubernetes auth and hands out database credentials that expire. And AWS access goes through EKS Pod Identity, so there are no static AWS keys anywhere.\u003c/p>\n\u003cp>Click. Coinbase did this the hard way, as a retrofit. They replaced a homegrown auth system with SPIFFE across more than four thousand services in seventy-nine clusters. CPU dropped seventy percent. Each hop got four to ten milliseconds faster, about fifty milliseconds off a typical service chain. And they got to a hundred percent adoption.\u003c/p>\n\u003cp>RBC's talk title says the rest: Kubernetes Secrets were a bad idea.\u003c/p>\n\u003cp>Istio gives us that identity. At scale it will also give us two million metric series, if we let it.\u003c/p>","plan":{"Act":"III, move 3","Job":"every workload, person and agent gets a short-lived identity, and secrets are issued","Headline":"Every pod gets an identity, not a password","Visual":"before: `DB_PASSWORD=hunter2`, voided and struck through. After: one pod with a","Energy":"3","Into next":"\"Istio gives us that identity. At scale it will also give us two million metric"}},"mesh-on-a-budget":{"title":"Mesh on a budget","notes":"\u003cp>Istio gives us identity. At scale, it also gives us metrics: lots of them, because every pair of services talking makes its own series. It's an n-squared problem.\u003c/p>\n\u003cp>Yahoo measured one production cluster: twenty-four thousand pods in the mesh, four hundred thousand requests a second, and two point oh six million active Istio metric series. That's the long bar. They aggregated in two stages inside the cluster, per node and then across the cluster, before anything left for the backend. Two hundred and eighty thousand series. That's the short bar, drawn to the same scale. Eighty-six percent fewer, and about a hundred and forty thousand dollars a year back, on that one cluster.\u003c/p>\n\u003cp>Click. Two more rules from the show. Rapido, at ten thousand pods, cut config churn by scoping what each proxy has to track to its namespace. And GEICO runs Cilium default-deny underneath Istio, for the things a mesh can't see: UDP, traffic that bypasses the sidecar, and system pods.\u003c/p>\n\u003cp>Click. And one decision we owe ourselves before the first production cluster: sidecar or ambient. Coinbase is moving to ambient.\u003c/p>\n\u003cp>That cardinality lesson is the whole observability story in miniature.\u003c/p>","plan":{"Act":"III, move 3","Job":"Istio at scale works when its config and its telemetry are scoped from the start.","Headline":"Istio scales when we scope it on day one","Visual":"Yahoo's series drawn to scale: a 2.06M bar against a 280K bar, with a dimension line","Energy":"4","Into next":"\"That cardinality lesson is the whole observability story in miniature.\"","Notes":"🔵 Decide sidecar vs ambient before the first prod cluster. Coinbase is moving to"}},"not-building":{"title":"What we will not build","notes":"\u003cp>What we won't build matters as much as what we will. A startup's plan has to stay small enough to actually finish.\u003c/p>\n\u003cp>No GPUs, no model serving. We call Claude.\u003c/p>\n\u003cp>No second orchestrator and no second cloud. EKS, on AWS.\u003c/p>\n\u003cp>No Kargo, no GitOps Promoter, no progressive sync. Plain Argo CD, with CI and a PostSync hook as the gates.\u003c/p>\n\u003cp>No agent framework of our own. The Claude Agent SDK is the brain; we build the box it runs in.\u003c/p>\n\u003cp>No new observability backend. Prometheus, Grafana and Splunk stay; we put one pipeline in front of them.\u003c/p>\n\u003cp>And no agent platform product. IBM's point was that you already run the parts.\u003c/p>\n\u003cp>That leaves three things to decide today.\u003c/p>","plan":{"Act":"IV","Job":"keep the plan small enough for a startup by naming what we deliberately skip.","Headline":"What we will not build","Visual":"a deletion list. Six items are voided and struck through in graphite, each with an","Energy":"2","Into next":"\"That leaves three things to decide today.\""}},"one-pipeline":{"title":"One pipeline","notes":"\u003cp>Move four: one telemetry pipeline. We keep Prometheus, Grafana and Splunk. What we add is one OpenTelemetry tier in front of them.\u003c/p>\n\u003cp>Read it left to right. Thousands of services, but they're instrumented once, in a handful of shared libraries: HTTP, Kafka, the database clients. Everything goes through an OTel agent on each node, then a gateway that aggregates and samples. Then out to the backends we already pay for: metrics to Prometheus and Grafana, logs and traces to Splunk. Changing a backend becomes exporter config. Nobody redeploys a service.\u003c/p>\n\u003cp>Click. Nubank runs this with five engineers at about twenty-three billion spans an hour. Their trick was instrumenting six libraries instead of four thousand services.\u003c/p>\n\u003cp>Click. Splunk co-presented the OTel Blueprints talk: one prescribed collector shape for every team. remberg ships Grafana dashboards as pull requests. And Best Buy's advice for incident response: page on SLO burn, not CPU, and put deploys on the timeline. That's the context our agents will need later, too.\u003c/p>\n\u003cp>Once every signal goes through one place, so can every dollar.\u003c/p>","plan":{"Act":"III, move 4","Job":"keep Prometheus, Grafana and Splunk, and put one OTel collector tier in front, so cost","Headline":"One pipeline feeds Prometheus, Grafana and Splunk","Visual":"fan-in, fan-out. 49 service squares (for 4k+) converge on 6 shared-library boxes,","Energy":"2","Into next":"\"Once every signal goes through one place, so can every dollar.\""}},"retrofit-tax":{"title":"The retrofit tax","notes":"\u003cp>Here's the cost of hitting that wall late. Think of it as a revision table on a drawing: the changes you make after it's built.\u003c/p>\n\u003cp>Click. Revision A, Coinbase. Their service-to-service auth was homegrown and tightly tied to AWS. They replaced it with SPIFFE across more than four thousand services, and after a long tail of adoption, retired the old system in March 2025.\u003c/p>\n\u003cp>Click. Revision B, Cisco Meraki. A twenty-year-old monolith: five hundred services, a thousand database shards, five thousand hand-provisioned servers. Moving to Kubernetes meant writing a new contract between the platform and every app team.\u003c/p>\n\u003cp>Click. Revision C, Nutanix. One deleted object at the top of their GitOps tree pruned all thirty-nine production clusters. Four days to recover, and the backups were twelve hours old and had never been tested.\u003c/p>\n\u003cp>Click. Revision D is us, and it isn't drawn yet. That's the point. The tax they paid is the tax we skip, if we build these things in from the first cluster.\u003c/p>\n\u003cp>So what does \"built in from day one\" look like by 2030?\u003c/p>","plan":{"Act":"I","Job":"make the cost of waiting concrete. The scale stories were retrofit stories.","Headline":"Every scale story at the show was a retrofit","Visual":"a drawing's revision table. Rev A is Coinbase, B is Cisco Meraki and C is Nutanix,","Energy":"4","Into next":"\"So what does 'built for it from day one' look like by 2030?\""}},"sandbox-per-session":{"title":"Sandbox per session","notes":"\u003cp>An agent writes and runs code nobody reviewed. So each session gets a stronger box than a normal pod. This is an exploded drawing of one agent session: the pod in the middle, five parts pulled out.\u003c/p>\n\u003cp>Click. One: its own kernel. A sandboxed runtime, a microVM or gVisor, chosen with one field on the pod spec. AWS demoed hardware-isolated microVM pods on EKS doing exactly this.\u003c/p>\n\u003cp>Click. Two: its own identity. A service account per agent, which Istio turns into a SPIFFE identity. Bancolombia showed Istio policy deciding, per request, which agent may call which tool on behalf of which user.\u003c/p>\n\u003cp>Click. Three: keys it never sees. Vault brokers credentials onto its outbound calls; nothing sits in its environment.\u003c/p>\n\u003cp>Click. Four: an exit list. Egress goes through an allowlist, and the cloud metadata endpoint is blocked.\u003c/p>\n\u003cp>Click. Five: limits and an off switch. Per-session CPU, tokens and time, and when the pod is deleted, its access ends. Those five come from Infisical's demo, and they map one-to-one onto Vault and Istio, which we already chose.\u003c/p>\n\u003cp>Click. One honest disagreement from the show. Mastercard says no MCP and no shell, just functions. Verkada says MCP is boring plumbing. Both agree that the boundary matters more than the protocol, and the boundary is what we're building.\u003c/p>\n\u003cp>So what do the agents do first? The thing that's eating us: toil.\u003c/p>","plan":{"Act":"III, move 5","Job":"each agent session gets its own sandbox, identity, credentials and egress allowlist.","Headline":"Each agent session gets its own box, keys and exits","Visual":"an exploded assembly: one agent-session pod in the centre, with five numbered parts","Energy":"3","Into next":"\"So what do the agents do first? The thing that's eating us: toil.\""}},"skip-the-gpus":{"title":"Skip the GPUs","notes":"\u003cp>Let's get this out of the way. KubeCon this year was an AI conference. About two hundred of the five hundred talks had AI, agents, GPUs or models in the title.\u003c/p>\n\u003cp>And a third of those, the crossed-out squares, were about running models: GPUs, inference servers, schedulers for training jobs. We will never run our own models. We call Claude. So we skip all of that, on purpose, and we don't feel bad about it.\u003c/p>\n\u003cp>What's left, the dark squares, is agents, identity, platforms, delivery and observability. That's the part that bites a company growing as fast as we plan to.\u003c/p>","plan":{"Act":"I","Job":"clear the field. Much of the show's AI content (GPUs, inference, DRA, serving,","Headline":"A third of the AI talks were about running models. We never will.","Visual":"the 199 AI-titled talks as unit squares in ten rows. The 65 about running models are","Energy":"2","Into next":"\"What's left is the part that bites a company growing as fast as we plan to.\"","Data":"199 of 501 talks have AI, LLM, agents, GPU, inference, MCP or models in the title."}},"ten-line-contract":{"title":"Ten-line contract","notes":"\u003cp>Move two: apps on a contract.\u003c/p>\n\u003cp>On the left is LinkedIn's real deployment spec. That's all an app team writes: a name, a replica count, a version, CPU and memory. About ten lines.\u003c/p>\n\u003cp>On the right is what the platform owns, which is everything else: the shape of the pod spec, the init containers it injects, the runtime contract, volumes, security, placement, and a policy that stops teams setting their own node selectors. Behind those ten lines LinkedIn runs five million pods and a hundred and ten thousand deploys a week.\u003c/p>\n\u003cp>Click. They aren't alone. Cisco Meraki's migration talk called Kubernetes a new platform contract, not an infrastructure swap. Meta replaced hand-written YAML with an order form. ŌURA cut their customer-facing code by about ninety-three percent.\u003c/p>\n\u003cp>Click. Ours: one golden Helm chart, a short values file, and one plain Argo CD Application per app. The migration to EKS is the moment to impose it. An app moves on the contract, or it doesn't move yet.\u003c/p>\n\u003cp>If app teams write ten lines, something has to catch the bad ones. With plain Argo CD, that's CI.\u003c/p>","plan":{"Act":"III, move 2","Job":"every app crosses to EKS on a short contract the platform owns. The migration is the","Headline":"Every app crosses to EKS on a ten-line contract","Visual":"LinkedIn's real 10-line `LiDeployment` in a frame, with a vertical dimension","Energy":"2","Into next":"\"If app teams write ten lines, something has to catch the bad ones. With plain"}},"the-ask":{"title":"The ask","notes":"\u003cp>We started with Meta, Nubank and LinkedIn: small teams, very big estates. Big is a ratio. There's a fourth row now, in dashed red, and it's ours in 2030. It's dashed because we haven't agreed the numbers yet. Agreeing them is part of the ask.\u003c/p>\n\u003cp>Three things.\u003c/p>\n\u003cp>Click. One: the five moves are the design bar for the first production EKS cluster. If we make an exception, we write it down.\u003c/p>\n\u003cp>Click. Two: the 2030 spec sheet is our north star, and we check it once a year against the tests on each rung.\u003c/p>\n\u003cp>Click. Three: one agent in the first quarter of 2027. Alert triage, read-only, running on EKS, and by the end of the second quarter we know what each alert costs us.\u003c/p>\n\u003cp>We're early enough to build from the first cluster what they had to retrofit. Let's do that.\u003c/p>","plan":{"Act":"IV","Job":"close by echoing the open. Put our row on the ratio chart, and ask for three concrete","Headline":"Approve the five rules for cluster one, and start one agent","Visual":"the cold open's ratio rows return, small: Meta to scale, Nubank and LinkedIn with","Energy":"4","Into next":"the end. The one sentence stays on screen for questions."}},"the-claim":{"title":"The claim","notes":"\u003cp>Here's the one sentence for the whole talk. We are early enough to build, from the first EKS cluster, what the big operators had to retrofit.\u003c/p>\n\u003cp>This curve is the shape of the next four years if we grow the way we plan to. We are here, at the bottom left, before the bend. Every company you'll hear about today hit the bend first and fixed their platform afterwards, while it was running. That's expensive.\u003c/p>\n\u003cp>We get to do it the other way round: decide how a cluster, a service and an agent are made before there are a hundred of them.\u003c/p>\n\u003cp>First, what we're leaving on the floor in Salt Lake City.\u003c/p>","plan":{"Act":"I","Job":"state the one sentence early. Our advantage is timing.","Headline":"We can build from day one what they had to retrofit","Visual":"the claim at 112px. An exponential curve is plotted 2026–2030, with a red \"we are","Energy":"2","Into next":"\"First, what we're leaving on the floor in Salt Lake City.\""}},"the-loop":{"title":"The loop","notes":"\u003cp>This is the slide the whole deck has been building to. On the left, the loop. On the right, its parts list: who already runs each station.\u003c/p>\n\u003cp>Click. One: a signal, a Prometheus alert, a CVE, a new EKS version. Two: an agent session picks it up, in its own sandbox, with Vault keys and an Istio identity. Verkada does this for forty-seven hundred alerts a month. Mastercard's agent has no shell; it only gets tools.\u003c/p>\n\u003cp>Click. Three: the agent opens a merge request; at monday.com eighty percent of PRs are zero-touch. Four: CI checks it, the same CI for people and AI, as at Ford. Five, the red one: a person approves. Still true in 2030.\u003c/p>\n\u003cp>Click. Six: plain Argo CD syncs the first wave; Mastercard does this across a hundred and fifty EKS clusters. Seven: the PostSync check; LinkedIn took that from a week of hoping to an hour of proof. Eight: Grafana and Splunk confirm. Nine: the next wave, or stop and page. NVIDIA's agent stops on a failed status.\u003c/p>\n\u003cp>Click. Watch one change go round. Same rails as ours. The toil curve stops landing on people. That's 2030. Here's the road from where we are.\u003c/p>","plan":{"Act":"III, move 5 (**peak**)","Job":"the turn. Agents work the fleet's toil through the same rails people use, so the work","Headline":"Agents work the toil through the same rails we do","Visual":"a schematic loop with nine numbered balloons; balloon 5, \"Approve\", is red: the one","Energy":"5","Into next":"\"That's 2030. Here's the road from where we are.\""}},"the-road":{"title":"The road","notes":"\u003cp>Here's the road, one rung a year. Each rung has a test we can fail, so we'll know whether we're on it.\u003c/p>\n\u003cp>Click. 2027 is the foundation. The first production EKS clusters are built from Git, and apps arrive on the ten-line contract. Vault and Istio identity from day one, and the OTel tier in front of Prometheus, Grafana and Splunk. And our first agent: alert triage, read-only. The test: can we rebuild a production cluster from Git in a day?\u003c/p>\n\u003cp>Click. 2028 is the move. Most apps are on EKS and on-prem is draining. A second AWS region. Upgrades go in waves with checks, and agents start opening the upgrade and CVE merge requests. The test: one Kubernetes minor version across the whole fleet in two weeks.\u003c/p>\n\u003cp>Click. 2029 is scale. Tens of clusters. Agents ship routine change with one human approval. Cost per team, per agent and per alert is on a dashboard. The test is the one that matters: the platform team stays flat while the cluster count doubles.\u003c/p>\n\u003cp>Click. And 2030 is the ratio: every line of the spec sheet, met. The test: our row belongs next to Meta's.\u003c/p>\n\u003cp>What we don't build matters just as much.\u003c/p>","plan":{"Act":"IV","Job":"turn the 2030 picture into four yearly rungs, each with a test we can fail.","Headline":"Four years, four rungs, each with a test we can fail","Visual":"a stair drawn in section: one tread per year, rising left to right. Above each tread","Energy":"3","Into next":"\"What we don't build matters just as much.\""}},"twenty-thirty":{"title":"2030 spec sheet","notes":"\u003cp>Here's 2030, written as a spec sheet. These are our proposed targets, not facts, and each one sits next to a company that already does it today.\u003c/p>\n\u003cp>A new EKS cluster: same day, from a pull request, no tickets. Meta does that with about fifteen people.\u003c/p>\n\u003cp>A Kubernetes minor version across the whole fleet in under two weeks. LinkedIn does it in seven business days across two hundred and fifty clusters.\u003c/p>\n\u003cp>A new service is about ten lines from the app team. Zero long-lived secrets in pods. Every alert gets a first look from an agent in minutes, for cents. Routine change is opened by agents and approved by a person; that row is red because a person stays in it.\u003c/p>\n\u003cp>Every dollar has an owner. And the footprint: at least two AWS regions, and on-prem exited. That last one has a cloud around it because we haven't decided it. Fully exit, or keep on-prem as one more cluster run exactly like the others?\u003c/p>\n\u003cp>Five moves get us there. Each one is already running at a company that spoke last week.\u003c/p>","plan":{"Act":"II","Job":"show the after: the 2030 operating state, expressed as ratios and times instead of","Headline":"2030: a new cluster, service or agent is a pull request","Visual":"a spec table with eight rows (spec, 2030 target, already done by) and a blue stamp","Energy":"3","Into next":"\"Five moves get us there. Each one is already running at a company that spoke"}},"upgrades-in-waves":{"title":"Upgrades in waves","notes":"\u003cp>Creating clusters is the easy half. Keeping them current is where the hours go.\u003c/p>\n\u003cp>This is NVIDIA's slide. They had two kernel CVEs land days apart. They wrote the fix and, in the same package, the check that fails if the fix didn't take. Then an agent applied it cluster by cluster. It polled the status field, the same one kubectl shows, moved on when it said complete, and stopped and called a person when it said erroring or blocked.\u003c/p>\n\u003cp>About fifty-six hundred nodes converged in thirty minutes, across sixteen clusters, unattended. And the agent did stop once: some clusters had tainted control-plane nodes, so it escalated, they fixed the config, and re-applied.\u003c/p>\n\u003cp>Click. Our version is simple. Every change goes dev, then one production canary cluster, then the rest. Between each wave is a check that has to pass. On EKS, AWS upgrades the control plane for us. We own the add-ons, the nodes, which we replace rather than patch, and the checks.\u003c/p>\n\u003cp>Waves make a good change fast. They make a bad change fast too.\u003c/p>","plan":{"Act":"III, move 1","Job":"upgrades and patches roll out in waves, each with a check that fails, so a person","Headline":"Ship every change with the check that proves it","Visual":"NVIDIA's status-gate slide, lifted as \"Detail A\" (`assets/nvidia-status-agent.png`,","Energy":"3","Into next":"\"Waves make a good change fast. They make a bad change fast too.\""}},"work-outgrows-us":{"title":"The work outgrows us","notes":"\u003cp>This is the problem in one picture. The black line is the work: every cluster times every release times every CVE. The red line is the team. Teams grow in a straight line, one hire at a time. The work doesn't.\u003c/p>\n\u003cp>The blue gap between them is toil. Someone does it by hand, or it doesn't get done.\u003c/p>\n\u003cp>LinkedIn put a formula on it. Upgrade time is rollouts times ramps times deploy-plus-soak, divided by your daily window. For three minor versions across two hundred and fifty clusters, done the normal way, that came to forty business days.\u003c/p>\n\u003cp>And this is what we wrote down ourselves on the show floor: lots of companies are running hundreds of clusters, and we can't keep doing manual upgrades.\u003c/p>\n\u003cp>Click. Then AI multiplies it. Mastercard's speaker had a nice pair: every CTO says AI means ten times the productivity; every CISO says it means ten times the vulnerabilities. Both are right, and both land on this curve.\u003c/p>\n\u003cp>Every big operator at the show hit this wall. The ones who hit it late paid for it.\u003c/p>","plan":{"Act":"I","Job":"set the stakes. Toil grows with clusters × releases × CVEs, which is faster than any","Headline":"The work grows faster than the team ever will","Visual":"an illustrative plot: work (graphite, exponential) against the team (red, linear), with","Energy":"3","Into next":"\"Every big operator at the show hit this wall. The ones who hit it late paid","Sources":"`Key lessons/Takaways`; `deck-assets/13-skip-level-upgrades/p02`, `p08`;"}}},"narrativeOrder":["cold-open","the-claim","skip-the-gpus","work-outgrows-us","retrofit-tax","twenty-thirty","five-moves","cluster-is-a-commit","upgrades-in-waves","guard-the-deletes","ten-line-contract","ci-is-the-gate","identity-not-secrets","mesh-on-a-budget","one-pipeline","every-dollar-has-an-owner","agent-is-a-workload","sandbox-per-session","the-loop","the-road","not-building","the-ask"],"kit":"1.0.0"};</script>
