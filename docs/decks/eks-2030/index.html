<script>window.DECK = {"deck":"eks-2030","title":"Built for the curve: KubeCon 2026 takeaways for our move to EKS, and our 2030","draft":"ten","drafts":{"main":["cold-open","the-claim","skip-the-gpus","work-outgrows-us","retrofit-tax","twenty-thirty","five-moves","cluster-is-a-commit","upgrades-in-waves","guard-the-deletes","ten-line-contract","ci-is-the-gate","identity-not-secrets","mesh-on-a-budget","one-pipeline","every-dollar-has-an-owner","agent-is-a-workload","sandbox-per-session","the-loop","the-road","not-building","the-ask"],"ten":["cold-open","before-the-bend","spec-for-2030","guard-the-deletes-ten","ten-lines-two-gates","identity-not-secrets-ten","one-pipeline-to-scale","agent-in-a-box","the-loop-ten","the-ask-ten"]},"size":[1920,1080],"slides":{"agent-in-a-box":{"title":"An agent in a box","notes":"\u003cp>Sheet five: agents. An agent isn't a tool on someone's laptop. It's a workload, and a strange one: it runs for minutes, costs tokens, gives a different answer each time, and runs code nobody reviewed.\u003c/p>\n\u003cp>So here's one agent session, exploded. In the middle, the Claude Agent SDK harness, in our own image, one pod per session. Events come in at the top: an alert, a webhook, a schedule. And there's exactly one way out, at the bottom: it writes merge requests. Nothing else.\u003c/p>\n\u003cp>Click. One: its own kernel, a microVM or gVisor, picked with one field on the pod spec; AWS demoed microVM pods on EKS. Click. Two: its own identity, a service account per agent, so Istio can say which agent may call which tool; Bancolombia showed that. Click. Three: keys it never sees; Vault puts them on its outbound calls. Click. Four: an exit list through Istio. Click. Five: caps on CPU, tokens and time, and an off switch: delete the pod.\u003c/p>\n\u003cp>Those five are from Infisical's demo, and every one is Vault, Istio or plain Kubernetes. As IBM put it: you probably don't need an agent platform; you already run the parts.\u003c/p>\n\u003cp>So what do the agents do first? The thing that's eating us: toil.\u003c/p>","plan":{"Act":"III, sheet 5 (agents are workloads)","Job":"an agent isn't a laptop tool; it's a workload in its own box, built from parts we","Headline":"An agent is a workload: its own pod, kernel, keys and exits","Visual":"an exploded assembly. One agent-session pod in the centre holding the Claude Agent","Energy":"3","Into next":"\"So what do the agents do first? The thing that's eating us: toil.\"","Sources":"AWS, Infisical, Bancolombia (abstracts); IBM, Mastercard (posted slides)."}},"agent-is-a-workload":{"title":"An agent is a workload","notes":"\u003cp>Move five: agents. The first thing to get right is what an agent is. It isn't a tool on someone's laptop. It's a workload, and a strange one.\u003c/p>\n\u003cp>GenbaNEXT put it in a table. A normal request takes milliseconds, costs nearly nothing, and gives the same answer twice. An agent task takes minutes, costs tokens, gives a different answer each time, carries state between steps, and when it fails, it fails after you've already paid for half of it.\u003c/p>\n\u003cp>Click. So here's our build, as a section through one agent pod. Inside: the Claude Agent SDK harness, in our own image. It's started by events: an alert, a webhook, a schedule. Its state lives outside the pod, in Postgres, the way Mastercard does it, so a restart resumes instead of starting over. And it writes in exactly one way: a merge request.\u003c/p>\n\u003cp>Click. IBM's line was the one I wrote down: you probably don't need an agent platform, you already run the parts. Uber ran over eight hundred thousand agent runs in one month on the same workflow engine it uses for everything else.\u003c/p>\n\u003cp>A workload that writes and runs its own code needs a stronger box than a normal pod.\u003c/p>","plan":{}},"before-the-bend":{"title":"Before the bend","notes":"\u003cp>Here's the one sentence for the whole talk. We can build, from the first EKS cluster, what the big operators had to retrofit.\u003c/p>\n\u003cp>The curves are illustrative. The black line is the work: every cluster, times every release, times every CVE. The red line is the team, and teams grow one hire at a time. The blue gap is toil: somebody does it by hand, or it doesn't get done. LinkedIn put a number on it: three Kubernetes minors across two hundred and fifty clusters, one at a time, is forty business days.\u003c/p>\n\u003cp>Click. Everyone we heard from hit the bend first, then rebuilt the platform while it was running. Revision A, Coinbase: a homegrown auth system replaced with SPIFFE across four thousand services.\u003c/p>\n\u003cp>Click. B, Cisco Meraki: a twenty-year monolith, moved onto a new contract between platform and app teams.\u003c/p>\n\u003cp>Click. C, Nutanix: one deleted object pruned thirty-nine production clusters, and it took four days to come back.\u003c/p>\n\u003cp>Click. Revision D is us, and it isn't drawn yet. We're here, before the bend. We get to decide how a cluster, a service and an agent are made before there are a hundred of them.\u003c/p>\n\u003cp>So what does \"built for it from day one\" look like by 2030?\u003c/p>","plan":{"Act":"I","Job":"state the one sentence, and the stakes, on one sheet. The work bends; teams don't; the","Headline":"We can build from day one what they had to retrofit","Visual":"the deck's cover sheet. Left: an illustrative plot. Work (graphite) bends upward","Energy":"3","Into next":"\"So what does 'built for it from day one' look like by 2030?\"","Sources":"Coinbase, Nutanix (posted slides); Meraki (abstract); LinkedIn's upgrade formula,"}},"ci-is-the-gate":{"title":"CI is the gate","notes":"\u003cp>We're keeping Argo CD basic: no promotion tools, no progressive sync. So where does safety come from? Two gates, both boring.\u003c/p>\n\u003cp>The first gate is CI, before anything merges. It renders the chart, checks the schema, runs policy, and checks the rules the API server would reject anyway. Click. Ford runs hundreds of clusters this way, with pull requests coming from people, from AI and from bots. Deterministic CI means reviewers read the content, not the syntax.\u003c/p>\n\u003cp>The second gate is after the sync: an Argo CD PostSync hook, which is just a Job with one annotation. It runs a smoke test against the thing that just deployed. If it passes, the next wave goes. If it fails, the wave stops and a person gets paged; that's the red branch. Click. LinkedIn built exactly this and went from a week of hoping to an hour of proof, with more than ten incidents caught before production. EarnIn wires infrastructure tests into GitOps the same way, and caught cert-manager breaking silently and backups that never actually ran.\u003c/p>\n\u003cp>Now the pods are running. Who are they, and what are they allowed to touch?\u003c/p>","plan":{}},"cluster-is-a-commit":{"title":"A cluster is a commit","notes":"\u003cp>Move one. A cluster is something we create from Git, and rebuild from Git, and nobody ever builds one by hand.\u003c/p>\n\u003cp>This is a section through one cluster. The bottom layer is infrastructure code: the VPC, the EKS cluster, the node pools, and one last thing, Argo CD. That's the only \"app\" the infra code ever installs. Everything above that line, the add-ons, Istio, Vault's agent, the apps, is Argo CD's job, from the same repo.\u003c/p>\n\u003cp>The tool for the bottom layer is a decision we still have to make: Terraform, or Cluster API, or ACK with kro. The cloud is there because it's open. The split is not open.\u003c/p>\n\u003cp>Click. Meta told exactly this story. About fifteen engineers, about a hundred clusters. Their line was \"Terraform didn't get fired, just reorged\". A one-line Helm change used to take up to a working day in their Terraform pipeline; now it's minutes.\u003c/p>\n\u003cp>Click. And the proof that rebuilds work: Nutanix lost thirty-nine clusters, which is coming up in two slides, and redeployed all thirty-nine from Git by day two.\u003c/p>\n\u003cp>Creating clusters is the easy half. Keeping fifty of them current is where the hours go.\u003c/p>","plan":{}},"cold-open":{"title":"Fifteen engineers, a hundred clusters","notes":"\u003cp>At KubeCon, Meta said about fifteen engineers run about a hundred Kubernetes clusters for AI research and inference. Here it is drawn to scale: the red bar is the team, the long bar is the clusters. One to six point seven.\u003c/p>\n\u003cp>Click. Nubank: five engineers run tracing for more than six thousand services. Same scale. The drawing breaks: at this scale, that bar is about forty slides wide.\u003c/p>\n\u003cp>Click. LinkedIn: an app team writes about ten lines, and the platform runs five million pods. That one would be thirty-four thousand slides wide.\u003c/p>\n\u003cp>None of them got there by hiring a big platform team. \"Big\" is a ratio, not a headcount. Here's what we think that means for us.\u003c/p>","plan":{"Act":"I","Job":"earn attention with the show's most useful surprise: the biggest operators run huge","Headline":"Fifteen engineers run Meta's hundred clusters","Visual":"kept from `main` unchanged. The ratios drawn to scale: Meta's 15 engineers (red","Energy":"4","Into next":"\"None of them got there by hiring. Here's what we think that means for us.\"","Sources":"Meta (abstract); Nubank, LinkedIn (posted slides)."}},"every-dollar-has-an-owner":{"title":"Every dollar has an owner","notes":"\u003cp>If we grow exponentially, so does the bill. So every dollar needs an owner from the first cluster, not after the first finance review.\u003c/p>\n\u003cp>Adobe drew the problem at the show. The AWS bill comes per account. Ownership is per team. Teams spread across clusters and accounts, and by default nothing lines up.\u003c/p>\n\u003cp>Click. Four meters. Pods: a team label on everything, enforced at admission, so it's never optional. Packets: Adobe priced network flows with eBPF, because cross-AZ, peering and internet egress all cost differently. Series: Yahoo's hundred and forty thousand a year was one cluster's metrics. And tokens: Verkada's triage agent costs about twenty-seven cents for a five-call investigation and a dollar twenty-nine past twenty-five calls. Mastercard said the same thing: once agents run off a laptop, they need budgets and attribution.\u003c/p>\n\u003cp>Tokens bring us to move five: the agents.\u003c/p>","plan":{}},"five-moves":{"title":"Five moves","notes":"\u003cp>Five moves. Think of them as the five sheets of a drawing set. Each one uses tools we already lean on, and each one is already running at a company that presented.\u003c/p>\n\u003cp>Click. One: clusters are cattle. EKS, Karpenter, plain Argo CD. Meta and NVIDIA.\u003c/p>\n\u003cp>Click. Two: apps on a contract. One Helm chart, CI, and a PostSync hook. LinkedIn and Ford.\u003c/p>\n\u003cp>Click. Three: identity, not secrets. Vault, Istio, EKS Pod Identity. Coinbase and Yahoo.\u003c/p>\n\u003cp>Click. Four: one telemetry pipeline, feeding the Prometheus, Grafana and Splunk we already have. Nubank and Yahoo.\u003c/p>\n\u003cp>Click. Five: agents are workloads, built on the Claude Agent SDK and run on EKS. Verkada and Mastercard.\u003c/p>\n\u003cp>And what's not in the set: GPUs, the advanced Argo promotion tools, and a second orchestrator.\u003c/p>\n\u003cp>Move one: stop treating clusters as places.\u003c/p>","plan":{}},"guard-the-deletes":{"title":"Guard the deletes","notes":"\u003cp>This was the cautionary tale of the show. Nutanix ran thirty-nine production clusters from one management cluster through GitOps. An admin, changing something else, deleted the top-level object of the tree. Pruning did exactly what it was built to do: it deleted everything under it.\u003c/p>\n\u003cp>The timeline: twelve minutes in, the delete stalled, because the GitOps controller had deleted itself. Eight hours later they restored the controller, it read the same desired state, and finished the job: all thirty-nine clusters gone. Two days to get the clusters back, two more for the apps. And the backups were twelve hours old and had never been restore-tested.\u003c/p>\n\u003cp>They used Flux. The same shape exists in Argo CD's app-of-apps. Four guards, all basic.\u003c/p>\n\u003cp>Click. One: no single root owns the fleet. One Application per cluster, and Argo CD bootstrapped on its own.\u003c/p>\n\u003cp>Click. Two: make bulk delete hard. The Prune=false sync option on clusters and stateful infrastructure, and an in-tree CEL admission policy that refuses deletes on them. We'll check the exact option names against our Argo CD version.\u003c/p>\n\u003cp>Click. Three: data outlives objects. Retain on the storage class, and Git hosted outside the clusters it drives.\u003c/p>\n\u003cp>Click. Four: restore on a schedule. Their new targets are an hour of data loss and thirty minutes to restore, proven on a game day.\u003c/p>\n\u003cp>Move two is about the apps, and keeping Argo CD boring.\u003c/p>","plan":{}},"guard-the-deletes-ten":{"title":"Guard the deletes","notes":"\u003cp>Sheet one: clusters are cattle. We build every cluster from Git and rebuild it from Git. Which tool writes the bottom layer, Terraform, Cluster API or ACK with kro, is still open. The rule isn't.\u003c/p>\n\u003cp>But that cuts both ways. Nutanix ran thirty-nine production clusters from one management cluster. An admin deleted the top-level object of the tree, and pruning did exactly what it was built to do. Twelve minutes in, the delete stalled, because the controller had deleted itself. Eight hours later they restored it, it read the same desired state, and finished the job: all thirty-nine gone. Four days to get clusters and apps back, and the backups had never been restore-tested. They ran Flux; Argo CD's app-of-apps has the same shape.\u003c/p>\n\u003cp>Four guards, all basic. Click. No single root owns the fleet: one Application per cluster. Click. Make bulk delete hard: Prune=false on clusters and stateful infrastructure, and a CEL policy that refuses deletes. The catch: we check those names on our Argo CD version first. Click. Data outlives objects: Retain on storage, and Git outside the clusters. Click. Restore on a schedule: an hour of data loss, thirty minutes to restore, proven on a game day.\u003c/p>\n\u003cp>The good news: they redeployed all thirty-nine from Git by day two. That's the fleet. Sheet two is the apps, and keeping Argo CD boring.\u003c/p>","plan":{"Act":"III, sheet 1 (clusters are cattle)","Job":"clusters are made and remade from Git, and that cuts both ways: one wrong desired state","Headline":"One commit deleted 39 clusters. Four guards stop it.","Visual":"Nutanix's four days as a dimensioned timeline (marked not to scale), then four","Energy":"4","Into next":"\"That's the fleet. Sheet two is the apps, and keeping Argo CD boring.\"","Notes":"Nutanix ran Flux; the shape is the same in Argo CD's app-of-apps. They also"}},"identity-not-secrets":{"title":"Identity, not secrets","notes":"\u003cp>Move three: identity, not secrets.\u003c/p>\n\u003cp>Top left is how most platforms start: a password in an environment variable. Long-lived, copied into places, never rotated. We void that from the first cluster.\u003c/p>\n\u003cp>Instead, every pod gets one identity. Istio already gives each pod a SPIFFE ID, built from its namespace and service account, and a short-lived certificate for mutual TLS. Vault trusts the same identity through its Kubernetes auth and hands out database credentials that expire. And AWS access goes through EKS Pod Identity, so there are no static AWS keys anywhere.\u003c/p>\n\u003cp>Click. Coinbase did this the hard way, as a retrofit. They replaced a homegrown auth system with SPIFFE across more than four thousand services in seventy-nine clusters. CPU dropped seventy percent. Each hop got four to ten milliseconds faster, about fifty milliseconds off a typical service chain. And they got to a hundred percent adoption.\u003c/p>\n\u003cp>RBC's talk title says the rest: Kubernetes Secrets were a bad idea.\u003c/p>\n\u003cp>Istio gives us that identity. At scale it will also give us two million metric series, if we let it.\u003c/p>","plan":{}},"identity-not-secrets-ten":{"title":"Identity, not secrets","notes":"\u003cp>Sheet three: identity, not secrets.\u003c/p>\n\u003cp>Top left is how most platforms start: a password in an environment variable. Long-lived, copied around, never rotated. We void that from the first cluster.\u003c/p>\n\u003cp>Instead, every pod gets one identity. Istio gives each pod a SPIFFE ID and a short-lived certificate for mutual TLS. Vault trusts the same identity and hands out database credentials that expire. And AWS access goes through EKS Pod Identity, so there are no static keys anywhere.\u003c/p>\n\u003cp>Click. Coinbase is revision A from the cover sheet. They did this as a retrofit, across four thousand services in seventy-nine clusters. CPU dropped seventy percent, each hop got four to ten milliseconds faster, and they reached a hundred percent adoption. We get that by turning it on before the first app arrives.\u003c/p>\n\u003cp>Click. One decision we owe ourselves before the first production cluster: sidecar or ambient mode for Istio. Coinbase is moving to ambient. It's in a cloud because it's open.\u003c/p>\n\u003cp>Istio gives us identity. At scale it will also give us two million metric series, if we let it.\u003c/p>","plan":{"Act":"III, sheet 3 (identity, not secrets)","Job":"every workload gets a short-lived identity and secrets expire: Vault, Istio and EKS Pod","Headline":"Every pod gets an identity, not a password","Visual":"before, `DB_PASSWORD=hunter2` voided and struck. After, one pod with a SPIFFE ID","Energy":"2","Into next":"\"Istio gives us identity. At scale it also gives us two million metric series, if","Sources":"Coinbase (posted slides). Rapido's and GEICO's scoping rules are cut; Coinbase"}},"mesh-on-a-budget":{"title":"Mesh on a budget","notes":"\u003cp>Istio gives us identity. At scale, it also gives us metrics: lots of them, because every pair of services talking makes its own series. It's an n-squared problem.\u003c/p>\n\u003cp>Yahoo measured one production cluster: twenty-four thousand pods in the mesh, four hundred thousand requests a second, and two point oh six million active Istio metric series. That's the long bar. They aggregated in two stages inside the cluster, per node and then across the cluster, before anything left for the backend. Two hundred and eighty thousand series. That's the short bar, drawn to the same scale. Eighty-six percent fewer, and about a hundred and forty thousand dollars a year back, on that one cluster.\u003c/p>\n\u003cp>Click. Two more rules from the show. Rapido, at ten thousand pods, cut config churn by scoping what each proxy has to track to its namespace. And GEICO runs Cilium default-deny underneath Istio, for the things a mesh can't see: UDP, traffic that bypasses the sidecar, and system pods.\u003c/p>\n\u003cp>Click. And one decision we owe ourselves before the first production cluster: sidecar or ambient. Coinbase is moving to ambient.\u003c/p>\n\u003cp>That cardinality lesson is the whole observability story in miniature.\u003c/p>","plan":{}},"not-building":{"title":"What we will not build","notes":"\u003cp>What we won't build matters as much as what we will. A startup's plan has to stay small enough to actually finish.\u003c/p>\n\u003cp>No GPUs, no model serving. We call Claude.\u003c/p>\n\u003cp>No second orchestrator and no second cloud. EKS, on AWS.\u003c/p>\n\u003cp>No Kargo, no GitOps Promoter, no progressive sync. Plain Argo CD, with CI and a PostSync hook as the gates.\u003c/p>\n\u003cp>No agent framework of our own. The Claude Agent SDK is the brain; we build the box it runs in.\u003c/p>\n\u003cp>No new observability backend. Prometheus, Grafana and Splunk stay; we put one pipeline in front of them.\u003c/p>\n\u003cp>And no agent platform product. IBM's point was that you already run the parts.\u003c/p>\n\u003cp>That leaves three things to decide today.\u003c/p>","plan":{}},"one-pipeline":{"title":"One pipeline","notes":"\u003cp>Move four: one telemetry pipeline. We keep Prometheus, Grafana and Splunk. What we add is one OpenTelemetry tier in front of them.\u003c/p>\n\u003cp>Read it left to right. Thousands of services, but they're instrumented once, in a handful of shared libraries: HTTP, Kafka, the database clients. Everything goes through an OTel agent on each node, then a gateway that aggregates and samples. Then out to the backends we already pay for: metrics to Prometheus and Grafana, logs and traces to Splunk. Changing a backend becomes exporter config. Nobody redeploys a service.\u003c/p>\n\u003cp>Click. Nubank runs this with five engineers at about twenty-three billion spans an hour. Their trick was instrumenting six libraries instead of four thousand services.\u003c/p>\n\u003cp>Click. Splunk co-presented the OTel Blueprints talk: one prescribed collector shape for every team. remberg ships Grafana dashboards as pull requests. And Best Buy's advice for incident response: page on SLO burn, not CPU, and put deploys on the timeline. That's the context our agents will need later, too.\u003c/p>\n\u003cp>Once every signal goes through one place, so can every dollar.\u003c/p>","plan":{}},"one-pipeline-to-scale":{"title":"One pipeline, to scale","notes":"\u003cp>Sheet four: one telemetry pipeline. We keep Prometheus, Grafana and Splunk. We add one OpenTelemetry tier in front: an agent on every node, a gateway per cluster.\u003c/p>\n\u003cp>This drawing is to scale. The band's height is Yahoo's Istio metric series on one production cluster: twenty-four thousand pods, two point oh six million active series. They collapsed it in two stages inside the cluster, per node and then across the cluster, and only the merged series leave. Two hundred and eighty thousand. Same traffic.\u003c/p>\n\u003cp>Click. Eighty-six percent fewer series, about a hundred and forty thousand dollars a year back, on one cluster. And once every signal goes through the gateway, a backend is just exporter config. Nobody redeploys a service to change where data goes.\u003c/p>\n\u003cp>Click. And the catch, because they said it out loud: sent to a second backend, the data read almost three times low, because several gateway pods wrote the same series in the same second. It isn't fixed yet. We'd test for that before we trust a dashboard.\u003c/p>\n\u003cp>The same gateway is where every dollar gets an owner, with a team label on every pod, enforced at admission. With that in place, we can afford the next workload: the agents.\u003c/p>","plan":{"Act":"III, sheet 4 (one telemetry pipeline)","Job":"keep Prometheus, Grafana and Splunk, put one OTel tier in front, and that tier is where","Headline":"One pipeline feeds the backends we keep, and sets what they cost","Visual":"a pipe drawn to scale. A hatched band whose height is Yahoo's active Istio series","Energy":"3","Into next":"\"Once every signal and every dollar goes through one place, we can afford the","Sources":"Yahoo, \"Two-Stage OTel Aggregation\" (posted slides). Nubank's five-engineer"}},"retrofit-tax":{"title":"The retrofit tax","notes":"\u003cp>Here's the cost of hitting that wall late. Think of it as a revision table on a drawing: the changes you make after it's built.\u003c/p>\n\u003cp>Click. Revision A, Coinbase. Their service-to-service auth was homegrown and tightly tied to AWS. They replaced it with SPIFFE across more than four thousand services, and after a long tail of adoption, retired the old system in March 2025.\u003c/p>\n\u003cp>Click. Revision B, Cisco Meraki. A twenty-year-old monolith: five hundred services, a thousand database shards, five thousand hand-provisioned servers. Moving to Kubernetes meant writing a new contract between the platform and every app team.\u003c/p>\n\u003cp>Click. Revision C, Nutanix. One deleted object at the top of their GitOps tree pruned all thirty-nine production clusters. Four days to recover, and the backups were twelve hours old and had never been tested.\u003c/p>\n\u003cp>Click. Revision D is us, and it isn't drawn yet. That's the point. The tax they paid is the tax we skip, if we build these things in from the first cluster.\u003c/p>\n\u003cp>So what does \"built in from day one\" look like by 2030?\u003c/p>","plan":{}},"sandbox-per-session":{"title":"Sandbox per session","notes":"\u003cp>An agent writes and runs code nobody reviewed. So each session gets a stronger box than a normal pod. This is an exploded drawing of one agent session: the pod in the middle, five parts pulled out.\u003c/p>\n\u003cp>Click. One: its own kernel. A sandboxed runtime, a microVM or gVisor, chosen with one field on the pod spec. AWS demoed hardware-isolated microVM pods on EKS doing exactly this.\u003c/p>\n\u003cp>Click. Two: its own identity. A service account per agent, which Istio turns into a SPIFFE identity. Bancolombia showed Istio policy deciding, per request, which agent may call which tool on behalf of which user.\u003c/p>\n\u003cp>Click. Three: keys it never sees. Vault brokers credentials onto its outbound calls; nothing sits in its environment.\u003c/p>\n\u003cp>Click. Four: an exit list. Egress goes through an allowlist, and the cloud metadata endpoint is blocked.\u003c/p>\n\u003cp>Click. Five: limits and an off switch. Per-session CPU, tokens and time, and when the pod is deleted, its access ends. Those five come from Infisical's demo, and they map one-to-one onto Vault and Istio, which we already chose.\u003c/p>\n\u003cp>Click. One honest disagreement from the show. Mastercard says no MCP and no shell, just functions. Verkada says MCP is boring plumbing. Both agree that the boundary matters more than the protocol, and the boundary is what we're building.\u003c/p>\n\u003cp>So what do the agents do first? The thing that's eating us: toil.\u003c/p>","plan":{}},"skip-the-gpus":{"title":"Skip the GPUs","notes":"\u003cp>Let's get this out of the way. KubeCon this year was an AI conference. About two hundred of the five hundred talks had AI, agents, GPUs or models in the title.\u003c/p>\n\u003cp>And a third of those, the crossed-out squares, were about running models: GPUs, inference servers, schedulers for training jobs. We will never run our own models. We call Claude. So we skip all of that, on purpose, and we don't feel bad about it.\u003c/p>\n\u003cp>What's left, the dark squares, is agents, identity, platforms, delivery and observability. That's the part that bites a company growing as fast as we plan to.\u003c/p>","plan":{}},"spec-for-2030":{"title":"2030 spec, the sheet index","notes":"\u003cp>Here's 2030 as a spec sheet, not a headcount. It's stamped preliminary because these are targets for us to agree. Each row is one sheet of the set: one move.\u003c/p>\n\u003cp>Sheet one: a new cluster comes from a pull request, the same day. LinkedIn already takes a Kubernetes minor across two hundred and fifty clusters in seven business days. Sheet two: a new service is about ten lines. Sheet three: zero long-lived secrets in pods. Sheet four: every metric series and every dollar has an owner.\u003c/p>\n\u003cp>Sheet five: an agent takes the first look at every alert, and opens the routine change. A person approves it. That line is red because a person stays in it, in 2030 too.\u003c/p>\n\u003cp>The footprint row is in a cloud because it's open: two AWS regions, yes, but do we exit on-prem fully, or keep it as one more cluster run like the others?\u003c/p>\n\u003cp>Along the bottom, what's not in the set. By a rough count of titles, about a third of the AI talks were about running models. We call Claude, so we skip all of it. No Kargo, no Promoter, no progressive sync, no second orchestrator.\u003c/p>\n\u003cp>Five sheets get us there. Sheet one is the clusters, and it starts with the worst day anyone described at the show.\u003c/p>","plan":{"Act":"II","Job":"show the after as a spec, not a headcount, and make it the index of the five moves, so","Headline":"2030: a new cluster, service or agent is a pull request","Visual":"a sheet index that is also a spec table. One row per sheet (balloon 1–5, the move,","Energy":"2","Into next":"\"Five sheets get us there. Sheet one is the clusters, and it starts with the","Data":"LinkedIn 7 business days for a minor across 250+ clusters, 5M+ pods (slides);"}},"ten-line-contract":{"title":"Ten-line contract","notes":"\u003cp>Move two: apps on a contract.\u003c/p>\n\u003cp>On the left is LinkedIn's real deployment spec. That's all an app team writes: a name, a replica count, a version, CPU and memory. About ten lines.\u003c/p>\n\u003cp>On the right is what the platform owns, which is everything else: the shape of the pod spec, the init containers it injects, the runtime contract, volumes, security, placement, and a policy that stops teams setting their own node selectors. Behind those ten lines LinkedIn runs five million pods and a hundred and ten thousand deploys a week.\u003c/p>\n\u003cp>Click. They aren't alone. Cisco Meraki's migration talk called Kubernetes a new platform contract, not an infrastructure swap. Meta replaced hand-written YAML with an order form. ŌURA cut their customer-facing code by about ninety-three percent.\u003c/p>\n\u003cp>Click. Ours: one golden Helm chart, a short values file, and one plain Argo CD Application per app. The migration to EKS is the moment to impose it. An app moves on the contract, or it doesn't move yet.\u003c/p>\n\u003cp>If app teams write ten lines, something has to catch the bad ones. With plain Argo CD, that's CI.\u003c/p>","plan":{}},"ten-lines-two-gates":{"title":"Ten lines, two gates","notes":"\u003cp>Sheet two: apps on a contract.\u003c/p>\n\u003cp>On the left is LinkedIn's real deployment spec. That's all an app team writes: a name, replicas, a version, CPU and memory. About ten lines. The platform owns everything else: pod shape, injected containers, security, placement.\u003c/p>\n\u003cp>Then there's one road to production. We're keeping Argo CD basic, with no promotion tools and no progressive sync, so safety comes from two boring gates.\u003c/p>\n\u003cp>Click. Gate one is CI before merge: render, schema, policy. Ford runs hundreds of clusters this way, with pull requests from people, AI and bots, and reviewers read the content, not the syntax.\u003c/p>\n\u003cp>Click. Gate two is after the sync: a PostSync hook, which is just a Job with one annotation. It smoke-tests what just deployed. Pass, and the next wave goes. Fail, and a person gets paged; that's the red branch. LinkedIn went from a week of hoping to an hour of proof.\u003c/p>\n\u003cp>Click. Ours: one golden Helm chart and a short values file. The move to EKS is the moment to impose it. An app moves on the contract, or it doesn't move yet.\u003c/p>\n\u003cp>Now the pods are running. Who are they, and what are they allowed to touch?\u003c/p>","plan":{"Act":"III, sheet 2 (apps on a contract)","Job":"every app crosses to EKS on a ten-line contract, and with plain Argo CD the only road","Headline":"App teams write ten lines; CI and one hook are the gates","Visual":"one drawing, left to right. LinkedIn's real 10-line `LiDeployment` in a frame with","Energy":"3","Into next":"\"Now the pods are running. Who are they, and what may they touch?\"","Sources":"LinkedIn, Ford (posted slides). The platform's owned items (pod shape, injected"}},"the-ask":{"title":"The ask","notes":"\u003cp>We started with Meta, Nubank and LinkedIn: small teams, very big estates. Big is a ratio. There's a fourth row now, in dashed red, and it's ours in 2030. It's dashed because we haven't agreed the numbers yet. Agreeing them is part of the ask.\u003c/p>\n\u003cp>Three things.\u003c/p>\n\u003cp>Click. One: the five moves are the design bar for the first production EKS cluster. If we make an exception, we write it down.\u003c/p>\n\u003cp>Click. Two: the 2030 spec sheet is our north star, and we check it once a year against the tests on each rung.\u003c/p>\n\u003cp>Click. Three: one agent in the first quarter of 2027. Alert triage, read-only, running on EKS, and by the end of the second quarter we know what each alert costs us.\u003c/p>\n\u003cp>We're early enough to build from the first cluster what they had to retrofit. Let's do that.\u003c/p>","plan":{}},"the-ask-ten":{"title":"The ask","notes":"\u003cp>We started with Meta, Nubank and LinkedIn: small teams, very big estates. Big is a ratio. There's a fourth row now, in dashed red, and it's ours in 2030. It's dashed because we haven't agreed the numbers yet. Agreeing them is part of this.\u003c/p>\n\u003cp>Every drawing set ends in an approval block, and the signature boxes are red because people sign them. Three things.\u003c/p>\n\u003cp>Click. One: the five moves are the design bar for the first production EKS cluster. If we make an exception, we write it down. The first test we can fail: rebuild a production cluster from Git in a day.\u003c/p>\n\u003cp>Click. Two: the 2030 spec sheet is our north star, and we review it once a year.\u003c/p>\n\u003cp>Click. Three: one agent in the first quarter of 2027. Alert triage, read-only, running on EKS, and by the end of the second quarter we know what each alert costs us.\u003c/p>\n\u003cp>And what we're not asking for: no GPUs, no second orchestrator, no promotion tooling, no agent framework of our own and no new observability backend. We build the box, not the brain.\u003c/p>\n\u003cp>We're early enough to build from the first cluster what they had to retrofit. Let's sign for it.\u003c/p>","plan":{"Act":"IV","Job":"close by echoing the open, and get three concrete yeses.","Headline":"Approve the five moves for cluster one, and start one agent","Visual":"the cold open's ratio rows return, small, with a fourth row, \"Us, 2030\", in dashed","Energy":"4","Into next":"the end. The one sentence is the last thing said; the approval block stays up"}},"the-claim":{"title":"The claim","notes":"\u003cp>Here's the one sentence for the whole talk. We are early enough to build, from the first EKS cluster, what the big operators had to retrofit.\u003c/p>\n\u003cp>This curve is the shape of the next four years if we grow the way we plan to. We are here, at the bottom left, before the bend. Every company you'll hear about today hit the bend first and fixed their platform afterwards, while it was running. That's expensive.\u003c/p>\n\u003cp>We get to do it the other way round: decide how a cluster, a service and an agent are made before there are a hundred of them.\u003c/p>\n\u003cp>First, what we're leaving on the floor in Salt Lake City.\u003c/p>","plan":{}},"the-loop":{"title":"The loop","notes":"\u003cp>This is the slide the whole deck has been building to. On the left, the loop. On the right, its parts list: who already runs each station.\u003c/p>\n\u003cp>Click. One: a signal, a Prometheus alert, a CVE, a new EKS version. Two: an agent session picks it up, in its own sandbox, with Vault keys and an Istio identity. Verkada does this for forty-seven hundred alerts a month. Mastercard's agent has no shell; it only gets tools.\u003c/p>\n\u003cp>Click. Three: the agent opens a merge request; at monday.com eighty percent of PRs are zero-touch. Four: CI checks it, the same CI for people and AI, as at Ford. Five, the red one: a person approves. Still true in 2030.\u003c/p>\n\u003cp>Click. Six: plain Argo CD syncs the first wave; Mastercard does this across a hundred and fifty EKS clusters. Seven: the PostSync check; LinkedIn took that from a week of hoping to an hour of proof. Eight: Grafana and Splunk confirm. Nine: the next wave, or stop and page. NVIDIA's agent stops on a failed status.\u003c/p>\n\u003cp>Click. Watch one change go round. Same rails as ours. The toil curve stops landing on people. That's 2030. Here's the road from where we are.\u003c/p>","plan":{}},"the-loop-ten":{"title":"The loop","notes":"\u003cp>This is the slide the whole set has been building to: the assembly drawing. On the left, the loop. On the right, who already runs each station, and which of our sheets it comes from.\u003c/p>\n\u003cp>Click. One: a signal, an alert or a CVE, through the pipeline from sheet four. Two: an agent session picks it up, in its box from sheet five. Verkada does this for forty-seven hundred alerts a month.\u003c/p>\n\u003cp>Click. Three: it opens a merge request; at monday.com eighty percent are zero-touch. Four: the same CI for people and AI, as at Ford. Five, the red one: a person approves. Still true in 2030.\u003c/p>\n\u003cp>Click. Six: plain Argo CD syncs the first wave; Mastercard runs a hundred and fifty EKS clusters by merge request. Seven: the PostSync check. Eight: Grafana and Splunk confirm. Nine: the next wave, or stop and page. NVIDIA's agent rolled about fifty-six hundred nodes in thirty minutes this way, and stopped on a failed status.\u003c/p>\n\u003cp>Click. Watch one change go round. Pause. Nine stations, one person. Nothing on this loop is new for the agent; these are the rails we build for people. That's how the toil curve stops landing on us.\u003c/p>\n\u003cp>That's 2030. Getting there starts with three decisions.\u003c/p>","plan":{"Act":"IV (**peak**)","Job":"the turn. Agents work the fleet's toil through the same rails people use, so the work","Headline":"Agents work the toil through the same rails we do","Visual":"the assembly drawing. A schematic loop with nine balloons; balloon 5, \"Approve\", is","Energy":"5","Into next":"\"That's 2030. Getting there starts with three decisions.\"","Sources":"Verkada (abstract); Mastercard, monday.com, Ford, LinkedIn, Salesforce, NVIDIA"}},"the-road":{"title":"The road","notes":"\u003cp>Here's the road, one rung a year. Each rung has a test we can fail, so we'll know whether we're on it.\u003c/p>\n\u003cp>Click. 2027 is the foundation. The first production EKS clusters are built from Git, and apps arrive on the ten-line contract. Vault and Istio identity from day one, and the OTel tier in front of Prometheus, Grafana and Splunk. And our first agent: alert triage, read-only. The test: can we rebuild a production cluster from Git in a day?\u003c/p>\n\u003cp>Click. 2028 is the move. Most apps are on EKS and on-prem is draining. A second AWS region. Upgrades go in waves with checks, and agents start opening the upgrade and CVE merge requests. The test: one Kubernetes minor version across the whole fleet in two weeks.\u003c/p>\n\u003cp>Click. 2029 is scale. Tens of clusters. Agents ship routine change with one human approval. Cost per team, per agent and per alert is on a dashboard. The test is the one that matters: the platform team stays flat while the cluster count doubles.\u003c/p>\n\u003cp>Click. And 2030 is the ratio: every line of the spec sheet, met. The test: our row belongs next to Meta's.\u003c/p>\n\u003cp>What we don't build matters just as much.\u003c/p>","plan":{}},"twenty-thirty":{"title":"2030 spec sheet","notes":"\u003cp>Here's 2030, written as a spec sheet. These are our proposed targets, not facts, and each one sits next to a company that already does it today.\u003c/p>\n\u003cp>A new EKS cluster: same day, from a pull request, no tickets. Meta does that with about fifteen people.\u003c/p>\n\u003cp>A Kubernetes minor version across the whole fleet in under two weeks. LinkedIn does it in seven business days across two hundred and fifty clusters.\u003c/p>\n\u003cp>A new service is about ten lines from the app team. Zero long-lived secrets in pods. Every alert gets a first look from an agent in minutes, for cents. Routine change is opened by agents and approved by a person; that row is red because a person stays in it.\u003c/p>\n\u003cp>Every dollar has an owner. And the footprint: at least two AWS regions, and on-prem exited. That last one has a cloud around it because we haven't decided it. Fully exit, or keep on-prem as one more cluster run exactly like the others?\u003c/p>\n\u003cp>Five moves get us there. Each one is already running at a company that spoke last week.\u003c/p>","plan":{}},"upgrades-in-waves":{"title":"Upgrades in waves","notes":"\u003cp>Creating clusters is the easy half. Keeping them current is where the hours go.\u003c/p>\n\u003cp>This is NVIDIA's slide. They had two kernel CVEs land days apart. They wrote the fix and, in the same package, the check that fails if the fix didn't take. Then an agent applied it cluster by cluster. It polled the status field, the same one kubectl shows, moved on when it said complete, and stopped and called a person when it said erroring or blocked.\u003c/p>\n\u003cp>About fifty-six hundred nodes converged in thirty minutes, across sixteen clusters, unattended. And the agent did stop once: some clusters had tainted control-plane nodes, so it escalated, they fixed the config, and re-applied.\u003c/p>\n\u003cp>Click. Our version is simple. Every change goes dev, then one production canary cluster, then the rest. Between each wave is a check that has to pass. On EKS, AWS upgrades the control plane for us. We own the add-ons, the nodes, which we replace rather than patch, and the checks.\u003c/p>\n\u003cp>Waves make a good change fast. They make a bad change fast too.\u003c/p>","plan":{}},"work-outgrows-us":{"title":"The work outgrows us","notes":"\u003cp>This is the problem in one picture. The black line is the work: every cluster times every release times every CVE. The red line is the team. Teams grow in a straight line, one hire at a time. The work doesn't.\u003c/p>\n\u003cp>The blue gap between them is toil. Someone does it by hand, or it doesn't get done.\u003c/p>\n\u003cp>LinkedIn put a formula on it. Upgrade time is rollouts times ramps times deploy-plus-soak, divided by your daily window. For three minor versions across two hundred and fifty clusters, done the normal way, that came to forty business days.\u003c/p>\n\u003cp>And this is what we wrote down ourselves on the show floor: lots of companies are running hundreds of clusters, and we can't keep doing manual upgrades.\u003c/p>\n\u003cp>Click. Then AI multiplies it. Mastercard's speaker had a nice pair: every CTO says AI means ten times the productivity; every CISO says it means ten times the vulnerabilities. Both are right, and both land on this curve.\u003c/p>\n\u003cp>Every big operator at the show hit this wall. The ones who hit it late paid for it.\u003c/p>","plan":{}}},"narrativeOrder":["cold-open","before-the-bend","spec-for-2030","guard-the-deletes-ten","ten-lines-two-gates","identity-not-secrets-ten","one-pipeline-to-scale","agent-in-a-box","the-loop-ten","the-ask-ten"],"kit":"1.0.0"};</script>
