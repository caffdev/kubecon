<script>window.DECK = {"deck":"rails-not-runbooks","title":"Rails, not runbooks","draft":"ten","drafts":{"main":["title","cold-open","journey","show-fleet","estate-grows","one-runbook","tools-too","overrun","capi-diff","skip-level","region-claim","show-delivery","twenty-tools","waves","gates","change-windows","stop-clicking-sync","placement","failover","show-agents","three-ways","agent-pod","sandbox","mcp-gateway","credentials","policy-layer","the-lake","authority","triage","new-holes","ship-the-check","patch-loop","not-building","the-ask"],"ten":["title-ten","cold-open-ten","upkeep","the-rails","receipts","failover-ten","three-ways-ten","first-job","close-the-circle","the-ask-ten"]},"size":[1920,1080],"slides":{"agent-pod":{"title":"An agent is a Job","notes":"\u003cp>Workloads first. Here's one agent as Kubernetes sees it: a Job. Jenkins, an alert or a schedule creates it, it does one task, and it's gone.\u003c/p>\n\u003cp>Five fields matter. runtimeClassName isolated-sandbox: in EKS Auto Mode that's Nitro Sandbox, built in. The pod runs in its own Firecracker microVM, so the code the agent just wrote never touches the node's kernel. No extra setup; AWS documents it as the simplest way to run isolated pods.\u003c/p>\n\u003cp>serviceAccountName: wired to Pod Identity, so it gets a short-lived role. No keys in the image.\u003c/p>\n\u003cp>automountServiceAccountToken false: no Kubernetes API token just because it's a pod.\u003c/p>\n\u003cp>activeDeadlineSeconds: killed at fifteen minutes, whatever it's doing; ttlSecondsAfterFinished cleans it up, and its logs are already in the lake.\u003c/p>\n\u003cp>nodeSelector and tolerations: agents run on their own tainted node pool, grown for a burst and emptied after. Nobody approves each agent; the spec is the approval.\u003c/p>\n\u003cp>Podium runs this shape: every coding agent an isolated pod.\u003c/p>\n\u003cp>The catches, from the EKS user guide: existing Auto Mode clusters need Kubernetes 1.36 for sandbox pods, and there's no GPU passthrough yet. On-prem, the same line names gVisor or Kata instead.\u003c/p>\n\u003cp>runtimeClassName is the line that matters, because a container is not a cage.\u003c/p>","plan":{}},"authority":{"title":"Authority is earned, like traffic","notes":"\u003cp>Every control so far says what an agent can't do. This one says how it gets to do more, and it's the single most copyable idea we brought home, from Transfix.\u003c/p>\n\u003cp>Take the rails we already built for releases and swap the payload. Instead of a version rolling out, the thing being rolled out is authority.\u003c/p>\n\u003cp>The top row is the first half of this talk: a new version goes to the canary wave, the gate Job checks it, exit zero passes, the next wave gets it, and a failed gate stops the wave and the revert is a commit.\u003c/p>\n\u003cp>The bottom row is the same rails pointed at an agent. The canary is shadow mode: the agent decides, and the action is withheld; a person sees what it would have done. The gate is grading its work against what actually happened. Passing is an eligibility rule that gives the same answer every time, not a feeling. The next wave is a reviewed permission change, a pull request like any other. And the stop is revoking the grant, which we design before we grant anything.\u003c/p>\n\u003cp>\"Models produce evidence. Code decides authority.\" It needs nothing we don't already run: the pipeline, RBAC for what each role can touch in a cluster, repository rules for who can merge.\u003c/p>\n\u003cp>Rung one, shadow mode, is where every agent starts. So here's what shadow mode looks like on a real job: the next alert.\u003c/p>","plan":{}},"capi-diff":{"title":"An upgrade is one field","notes":"\u003cp>So here's the admins' fix, on-prem. kubeadm stays. The hands go.\u003c/p>\n\u003cp>On the left is the whole upgrade, as a pull request. It's a Cluster API Cluster object for ny4, built from a ClusterClass we'd call onprem-kubeadm. Three control-plane machines, six workers. The upgrade is one line: version, v1.36 to v1.37. That's the diff someone reviews. The versions are illustrative.\u003c/p>\n\u003cp>On the right, top: what that used to be. Fifty-four hand steps for this one cluster.\u003c/p>\n\u003cp>Click. Bottom: what Cluster API does with the one line. The control plane first, one machine at a time: a new machine at the new version joins, the old one is drained and deleted. Then the workers, the same way, one extra machine at a time. It's still kubeadm underneath. Nobody types it.\u003c/p>\n\u003cp>The catch, and it's the first thing an admin will ask: replacing a machine on bare metal means re-provisioning a physical server. That's what Metal3 does. If ny4 runs on VMs, it's the vSphere or Nutanix provider instead. Picking that provider is the first decision, before any of this works.\u003c/p>\n\u003cp>One field per cluster. LinkedIn went a step further, and changed the upgrade itself.\u003c/p>","plan":{}},"change-windows":{"title":"A freeze is config","notes":"\u003cp>The pipeline also needs to know when not to run.\u003c/p>\n\u003cp>The strip is one week. Syncs are allowed Monday to Thursday, nine to five; everything else is frozen. Wave one Tuesday, wave two Wednesday. The prod wave starts Thursday, hits five o'clock and stops, then picks up Monday morning. Nobody had to remember, and nobody met about it. That's the platform team's time syncs, gone.\u003c/p>\n\u003cp>On the left, how: Argo CD's own sync windows on the AppProject. Kind allow, a cron schedule, eight hours, New York time. Built in. It stops the pipeline.\u003c/p>\n\u003cp>Click. But kubectl, operators and soon agents change clusters too. So the approved window from the change record is projected into the cluster as a small object of ours, and a Kyverno rule denies production writes when none is open. Admission never waits on the ticket system.\u003c/p>\n\u003cp>NVIDIA schedules fleet maintenance around business windows; Agility Robotics gates updates on robots mid-task.\u003c/p>\n\u003cp>That's the platform team's whole kit: waves, gates and windows. Which means we can finally make teams an offer.\u003c/p>","plan":{}},"close-the-circle":{"title":"Close the circle","notes":"\u003cp>That's our agents. Theirs are already at work on what we run: the Metal3 maintainer's AI found two hundred and twenty issues in one project in a year, and his first takeaway was plain. Shorten your upgrade cycle. So we close the circle.\u003c/p>\n\u003cp>From the top. A new CVE lands, found by their agent or anyone's. The lake finds it: one query over a read-only copy of the fleet, which clusters run the affected image. Our agent drafts the fix.\u003c/p>\n\u003cp>Click. And look at the fix. It's the same one-line diff from the rails: payments moves to a new image digest, rebuilt with the patched OpenSSL. Only this time an agent opened it.\u003c/p>\n\u003cp>Then CI runs the same rules as anyone's change, and the team approves. The agent that opens the PR never approves or merges it; that's Transfix's rule. Then the waves roll it out, each step gated on status.\u003c/p>\n\u003cp>Click. Is that fast enough? NVIDIA did it on stage: two CVEs days apart, about fifty-six hundred nodes across sixteen clusters, converged in thirty minutes, with an agent driving the rollout by reading one status field and stopping for a human if it ever said erroring or blocked. Their line: the next CVE is a YAML change.\u003c/p>\n\u003cp>In the middle of the circle: days, from a CVE to every cluster. Same small team, same rails. The agents just make it go round faster.\u003c/p>\n\u003cp>So here's where we start.\u003c/p>","plan":{"Act":"III","Job":"close the loop on attackers: our agents patch what theirs find, through the same","Headline":"Close the circle: our agents patch what theirs find, and the waves roll it out.","Visual":"`main`'s ring of five stations, now drawn as a loop of track (a new CVE, found","Energy":"4","Into next":"so here's where we start.","Source":"📎 *Progressive Delivery for Trust* (Transfix) p09, p17; 📎 *5,000 Nodes in","Merged from":"`new-holes`, `ship-the-check`, `patch-loop`, `the-lake` (notes)"}},"cold-open":{"title":"Meta's fleet, and ours","notes":"\u003cp>One number from the keynote stage to start. Meta runs about a hundred Kubernetes clusters, for AI research and inference, with about fifteen engineers. That's from their own keynote abstract.\u003c/p>\n\u003cp>We run twenty-nine. On our own hardware at two exchanges, in two AWS regions, and in a second cloud. And the clusters and the apps on them are upgraded by one small team, mostly by hand.\u003c/p>\n\u003cp>Click. Now look at what does the upgrades. At Meta, about seven clusters per engineer, and it's code that does them: GitOps, the title of the talk. Here, it's people. It's us.\u003c/p>\n\u003cp>Click. So fifteen engineers can run a hundred clusters. The difference isn’t how many of us there are. It's what does the upgrades.\u003c/p>\n\u003cp>That's the talk. For the next forty minutes, every claim comes with a receipt: someone at the show who already does it, and the config it takes. Here's what we brought back.\u003c/p>","plan":{}},"cold-open-ten":{"title":"Meta's fleet, and ours","notes":"\u003cp>One number from the keynote stage. Meta runs about a hundred Kubernetes clusters with about fifteen engineers. That's from their own keynote abstract.\u003c/p>\n\u003cp>We run twenty-nine: on our own hardware at two exchanges, in two AWS regions, and in a second cloud. And the clusters, and the tools and apps on them, are upgraded by one small team, mostly by hand.\u003c/p>\n\u003cp>Click. Look at what does the upgrades. At Meta it's code: GitOps, the title of their talk. Here, it's people. It's us.\u003c/p>\n\u003cp>Click. So fifteen engineers can run a hundred clusters. The difference isn't how many of us there are. It's what does the upgrades.\u003c/p>\n\u003cp>Here's what \"by hand\" adds up to for us.\u003c/p>","plan":{"Act":"Open","Job":"earn attention with the contrast an engineer can't ignore: a peer runs a bigger","Headline":"Meta runs ~100 clusters with ~15 engineers. We run 29 with a small team, by hand.","Visual":"two bands at the same scale, one square per cluster: Meta's 100 with fifteen","Energy":"4","Into next":"here's what \"by hand\" adds up to for us.","Source":"forked from `cold-open`; notes trimmed. Meta: keynote abstract, *We Have GitOps"}},"credentials":{"title":"No passwords in the agent","notes":"\u003cp>The scoped token is the whole credentials story. The agent never holds a password.\u003c/p>\n\u003cp>Left to right. The agent carries a pass: a workload identity issued to that pod, read-only, short-lived and rotated. No key file, no token in an environment variable.\u003c/p>\n\u003cp>At the gateway the pass becomes a token for one call. The real secret sits in the store behind the gateway and never crosses the dashed line, not into the agent's context, prompt or image. If an agent is tricked into printing everything it knows, there's nothing worth printing.\u003c/p>\n\u003cp>Click. In AWS, this is the whole wiring: one Pod Identity association between the triage-agent service account and a read-only role. That's the serviceAccountName line from the Job.\u003c/p>\n\u003cp>On-prem, the same idea is a SPIFFE ID from SPIRE. Secrets apps do need are synced by External Secrets, never written in YAML. The store itself is still GOALS section nine.\u003c/p>\n\u003cp>Identity says who the agent is. Policy says what anyone may do.\u003c/p>","plan":{}},"estate-grows":{"title":"Four clusters became 29","notes":"\u003cp>Now ours. Four clusters, on our own hardware next to the exchange. Dev and staging, ny4 for production, and ch4 as its disaster-recovery twin, in lockstep. Built with kubeadm, by hand, which was right at the time. One small team, in orange, owns the upgrades: the clusters and the twenty apps on them.\u003c/p>\n\u003cp>Click. Then EKS, for the environments that don't need to sit by an exchange: dev, qa and ftb. A different animal, so now there are two upgrade procedures.\u003c/p>\n\u003cp>Click. A second exchange. Everything we built for the first, again: its own clusters, its own DR pair. Eleven.\u003c/p>\n\u003cp>Click. The cloud migration. AWS clusters arrive in chunks of six as services move. Seventeen.\u003c/p>\n\u003cp>Click. Resilience. Production gets a second AWS region, mirroring the first. Twenty-three.\u003c/p>\n\u003cp>Click. And two regions of one provider is still one provider. So, fingers crossed for AWS, a second cloud. Twenty-nine clusters, sixty-five apps, four thousand pods. Every step was reasonable on the day. And it's still the same small team.\u003c/p>\n\u003cp>Two procedures, three kinds of place. Here's what one upgrade actually is.\u003c/p>","plan":{}},"failover":{"title":"Failover by layer","notes":"\u003cp>Remember \"fingers crossed for AWS\". This is what replaces it, and it's where the engineering is.\u003c/p>\n\u003cp>Four layers, two AWS regions, the second cloud on the right. Start with delivery: because placement is labels, the app already runs in both regions, three replicas each. Nothing gets deployed during an outage.\u003c/p>\n\u003cp>Click. Region one fails. Detection starts the clock: health checks have to fail enough times to be believed.\u003c/p>\n\u003cp>Click. Traffic moves: Global Accelerator at the edge, Route 53 behind it, Istio locality failover east-west. All of it lands on region two. Nobody redeployed anything.\u003c/p>\n\u003cp>Click. Capacity. Region two was sized for half the traffic and just got all of it. The autoscaler doubles the pods and Auto Mode adds nodes: launch, image pull, warm-up. Minutes, and part of our recovery time whether we budget for it or not.\u003c/p>\n\u003cp>Click. State. Region two's database replica is promoted to writer. The slowest layer, and not a Kubernetes problem at all.\u003c/p>\n\u003cp>So recovery time is a sum, and the data sets it. No seconds on the slide on purpose: we measure each one at a game day.\u003c/p>\n\u003cp>And if all of AWS goes? The second cloud holds a warm standby. Karmada's cluster affinities are for the few apps that can't run in two places at once; Bloomberg runs streaming that way. And the data row says it plainly: how data crosses clouds is undecided.\u003c/p>\n\u003cp>That's the first half. Now the show's biggest topic.\u003c/p>","plan":{}},"failover-ten":{"title":"Failover by layer","notes":"\u003cp>Here's what the rails buy the people who write the apps. A developer never names a cluster. The app's repo says where it runs as labels: production, both AWS regions. The ApplicationSet finds every cluster with those labels. So the app already runs in both regions, three replicas each, and the thirtieth cluster costs the developer nothing.\u003c/p>\n\u003cp>Now lose a region. Four layers, two AWS regions, and the second cloud on the right.\u003c/p>\n\u003cp>Click. Region one fails. Detection starts the clock: health checks have to fail enough times to be believed.\u003c/p>\n\u003cp>Click. Traffic moves: Global Accelerator at the edge, Route 53 behind it, Istio locality failover between services. All of it lands on region two. Nobody redeployed anything.\u003c/p>\n\u003cp>Click. Capacity. Region two was sized for half the traffic and just got all of it. The autoscaler doubles the pods and Auto Mode adds nodes. Minutes, and part of our recovery time whether we budget for it or not.\u003c/p>\n\u003cp>Click. State. Region two's database replica is promoted to writer. The slowest layer, and not a Kubernetes problem at all.\u003c/p>\n\u003cp>So recovery time is a sum, and the data sets it. No seconds on the slide on purpose: we measure each one at a game day. On rails, failover isn't a runbook someone opens at three in the morning. It's labels, and four layers that are already running.\u003c/p>\n\u003cp>And if all of AWS goes, the second cloud holds a warm standby. How data crosses clouds is undecided, and the slide says so.\u003c/p>\n\u003cp>That's the fleet half: clusters, tools and apps, all on rails. Now the show's biggest topic.\u003c/p>","plan":{"Act":"II","Job":"the peak: because placement is a label, the app already runs in both regions;","Headline":"Lose a region and the app doesn't move: traffic, capacity and data do.","Visual":"`main`'s failover by layer. Four layers (traffic, delivery, capacity, state)","Energy":"5","Into next":"that's the fleet half: clusters, tools and apps on rails. Now the show's","Source":"GOALS §5.1 B, §5.5; `EKS-VS-ECS.md` rule 5; Bloomberg (Karmada; no deck)","Merged from":"`failover`, `placement`"}},"first-job":{"title":"Rung one: explain the alert","notes":"\u003cp>Fenced in is where an agent starts. How does it earn more? The same way a release earns a wave.\u003c/p>\n\u003cp>Across the top, five rungs, from Transfix's talk. Shadow mode: the agent decides, but the action is withheld. Then its work is graded against what actually happened. Then an eligibility rule, code that gives the same answer every time, says it's ready. Then a permission pull request, reviewed by people. And the revoke is designed before the grant. Their line: models produce evidence; code decides authority.\u003c/p>\n\u003cp>Rung one is a real job with no write path: explaining alerts.\u003c/p>\n\u003cp>Click. Payments is crash-looping on aws-1 prod. The agent reads and posts: real, not noise; Argo CD synced payments twelve minutes ago; suggestion, roll back with one revert PR. It doesn't act. Nothing to sandbox, nothing to gate.\u003c/p>\n\u003cp>Click. The responder accepts, modifies or rejects, and every choice is logged. That log is the track record the agent needs before it's allowed to open that PR itself.\u003c/p>\n\u003cp>Click. Receipts. Verkada runs this on nine clusters: forty-seven hundred alerts a month, thirty-three cents each, a summary in a hundred and thirty-nine seconds. Salesforce's first try was right a quarter of the time; a curated knowledge base and an eval harness took it to sixty to eighty percent. Budget for both, or expect the twenty-five.\u003c/p>\n\u003cp>That's our agents. Theirs are already at work on what we run.\u003c/p>","plan":{"Act":"III","Job":"tie the halves: agents earn authority on rails the way releases earn waves, and","Headline":"Agents earn authority the way releases earn waves, and rung one only explains alerts.","Visual":"a rung track across the top: five stops (Shadow mode, acts on nothing;","Energy":"4","Into next":"that's our agents. Theirs are already at work on what we run.","Source":"path2-agents `authority` (Transfix, *Progressive Delivery for Trust*, p9,","Merged from":"`authority`, `triage`"}},"gates":{"title":"A gate is a Job","notes":"\u003cp>A ring only moves outward when its step is healthy. Healthy means a gate, and a gate is a Job.\u003c/p>\n\u003cp>On the left, the whole thing: a Kubernetes Job with one annotation that matters, the Argo CD PostSync hook. After Argo syncs the new Prometheus, it runs this check: are ninety-nine percent of targets up, and has that held for fifteen minutes. Every tool brings its own check.\u003c/p>\n\u003cp>Exit zero: the app goes healthy and the next wave starts.\u003c/p>\n\u003cp>Click. Exit one: the sync fails, and the next wave never starts. Prod never sees it.\u003c/p>\n\u003cp>On the right, LinkedIn's slide from their canary pipeline for critical cluster services. Same shape: Argo syncs the canary, a PostSync hook decides.\u003c/p>\n\u003cp>Click. Their result: a release went from about a week to about an hour, validated automatically, with more than ten incidents caught before production.\u003c/p>\n\u003cp>One thing to be precise about: Argo CD doesn't roll back by itself. A failed gate stops the wave; the revert is a commit, which a bot can open.\u003c/p>\n\u003cp>And the pipeline also needs to know when not to run at all.\u003c/p>","plan":{}},"journey":{"title":"Three takeaways","notes":"\u003cp>Here's the whole talk in three lines. Three takeaways from four days and five hundred talks, and each one comes with a receipt.\u003c/p>\n\u003cp>Click. One: there's always another cluster. Another environment, another exchange, another region. So clusters are objects, built and upgraded from code. The receipt: LinkedIn moved more than two hundred and fifty clusters three Kubernetes minors forward in one rollout, in seven business days.\u003c/p>\n\u003cp>Click. Two: no manual way keeps up. Every change rides one pipeline, in waves, behind gates. The receipt: LinkedIn again, whose canary pipeline turned a week of testing per release into an hour.\u003c/p>\n\u003cp>Click. Three: AI brings problems as it solves them. Verkada's agent explains a production alert for thirty-three cents. And on the other side, one maintainer's own AI pipeline found two hundred and twenty issues in one open-source project, Metal3, in a year. Attackers run the same models. Both are true at once.\u003c/p>\n\u003cp>The fleet first, and first, how many fleets were on stage.\u003c/p>","plan":{}},"mcp-gateway":{"title":"MCP auth: three questions","notes":"\u003cp>As users, agents work through tools, and these days that mostly means MCP.\u003c/p>\n\u003cp>Stacklok and AWS framed MCP auth as three questions. Who is calling, and how do they prove it? For us, the agent's own workload identity, not a person's borrowed token. Who decides what it may call? A policy at the gateway, groups from the directory. What identity reaches the tool? A token minted for that one call, never the agent's.\u003c/p>\n\u003cp>On the right, question two as a Cedar policy: triage agents may call read-only tools on the Kubernetes server. Cedar can be analysed, so you can prove what a policy set allows before any agent tries it.\u003c/p>\n\u003cp>Click. The choice is the gateway, Obot, ToolHive or our own thin proxy, decided in a short bake-off on where enforcement sits.\u003c/p>\n\u003cp>And the dissent: Mastercard dropped MCP for narrow built-in tools, and drives thirty EKS clusters that way.\u003c/p>\n\u003cp>The scoped token in question three is the whole credentials story.\u003c/p>","plan":{}},"new-holes":{"title":"New holes daily","notes":"\u003cp>Now the third way agents arrive: in attackers' hands.\u003c/p>\n\u003cp>This is every CVE published, year by year, as one talk showed it. For a decade, a steady climb: ten thousand, twenty, thirty, forty-five thousand last year. This year, about seventy-nine thousand, and the year isn't over. Over two hundred a day.\u003c/p>\n\u003cp>What changed is AI. Metal3's security lead at Ericsson told it on stage: this year, his own AI pipeline found two hundred and twenty issues in one small project. Seventy-nine were invalid or duplicates. Twenty-two were real security bugs. And he's a defender. Mythos vs Maintainers was the other side: attackers pointing the same models at the same code, and maintainers drowning in reports.\u003c/p>\n\u003cp>Click. His first takeaway, word for word: \"AI finds bugs fast, and not only for us. Shorten your upgrade cycle.\"\u003c/p>\n\u003cp>A note on what that means for us. Most of these holes are in images and libraries, and those patches don't wait for our three Kubernetes upgrades a year; they ship through the waves like any change. So the question isn't the upgrade calendar. It's how fast a fix goes from \"a hole exists\" to \"every cluster is patched\", and who drives it.\u003c/p>\n\u003cp>The answer isn't more people. NVIDIA showed what it is.\u003c/p>","plan":{}},"not-building":{"title":"What we won't build","notes":"\u003cp>Before the ask, what we won't build. It matters as much as what we will, because a plan has to stay small enough to finish.\u003c/p>\n\u003cp>No GPUs, no model serving. About a third of the AI talks at the show were about running models. We never will. We call Claude, through the same gateway every agent uses.\u003c/p>\n\u003cp>No second container orchestrator. ECS wouldn't replace anything; it would be a third platform to run. EKS everywhere in AWS, Auto Mode by default.\u003c/p>\n\u003cp>No agent framework of our own. Claude runs headless in the Job you saw; we build the box it runs in, not the brain.\u003c/p>\n\u003cp>No promotion product. The waves are an ApplicationSet and the gate is a Job, in the Argo CD we already run.\u003c/p>\n\u003cp>No new observability backend. OTel in front of Prometheus, Grafana and Splunk, which all stay.\u003c/p>\n\u003cp>And no developer portal before the road exists. Every company at the show that made deploying boring built the path first; the portal came after, as a window onto it.\u003c/p>\n\u003cp>That leaves five pull requests.\u003c/p>","plan":{}},"one-runbook":{"title":"One upgrade, by hand","notes":"\u003cp>Here's what one upgrade actually is, on a kubeadm cluster.\u003c/p>\n\u003cp>In the box: the runbook for a single node. Drain it. Upgrade kubeadm. On the first control-plane node that's kubeadm upgrade apply; on every other node, kubeadm upgrade node. Upgrade kubelet and kubectl. Restart kubelet. Uncordon it. Then the next node. The control plane nodes go first, one at a time, then the workers, one at a time.\u003c/p>\n\u003cp>Below: that's one row. Nine nodes, six steps each, fifty-four steps for one cluster, and a person waiting on every one of them. Call it a day.\u003c/p>\n\u003cp>And kubeadm won't skip a minor version. Kubernetes ships three a year, roughly April, August and December, so that row happens three times a year. Per cluster. On-prem we have eight of them by now.\u003c/p>\n\u003cp>And in AWS it's a different procedure again: update the control plane version, then every node group, then the add-ons. Two runbooks.\u003c/p>\n\u003cp>That's the clusters. And they're the small part.\u003c/p>","plan":{}},"overrun":{"title":"Upkeep outgrows every group","notes":"\u003cp>Now add it up, split by who carries it.\u003c/p>\n\u003cp>Cluster admins, on the left: kubeadm and cluster upgrades, plus the multi-cluster upkeep, labels, registrations, failover setup. One admin, half a year of hours, 850. Out at the second cloud.\u003c/p>\n\u003cp>The platform team, in the middle, carries the most: the platform apps, just the core four tools for now; progressive rollouts of every app upgrade; and the time syncs, the windows and approvals that keep everyone in step. Two engineers, 1,700 hours. Out first, at the second region.\u003c/p>\n\u003cp>Developers, on the right: knowing what runs where and why, scheduling, keeping DR patterns alive. Thirteen hundred hours by the second cloud, spread thin across every team, so nobody sees it.\u003c/p>\n\u003cp>All three on one scale, so you can see who carries the most. Click. And the dashed bars are AI, which adds to all three.\u003c/p>\n\u003cp>A model, not a measurement. But each group crosses its line for a different reason, so each gets its own fix, and for each, someone at the show already runs it. Admins first.\u003c/p>","plan":{}},"patch-loop":{"title":"Close the circle","notes":"\u003cp>Put that next to everything we built, and the circle closes.\u003c/p>\n\u003cp>From the top. A new CVE lands, found by their agent or anyone's. The lake finds it: that query from earlier, which clusters run the image. Our agent drafts the fix.\u003c/p>\n\u003cp>Click. The fix is a pull request with a one-line diff: payments moves to a new image digest, rebuilt with the patched OpenSSL.\u003c/p>\n\u003cp>Then CI runs the same rules as anyone's change, and the team approves; the agent can't approve its own PR. Then the waves roll it out, each step gated on status, as NVIDIA showed.\u003c/p>\n\u003cp>Click. Remember Transfix: models produce evidence, code decides authority. This agent has climbed to the permission rung, and it still only proposes; the agent that opens the PR is never the one that approves or merges it. Authority grows from a track record read by rules, not from trust. KubeEdge's maintainers already run the attacker-side version: agents reading disclosures and proposing patches.\u003c/p>\n\u003cp>In the middle: days, from a CVE to every cluster. Same team, same pipeline; the agents make it go round faster.\u003c/p>\n\u003cp>Before the ask, one more list: what we won't build.\u003c/p>","plan":{}},"placement":{"title":"Labels, not cluster names","notes":"\u003cp>Now developers, and the question each one asks: where does my app run?\u003c/p>\n\u003cp>Before, on the left: the payments repo has a file per cluster, an Argo CD Application for ny4, for ch4, a dozen for AWS, and values for each. The highlighted line: destination name ny4. Developers have to know our cluster names, and every new cluster means a PR in every app repo.\u003c/p>\n\u003cp>After, on the right: one block in the app's repo. Tier prod, regions aws-1 and aws-2, a warm standby in the second cloud, six replicas. No cluster names. That's our small API; the platform turns it into an ApplicationSet cluster generator selecting on labels the clusters already carry.\u003c/p>\n\u003cp>Click. The thirtieth cluster arrives from the Region claim already labelled. Payments lands on it, and nobody opens a PR in the payments repo.\u003c/p>\n\u003cp>NVIDIA and Salesforce made the same point from the other side: choose where the complexity lives, and put it in the platform.\u003c/p>\n\u003cp>And because it's labels, the app already runs in both regions. So what happens when one goes?\u003c/p>","plan":{}},"policy-layer":{"title":"One rule set, whoever made it","notes":"\u003cp>Identity says who the agent is. Policy says what anyone may do, and the trick is to write the rule against the action, not the actor.\u003c/p>\n\u003cp>On the right, one CEL rule as a native ValidatingAdmissionPolicy, GA since Kubernetes 1.30, no webhook to keep alive. Every container image comes from our registry, pinned by digest. It never mentions people or agents.\u003c/p>\n\u003cp>On the left, three actors send the same bad change: a person with kubectl, the pipeline from a merged PR, an agent through a tool call.\u003c/p>\n\u003cp>The pipeline and the agent meet the rule in CI first, through kyverno test, so the PR fails before anyone reviews it. For an agent, a failed test is something it can read and fix.\u003c/p>\n\u003cp>The person with kubectl skips CI; that's what admission is for. Click. All three meet the same rule there, with the same message.\u003c/p>\n\u003cp>One rule set for people and agents. That's why agent governance mostly comes for free, if the rules are already there.\u003c/p>\n\u003cp>Policy stops what shouldn't happen. Telemetry shows what did.\u003c/p>","plan":{}},"receipts":{"title":"LinkedIn: 40 days → 7, a week → an hour","notes":"\u003cp>Here's a peer already running it: LinkedIn, more than two hundred and fifty clusters on their own hardware, roughly ten times our fleet. Two of their slides, two talks, both halves of what we just drew.\u003c/p>\n\u003cp>On the left, clusters. They took production from Kubernetes 1.31 to 1.34, three minors. One minor at a time was six fleet waves and forty business days. They did it in one rollout and a promotion: seven. The trick is in the title, binary version is not behaviour. Ship the new binaries pinned to the old behaviour with the emulated-version flag, soak, then raise the version. One promotion instead of three upgrades.\u003c/p>\n\u003cp>On the right, releases. Their canary pipeline is the gate we just drew: Argo CD syncs the canary, a PostSync Job decides, exit zero or exit one. A release went from about a week, cluster by cluster, to about an hour, validated automatically. And it caught more than ten potential incidents before production.\u003c/p>\n\u003cp>One honest catch. LinkedIn ran the skip-level upgrade with their own control-plane tooling. Before we promise it, we check what kubeadm and Cluster API support. And patches still ship every month, through the waves.\u003c/p>\n\u003cp>So that's clusters and tools on rails. Now what it buys the people who write the apps.\u003c/p>","plan":{"Act":"I","Job":"the proof: one peer at about ten times our fleet runs both halves of the turn,","Headline":"LinkedIn runs 250+ clusters on rails: 40 days became 7, and a week became an hour.","Visual":"snowfield (the show's slides). Two lifted LinkedIn slides side by side, the","Energy":"3","Into next":"clusters and tools on rails. Now what it buys the people who write the apps.","Source":"📎 *Binary Version Is Not Behavior* (LinkedIn) p02; 📎 *Ship Faster, Ship","Merged from":"`skip-level`, the LinkedIn receipt on `gates`"}},"region-claim":{"title":"A region is one claim","notes":"\u003cp>That's on-prem. In AWS the cluster itself can come from code.\u003c/p>\n\u003cp>On the left is all an admin writes for a new region: a Region claim. Mirror aws-1, six clusters, label them aws-2. That's our own API, a Crossplane composite we'd write, and the slide says so. Accounts and landing zone stay in CDK below it.\u003c/p>\n\u003cp>The composition builds the rest: VPC and subnets, IAM with Pod Identity, six EKS clusters, DNS and load balancers, and, most important, each cluster registered with Argo CD already labelled. So the waves and placement find them. Nobody edits a list.\u003c/p>\n\u003cp>Click. What it sets on each EKS cluster, in the real API fields. The version is ours. computeConfig enabled is Auto Mode: AWS runs the nodes and Karpenter. Load balancing and block storage on, so AWS runs those add-ons too.\u003c/p>\n\u003cp>And per the EKS user guide, AWS picks the node image and replaces every node within twenty-one days, so OS patches arrive on their own. It also has a sandbox runtime for agents built in; that comes back later.\u003c/p>\n\u003cp>That's the admins. The platform team carries the most, and the show had plenty to say about them.\u003c/p>","plan":{}},"sandbox":{"title":"Not a cage: three runtimes","notes":"\u003cp>A container is not a cage. Here's why, as three syscall paths. These are alternatives, not layers: one runtime class per pod.\u003c/p>\n\u003cp>On the left, a plain container. The agent's system calls go straight to the host kernel every pod on that node shares. A namespace, not a wall. Fine for code a person reviewed; not for code an agent wrote a minute ago.\u003c/p>\n\u003cp>Click. gVisor. The calls go to the Sentry, a kernel in user space, and only a narrow set reaches the host. Fast to start; syscall-heavy work pays. It needs our own node image, so it's for on-prem, not Auto Mode. Our on-prem default.\u003c/p>\n\u003cp>Click. A microVM. Each pod gets its own guest kernel behind a hypervisor, so an escape lands in a VM. On-prem that's Kata on our own KVM hosts; Microsoft showed snapshots taking away most of the start-up cost. In AWS it's already done for us: Auto Mode includes Nitro Sandbox, a Firecracker microVM per pod, selected with runtimeClassName isolated-sandbox, no setup. That's our default in AWS. The catches: Kubernetes 1.36 or later, and no GPU passthrough yet.\u003c/p>\n\u003cp>AWS's own talk said it simply: a runtime class on a normal pod spec.\u003c/p>\n\u003cp>That's agents as workloads. As users, they work through tools.\u003c/p>","plan":{}},"ship-the-check":{"title":"NVIDIA: 5,600 nodes in 30 minutes","notes":"\u003cp>The answer isn't more people. NVIDIA showed it, and it was the cleanest agent-safe automation at the show.\u003c/p>\n\u003cp>Their slide. Two kernel CVEs, days apart. Sixteen clusters, about fifty-six hundred nodes, converged in thirty minutes, and an agent drove it.\u003c/p>\n\u003cp>Look how little the agent was trusted with. It applies the change to a cluster and polls one status field. Complete: next cluster. Erroring or blocked: stop and escalate to a person. It caught tainted control-plane nodes, escalated instead of forcing it, and a human added the tolerations.\u003c/p>\n\u003cp>Underneath: ship the change with the check that fails without it, so done is a value in a field, not an opinion.\u003c/p>\n\u003cp>Click. All the agent reads: kubectl get, gate on status, an enum. An interface a machine can drive safely.\u003c/p>\n\u003cp>Click. Their line: the next CVE is a YAML change. The controller never changed between the two CVEs.\u003c/p>\n\u003cp>Put that next to everything we built, and the circle closes.\u003c/p>","plan":{}},"show-agents":{"title":"At the show: AI","notes":"\u003cp>That's the first half. Now the takeaway every stage at the show was talking about.\u003c/p>\n\u003cp>Same four days. Lit: AI, inference and agents. Two hundred and twenty-eight talks, nearly half the show.\u003c/p>\n\u003cp>The names. Uber on Monday. Tuesday's keynotes: Anthropic and Google with Agent Substrate, Red Hat's \"Sandbox Your Agents\", NVIDIA. Verkada triaging alerts at thirty-three cents each. Grainger, LinkedIn, Ericsson's AI-found zero-day. AWS, OpenAI, Microsoft, Huawei on Wednesday. Salesforce and AWS again on Thursday.\u003c/p>\n\u003cp>And look at how they split. Solving: Mastercard let an LLM drive thirty EKS clusters, read-only by default, with every write reviewed. Creating: Google's keynote said an agent isn't just another workload; it breaks the identity assumptions Kubernetes was built on. And Mythos vs Maintainers: open source maintainers drowning in AI-found vulnerability reports.\u003c/p>\n\u003cp>The same technology, on both sides, sometimes in the same hour. That's the third takeaway: AI brings problems as it solves them. Here's how it arrived on our map.\u003c/p>","plan":{}},"show-delivery":{"title":"At the show: pipelines","notes":"\u003cp>Next, the platform team, who carry the most. First, the second takeaway, as the show told it.\u003c/p>\n\u003cp>Same four days. Lit now: GitOps, pipelines, progressive delivery, policy, platform engineering. About a hundred and twenty talks.\u003c/p>\n\u003cp>And the names. Apple on policy, Monday. AT&T and JPMorganChase on policy as code. NVIDIA with Upbound, Adobe, Meta's keynote, Salesforce and Heroku, Google, the Crossplane maintainers, the Argo CD maintainers with Intuit, Spotify.\u003c/p>\n\u003cp>Three to remember. Meta, in a keynote: a one-line Helm change used to take a working day in their Terraform pipeline, so they moved deploys to GitOps. That's the fifteen engineers running a hundred clusters. LinkedIn: their most critical cluster services ship several times a week, through a canary pipeline built for software that has no user traffic to shift. And Ford: hundreds of clusters, and CI that checks every pull request end to end before it reaches one.\u003c/p>\n\u003cp>None of them keep up by hand. Every change rides a pipeline. Here's what that means for our platform team.\u003c/p>","plan":{}},"show-fleet":{"title":"At the show: fleets","notes":"\u003cp>Before our own story, here's the first takeaway as the show told it.\u003c/p>\n\u003cp>These are the four days, every talk as a box, Monday's co-located day through Thursday. Lit are the talks about running fleets: multi-cluster, upgrades, cluster lifecycle. Almost a hundred of them.\u003c/p>\n\u003cp>And look at who gave them. Bloomberg on multi-cluster. AWS's keynote. NVIDIA and Salesforce on one kubectl across many clusters. Apple and Uber keynotes. NVIDIA again, five thousand nodes in minutes. Mastercard, thirty EKS clusters. Coinbase, Nutanix, LinkedIn.\u003c/p>\n\u003cp>Three to remember. LinkedIn: more than two hundred and fifty clusters, about half a million nodes, upgraded with skip-level upgrades. Salesforce: a thousand clusters, run with agents. And GEICO, a regulated insurer like the companies we compare ourselves to: no single cloud had enough GPUs, so they run Kubernetes across providers.\u003c/p>\n\u003cp>None of them planned to have that many. Every one of those fleets grew one reasonable cluster at a time. There's always another cluster coming, so it has to be the rule, not the exception.\u003c/p>\n\u003cp>Now ours. It started at four.\u003c/p>","plan":{}},"skip-level":{"title":"LinkedIn: three minors, one rollout","notes":"\u003cp>That's on-prem from code. LinkedIn went further, at about ten times our size: more than two hundred and fifty clusters, around half a million nodes, on their own hardware. This is their result slide.\u003c/p>\n\u003cp>They took production from Kubernetes 1.31 to 1.34. Three minors. The old way, one minor at a time, was six fleet waves and forty business days. They did it in one rollout and a promotion, in seven.\u003c/p>\n\u003cp>The trick is in the title of their talk: binary version is not behaviour. It's KEP-4330, compatibility versions. You deploy the 1.34 binaries, but pinned with the emulated-version flag, so they behave like 1.31. You soak that. If anything's wrong, rollback is just a binary downgrade, because behaviour never changed. Then you release, by raising the emulated version. One promotion instead of three upgrades.\u003c/p>\n\u003cp>Two honest notes. LinkedIn did this with their own control-plane tooling, so before we promise it we check what kubeadm and Cluster API support. And this removes minor-version toil, not patching: security patches still ship every month, through the waves we're about to build.\u003c/p>\n\u003cp>That's on-prem. In AWS, the cluster itself comes from code.\u003c/p>","plan":{}},"stop-clicking-sync":{"title":"Stop clicking sync","notes":"\u003cp>Pause on this one, because it's the slide the platform half exists to deliver.\u003c/p>\n\u003cp>Today, Argo CD is a dashboard somebody clicks. And teams don't resist auto-sync because they like clicking. They resist it because manual sync is the only change control they have. Take the button away and you've taken away the one thing standing between a bad commit and production. Of course they say no.\u003c/p>\n\u003cp>So the offer isn't \"turn on auto-sync\". The offer is a trade. You stop clicking sync. Click. In exchange, nothing ships during a freeze, because the window is in the AppProject, not in someone's head. Click. A bad version stops at the canary, because the gate Job fails and the next wave never starts. Click. And a policy violation fails in CI in ninety seconds, not at two in the morning. That last one is coming, and it turns out to be the same rule we'll hand the agents.\u003c/p>\n\u003cp>Notice the order. The control comes back in a better form before the click goes away. Prod auto-sync is the last thing we switch on, not the first thing we ask for.\u003c/p>\n\u003cp>That's the platform team. Now developers, and where their app runs.\u003c/p>","plan":{}},"the-ask":{"title":"Five first pull requests","notes":"\u003cp>So, back to where we started. Meta runs about a hundred clusters with fifteen engineers. We run twenty-nine with a small team. The difference was never headcount. It's what does the work.\u003c/p>\n\u003cp>Same team on the left, same twenty-nine clusters. What changes is the job: not sixteen hundred hand rollouts a year, but about eighty wave approvals, and the pipeline does the rest.\u003c/p>\n\u003cp>Five first pull requests, each one an object you've already seen.\u003c/p>\n\u003cp>One. No hand-built cluster, ever again. The next one is a file: a Cluster API Cluster on-prem, a Region claim in AWS.\u003c/p>\n\u003cp>Two. One platform tool through the waves this quarter: the Splunk OTel collector. That means a wave label on twenty-nine cluster secrets, a RollingSync ApplicationSet, and one gate Job.\u003c/p>\n\u003cp>Three. AWS region two from one claim, on Auto Mode, with one app live in both regions, placed by labels.\u003c/p>\n\u003cp>Four. Before any agent touches anything: the sandbox runtime class, which Auto Mode already has, the gateway, Pod Identity, and the CEL rules.\u003c/p>\n\u003cp>Five. Explain-only alert triage by the second quarter of 2027, logging every accept, modify and reject from the first day, because that log is how agents earn the next job.\u003c/p>\n\u003cp>Rails, not runbooks. Every claim in this talk had a receipt. These five are ours to write. Thank you.\u003c/p>","plan":{}},"the-ask-ten":{"title":"Five first pull requests","notes":"\u003cp>Back to where we started. Meta runs about a hundred clusters with fifteen engineers. We run twenty-nine with a small team. The difference was never headcount; it's what does the work.\u003c/p>\n\u003cp>Same team on the left, same twenty-nine clusters. What changes is the job: not sixteen hundred hand rollouts a year, but about eighty wave approvals, and the rails do the rest.\u003c/p>\n\u003cp>And what we won't build, so this stays small: no GPUs or model serving, no second orchestrator, no agent framework of our own, no promotion product, no new observability backend, and no developer portal before the road exists. We call, compose or already run all of those.\u003c/p>\n\u003cp>Five first pull requests, each one an object you've already seen.\u003c/p>\n\u003cp>One. No hand-built cluster, ever again. The next one is a file: a Cluster API Cluster on-prem, a Region claim in AWS.\u003c/p>\n\u003cp>Two. One platform tool through the waves this quarter: the Splunk OTel collector. A wave label on twenty-nine cluster secrets, a RollingSync ApplicationSet, one gate Job.\u003c/p>\n\u003cp>Three. AWS region two from one claim, on Auto Mode, with one app live in both regions, placed by labels.\u003c/p>\n\u003cp>Four. Before any agent touches anything: the sandbox runtime class, the gateway, Pod Identity, the CEL rules.\u003c/p>\n\u003cp>Five. Explain-only alert triage by the second quarter of 2027, logging every accept, modify and reject from the first day, because that log is how agents earn the next rung.\u003c/p>\n\u003cp>Rails, not runbooks. Every claim today had a receipt. These five are ours to write. Thank you.\u003c/p>","plan":{"Act":"Close","Job":"echo the opening with the work changed by the rails, then the ask as five first PRs","Headline":"Same team, same 29 clusters: five first pull requests start it this quarter.","Visual":"left, the opening's echo: 29 squares, \"one small team\" in alpenglow, \"1,672","Energy":"3","Into next":"end, on the title: rails, not runbooks.","Source":"forked from `the-ask`; `not-building`'s scope said in the notes"}},"the-lake":{"title":"The read-only lake","notes":"\u003cp>Telemetry shows what did, and agents read it from a lake, not from production.\u003c/p>\n\u003cp>The range again, OTel as one plane through all three peaks, and the lake in the valley. Every stream lands as a table. From the fleet, pods and nodes, snapshotted every fifteen minutes. From delivery, every Argo CD sync and gate result. From the agents, every MCP call the gateway logged. And through the plane, traces, metrics and logs.\u003c/p>\n\u003cp>Agents read from the shore, with a read-only role or a SQL tool through the gateway. No path back up the mountain. That's what lets us say yes to agents analysing prod without giving them prod credentials.\u003c/p>\n\u003cp>Click. One query an agent runs: a new CVE lands; which clusters run an affected image? Join the pod snapshot to the vulnerability feed by digest. No kubectl, no credentials. Hold on to it; it comes back.\u003c/p>\n\u003cp>Receipts: NVIDIA and Upbound showed a queryable audit layer, one query across five clouds. Mastercard answers \"how many EC2 instances\" from an eight-hundred-byte projection instead of forty megabytes of JSON.\u003c/p>\n\u003cp>The limit: a lake is a snapshot. Fine for triage and trends; a gate mid-rollout reads live metrics. The store is still a decision.\u003c/p>\n\u003cp>So what is an agent allowed to do with what it reads? It earns that, the same way a release does.\u003c/p>","plan":{}},"the-rails":{"title":"Field, label, Job","notes":"\u003cp>Here's the turn. On rails, a rollout stops being a procedure and becomes three objects.\u003c/p>\n\u003cp>One: a change is one field. On the left, a pull request that moves payments to a new image digest. It's the same shape for a cluster's Kubernetes version in a Cluster API object, or a platform tool's release. One line in Git, reviewed like any other.\u003c/p>\n\u003cp>Click. Two: a wave is a label. Every cluster carries a wave label: test, canary or prod. One ApplicationSet with a RollingSync strategy rolls the change to the test cluster, then the canaries, then prod a quarter at a time, and only inside the change window, Monday to Thursday, nine to five. That window is a syncWindows block in the Argo CD project, not a calendar invite.\u003c/p>\n\u003cp>Click. Three: a gate is a Job. After each sync, a PostSync hook runs our check: targets up, rule errors zero, for fifteen minutes. Exit zero, and the next wave starts. Exit one, and the sync fails and the wave stops before prod. Argo CD doesn't roll back by itself; the revert is one commit, and a bot can open it.\u003c/p>\n\u003cp>Click. So nobody clicks sync. Teams hold on to manual sync because today it's their only change control. The window, the gate and a policy test in CI give them that control back. In our illustrative model, sixteen hundred hand rollouts become about eighty wave approvals a year.\u003c/p>\n\u003cp>One catch: progressive sync sits behind a controller flag in Argo CD, so we check it on a test ApplicationSet before we lean on it.\u003c/p>\n\u003cp>That's the shape. Here's a peer who already runs it, at about ten times our size.\u003c/p>","plan":{"Act":"I","Job":"the turn: a rollout stops being a procedure and becomes three objects on one","Headline":"On rails, a change is one field, a wave is a label, and a gate is a Job.","Visual":"the deck's signature at full width: one mint track across the slide. At the","Energy":"4","Into next":"that's the shape. Here's a peer who already runs it, at ten times our size.","Source":"GOALS §1.4, §1.7(b), §2.3; Argo CD docs (Progressive Syncs, sync windows,","Merged from":"`capi-diff`, `region-claim`, `waves`, `gates`, `change-windows`,"}},"three-ways":{"title":"Three ways agents arrive","notes":"\u003cp>So AI was everywhere at the show. On our map it doesn't arrive as one thing. Agents arrive three ways at once, and each needs a different answer.\u003c/p>\n\u003cp>Click. First, as workloads. An agent is a pod, on our nodes, beside our apps, often running code it wrote a minute ago. Podium runs every coding agent as an isolated pod, and those agents open thirty percent of their merged pull requests. The answer is an ordinary Job spec, with a sandbox runtime class.\u003c/p>\n\u003cp>Click. Second, as users. The same agent calls our tools: it opens pull requests, requests infrastructure, reads the cluster. Mastercard lets an LLM drive thirty EKS clusters, with every write reviewed. The answer is a gateway, a short-lived identity, and the same CEL rules people get.\u003c/p>\n\u003cp>Click. Third, the one nobody puts on a roadmap: attackers have agents too. They point them at the open source we run. One Metal3 maintainer's own AI found two hundred and twenty issues in a year; attackers have the same models. We can't fence that out. We have to out-pace it, with the lake, our own agents, and the waves from the first half.\u003c/p>\n\u003cp>Those three tags sit in the corner from here on. Workloads first: here's one agent, as a pod.\u003c/p>","plan":{}},"three-ways-ten":{"title":"Three ways agents arrive","notes":"\u003cp>Now the show's biggest topic. Nearly half the talks, two hundred and twenty-eight of five hundred and one, were about AI. On our map it doesn't arrive as one thing. Agents arrive three ways at once.\u003c/p>\n\u003cp>Click. As workloads. An agent is a pod on our nodes, beside our apps, often running code it wrote a minute ago. Podium runs every coding agent as an isolated pod, and those agents open thirty percent of their merged pull requests. The fence is one line in an ordinary Job spec: runtimeClassName isolated-sandbox. A container shares the host's kernel; in EKS Auto Mode that line gives the agent its own, a Nitro Sandbox microVM per pod, built in. On-prem it's gVisor or Kata. The catch, from the EKS guide: Kubernetes 1.36 on existing Auto Mode clusters, and no GPU passthrough yet.\u003c/p>\n\u003cp>Click. As users. The same agent calls our tools: it opens pull requests, requests infrastructure, reads the cluster. Mastercard lets an LLM drive thirty EKS clusters, with every write reviewed. The fence: every tool call goes through one gateway that checks a policy; the agent carries a short-lived Pod Identity, so no password ever enters the agent; and the same CEL admission rule that checks a person's change checks the agent's. Write the rule against the action, not the actor.\u003c/p>\n\u003cp>Click. As attackers. They point their agents at the open source we run. One Metal3 maintainer's own AI found two hundred and twenty issues in a year, and attackers have the same models. There's no fence for that. We have to outrun it.\u003c/p>\n\u003cp>Fenced in is where an agent starts. Here's how it earns more.\u003c/p>","plan":{"Act":"III","Job":"the turn of the agent half: agents arrive three ways at once; two can be fenced in","Headline":"Agents arrive three ways: we fence in two, and we have to outrun the third.","Visual":"three columns, each a small picture and a company already living with it:","Energy":"3","Into next":"fenced in is where an agent starts. Here's how it earns more.","Source":"Podium (abstract); 📎 *No RAG, No Regrets* (Mastercard); 📎 *AI Found a 0-Day in","Merged from":"`show-agents`, `three-ways`, `agent-pod`, `sandbox`, `mcp-gateway`,"}},"title":{"title":"Rails, not runbooks","notes":"\u003cp>Rails, not runbooks.\u003c/p>\n\u003cp>Behind the title, the three peaks you'll see all talk. On the left, the fleet: the clusters themselves. In the middle, delivery: how every change reaches them. On the right, agents: the newest kind of user, arriving on all of it.\u003c/p>\n\u003cp>And along the foot of the range, the idea that ties them together. Today, most change reaches our clusters through a runbook: a person, a checklist, a terminal. What we saw at KubeCon, from teams ten times our size, is change that runs on rails: one track every change rides, a person's or an agent's, with the checks built into the track.\u003c/p>\n\u003cp>That's the whole argument. The next forty minutes are the evidence, and the config it takes. Let's start with one number.\u003c/p>","plan":{}},"title-ten":{"title":"Rails, not runbooks","notes":"\u003cp>Rails, not runbooks.\u003c/p>\n\u003cp>Behind the title, three peaks. On the left, the fleet: the clusters themselves. In the middle, delivery: how every change reaches them. On the right, agents: the newest kind of user, arriving on all of it.\u003c/p>\n\u003cp>Along the foot of the range, the idea that ties them together. Today most change reaches our clusters through a runbook: a person, a checklist, a terminal. At KubeCon, teams ten times our size showed change that runs on rails: one track that every change rides, a person's or an agent's, with the checks built into the track.\u003c/p>\n\u003cp>That's the argument. The next fifteen minutes are the evidence, the config it takes, and five pull requests to start. One number first.\u003c/p>","plan":{"Act":"Open","Job":"name the argument before the first fact: change should run on rails, not on runbooks","Headline":"Rails, not runbooks","Visual":"`main`'s title: the three peaks large under the disc (fleet, delivery,","Energy":"3","Into next":"the whole argument in one line; now one number to start.","Source":"forked from `title`; subtitle says \"small team\", notes cut to the short talk."}},"tools-too":{"title":"Four tools, four release trains","notes":"\u003cp>Every one of those clusters also runs the platform: Argo CD to deploy, Prometheus to measure, the Splunk OTel collector to ship telemetry, and Karpenter to scale nodes on the cloud clusters.\u003c/p>\n\u003cp>Each of those has its own release train. Prometheus ships a minor about every six weeks. Argo CD about every three months. The OTel collector every few weeks. Karpenter every month or two. Those are rough, and they don't line up with each other or with Kubernetes.\u003c/p>\n\u003cp>So here's the fleet, twenty-nine clusters across the top, the four tools down the side. Four tools for now, to keep the picture readable; the real list comes back later. Each square is how far that cluster's copy is behind the latest release. Dark is current. Pale is one behind. Hollow is two or more. Dashed means nobody's quite sure without logging in. The blanks are Karpenter on our own hardware, where it doesn't run.\u003c/p>\n\u003cp>This is what hand rollouts leave behind. Not because anyone's careless: because each release is another twenty-odd rollouts by hand, and the next release lands before the last one's finished. The grid is illustrative, but anyone who's run a fleet will recognise it.\u003c/p>\n\u003cp>Now add the clusters, the tools and the apps together, and put them against the team's year.\u003c/p>","plan":{}},"triage":{"title":"One alert, triaged","notes":"\u003cp>Shadow mode, on a real job. The first job isn't fixing anything. It's explaining an alert.\u003c/p>\n\u003cp>On the left, a real-shaped alert: payments crash-looping on aws-1 prod for six minutes.\u003c/p>\n\u003cp>Click. The agent reads the lake and posts this. A verdict: real, not noise, no open incident. A severity with its basis, so you can disagree: three of six replicas down in aws-1, and aws-2 carrying it; that's the failover slide working. What changed: Argo CD synced payments twelve minutes ago. Where to look. And a suggestion: roll back, one revert PR.\u003c/p>\n\u003cp>It doesn't act. No write path anywhere, which is why it's first: no sandbox or policy gate needed to make it safe.\u003c/p>\n\u003cp>Click. The responder accepts, modifies or rejects, and every choice is logged. That log is the track record an agent needs before it's allowed to open that PR itself.\u003c/p>\n\u003cp>Receipts. Verkada runs this on nine production clusters: forty-seven hundred alerts a month, thirty-three cents each, a summary in a hundred and thirty-nine seconds. And Salesforce's first attempt was right a quarter of the time. A curated knowledge base and an eval harness got them to sixty to eighty percent. Budget for both, or expect the twenty-five.\u003c/p>\n\u003cp>Demo option: HolmesGPT on a CrashLoopBackOff in dev, two minutes.\u003c/p>\n\u003cp>That's our agents. Theirs are already at work.\u003c/p>","plan":{}},"twenty-tools":{"title":"Twenty tools, not four","notes":"\u003cp>Those platform hours assumed the core four tools. Here's what the platform actually runs.\u003c/p>\n\u003cp>The four in blue are the core four from the chart. Click. And the rest: Ceph and Rook on our hardware, the Vault operator and External Secrets, Grafana and Thanos, Istio or the ALB controller, the Kafka UI, the file viewer, cert-manager, external-dns, Kyverno, Velero, KEDA, Reloader, Argo Rollouts. Twenty, each tagged with where it runs.\u003c/p>\n\u003cp>The numbers, side by side. Four tools across twenty-nine clusters by hand: 116 installs, 464 rollouts a year, about 700 hours. Twenty: 418 installs, 1,672 rollouts, two and a half thousand hours. Three people doing nothing else.\u003c/p>\n\u003cp>Click. Through the pipeline, it's eighty approvals a year. That's the job left for a person.\u003c/p>\n\u003cp>A model, not a measurement, but the shape holds. So here's what the pipeline is made of, starting with the order things roll out in.\u003c/p>","plan":{}},"upkeep":{"title":"1,672 rollouts by hand","notes":"\u003cp>Here's what \"by hand\" adds up to. This is our estate as a field. Every column is a cluster: eight on-prem, fifteen in AWS, six in the second cloud. Every row is a platform tool: Argo CD, Prometheus, the Splunk collector, cert-manager, Kyverno, Velero and the rest. Twelve run everywhere, a few only on-prem or only in the cloud, and four on a handful.\u003c/p>\n\u003cp>Every little tick is one rollout: one tool, on one cluster, one release. Four releases a year each.\u003c/p>\n\u003cp>Click. Four hundred and eighteen installs, four releases a year: sixteen hundred and seventy-two rollouts, all done by one small team, by hand. And that's an illustrative model, not a measurement; the inputs are in the repo, and we'll swap in real numbers before this goes further.\u003c/p>\n\u003cp>It also leaves things out. Kubernetes itself: a kubeadm upgrade is fifty-four steps on one cluster, three minors a year. And every app on top.\u003c/p>\n\u003cp>And look at the right edge. The next cluster isn't free. It's another column of ticks, for the same team.\u003c/p>\n\u003cp>Peers ten times our size don't do this by hand. They put the change on rails.\u003c/p>","plan":{"Act":"I","Job":"the problem, felt: by hand, the work is clusters × tools, and every new cluster adds","Headline":"By hand, twenty tools on 29 clusters is 1,672 rollouts a year.","Visual":"the estate as a field of marks. 29 columns, one per cluster, grouped on-prem 8 ·","Energy":"3","Into next":"peers ten times our size don't do this by hand. They put the change on rails.","Data":"`assets/toil-model.json` (`twenty_tools`), illustrative","Merged from":"`estate-grows`, `one-runbook` (54 kubeadm steps, in the notes),"}},"waves":{"title":"A wave is a label","notes":"\u003cp>Twenty tools across the fleet. The pipeline that rolls them out is less than you'd think.\u003c/p>\n\u003cp>On the right, the order: test cluster, one canary, then prod a quarter at a time. Each ring is a label on the cluster: wave equals test, canary or prod.\u003c/p>\n\u003cp>On the left, the whole rollout order for Prometheus: an ApplicationSet over every registered cluster. The line that matters is RollingSync. Three steps: test; when healthy, canary; when healthy, prod, no more than twenty-five percent at a time. The template copies each cluster's label onto its app, so the steps can find it.\u003c/p>\n\u003cp>Same file shape for all twenty tools. A thirtieth cluster arrives labelled, from the Region claim, and joins its ring.\u003c/p>\n\u003cp>The catch: progressive sync sits behind a controller flag. We check its maturity in our Argo CD before we lean on it.\u003c/p>\n\u003cp>A ring only moves outward when its step is healthy. Healthy means a gate.\u003c/p>","plan":{}}},"narrativeOrder":["title-ten","cold-open-ten","upkeep","the-rails","receipts","failover-ten","three-ways-ten","first-job","close-the-circle","the-ask-ten"],"kit":"1.0.0"};</script>
