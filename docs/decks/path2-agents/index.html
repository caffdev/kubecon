<script>window.DECK = {"deck":"path2-agents","title":"Path 2: Claude off the laptop, into the pod","draft":"main","drafts":{"main":["cold-open","scope","the-default","show-agreed","four-questions","the-turn","architecture","one-marketplace","blast-radius","authority","itemize","ladder","stage-one","what-they-budgeted","phase-zero","the-ask"]},"size":[1920,1080],"slides":{"architecture":{"title":"Four components","notes":"\u003cp>Here's the whole runtime on one slide, and the point is how little of it is new.\u003c/p>\n\u003cp>Left to right. Something happens: a pull request opens, an alert fires, someone types a command in Slack, or the nightly cron runs. Jenkins picks it up, as it already does for everything else, with credential binding, audit logs, retries and a UI people know. It calls one shared library step we write, claudeAgent. That starts a throwaway pod in a namespace of its own, running an agent image we build: Claude Code headless, with managed settings baked in, plugins pulled from our marketplace, and telemetry on.\u003c/p>\n\u003cp>The dashed line is the namespace's network policy. The pod can only talk to two things: the gateway, and the telemetry collector. Every model call goes through the gateway to the Anthropic API or Bedrock. Every tool call goes through it to GitHub, Jira, Grafana and a read-only view of Kubernetes. Quota, auth and audit live there, once.\u003c/p>\n\u003cp>Teal is what we build. Four things: the agent image, the library step, the marketplace, and the gateway. Grey is configuration of things we already run.\u003c/p>\n\u003cp>The marketplace is the piece laptops get first, so let's look at that.\u003c/p>","plan":{"Act":"II","Job":"show the whole runtime and the four parts we own","Headline":"We own four components; everything else is configuration.","Visual":"left to right: triggers → Jenkins → an ephemeral pod in `claude-agents` → AI gateway → Anthropic or Bedrock; MCP gateway → GitHub, Jira, Grafana, read-only k8s; OTel → Jaeger, Loki, Prometheus. The four owned parts (agent image, `claudeAgent` library step, marketplace, gateway) in teal, the rest grey","Energy":"4","Into next":"the marketplace is the piece laptops get first.","Source":"`CLAUDE-AGENT-PLATFORM.md` §2"}},"authority":{"title":"An agent earns the right to act the way a release earns traffic.","notes":"\u003cp>Say it out loud: what you will actually say over this slide, written for the ear.\u003c/p>","plan":{"Act":"II","Job":"the most copyable idea we brought home","Headline":"An agent earns the right to act the way a release earns traffic.","Visual":"the progressive-delivery primitives re-pointed at an agent: canary step → shadow mode, analysis → grade the work, success → an eligibility policy, promotion → a reviewed permission PR, abort → revoke the grant","Energy":"4","Into next":"and none of that works unless we can see what it did.","Source":"\"Progressive Delivery for Trust: How Agents Earn the Right to Merge\" (Transfix); `deck-assets/03-agents-earn-merge`"}},"blast-radius":{"title":"An agent pod gets one namespace, egress to two gateways, and no cluster write credentials.","notes":"\u003cp>Say it out loud: what you will actually say over this slide, written for the ear.\u003c/p>","plan":{"Act":"II","Job":"answer the security question in one picture","Headline":"An agent pod gets one namespace, egress to two gateways, and no cluster write credentials.","Visual":"containment drawn to scale. The laptop's reach today (everything the engineer's credentials touch) against the pod's: one namespace, a NetworkPolicy, two gateway exits, a GitHub App token scoped to one repo, no static key anywhere","Energy":"3","Into next":"reach is one half. The other is how an agent earns more of it.","Source":"`CLAUDE-AGENT-PLATFORM.md` §5"}},"cold-open":{"title":"$0.33 an alert","notes":"\u003cp>Every dot on the right is one alert. There are four thousand seven hundred of them, one month of alerts at Verkada across nine production clusters. An agent reads every one, says whether it's real or noise, how severe and why, and links the runbook and the deploy that correlates. Thirty-three cents each. Our arithmetic says that's about fifteen hundred dollars a month for the whole pile.\u003c/p>\n\u003cp>That's an operations report, not a demo. And it's exactly the kind of work we want Claude doing for us first, because it reads and explains. It never writes to a cluster.\u003c/p>\n\u003cp>Before we go further, let me be precise about what we mean by AI in this deck.\u003c/p>","plan":{"Act":"I","Job":"open on an operations number, not a demo","Headline":"Verkada triages 4,700 alerts a month for 33 cents each.","Visual":"one alert ticket with a $0.33 price stamped on it, and 4,700 hairlines stacked behind it as the month's pile","Energy":"3","Into next":"that's the kind of work we want Claude doing. First, what we mean by \"AI\" here.","Source":"\"Triaging 4,700 Alerts/Month at $0.33 Each\" (Verkada), nine production clusters"}},"four-questions":{"title":"Before an agent runs, we name where its sandbox, identity, session and egress come from.","notes":"\u003cp>Say it out loud: what you will actually say over this slide, written for the ear.\u003c/p>","plan":{"Act":"I","Job":"give the room the checklist for \"production-ready\"","Headline":"Before an agent runs, we name where its sandbox, identity, session and egress come from.","Visual":"an agent drawn as a box with four walls, one labelled on each side. A wall without an answer is drawn open","Energy":"3","Into next":"we could build all four into a new platform. We think that's the mistake.","Source":"\"Agent Substrate\", \"Sandbox Your Agents\", \"The Identity Crisis\" keynotes (no decks posted)"}},"itemize":{"title":"Every Claude call and MCP call becomes a span with a team, a use case and a cost.","notes":"\u003cp>Say it out loud: what you will actually say over this slide, written for the ear.\u003c/p>","plan":{"Act":"II","Job":"make every agent action countable and costed","Headline":"Every Claude call and MCP call becomes a span with a team, a use case and a cost.","Visual":"one agent run laid out as a trace: trigger, model calls, tool calls, PR. Each span shows its team label and token cost. Turning telemetry on is also how we take the inventory","Energy":"3","Into next":"with that in place, we can climb.","Source":"GOALS §4; OTel GenAI semantic conventions"}},"ladder":{"title":"The ladder","notes":"\u003cp>This is the slide we want a decision on. Our AI rollout as a climb, six camps from where we are to where the talks we heard had got to.\u003c/p>\n\u003cp>We're at camp zero. Engineers use Claude Code, and a human applies every change.\u003c/p>\n\u003cp>Click. The line draws to the next two camps, and they're the only ones with dates. Camp one, alert triage, by Q2 2027. It explains, it never acts: there's no write path anywhere, so it needs no policy gate, no sandbox and no rollback story. That's why the date is safe. Camp two, agents open pull requests, by the end of 2027. Review is unchanged. That date is a bet, because it needs Path 1's stage B, policy in CI, to land first.\u003c/p>\n\u003cp>Click. Above that the route is dashed. Always-on analysis that owns alert severity. Agents that fix things inside a blast radius we define. Teams writing their own agents. They have no dates, deliberately. Dating them before the camps below exist would be fiction. If the lower route lands early, they start early; if it slips, they slip, and nobody has to re-argue the order.\u003c/p>\n\u003cp>Camp one is close. Here's what reaching it actually means.\u003c/p>","plan":{"Act":"III","Job":"the peak: the ladder and its two dates","Headline":"Six rungs, and only the next two get dates.","Visual":"an expedition profile. Camps 0–2 sit on a solid, surveyed slope with dates (today; Q2 2027; end 2027). Camps 3–5 sit on a pale, dashed slope with no dates. The line draws up to camp 2, then the dashes appear","Energy":"5","Into next":"camp 1 is close. Here's what reaching it means.","Source":"GOALS §6"}},"one-marketplace":{"title":"Laptops and pods read the same skills, MCP servers and settings from one versioned repo.","notes":"\u003cp>Say it out loud: what you will actually say over this slide, written for the ear.\u003c/p>","plan":{"Act":"II","Job":"fix today's drift: skills and MCP configs passed round in Slack","Headline":"Laptops and pods read the same skills, MCP servers and settings from one versioned repo.","Visual":"before and after. Before: skills copied person to person, each copy slightly different. After: one repo fanning out to laptops and pods alike, with MCP servers run centrally","Energy":"3","Into next":"and when it runs in a pod, here's how far it can reach.","Source":"`CLAUDE-AGENT-PLATFORM.md` §4"}},"phase-zero":{"title":"Phase 0 starts this month, on laptops: telemetry, org auth, one marketplace.","notes":"\u003cp>Say it out loud: what you will actually say over this slide, written for the ear.\u003c/p>","plan":{"Act":"III","Job":"make the first step concrete and safe to start next week","Headline":"Phase 0 starts this month, on laptops: telemetry, org auth, one marketplace.","Visual":"phases 0–3 as a short route with exit gates; phase 0 lit with its five items and its gate (80% of users reporting telemetry, top five use cases named from data)","Energy":"3","Into next":"so here's what we need decided.","Source":"`CLAUDE-AGENT-PLATFORM.md` §3"}},"scope":{"title":"We run Claude; we are not building or hosting a model.","notes":"\u003cp>Say it out loud: what you will actually say over this slide, written for the ear.\u003c/p>","plan":{"Act":"I","Job":"take GPUs and model serving off the table before anyone asks","Headline":"We run Claude; we are not building or hosting a model.","Visual":"a boundary line. Inside, lit: Claude Code, the API or Bedrock, the Agent SDK, our MCP servers. Outside, greyed out: GPU scheduling, DRA, llm-d, vLLM, KServe, training","Energy":"2","Into next":"and if we do nothing, here's what running Claude turns into."}},"show-agreed":{"title":"Teams running agents in production let the agent propose and let policy decide.","notes":"\u003cp>Say it out loud: what you will actually say over this slide, written for the ear.\u003c/p>","plan":{"Act":"I","Job":"prove agents in production are real, and governed","Headline":"Teams running agents in production let the agent propose and let policy decide.","Visual":"four operating numbers on one ridge: Verkada $0.33 an alert; Podium 30% of merged PRs; Mastercard 30 EKS clusters; Salesforce 1,000 clusters","Energy":"3","Into next":"and four keynotes named what any agent needs before it runs.","Source":"session titles and abstracts; GOALS §6 evidence"}},"stage-one":{"title":"Triage counts only if a responder would act on it, and the accept-or-reject log is the product.","notes":"\u003cp>Say it out loud: what you will actually say over this slide, written for the ear.\u003c/p>","plan":{"Act":"III","Job":"define \"done\" for stage 1, so it isn't a chatbot","Headline":"Triage counts only if a responder would act on it, and the accept-or-reject log is the product.","Visual":"one triage card filled in for real: relevance call, severity with its basis, links out, a suggested action, and the responder's accept / modify / reject recorded on it","Energy":"3","Into next":"the teams with good numbers all budgeted two things nobody puts in a business case."}},"the-ask":{"title":"Commit to the two dates, start phase 0, choose Bedrock, and name two owners.","notes":"\u003cp>Say it out loud: what you will actually say over this slide, written for the ear.\u003c/p>","plan":{"Act":"III","Job":"the ask, echoing the opening alert","Headline":"Commit to the two dates, start phase 0, choose Bedrock, and name two owners.","Visual":"the $0.33 ticket from the opening, now stamped with our date: stage 1 by Q2 2027. Beside it four decisions with our lean","Energy":"4","Into next":"end"}},"the-default":{"title":"Left alone, every team wires its own `claude -p` into its own pipeline, with its own API key.","notes":"\u003cp>Say it out loud: what you will actually say over this slide, written for the ear.\u003c/p>","plan":{"Act":"I","Job":"the stakes: name the outcome we're drifting into","Headline":"Left alone, every team wires its own `claude -p` into its own pipeline, with its own API key.","Visual":"repetition. A grid of near-identical Jenkinsfile fragments, each with its own key line and its own allow-list, copied until it hurts","Energy":"4","Into next":"the teams we heard from who run agents in production did the opposite."}},"the-turn":{"title":"Don't build an agent platform: run Claude headless in throwaway pods, through the CI we already trust.","notes":"\u003cp>Say it out loud: what you will actually say over this slide, written for the ear.\u003c/p>","plan":{"Act":"II","Job":"the turn: we don't need an agent platform","Headline":"Don't build an agent platform: run Claude headless in throwaway pods, through the CI we already trust.","Visual":"two columns of what we already have. Jenkins: triggers, credential binding, audit log, RBAC, retries, queueing, a UI people know. Kubernetes: isolation, quotas, network policy. Then the four gaps, lit","Energy":"4","Into next":"those four gaps are the whole build."}},"what-they-budgeted":{"title":"The teams with good numbers budgeted a knowledge base and an evaluation harness.","notes":"\u003cp>Say it out loud: what you will actually say over this slide, written for the ear.\u003c/p>","plan":{"Act":"III","Job":"name the two unglamorous line items, as practice","Headline":"The teams with good numbers budgeted a knowledge base and an evaluation harness.","Visual":"two quiet objects: a curated runbook shelf (chat threads weighted down) and a rubric with a sampling grid","Energy":"2","Into next":"all of this starts on laptops, this month.","Source":"Salesforce AIOps, STCLab, Mastercard"}}},"narrativeOrder":["cold-open","scope","the-default","show-agreed","four-questions","the-turn","architecture","one-marketplace","blast-radius","authority","itemize","ladder","stage-one","what-they-budgeted","phase-zero","the-ask"],"kit":"1.0.0"};</script>
