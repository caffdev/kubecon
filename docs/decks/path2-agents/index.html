<script>window.DECK = {"deck":"path2-agents","title":"Path 2: Claude off the laptop, into the pod","draft":"ten","drafts":{"main":["cold-open","scope","the-default","show-agreed","four-questions","the-turn","architecture","one-marketplace","blast-radius","authority","itemize","ladder","stage-one","what-they-budgeted","phase-zero","the-ask"],"with-index":["cold-open","scope","the-default","show-agreed","four-questions","the-turn","architecture","one-marketplace","blast-radius","authority","itemize","ladder","stage-one","what-they-budgeted","phase-zero","the-ask","tool-index","ti-claudecode","ti-claudeapi","ti-agentsdk","ti-mcp","ti-argomcp","ti-holmesgpt","ti-k8sgpt","ti-kagent","ti-substrate","ti-sandbox","ti-spiffe","ti-cedar","ti-obot","ti-toolhive","ti-aigateway","ti-kyvernoai","ti-otelgenai","ti-costpertask","ti-cadence","ti-spine"],"ten":["cold-open-ten","the-default-ten","four-pieces","contained","authority-ten","itemize-ten","two-dates","stage-one-ten","start-on-laptops","the-ask-ten"]},"size":[1920,1080],"slides":{"architecture":{"title":"Four components","notes":"\u003cp>Here's the whole runtime on one slide, and the point is how little of it is new.\u003c/p>\n\u003cp>Left to right. Something happens: a pull request opens, an alert fires, someone types a command in Slack, or the nightly cron runs. Jenkins picks it up, as it already does for everything else, with credential binding, audit logs, retries and a UI people know. It calls one shared library step we write, claudeAgent. That starts a throwaway pod in a namespace of its own, running an agent image we build: Claude Code headless, with managed settings baked in, plugins pulled from our marketplace, and telemetry on.\u003c/p>\n\u003cp>The dashed line is the namespace's network policy. The pod can only talk to the gateways and the telemetry collector. Every model call goes through the AI gateway to the Anthropic API or Bedrock. Every tool call goes through the MCP gateway to GitHub, Jira, Grafana and a read-only view of Kubernetes. Quota, auth and audit live there, once.\u003c/p>\n\u003cp>Teal is what we build. Four things: the agent image, the library step, the marketplace, and the gateways. Grey is configuration of things we already run.\u003c/p>\n\u003cp>The marketplace is the piece laptops get first, so let's look at that.\u003c/p>","plan":{}},"authority":{"title":"Authority as the payload","notes":"\u003cp>This is the single most copyable idea we brought home, from Transfix.\u003c/p>\n\u003cp>Take progressive delivery, which we already understand for releases, and swap the payload. Instead of traffic, the thing being rolled out is authority.\u003c/p>\n\u003cp>The top row is a release in Argo Rollouts: a canary step sends a percentage of traffic, analysis queries Prometheus, success is an error-rate threshold, promotion means more traffic, and abort means roll back.\u003c/p>\n\u003cp>The bottom row is the same primitives pointed at an agent. The canary step is shadow mode: the agent decides, and the action is withheld. Analysis grades its work against outcomes. Success is an eligibility policy that gives the same answer every time. Promotion is a reviewed permission change, a pull request. And abort is revoking the grant.\u003c/p>\n\u003cp>\"Models produce evidence. Code decides authority.\" And it needs nothing we don't already run: Rollouts primitives, RBAC for what each role touches in the cluster, and repository rulesets for what can happen in the repo. Design the revoke path before granting anything.\u003c/p>\n\u003cp>And none of that works unless we can see what it did.\u003c/p>","plan":{}},"authority-ten":{"title":"Authority as the payload","notes":"\u003cp>This is the single most copyable idea we brought home, from Transfix's talk, Progressive Delivery for Trust: How Agents Earn the Right to Merge.\u003c/p>\n\u003cp>Take progressive delivery, which we already run for releases, and swap the payload. Instead of traffic, the thing being rolled out is authority.\u003c/p>\n\u003cp>The top row is a release in Argo Rollouts. A canary step sends a slice of traffic. Analysis queries Prometheus. Success is an error rate under a threshold. Promotion means more traffic. Abort means roll back.\u003c/p>\n\u003cp>Click. The bottom row is the same five steps, pointed at an agent. The canary is shadow mode: the agent decides, and the action is withheld. Analysis grades its work against outcomes. Success is an eligibility policy that gives the same answer every time. Promotion is a reviewed permission change: a pull request. And abort is revoking the grant, which we design before we grant anything.\u003c/p>\n\u003cp>Models produce evidence. Code decides authority. The agent never promotes itself, and the proposer can't approve its own PR. It needs nothing we don't already run: Rollouts, RBAC, and repository rules.\u003c/p>\n\u003cp>And none of it works unless we can see what the agent did.\u003c/p>","plan":{"Act":"II","Job":"the most copyable idea we brought home","Headline":"An agent earns the right to act the way a release earns traffic.","Visual":"two rails, same five stations. A release in Argo Rollouts (grey): canary, analysis, success, promotion, abort. An agent (teal): shadow mode, grade the work, eligibility policy, a permission PR, revoke the grant. The Transfix line underneath","Energy":"4","Into next":"and none of that works unless we can see what it did.","Source":"\"Progressive Delivery for Trust: How Agents Earn the Right to Merge\" (Transfix); `deck-assets/03-agents-earn-merge`"}},"blast-radius":{"title":"Blast radius","notes":"\u003cp>Here's the security question, answered in one picture, drawn roughly to scale.\u003c/p>\n\u003cp>The big circle is a laptop's reach today: everything one engineer's credentials touch. Every repo, the cloud console, a production kubeconfig, Slack and email. When Claude runs on that laptop, that's its blast radius.\u003c/p>\n\u003cp>The small dashed circle is the agent pod. One namespace. Network policy means it can only leave through the two gateways, one for model calls and one for tools, plus the telemetry collector.\u003c/p>\n\u003cp>On the right, how. Identity: Bedrock through IRSA, or a token the gateway issues; no static key anywhere. Git: a GitHub App token scoped to one repository, allowed to push only to claude-slash branches, with main protected. The cluster: read-only, through MCP servers, with no write credentials at all. A hardened pod now, microVM sandboxing when agents start acting. And every trigger payload, an alert body, an issue description, is treated as untrusted input, because prompt injection is a when, not an if.\u003c/p>\n\u003cp>Reach is one half. The other is how an agent earns more of it.\u003c/p>","plan":{}},"cold-open":{"title":"$0.33 an alert","notes":"\u003cp>Every dot on the right is one alert. There are four thousand seven hundred of them, one month of alerts at Verkada across nine production clusters. An agent reads every one, says whether it's real or noise, how severe and why, and links the runbook and the deploy that correlates. Thirty-three cents each. Our arithmetic says that's about fifteen hundred dollars a month for the whole pile.\u003c/p>\n\u003cp>That's an operations report, not a demo. And it's exactly the kind of work we want Claude doing for us first, because it reads and explains. It never writes to a cluster.\u003c/p>\n\u003cp>Before we go further, let me be precise about what we mean by AI in this deck.\u003c/p>","plan":{}},"cold-open-ten":{"title":"$0.33 an alert","notes":"\u003cp>Every dot on the right is one alert. Four thousand seven hundred of them: one month of alerts at Verkada, across nine production clusters.\u003c/p>\n\u003cp>An agent reads every one. It says whether it's real or noise, how severe and why, and it links the runbook and the deploy that correlates. Thirty-three cents each. By our arithmetic that's about fifteen hundred dollars a month for the whole pile. Their median time to a summary is a little over two minutes.\u003c/p>\n\u003cp>That's an operations report, not a demo. And it's exactly the work we want Claude doing for us first, because it reads and explains. It never writes to a cluster.\u003c/p>\n\u003cp>So that's where we want to get to. Here's where we're heading if we just let it happen.\u003c/p>","plan":{"Act":"I","Job":"open on an operations number, not a demo","Headline":"Verkada triages 4,700 alerts a month for 33 cents each.","Visual":"4,700 dots, one per alert in a month; one lit and stamped with a $0.33 ticket","Energy":"3","Into next":"that's the work we want Claude doing. Here's what happens if we just let it.","Source":"\"Triaging 4,700 Alerts/Month at $0.33 Each: Verkada's MCP Agent on Nine Production Clusters\" (Verkada); $1,550 is our arithmetic"}},"contained":{"title":"Contained","notes":"\u003cp>Here's the security question in one picture, roughly to scale.\u003c/p>\n\u003cp>The big circle is a laptop's reach today: everything one engineer's credentials touch. Every repo, the cloud console, a production kubeconfig, Slack and email. When Claude runs on that laptop, that's its blast radius.\u003c/p>\n\u003cp>The small glowing circle is the agent pod. One namespace. Network policy means it can only leave through named exits: the AI gateway for model calls, the MCP gateway for tools, and the telemetry collector. No general internet. That one control turns prompt injection from \"exfiltrate the repo\" into \"post a weird PR comment\", and we assume injection, because every alert body and PR description is text someone else wrote.\u003c/p>\n\u003cp>Four keynotes this week, among them Agent Substrate, Sandbox Your Agents and The Identity Crisis, asked the same four questions of any agent. Here are our answers. Identity: Bedrock through IRSA, or a token the gateway issues; no static key anywhere. And when it's time to write, a GitHub App token for one repository, pushing only to claude-slash branches. Egress: named exits only. Sandbox: a hardened pod now, non-root with a read-only filesystem, and microVMs once agents start fixing things. Session: the pod is thrown away when the job ends. And the cluster it only ever reads, through MCP. No write credentials at all.\u003c/p>\n\u003cp>That's how far it can reach. The next question is how it earns the right to do more.\u003c/p>","plan":{"Act":"II","Job":"answer the security question in one picture","Headline":"An agent pod gets one namespace, egress to two gateways, and no cluster write credentials.","Visual":"containment drawn to scale on night: the laptop's reach today as a large pale circle holding everything an engineer's credentials touch; the pod as a small glowing enclosure inside it with three labelled exits. Around it, the four keynote questions (identity, egress, sandbox, session) each answered in a line","Energy":"3","Into next":"that's what it can reach. The next question is how it earns more.","Source":"`CLAUDE-AGENT-PLATFORM.md` §5; \"Agent Substrate\", \"Sandbox Your Agents\", \"The Identity Crisis\" keynotes (no decks posted)"}},"four-pieces":{"title":"Four pieces","notes":"\u003cp>Here's the turn. Don't build an agent platform. Run Claude headless, in throwaway pods, through the CI we already trust.\u003c/p>\n\u003cp>This is the whole runtime, and right now it's all grey, because it's all something we already run. Something happens: a pull request opens, an alert fires, someone types a Slack command, the nightly cron runs. Jenkins picks it up, the way it already does, with credentials, an audit log, retries and access control. It starts a throwaway pod in a namespace of its own. The dashed line is that namespace's network policy: the pod can only reach the gateways and the telemetry collector. Every model call goes to Claude, through the API or Bedrock. Every tool call goes to GitHub, Jira, Grafana, or a read-only view of Kubernetes.\u003c/p>\n\u003cp>Click. Four pieces light up, and those four are the whole build. A Jenkins library step, claudeAgent, so a team writes one line instead of a pipeline. A hardened agent image: Claude Code headless, with managed settings baked in and telemetry on. The gateways, where quota, auth and audit live once. And a marketplace repo of skills, MCP configs and settings, which every laptop reads too.\u003c/p>\n\u003cp>And to be clear about scope: we run Claude. We're not hosting a model, so GPUs and serving stacks stay off the table.\u003c/p>\n\u003cp>Security's first question is going to be how far that pod can reach.\u003c/p>","plan":{"Act":"II","Job":"the turn: we don't need an agent platform, and here is the whole build","Headline":"Don't build an agent platform: build four pieces and let Jenkins run the rest.","Visual":"the runtime as a system drawing, all grey (triggers, Jenkins, the `claude-agents` namespace, OTel). On the click, four pieces light teal: the `claudeAgent()` library step, the agent image, the AI and MCP gateways, the marketplace repo","Energy":"4","Into next":"security's first question is how far that pod can reach.","Source":"`CLAUDE-AGENT-PLATFORM.md` §2; ⚠️ Claude Code flag names unchecked"}},"four-questions":{"title":"Four questions","notes":"\u003cp>Four keynotes this week, Agent Substrate, Sandbox Your Agents, The Harness Is the New Runtime, and The Identity Crisis, all named the same checklist.\u003c/p>\n\u003cp>For any agent we run, we have to be able to say where four things come from. Its sandbox: the code it wrote a minute ago runs somewhere, and a container shares a kernel. Its identity: who it is, and for how long, ideally minutes rather than forever. Its egress: what it can reach, and through what. And its session: where its state lives, and what happens if it dies halfway through a task.\u003c/p>\n\u003cp>Right now, for Claude on a laptop, the honest answer to all four is \"the laptop, with one person's credentials\". That's why the walls are drawn open.\u003c/p>\n\u003cp>If we can't answer all four, it isn't production-ready. Three of the four are much cheaper to build in than to retrofit.\u003c/p>\n\u003cp>We could build all four into a new platform. We think that's the mistake.\u003c/p>","plan":{}},"itemize":{"title":"Every call is a span","notes":"\u003cp>None of what we've described works unless we can see what each run did and what it cost.\u003c/p>\n\u003cp>This is one alert-triage run, laid out as a trace. It's illustrative, not measured. An alert fires. Jenkins starts the job. Claude runs. It calls the model, then asks Grafana for a dashboard through an MCP tool, calls the model again, searches the logs, calls the model one more time, and posts its note to Slack. Every one of those is a span on the OpenTelemetry pipeline we already run, and every span carries the same labels: which team, which use case, which trigger, which Jenkins run. The model calls carry their token cost.\u003c/p>\n\u003cp>We use the OpenTelemetry generative-AI conventions rather than inventing our own attributes, because that standard is being written right now and we don't want to redo this next year.\u003c/p>\n\u003cp>And here's the trick: turning telemetry on is also how we answer \"what are we using AI for?\" The inventory falls out of the instrumentation.\u003c/p>\n\u003cp>With that in place, we can climb.\u003c/p>","plan":{}},"itemize-ten":{"title":"Every call is a span","notes":"\u003cp>None of what we've described works unless we can see what each run did and what it cost.\u003c/p>\n\u003cp>This is one alert-triage run, laid out as a trace. It's illustrative, not measured. An alert fires. Jenkins starts the job. Claude runs. It calls the model, asks Grafana for a dashboard through an MCP tool, calls the model again, searches the logs, calls the model once more, and posts its note to Slack. Every one of those is a span on the OpenTelemetry pipeline we already run, and every span carries the same labels: which team, which use case, which Jenkins run. The model calls carry their token cost.\u003c/p>\n\u003cp>Add them up and you get a cost per task. That's the unit Verkada reports, thirty-three cents an alert, and it's the unit we'll report too.\u003c/p>\n\u003cp>We use the OpenTelemetry generative-AI conventions rather than inventing our own attributes, because that standard is being written right now and we don't want to redo this next year. And here's the trick: turning telemetry on is also how we answer \"what are we using AI for?\" The inventory falls out of the instrumentation.\u003c/p>\n\u003cp>With that in place, we can climb.\u003c/p>","plan":{"Act":"II","Job":"make every agent action countable and costed","Headline":"Every model call and tool call is a span with a team, a use case and a cost.","Visual":"one alert-triage run as a trace: trigger, the Jenkins job, model calls (teal) and tool calls (grey-blue), each model call priced. The run's total, $0.21, large on the right and labelled illustrative, with \"cost per task\" named as the unit Verkada reports ($0.33 an alert)","Energy":"3","Into next":"with that in place, we can climb.","Source":"GOALS §4; OTel GenAI semantic conventions; the trace and its costs are illustrative"}},"ladder":{"title":"The ladder","notes":"\u003cp>This is the slide we want a decision on. Our AI rollout as a climb, six camps from where we are to where the talks we heard had got to.\u003c/p>\n\u003cp>We're at camp zero. Engineers use Claude Code, and a human applies every change.\u003c/p>\n\u003cp>Click. The line draws to the next two camps, and they're the only ones with dates. Camp one, alert triage, by Q2 2027. It explains, it never acts: there's no write path anywhere, so it needs no policy gate, no sandbox and no rollback story. That's why the date is safe. Camp two, agents open pull requests, by the end of 2027. Review is unchanged. That date is a bet, because it needs Path 1's stage B, policy in CI, to land first.\u003c/p>\n\u003cp>Click. Above that the route is dashed. Always-on analysis that owns alert severity. Agents that fix things inside a blast radius we define. Teams writing their own agents. They have no dates, deliberately. Dating them before the camps below exist would be fiction. If the lower route lands early, they start early; if it slips, they slip, and nobody has to re-argue the order.\u003c/p>\n\u003cp>Camp one is close. Here's what reaching it actually means.\u003c/p>","plan":{}},"one-marketplace":{"title":"One marketplace","notes":"\u003cp>The marketplace is the piece laptops get first, before any agent runs anywhere.\u003c/p>\n\u003cp>Today, on the left: the skills and MCP configs people find useful get passed person to person, in Slack. Every copy drifts a little. There's someone's version two, someone's fork, and nobody knows which one is current or safe.\u003c/p>\n\u003cp>On the right: one versioned repo, owned by the platform team, with contributions by pull request from anyone. Every laptop and every agent pod reads from the same place, so the agent in a pod behaves like the engineer at the terminal, because it's using the same skills and settings. And MCP servers run centrally rather than being shipped to every laptop.\u003c/p>\n\u003cp>Phase 0 is mostly this, which is why it starts on laptops. And when it runs in a pod, here's how far it can reach.\u003c/p>","plan":{}},"phase-zero":{"title":"Phase 0","notes":"\u003cp>All of this starts on laptops, this month, and nothing in phase 0 needs a write path anywhere.\u003c/p>\n\u003cp>Four phases along the top. Phase 0 is laptops, now to January. Phase 1 is read-only agents in CI, February to Q2, which is our stage-1 alert triage. Phase 2 is agents opening pull requests in the second half of 2027. Phase 3, teams adding their own agent jobs, is a 2028 decision we make with real data.\u003c/p>\n\u003cp>Phase 0 is five things. Turn on telemetry on every desktop through managed settings; two to four weeks of that data is the inventory of what we use AI for. Move everyone to org-provisioned auth, so personal API keys stop working on company repos. Ship a managed settings file with the org-wide deny list. Stand up the marketplace repo and move in the five to ten skills people already pass around. And commit a CLAUDE.md in each service repo, because the agents in pods will read the same file.\u003c/p>\n\u003cp>The exit gate: eighty percent of active users reporting telemetry, a marketplace with an owner and a review process, and the top five use cases named from data rather than anecdote.\u003c/p>\n\u003cp>So here's what we need decided.\u003c/p>","plan":{}},"scope":{"title":"Scope","notes":"\u003cp>Before anything else: scope. We run Claude. We are not building or hosting a model.\u003c/p>\n\u003cp>Inside our boundary: engineers using Claude Code every day, with a human approving every change. Agents we write that call Claude through the API or Bedrock. The Agent SDK, which is the Claude Code harness as a library, running in our own pods. And the MCP servers those agents reach.\u003c/p>\n\u003cp>Deliberately outside: GPU scheduling, device allocation and quota; model-serving stacks like llm-d, vLLM and KServe; training and fine-tuning. Roughly a third of the week was about those. It was excellent engineering, and none of it is our problem.\u003c/p>\n\u003cp>Buying inference means our hard problems are the ones at our boundary: what an agent may touch, with whose identity, what it costs per task, and how we know what it did.\u003c/p>\n\u003cp>And if we do nothing, here's what running Claude turns into.\u003c/p>","plan":{}},"show-agreed":{"title":"What the show agreed","notes":"\u003cp>The teams we heard from who run agents in production all did the opposite of that default, and they had operating numbers, not demos.\u003c/p>\n\u003cp>Verkada: thirty-three cents per alert triaged, four thousand seven hundred a month, nine production clusters. Podium: thirty percent of their merged pull requests come from autonomous Kubernetes coding agents. Mastercard: an LLM driving thirty EKS clusters in production, through a narrow set of live tools rather than a search index. Salesforce: a thousand clusters under agentic AIOps.\u003c/p>\n\u003cp>Different companies, same shape. The agent proposes. A pull request, a recommendation, a triage note. And progressive delivery and policy decide what actually happens. Nobody argued for an agent with production credentials and no gate.\u003c/p>\n\u003cp>And four keynotes named what any agent needs before it runs.\u003c/p>","plan":{}},"stage-one":{"title":"Stage 1, done","notes":"\u003cp>Camp one is close, so let's define what reaching it means, because if the output is a summary nobody acts on, we've built a chatbot.\u003c/p>\n\u003cp>This is an illustrative triage, not a real one. An alert fires. The agent posts four things, and these are the acceptance criteria. A relevance call: real, noise, or a duplicate of an open incident, with its reasoning. A severity, stated in terms a responder can disagree with. Links out: the runbook, the dashboard, the deploy that correlates, the last three times this fired. And a suggested action.\u003c/p>\n\u003cp>Then the responder accepts it, modifies it, or rejects it, and we log which. That log is the product. It's the track record that stage 2, agents opening pull requests, is gated on. If we don't instrument it from day one, we arrive at the next gate with no evidence.\u003c/p>\n\u003cp>We don't start from scratch. HolmesGPT is a CNCF Sandbox project built for exactly this, alert-driven and read-only, with Claude behind it; we need to confirm its current Claude support. k8sgpt is the lighter, rule-based option.\u003c/p>\n\u003cp>The teams with good numbers all budgeted two things nobody puts in a business case.\u003c/p>","plan":{}},"stage-one-ten":{"title":"Stage 1, done","notes":"\u003cp>Camp one is close, so let's define what reaching it means, because if the output is a summary nobody acts on, we've built a chatbot.\u003c/p>\n\u003cp>This is an illustrative triage, not a real one. An alert fires. The agent posts four things, and these are the acceptance criteria. A relevance call: real, noise, or a duplicate of an open incident. A severity, stated in terms a responder can disagree with. Links out: the runbook, the dashboard, the deploy that correlates, the last three times this fired. And a suggested action.\u003c/p>\n\u003cp>Then the responder accepts it, modifies it, or rejects it, and we log which. That log, on the right, is the product. It's the track record the camp-two gate reads before any agent gets to open a pull request. If we don't instrument it from day one, we arrive at that gate with no evidence.\u003c/p>\n\u003cp>We don't start from scratch, either. HolmesGPT is an open-source investigation agent built for exactly this, alert-driven and read-only, and k8sgpt is a lighter rule-based option. We still need to confirm HolmesGPT's current Claude support before we commit to it.\u003c/p>\n\u003cp>And none of this needs a cluster to start. It starts on laptops, this month.\u003c/p>","plan":{"Act":"III","Job":"define \"done\" for stage 1, so it isn't a chatbot","Headline":"Triage counts only if a responder acts on it; the accept-or-reject log is the product.","Visual":"one triage card filled in for real: the alert, a relevance call, a severity with its basis, links out, a suggested action, and the responder's verdict stamped and logged. Beside it, the log as a ledger that runs up to the camp 2 gate","Energy":"3","Into next":"none of this needs a cluster to start. It starts on laptops, this month.","Source":"GOALS §6, \"What stage 1 has to produce\"; the card is illustrative"}},"start-on-laptops":{"title":"Start on laptops","notes":"\u003cp>All of this starts on laptops, this month, and nothing in phase 0 needs a write path anywhere.\u003c/p>\n\u003cp>On the left is what we change on every laptop between now and January. A managed settings file, pushed by device management, that turns telemetry on and carries the org-wide deny list. Org-provisioned auth, Enterprise seats or Bedrock through single sign-on, so personal API keys stop working on company repos. The marketplace repo, with the five to ten skills people already pass around in Slack moved into it. And a CLAUDE.md in every service repo.\u003c/p>\n\u003cp>On the right is the agent pod from February. Every row carries across. The same managed settings, baked into the image. The same identity rule, as workload identity with no keys. The same plugins, pinned to a reviewed tag so an automated job never picks up an unreviewed skill. The same CLAUDE.md. The only thing that doesn't cross is someone's personal config. If a job only works because of something in a person's home directory, that's a bug.\u003c/p>\n\u003cp>The exit gate: eighty percent of active users reporting telemetry, a marketplace with an owner and a review process, and the top five use cases named from data rather than anecdote.\u003c/p>\n\u003cp>So here's what we need decided.\u003c/p>","plan":{"Act":"III","Job":"make the first step concrete, safe, and obviously on the path to the pods","Headline":"Phase 0 starts this month on laptops, and every pod inherits it.","Visual":"a laptop and a pod side by side. Rows carried across: telemetry on, no personal keys, the marketplace's plugins, the repo's CLAUDE.md. The personal `~/.claude` row stays behind on the laptop. The exit gate underneath","Energy":"3","Into next":"so here's what we need decided.","Source":"`CLAUDE-AGENT-PLATFORM.md` §3 phase 0 and §4"}},"the-ask":{"title":"The ask","notes":"\u003cp>We opened with a thirty-three-cent alert. That's stage 1, and we're asking you to put our own date on it.\u003c/p>\n\u003cp>First: commit to stage 1, alert triage, by Q2 2027, and stage 2, agents opening pull requests, by the end of 2027. Stage 1 never writes anything, so the date is safe. Stage 2 is a bet on Path 1's stage B landing first.\u003c/p>\n\u003cp>Second: start phase 0 this month. Telemetry, org auth, and the marketplace. None of it touches a cluster.\u003c/p>\n\u003cp>Third: model access. We recommend Bedrock with IRSA, since we're all in on AWS, with a gateway in front either way and no static keys anywhere. Direct API gets features first, so it's worth a cost and data-residency check.\u003c/p>\n\u003cp>Fourth: two owners, one for the knowledge base and one for the evaluation harness. Neither exists by default, and they decide whether stage 1 gets trusted.\u003c/p>\n\u003cp>And confirm the scope: we consume Claude, we don't host models.\u003c/p>\n\u003cp>If we settle one thing in this room, make it the dates. They decide what the next two quarters are for.\u003c/p>","plan":{}},"the-ask-ten":{"title":"The ask","notes":"\u003cp>We opened with a thirty-three-cent alert. That's stage 1, and we're asking you to put our own date on it.\u003c/p>\n\u003cp>First: commit to stage 1, alert triage, by Q2 2027, and stage 2, agents opening pull requests, by the end of 2027. Stage 1 never writes anything, so that date is safe. Stage 2 is a bet on Path 1's stage B landing first.\u003c/p>\n\u003cp>Second: start phase 0 this month. Telemetry, org auth and the marketplace, all on laptops. None of it touches a cluster.\u003c/p>\n\u003cp>Third: the model path. We recommend Bedrock with IRSA, since we're all in on AWS, with a gateway in front either way and no static keys anywhere. The direct API gets features first, so it's worth a cost and data-residency check.\u003c/p>\n\u003cp>Fourth: two owners, one for a knowledge base and one for an evaluation harness. The teams at the show with good accuracy numbers all budgeted both. Runbooks kept current on purpose, and a rubric with people checking a sample, so we can tell a better prompt from a lucky week. Neither exists by default, and they decide whether a responder trusts stage 1.\u003c/p>\n\u003cp>And confirm the scope: we consume Claude, we don't host models. That keeps GPUs and serving stacks off the table.\u003c/p>\n\u003cp>If we settle one thing in this room, make it the dates. They decide what the next two quarters are for.\u003c/p>","plan":{"Act":"III","Job":"the ask, echoing the opening alert","Headline":"Commit to the two dates, start phase 0, choose Bedrock, and name two owners.","Visual":"the $0.33 ticket from the opening, now stamped with our date: stage 1 by Q2 2027. Beside it four decisions, each with our lean","Energy":"4","Into next":"end"}},"the-default":{"title":"The default","notes":"\u003cp>Here's the outcome we're drifting into if we do nothing.\u003c/p>\n\u003cp>Every team that wants an agent in its pipeline wires up its own. Payments does it one way, search does it another. Each one has a personal API key pasted into a credential somewhere, each one has whatever permissions its author happened to allow, and each one copied a slightly different set of skills from Slack.\u003c/p>\n\u003cp>Twelve teams, twelve keys, twelve allow-lists, twelve versions of the same prompt. Nobody can say what any of them cost, what they touched, or which key to revoke.\u003c/p>\n\u003cp>That's the laptop problem again, except this time there's no human watching.\u003c/p>\n\u003cp>The teams we heard from who run agents in production did the opposite.\u003c/p>","plan":{}},"the-default-ten":{"title":"The default","notes":"\u003cp>Here's where we're heading if we do nothing.\u003c/p>\n\u003cp>Every team that wants an agent in its pipeline wires up its own. Payments does it one way, search does it another. Each one has a personal API key pasted into a credential somewhere: that's the orange line on every card. Each one has whatever permissions its author happened to allow, and each one copied a slightly different set of skills out of Slack.\u003c/p>\n\u003cp>Twelve teams, twelve keys, twelve allow-lists, twelve versions of the same prompt. Nobody can say what any of them cost, what they touched, or which key to revoke.\u003c/p>\n\u003cp>It's the laptop problem again, except this time there's no human watching.\u003c/p>\n\u003cp>We could answer that with a new agent platform. We think that would be the mistake.\u003c/p>","plan":{"Act":"I","Job":"the stakes: name the outcome we're drifting into","Headline":"Left alone, every team wires its own `claude -p` into its own pipeline, with its own key.","Visual":"repetition. Twelve near-identical pipeline snippets, each with its own key line (alpenglow) and its own allow-list, copied until it hurts","Energy":"4","Into next":"we could answer that with a new agent platform. We think that's the mistake."}},"the-turn":{"title":"The turn","notes":"\u003cp>Here's the turn. We could build all four of those walls into a new agent platform. We think that's the mistake.\u003c/p>\n\u003cp>Don't build an agent platform. Run Claude Code headless, in throwaway pods, through the CI system we already trust.\u003c/p>\n\u003cp>Jenkins already gives us triggers, credential binding, audit logs, RBAC, retries, queueing, and a UI people know. Kubernetes already gives us isolation, quotas and network policy. That's most of a platform, and we already run it.\u003c/p>\n\u003cp>What's missing is four things. Click: a hardened agent image. Click: one shared, versioned marketplace of skills, MCP configs and settings. Click: a gateway that every model call and tool call passes through. Click: telemetry that tells us what each run did and what it cost.\u003c/p>\n\u003cp>Build those four things and let everything else be Jenkins. Those four gaps are the whole build.\u003c/p>","plan":{}},"ti-agentsdk":{"title":"Claude Agent SDK and Managed Agents","notes":"\u003cp>Claude Agent SDK and Managed Agents: Two ways to get a full agent loop without writing one, differing in who hosts it. Where we stand: Trial the Agent SDK for agents that run as cluster workloads. Keep Managed Agents for self-contained work only.\u003c/p>\n\u003cp>The rule: if the agent's tools live in our clusters, we host the loop.\u003c/p>","plan":{}},"ti-aigateway":{"title":"AI gateway on Gateway API","notes":"\u003cp>AI gateway on Gateway API: One place in front of Claude and our MCP tools. Where we stand: One of the four components we build. Trial once the Gateway API migration has an owner.\u003c/p>\n\u003cp>For us the gateway's job is egress to Claude and tool access, not load-balancing model servers.\u003c/p>","plan":{}},"ti-argomcp":{"title":"Argo CD MCP server","notes":"\u003cp>Argo CD MCP server: Lets an agent read real application state instead of guessing. Where we stand: Trial read-only, as one of stage 1's data sources.\u003c/p>\n\u003cp>ArgoCon's checklist order: integration, progressive delivery, traceability.\u003c/p>","plan":{}},"ti-cadence":{"title":"Cadence","notes":"\u003cp>Cadence: Durable workflows for agents that act over many steps. Where we stand: Watch. It becomes relevant at stage 4, when agents take multi-step actions; not before.\u003c/p>\n\u003cp>If we get there, compare Cadence and Temporal on the operational burden we can staff.\u003c/p>","plan":{}},"ti-cedar":{"title":"Cedar and OpenFGA","notes":"\u003cp>Cedar and OpenFGA: Answering 'what can this agent actually do?' with a query. Where we stand: Trial Cedar for MCP tool permissions alongside the Obot and ToolHive bake-off.\u003c/p>\n\u003cp>The question to answer in one query: list every tool this agent can call, and with what scope.\u003c/p>","plan":{}},"ti-claudeapi":{"title":"Claude API and Amazon Bedrock","notes":"\u003cp>Claude API and Amazon Bedrock: The model calls behind every agent we host: direct from Anthropic, or through AWS. Where we stand: We recommend Bedrock with IRSA, with a gateway in front either way. ⚠️ Check current pricing and feature availability on both first.\u003c/p>\n\u003cp>For triage the context, runbooks and recent deploys, repeats on every alert. That's exactly the shape prompt caching rewards.\u003c/p>","plan":{}},"ti-claudecode":{"title":"Claude Code","notes":"\u003cp>Claude Code: Anthropic's coding agent in the terminal and IDE: stage 0 of our ladder, today. Where we stand: In use. Next: managed settings, telemetry on, and hooks that run our policy checks locally. ⚠️ Check flag names against current docs.\u003c/p>\n\u003cp>Stage 0 isn't nothing: it's where our engineers learn what the model is good and bad at before any automation exists.\u003c/p>","plan":{}},"ti-costpertask":{"title":"Cost per task","notes":"\u003cp>Cost per task: Pricing AI the way Verkada did: per unit of work. Where we stand: Trial alongside stage 1. ⚠️ Model prices change; read them from current pricing, not this card.\u003c/p>\n\u003cp>Verkada's figure was 33 cents an alert. We want our own number by the end of the stage-1 pilot.\u003c/p>","plan":{}},"ti-holmesgpt":{"title":"HolmesGPT","notes":"\u003cp>HolmesGPT: An open-source investigation agent built for alert-driven triage. Where we stand: Our stage-1 starting point, read-only, with Claude behind it. ⚠️ Confirm the current release and Claude support.\u003c/p>\n\u003cp>It pairs naturally with the knowledge-base practice: its runbooks are our runbooks.\u003c/p>","plan":{}},"ti-k8sgpt":{"title":"k8sgpt","notes":"\u003cp>k8sgpt: A rule-based Kubernetes scanner with model-written explanations. Where we stand: Watch, or use as a cheap first pass alongside HolmesGPT.\u003c/p>\n\u003cp>Good for 'what's wrong in this cluster right now', less good for 'why did this alert fire'.\u003c/p>","plan":{}},"ti-kagent":{"title":"kagent","notes":"\u003cp>kagent: Agents as Kubernetes resources, not scripts on a laptop. Where we stand: A phase 3 candidate: whether we stay on Jenkins or move execution to a Kubernetes-native controller, decided with 2027's data.\u003c/p>\n\u003cp>Our day-one notes had kagent in the top three, and it held up all week. The platform plan deliberately starts on Jenkins and keeps this as the option.\u003c/p>","plan":{}},"ti-kyvernoai":{"title":"Kyverno for AI traffic","notes":"\u003cp>Kyverno for AI traffic: Our policy engine, extended to models and tools. Where we stand: Trial with the AI gateway.\u003c/p>\n\u003cp>No deck was posted for this one; watch the recording when it lands.\u003c/p>","plan":{}},"ti-mcp":{"title":"Model Context Protocol","notes":"\u003cp>Model Context Protocol: The standard way an agent reaches a tool, and the thing we have to govern. Where we stand: Adopt as the tool interface, with servers run centrally as cluster workloads behind the MCP gateway.\u003c/p>\n\u003cp>Every MCP server we run should have its own identity and an owner, like any other service.\u003c/p>","plan":{}},"ti-obot":{"title":"Obot","notes":"\u003cp>Obot: An MCP catalog and gateway, with permissions from the directory. Where we stand: In a two-week bake-off against ToolHive. Decide the enforcement point before the product.\u003c/p>\n\u003cp>Our notes called it 'AD-managed MCP permissions', which is exactly the problem it targets.\u003c/p>","plan":{}},"ti-otelgenai":{"title":"OpenTelemetry GenAI conventions","notes":"\u003cp>OpenTelemetry GenAI conventions: Standard span attributes for model and tool calls. Where we stand: Adopt for every Claude and MCP call from day one: it's the inventory of what we use AI for. ⚠️ Pin a convention version; some attributes are experimental.\u003c/p>\n\u003cp>Turning this on is phase 0's first item.\u003c/p>","plan":{}},"ti-sandbox":{"title":"Kata Containers, gVisor, vCluster","notes":"\u003cp>Kata Containers, gVisor, vCluster: Three ways to stop agent-written code sharing a kernel with everything else. Where we stand: A hardened pod now: non-root, read-only filesystem, no host mounts. Kata for any agent that executes generated code, from stage 3.\u003c/p>\n\u003cp>Most agents in stages 1 and 2 never execute generated code; they need the hardened pod, not a microVM.\u003c/p>","plan":{}},"ti-spiffe":{"title":"SPIFFE / SPIRE","notes":"\u003cp>SPIFFE / SPIRE: Short-lived, attested identity for every workload, including agents. Where we stand: Adopt, and start before the agents arrive: mesh identity first, SPIRE where the mesh doesn't reach.\u003c/p>\n\u003cp>The strongest build-it-in message of the week.\u003c/p>","plan":{}},"ti-spine":{"title":"Path 1's delivery spine","notes":"\u003cp>Path 1's delivery spine: Argo CD, GitOps Promoter, Argo Rollouts, Kyverno: carded in Path 1's index. Where we stand: See the Path 1 deck for each tool's card and the promotion decision.\u003c/p>\n\u003cp>If someone asks why the agent deck needs the delivery deck: a change is safe because of how it ships, not who wrote it.\u003c/p>","plan":{}},"ti-substrate":{"title":"Agent substrate","notes":"\u003cp>Agent substrate: A vocabulary more than a product: the layer under an agent. Where we stand: Adopt the checklist as our production-readiness bar; decide implementations piece by piece.\u003c/p>\n\u003cp>If we can't fill in all four boxes for an agent, it doesn't go to production.\u003c/p>","plan":{}},"ti-toolhive":{"title":"ToolHive","notes":"\u003cp>ToolHive: MCP servers as isolated, Kubernetes-native workloads. Where we stand: In the bake-off against Obot.\u003c/p>\n\u003cp>If the enforcement point is per-server identity, ToolHive fits; if it's a central catalog and gateway, Obot fits.\u003c/p>","plan":{}},"tool-index":{"title":"Tool index","notes":"\u003cp>The appendix: every tool this path names gets one catalogue card. What it is, what sets it apart, and where we stand, with the status stamped on it: adopt, trial, decide or watch. This part is for reading afterwards, not for presenting.\u003c/p>","plan":{}},"two-dates":{"title":"Two dates","notes":"\u003cp>This is the slide we want a decision on. Our AI rollout as a climb: six camps, which the plan calls stages.\u003c/p>\n\u003cp>We're at camp zero, the orange flag. Engineers use Claude Code, and a human applies every change.\u003c/p>\n\u003cp>Click. The line draws to the next two camps, and they're the only ones with dates. Camp one, alert triage, by Q2 2027. It explains; it never acts. There's no write path anywhere, so it needs no policy gate, no sandbox and no rollback story. That's why the date is safe, and Verkada is already standing on it at thirty-three cents an alert. Camp two, agents open pull requests, by the end of 2027. Review is unchanged. Podium is there: thirty percent of their merged pull requests come from autonomous agents. Our date is a bet, because it needs Path 1's stage B, policy in CI, to land first.\u003c/p>\n\u003cp>Click. Above that the route is dashed. Always-on analysis that owns alert severity. Agents that fix things inside a blast radius we define; Salesforce runs agentic operations across a thousand clusters, and Mastercard lets a model drive thirty EKS clusters, read-only by default and writing only with review. Then teams writing their own agents. So the route is real. But these camps have no dates, deliberately. Dating them before the camps below exist would be fiction. If the lower route lands early, they start early; if it slips, they slip.\u003c/p>\n\u003cp>Camp one is close. Here's what reaching it actually means.\u003c/p>","plan":{"Act":"III","Job":"the peak: the ladder, its two dates, and proof the route is real","Headline":"Six rungs, and only the next two get dates.","Visual":"an expedition profile. Camps 0–2 on a solid teal slope with dates in alpenglow (today; Q2 2027; end of 2027). Camps 3–5 on a dashed slope with no dates. Small flags mark who from the show already stands where: Verkada at camp 1, Podium at camp 2, Salesforce and Mastercard at camp 4","Energy":"5","Into next":"camp 1 is close. Here's what reaching it means.","Source":"GOALS §6 (the ladder and its evidence column); session titles and abstracts"}},"what-they-budgeted":{"title":"What they budgeted","notes":"\u003cp>The teams we heard from with good accuracy numbers all budgeted two things that nobody puts in an AI business case by default.\u003c/p>\n\u003cp>On the left, a curated knowledge base. Runbooks and design docs, kept current on purpose, with chat threads weighted down. Salesforce credited this, not a model change, for their accuracy across a thousand clusters. STCLab found that runbook quality mattered more than which model they used. Write the runbook the agent follows, and it gets better as the runbook does.\u003c/p>\n\u003cp>On the right, an evaluation harness. A rubric, graded by a model, plus a stratified sample checked by people. Built before launch, so we can tell a better prompt from a lucky week.\u003c/p>\n\u003cp>Both are unglamorous, both need an owner, and both are what separated the teams with good numbers from everyone else. They're the two owners we'll ask for at the end.\u003c/p>\n\u003cp>All of this starts on laptops, this month.\u003c/p>","plan":{}}},"narrativeOrder":["cold-open-ten","the-default-ten","four-pieces","contained","authority-ten","itemize-ten","two-dates","stage-one-ten","start-on-laptops","the-ask-ten"],"kit":"1.0.0"};</script>
